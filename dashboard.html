      {"name": "ひすいこたろうの名言セラピー", "isNew": true, "videoTitle": "あなたも持っている、最高の超能力とは？", "videoUrl": "https://www.youtube.com/watch?v=_8pIu8QNyvg", "published": "2026-08-05T12:00:30+00:00", "failed": false, "summary": "チャンネル名: ひすいこたろうの名言セラピー\n動画タイトル: あなたも持っている、最高の超能力とは？\nURL: https://www.youtube.com/watch?v=_8pIu8QNyvg\n公開日時: 2026-08-05T12:00:30+00:00\n形式: 音楽とナレーションによる短い朗読・解説動画\n\nこの動画は、宮沢賢治の生き方とエピソードを通じて「最高の超能力とは、どんな時も人に優しくできることである」というメッセージを伝える動画です。\n\n【冒頭:賢治の少年時代のエピソード】\n独自の宇宙観を描いた作家・宮沢賢治が子供の頃、「大きくなったら何になるか」と聞かれた際に「何になるかわからない。でも、偉い人だけにはなりたくない。偉い人よりも人のために働く人になりたかった」と答えたというエピソードが紹介されます。\n\n【教師時代のエピソード:0点をつけない賢治】\n賢治が教師をしていた時期、答案用紙に何も書かなくても生徒に絶対に零点をつけず、名前だけ書いても20点を与えていたというエピソードが語られます。その理由として、「例え何もできなくたって、0点の存在などこの世にいないから」という賢治の考えが紹介されます。\n\n【教師を辞めて農民になった理由】\n安定した職である教師を辞めて農民になろうとした際、思いとどまらせようとした校長に対し、賢治が語った言葉が紹介されます。「私はもっと土にまみれて働きたいんです。教師をして生徒たちを立派な農民に育てるのも大切な仕事です。でもそれだけでは本当の農民の苦しみは分かりません。雨が降れば田んぼが流され、日照りが続けば稲の枯れるのをじっと見ている他に何もできない人たち。その人たちのことを思うと、のんびり教師などしていられないんです。その人たちと一緒になって働き、その人たちのために今すぐ役に立ちたいんです。」という言葉が紹介されます。\n\n【母親の口癖】\n賢治の母親の口癖として、「人というものは、人のために何かしてあげるために生まれてきたんです」という言葉が紹介されます。\n\n【賢治こそ最高の超能力者だったという主張】\n宮沢賢治こそ最高の超能力者だったとし、透視能力・テレパシー・念力などどんな能力よりもすごい超能力があるとして、「それはどんな時も人に優しくできること。それこそ最高の超能力です」と語られます。\n\n【賢治が生まれた年の大地震のエピソード】\n賢治が生まれた1896年は、マグニチュード8.2の巨大地震(明治三陸地震)が日本を襲い、2万人以上の死者を出したこと、震源地が賢治の生まれた岩手県東北であったことが紹介されます。賢治はその2ヶ月後という大混乱のさなかに生まれ、それでもあれだけ優しい人に育ったという点が強調されます。\n\n【賢治の言葉の引用】\n「世界が全体幸福にならないうちは個人の幸福はありえない」という宮沢賢治の言葉が紹介されます。\n\n【締めくくり】\n「というわけで今日も頑張ったね。お疲れ様でした。」という視聴者へのねぎらいの言葉で締めくくられます。\n\n【まとめ】\n宮沢賢治の教師時代・農民への転身・生い立ちにまつわる複数のエピソードと言葉を通じて、透視やテレパシーのような特殊な能力ではなく、「どんな時も人に優しくできること」こそが誰もが持ちうる最高の超能力であるというメッセージを伝える動画です。"},
      {"name": "崔の店長日誌。", "isNew": true, "videoTitle": "【食風水】このタイミングで食べると運気が変わる旬の食材！〜金のエネルギー〜/ 100日マラソン続〜1943日〜", "videoUrl": "https://www.youtube.com/watch?v=b_-RcG44sI0", "published": "2026-08-05T20:00:11+00:00", "failed": false, "summary": "チャンネル名: 崔の店長日誌。\n動画タイトル: 【食風水】このタイミングで食べると運気が変わる旬の食材！〜金のエネルギー〜/ 100日マラソン続〜1943日〜\nURL: https://www.youtube.com/watch?v=b_-RcG44sI0\n公開日時: 2026-08-05T20:00:11+00:00\n形式: 毎日配信の「100日マラソン」シリーズ(1943日目)、店主・崔氏によるトーク配信\n\nこの動画は、8月6日で夏の土用が終わり翌8月7日から「立秋(金のエネルギー)」が巡り始めるタイミングに合わせ、運気が上がるとされる秋の旬の食材とレシピを「食風水」の観点から紹介する内容です。\n\n【冒頭:挨拶と日付、家庭の小話】\n「皆さんおはようございます。最平です。」という挨拶から始まり、今日が8月6日木曜日であることを確認。小中学校の始業式に触れつつ、自身の家庭のエピソードとして、息子が宿題をやっておらず妻に叱られていた話を紹介。自分も口を出そうとしたが、昔(パパの時代)は宿題をやらずに先生から往復ビンタを食らい、冬休みが来るまで毎日学校に残されて夏休みの宿題をやらされ、大丈夫と言ったら息子は泣きながら宿題をやり始めたという笑い話が語られます。\n\n【本題の導入:土用明けと立秋、金のエネルギー】\n今日8月6日で「夏の土用」が終わり、明日8月7日から「立秋」がスタートすること、これまでは「土」のエネルギーだったのが明日から「金」のエネルギーが巡り始めることが説明されます。金のエネルギーは体にしっかり蓄えることで金運アップや豊かさの象徴になるとし、そのために食べると良い旬の食材(食風水)を紹介するという本題に入ります。\n\n【梨(なし)】\nまずフルーツとして梨が紹介されます。梨は体にこもった熱を冷ます効果や、肺・喉・肌を潤す効果があるとされ、咳が止まらなかった時に梨を食べたらその日から治ったという自身の体験が語られます。ただし梨は体を冷やす性質があるため、胃腸の調子が悪い時に食べ過ぎると胃腸を崩す場合があると注意も添えられます。運気的には人間関係を円滑にし、コミュニケーション能力を上げる効果があると言われている(科学的根拠はないと断りつつ)と紹介されます。\n\n【ぶどう】\n次にぶどうが「絶対に欠かせない」食材として紹介されます。実りと豊かさの象徴であり、ぶどうから作られるワインをお金持ちがよく飲むイメージがある通り、実際に周囲の富裕層にワイン好きが多いというエピソードが語られます。ぶどうは1つの房にたくさん実がなることから子孫繁栄・金運アップなど全般的な運をアップさせる最強の食べ物とされ、栄養面ではポリフェノールが豊富で疲労回復に役立つとも説明されます。\n\n【秋ナス】\n野菜では秋ナスが紹介されます。ナスに含まれるカリウムがむくみ改善や血圧を下げる効果、余分な塩分排出効果があるとされ、筋トレをしている人にとっても筋肉・神経系の調整に良い食材だと説明されます。また紫色の食べ物であることから直感力アップや、金運を上げる効果があるとも言われていると紹介されます。\n\n【かぼちゃ】\n夏バテ回復と運気アップの両面で「最強」の食材として、かぼちゃが紹介されます。β-カロテン・ビタミンE・食物繊維が豊富で、免疫力アップ・若返り効果・お腹の調子を整える・冷え性対策に良いとされ、かぼちゃの色から金運を大きく上げると言われていると説明。自身の好きな食べ方として、味噌汁に入れるほか、蒸したかぼちゃに枝豆とマヨネーズを和えて食べるのが好きだと紹介されます。あわせて、これらの食材は電子レンジを多用するとエネルギーが飛んでしまうと言われているため、なるべく焼く・煮る・蒸すという調理法がおすすめだと補足されます。\n\n【無水カレーのレシピ紹介】\nストレス数値を下げる効果があるとされるカレーについて、カレールーではなくカレー粉を使った「無水カレー」のレシピを紹介。ナス・トマト・エノキ・鶏ひき肉・カレー粉を入れて煮込むだけで簡単に作れ、実際に作ってみたところ非常に美味しかったという感想が語られます。市販の「痩せる無水カレー」の素も使い勝手が良く冷凍もできると紹介し、添加物が気になる人にもおすすめだと述べます。\n\n【鮭とキノコの炊き込みご飯】\n最後に、鮭とキノコの炊き込みご飯が紹介されます。鮭は生まれ育った川から海に出て再び戻ってくる習性から、出したお金がちゃんと戻ってくるという験担ぎがあると説明。秋に旬を迎えるキノコと合わせて炊き込みご飯やホイル焼きにすることで、金のエネルギーを体に取り込み金運・夏バテ対策の両面で効果があるとされます。\n\n【締めくくり:師匠の言葉とエール】\n師匠の言葉として「どんな幸運者もまずは一食、そして最初の一口からしか始まらない」という教えを紹介し、食べることを改善していくことが体・心・運全般を支える大きなきっかけになると述べます。最後は恒例の「行きます、行きます、せーの、よっしゃ!」という掛け声で視聴者を元気よく送り出して締めくくられます。\n\n【まとめ】\n夏の土用が明け、金のエネルギーが巡り始める立秋のタイミングに合わせて、梨・ぶどう・秋ナス・かぼちゃといった旬の食材、そして無水カレーや鮭とキノコの炊き込みご飯といった具体的なレシピを紹介しながら、日々の食事を通じて運気と心身の調子を整えていこうという、崔氏の「食風水」の考え方が一貫して語られる回です。"},

      {"name": "中野優作 / CAR and LIFE.（BUDDICA）", "isNew": false, "videoTitle": "【過去最高の投資額】BUDDICA大阪堺支社がついに完成！販売・買取・コーティングが全部できる新店舗の裏側を全公開", "videoUrl": "https://www.youtube.com/watch?v=I9ZVWjZ0tmk", "published": "2026-08-05T10:00:20+00:00", "failed": false, "summary": "チャンネル名: 中野優作 / CAR and LIFE.（BUDDICA）\n動画タイトル: 【過去最高の投資額】BUDDICA大阪堺支社がついに完成！販売・買取・コーティングが全部できる新店舗の裏側を全公開\nURL: https://www.youtube.com/watch?v=I9ZVWjZ0tmk\n公開日時: 2026-08-05T10:00:20+00:00\n形式: 新店舗のルームツアー(社長・中野優作氏とスタッフによる対談形式の店舗紹介動画)\n\nこの動画は、8月8日にオープンする中古車販売・買取とコーティングブランド「フェニックス」を併設したBUDDICA大阪堺支社について、社長の中野優作氏が改装費1億5000万円という過去最高額を投じた新店舗内を隅々まで案内し、各設備へのこだわりとコストの内訳を具体的に語るルームツアー動画です。\n\n【冒頭:オープン発表とコスト概要】\n「ついにやってきました」という中野氏の高揚した挨拶から始まり、大阪堺支社の改装費が1億5000万円かかったこと、これが過去最高の投資額であることが明かされます。今回はコーティングブランド「フェニックス」との併設(ダブルネーム)店舗であるため、予算をより投下できたという背景も説明されます。恒例の「ルームツアー」形式で、外装から順に見どころを紹介していく構成であることが宣言されます。\n\n【外装:新しいポールデザインと看板のコスト計算】\n外装の目玉として、中央が光る新しいポールが紹介されます。元々設置義務のある街灯の柱を利用して光らせるという新しい試みで、1本あたり約50万円、6本で300万円という設計。大手ホームセンター等が1発3000万円かける大型看板と比較し、「600台分がバーッと見える方がバディカオレンジだと分かる」という考えでコストパフォーマンスを重視したと説明します。あわせて、パタパタと動く旗を新たに設置。従来の車屋にありがちな「のぼり」は建物の中が見えなくなるというペイン(不満点)があったため、動く旗にすることで視認性と店内の見通しを両立させたとのこと。高さについては、あえて目線の高さに抑えて300万円台(400万円未満)に収めたが、「もう少し高くて良かった」と反省点も語られています。\n\n【看板:BUDDICA フェニックスPro ロゴのこだわりとコスト比較】\n大阪堺支社で初めて採用された平置き型の「BUDDICA フェニックスPro」ロゴが紹介されます。普通のマークではなく浮かせた3D文字で、後ろから光らせる間接照明(ハニカム状の背面発光)を採用。正面から光らせるより安く、背面発光にすることで100万円ほどコストを抑えられたと明かされます。柱と看板セットで合計1000万円かかったことも公表し、それでも「10年は使うと考えれば年間100万円、月8〜9万円程度。コーティング1件の平均単価12万円と比べれば、1日に何万台も通る交通量を考えると十分ペイする」という投資判断のロジックを説明。すでにオープン告知前にも関わらず看板を見た通行人からの予約が数十件入っていることも紹介されます。また、台風などで壁に穴を開けて看板を固定する必要があったが、それがかえっておしゃれな抜け感のあるデザインになったというエピソードも語られます。\n\n【建物の外観統一:屋根の高さ調整】\n建物は元々ディーラーだった物件で、部分ごとに屋根の高さが4パターン異なっていたところを、正面から見て一つの箱のように見えるよう高さをすべて揃える工事を行ったことが明かされます。この統一により「新しい建物に見える」ほどすっきりした印象になったとし、看板だけでなく建物自体の高さを上げることが集客・迫力の面で重要だと強調しています。\n\n【フェニックス作業エリア】\nフェニックスのオフィス・受付スペースを経て、実際にコーティング作業を行うブースへ。作業灯はあえて白色ではなく黄色いライト(ハニカムライト)のみを使用しており、これは磨く際に細かい傷を見落とさないための工夫だと説明されます。洗車時は白色光の方が良いが、コーティング前の研磨作業では黄色光が適しているとのこと。コーティング後の塗膜定着のため温度・湿度管理を行っており、エアコン3台を完備。ビニールカーテンで採光を調整する計画があることや、屋根に遮熱塗料を塗る計画(自動車の遮熱コーティングの効果を実体験したことがきっかけ)も語られます。ブースは全部で6ブースあり、水・エアの両方をどのブースからも使えるよう配管されている点も紹介されます。\n\n【中古車販売エリアと店舗什器】\nフェニックスのブースから中古車販売スペースへ。柱をグレーに塗り直し、傷んでいた屋根は全面張り替え、傷みが軽い部分はカバーで補修。ショールームで使っているライン照明を作業エリアにも使用しており、これは他の車屋も真似し始めている人気デザインだと言います。工具・部材の収納は、あえて棚を作り込まず「見える化」する方式を採用。過去に何度も収納方法を検討した結果、「探す時間の削減」と「汚くなると心も汚くなり、商品品質・接客の質も下がる」という考えから、あえて見える収納にたどり着いたと語ります。\n\n【納車スペースとオリーブの植栽】\n元々壁がなく車が出入りできる構造だった場所に、あえて壁を新設し「納車場所」として整備。雨天でも記念撮影・納車ができる空間として活用する狙いがあると説明します。また、香川県発祥のBUDDICAらしく、オリーブの木を植栽。香川県(小豆島)がオリーブの生産量日本一であることに触れ、地元へのこだわりを表現。関連するサブチャンネルの「バディカツーリズム」動画(小豆島編)も紹介されます。\n\n【ショールーム内装】\n中に入るとUSBポート付きテーブル(20〜30万円程度)と、BUDDICAオレンジにカスタムされたオリジナルのジャンプルーベ(Jean Prouvé)チェアが並びます。パーテーション代わりにガラスを使い、フェニックスのスペースとの視認性を両立。中野氏は「お客様の目に触れるもの、資産価値が残るものには投資する」という店舗づくりの方針を語ります。店舗づくりの基本は「垂直水平(まっすぐ)」であることも強調されます。\n\n【BUDDICAグッズコーナー】\nノンアルコールドリンク「ジャングルドライブ」を紹介。世界的なクラフトビールブランドとのコラボビールは8000本が10分で完売した実績があるとのエピソードが語られ、中野氏自身もまだ味見をしていないことから、その場でスタッフと試飲しようという流れになります。\n\n【デジタルサイネージ】\n店頭のデジタルサイネージは700万円かかった高額設備で、以前の店舗のものより一回り大きいサイズ。通行人への宣伝効果を狙った投資であることが説明されます。奥にはトイレとキッズコーナーも完備。\n\n【オフィスエリア】\n元々完全に壁で仕切られ、ドアすらなかったスペースを、生産性向上のためにあえて壁を抜いて開放的な作りに変更(この工事だけで約230万円)。買取部門と販売部門を分けつつ増設可能な設計にしており、スタンディングで梱包・発送作業ができる作業スペースも確保。配線がむき出しになりガムテープで固定するような雑然とした状態を嫌い、「汚くなると心が汚くなり、商品品質・接客の質が落ちる」という考えのもと、仕組みでカバーする設計を徹底しているとのこと。この設備だけで約100万円かかっていますが、生産性や見た目を考えれば人件費より安いと判断していると語ります。\n\n【実績の見える化ボード】\n店舗の営業成績や進捗状況をリアルタイムで自動表示するモニターを導入。昔はアナログで営業成績を貼り出す方式だったが、改ざんのリスクや店長が直接発破をかける必要をなくすため、本部から自動でデータが流れる仕組みに変えたとのことです。中野氏自身も営業時代に「こういう見える化がほしかった」と振り返ります。\n\n【展示場・洗車エリア】\n裏の仕上げ場所には高圧洗浄機を導入し、生産性・水使用量の両面で効果があると説明。洗車機には純水機を採用しており、水道水に含まれるミネラル分(水垢)が拭き上げ後にも残ってしまう現象を、水道水と純水を並べて5分置いた比較実験のような例え話で説明。「最初は舐めていたが、水垢が10回20回と積み重なることを考えると早く導入すればよかった」と率直な反省を語ります。受入検査エリアでは、プレオープン中の買取実績が好調で、2週間ほどで在庫がほぼ埋まってきていることも明かされます。\n\n【メイン展示場】\n敷地全体は1200坪で、このエリアだけで約300坪、収容台数は約560台。EVカート用のスペースも用意し、来店客が遊べるようにする計画。展示車両にはラッピング事業で手がけたカスタムカーも並び、法人からの問い合わせも多いことが紹介されます。プレハブの仮設事務所が撤去された後は、さらに車両を並べられるようになる計画も説明されます。\n\n【投資の取捨選択:窓枠の高さ統一を断念した理由】\n本当は左右の窓枠の高さも完全に揃えたかったが、それだけで追加4500万円かかることが判明し、「投資として元が取れない」と判断して断念したというエピソードが語られます。「自分の家だったら我慢できなかったかもしれないが、商売として考えたら我慢すべきところは我慢する」という投資判断の哲学が示されます。\n\n【オープンキャンペーンの告知】\n最後に8月8日(土)のオープン日程が案内されます。中野氏自身も朝から夕方5時頃まで店舗にいる予定で、来場者には1人1000円までキッチンカーの飲食などを奢るキャンペーンを実施。前回の店舗オープン時に自動車での来場者が多く渋滞・迷惑をかけた反省から、今回は自動車での来場を控えるよう呼びかけ、代わりに泉川駅近くの提携パーキング(北口)からの無料シャトルバス(南口発着、ハイエース4台体制)の利用を案内しています。すでにオープン日の予約は満席とのことで、それ以降の日程での買取・販売・フェニックスコーティングの予約は、概要欄のLINE(バディカダイレクト、フェニックス公式)から受け付けるとのことです。\n\n【まとめ】\nこの動画全体を貫くのは、「見た目の派手さのためだけの投資はしない、投資対効果(何年使うか・どれだけ集客や生産性に効くか)を必ず数字で検証した上でお金をかける」という中野氏の一貫した経営哲学です。看板・照明・純水機・オフィスレイアウトなど、店舗のあらゆる細部について具体的な金額(50万円のポール、1000万円の看板セット、700万円のデジタルサイネージ、230万円の壁撤去工事など)を挙げながら、「なぜそこにお金をかけたか/かけなかったか(窓枠統一の4500万円は断念)」を明快なロジックで説明しており、単なる新店舗紹介にとどまらず、店舗経営・小売業の投資判断の考え方そのものを視聴者に開示する内容になっています。\n"},

  function relTime(iso) {
    const then = new Date(iso).getTime();
    const now = Date.now();
    const diffMs = now - then;
    const min = Math.floor(diffMs / 60000);
    if (min < 60) return `${Math.max(min, 0)}分前`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr}時間前`;
    const day = Math.floor(hr / 24);
    if (day < 30) return `${day}日前`;
    const mon = Math.floor(day / 30);
    return `${mon}ヶ月前`;
  }

  function render(data) {
    const list = document.getElementById("channelList");
    list.innerHTML = "";
    let newCount = 0;

    data.channels.forEach((ch) => {
      if (ch.isNew) newCount++;
      const li = document.createElement("li");
      li.className = "channel" + (ch.isNew ? " is-new" : "");

      const chip = document.createElement("span");
      chip.className = "chip" + (ch.isNew ? " is-new" : "");
      chip.textContent = ch.failed ? "取得失敗" : (ch.isNew ? "新着あり" : "変化なし");

      const name = document.createElement("div");
      name.className = "channel-name";
      name.textContent = ch.name;

      const video = document.createElement("a");
      video.className = "video-title";
      video.href = ch.videoUrl;
      video.target = "_blank";
      video.rel = "noopener noreferrer";
      video.textContent = ch.videoTitle;

      const meta = document.createElement("div");
      meta.className = "meta" + (ch.failed ? " fail" : "");
      meta.textContent = ch.failed ? "前回チェック失敗" : `公開: ${relTime(ch.published)}`;

      li.append(chip, name, video, meta);

      if (ch.summary) {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "summary-toggle";
        toggle.textContent = "▸ 詳細な要約を読む";

        const body = document.createElement("div");
        body.className = "summary-body";
        body.textContent = ch.summary;

        toggle.addEventListener("click", () => {
          const open = body.classList.toggle("open");
          toggle.textContent = open ? "▾ 要約をたたむ" : "▸ 詳細な要約を読む";
        });

        li.append(toggle, body);
      }

      list.appendChild(li);
    });

    document.getElementById("sumNew").textContent = newCount;
    document.getElementById("sumIdle").textContent = data.channels.length - newCount;
    document.getElementById("sumTotal").textContent = data.channels.length;

    const dot = document.getElementById("updatedDot");
    const text = document.getElementById("updatedText");
    dot.classList.toggle("live", newCount > 0);

  }
