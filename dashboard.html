<title>YouTube新着チェッカー</title>
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface-raised: #fbfaf8;
    --ink: #21262b;
    --ink-muted: #5b6470;
    --ink-faint: #8b929b;
    --border: #dedbd3;
    --border-strong: #c7c3b8;
    --accent: #2e5c8a;
    --accent-soft: #e4ecf3;
    --new: #d9622b;
    --new-soft: #fbe7db;
    --idle: #7d8880;
    --idle-soft: #eceae4;

  }

    :root {
      --bg: #14171a;
      --surface: #1b1f23;
      --surface-raised: #21262b;
      --ink: #e8e6e1;
      --ink-muted: #9aa2a9;
      --ink-faint: #6b7278;
      --border: #2c3237;
      --border-strong: #3a4046;
      --accent: #7fb0e0;
      --accent-soft: #223140;
      --new: #f0904f;
      --new-soft: #3a2618;
      --idle: #7c8680;
      --idle-soft: #23282a;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.25);
    }
  }

  :root[data-theme="dark"] {
    --bg: #14171a;
    --surface: #1b1f23;
    --surface-raised: #21262b;
    --ink: #e8e6e1;
    --ink-muted: #9aa2a9;
    --ink-faint: #6b7278;
    --border: #2c3237;
    --border-strong: #3a4046;
    --accent: #7fb0e0;
    --accent-soft: #223140;
    --new: #f0904f;
    --new-soft: #3a2618;
    --idle: #7c8680;
    --idle-soft: #23282a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.25);
  }

  :root[data-theme="light"] {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface-raised: #fbfaf8;
    --ink: #21262b;
    --ink-muted: #5b6470;
    --ink-faint: #8b929b;
    --border: #dedbd3;
    --border-strong: #c7c3b8;
    --accent: #2e5c8a;
    --accent-soft: #e4ecf3;
    --new: #d9622b;
    --new-soft: #fbe7db;
    --idle: #7d8880;

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 20px 64px;
  }

  header.top {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 28px;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  h1 {

    font-weight: 600;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 0;

    font-size: 14px;
    margin-top: 2px;
  }

  .summary-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 24px 0 28px;
  }

  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }

  .summary-card .num {
    font-family: var(--font-display);
    font-size: 28px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .summary-card.new .num { color: var(--new); }
  .summary-card .label {
    margin-top: 6px;
    font-size: 12px;
    color: var(--ink-muted);
  }

  .updated-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-faint);
    font-family: var(--font-mono);
    margin-bottom: 18px;
  }

  .updated-line .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--idle);
    flex: none;
  }
  .updated-line .dot.live { background: var(--new); }

  ul.channels {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  li.channel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 14px;
    align-items: start;
    transition: border-color 0.15s ease;
  }

  li.channel.is-new {
    border-color: color-mix(in srgb, var(--new) 45%, var(--border));
  }

  .chip {
    grid-row: 1 / 3;
    align-self: center;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.03em;
    padding: 5px 10px;
    border-radius: 999px;
    white-space: nowrap;
    background: var(--idle-soft);
    color: var(--idle);
  }
  .chip.is-new {
    background: var(--new-soft);
    color: var(--new);
    font-weight: 600;
  }

  .channel-name {
    font-weight: 600;
    font-size: 14.5px;
    color: var(--ink);
  }

  .video-title {
    font-size: 13.5px;
    color: var(--ink-muted);
    text-decoration: none;
    line-height: 1.4;
  }
  .video-title:hover { color: var(--accent); text-decoration: underline; }
  li.channel.is-new .video-title { color: var(--ink); }

  .meta {
    grid-column: 2;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 2px;
  }

  .meta .fail { color: var(--new); }

  .summary-toggle {
    grid-column: 2;
    justify-self: start;
    margin-top: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--accent);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .summary-toggle:hover { text-decoration: underline; }

  .summary-body {
    grid-column: 2;
    margin-top: 10px;
    padding-top: 12px;
    border-top: 1px dashed var(--border-strong);
    font-size: 13.5px;
    line-height: 1.75;
    color: var(--ink);
    white-space: pre-wrap;
    display: none;
  }
  .summary-body.open { display: block; }

  footer {
    margin-top: 32px;
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
  }
  footer a { color: var(--ink-muted); }

  @media (max-width: 480px) {
    .summary-row { grid-template-columns: 1fr 1fr; }
    .summary-card:last-child { grid-column: 1 / -1; }
  }
</style>

<div class="page">

      {"name": "さとうみつろう", "isNew": true, "videoTitle": "ハーバード大学の研究で判明した「暗い寝室」の効果とは？！", "videoUrl": "https://www.youtube.com/watch?v=Q0-y69AdSJk", "published": "2026-09-12T09:00:06+00:00", "failed": true, "summary": "チャンネル名: さとうみつろう\n動画タイトル: ハーバード大学の研究で判明した「暗い寝室」の効果とは？！\nURL: https://www.youtube.com/watch?v=Q0-y69AdSJk\n公開日時: 2026-09-12T09:00:06+00:00\n形式: ロサンゼルス滞在中に撮影された単独トーク配信(前回動画に続く時差ボケ・体内時計シリーズ)\n\nこの動画は、佐藤みつろう氏がロサンゼルス滞在中に実際に成功させた時差ボケ解消法として「夕日を見つめる」ことを紹介しつつ、朝日を浴びることの重要性、部屋を真っ暗にして寝ることの効果、そして「夜は真っ暗、朝は徐々に明るく」という相反する2つの条件を両立させるための(半分ネタの)アイデアを、イーロン・マスクのXプライズ財団や大和言葉の話を交えながら語る内容です。\n\n【冒頭:ロサンゼルスでの奇跡的な日付】\n「おはようございます。佐藤郎です」と挨拶し、今日が9月11日でロサンゼルス現地時間が奇しくも「9時11分」であったことに驚きを示しつつ、部屋をできる限り真っ暗にして寝る健康法について伝えると宣言する。\n\n【時差ボケ解消の実践:夕日を見つめる】\n一般的に「地球を西回りすると時差ボケしないが東回り(日本→アメリカ)は時差ボケする」と言われる中、前夜21時に羽田を出て機内で5時間ほど寝て体は朝のつもりでいたが、ロサンゼルス到着時は夕方で、そこから眠りに入る体を作る必要があったと説明。実際に時差ボケ解消に成功した方法は「夕日を見つめる」という簡単なことだったと明かし、朝日を見つめて体内時計をリセットする健康法と同様に、夕日でも同じ効果があると説明する。\n\n【イーロン・マスクのXプライズ財団とミトコンドリア研究】\n世界一の資産家イーロン・マスクが、10年間人間を若返らせることに成功した団体に150億円を与える「Xプライズ」というコンペを開催しており、世界200チームの応募のうち20チームが残っていて、ハーバードなどトップクラスの機関を含め、日本からもMIT系や大阪大学の吉森教授(泡盛関連)のチームが残っていることを紹介。残った20チームのほとんどがミトコンドリアの研究をしているとし、若返り・健康の鍵はミトコンドリアにあると語る。ミトコンドリアが最も多く存在する場所として、心臓、脳、そして目から入る光を捉える「視交叉(本人は「師匠株」と発音)」の3つを挙げ、ミトコンドリア自体が体内時計を司る主役であると説明する。\n\n【コルチゾール覚醒反応(CAR)と夕日の効果】\n朝日を見ることでコルチゾールが急上昇し血糖値が上がって覚醒する「コルチゾール・アウェイクネス・レスポンス(CAR)」について説明し、その逆の夕日にも特有の太陽光スペクトラムがあり、それを体が判別して「今は夕方だ」とリセットしてくれると解説。他にも冷水シャワーや、自身が実践している「週波音(周波数音)を耳から聞く」ライフハックも併用したが、一番の要因は自差(時差)ボケの成功だったと語る。\n\n【ライフハック界隈のガムテープ習慣】\nなぜ部屋を暗くすべきかについて、健康オタクの「ミトコンドリア界隈」で旅行時にガムテープを持ち歩き、テレビリモコンの赤色LEDやホテルの人感センサーの緑色LEDなど、瞼を閉じていても皮膚を突き破って視交叉に信号を送ってしまう微弱な光源を塞ぐことが流行っていると紹介する。\n\n【自身の体験:沖縄でクーラーをやめた話】\nできる限りナチュラルに生活しようとクーラーをやめていた時期に沖縄で窓を開けて寝ていたが、街灯や自販機の光でミトコンドリアが刺激されることに気づき、結局クーラーに戻してカーテンを閉め真っ暗にしたところ、以前(窓を開けカーテンも開けていた時)より体調が良くないことに気づいたというエピソードを紹介。その理由として、自然界では朝日はゆっくりと徐々に昇るものであり、実験でも「いきなり光を当てる群」と「徐々に明るくなる群」では後者の方が目覚めが良かったという研究結果があると説明する。\n\n【矛盾する2条件とフジテレビのADさんネタ】\n「夜は真っ暗にしたいが、朝は徐々に明るくしたい」という相反する条件を両立させる方法として、夜中にこっそり部屋に入ってきてカーテンをゆっくり開けてくれる「フジテレビの目覚ましドッキリのアシスタントディレクター」が必要だと冗談交じりに語り、原始の森で寝ていればこの矛盾は自然に解決するが、都会に住んでいるから街灯や自販機の光を防ぐ必要が生じ、この矛盾が生まれるのだと説明する。\n\n【日本の大和言葉:夜明けを表す5つの段階】\n先々週広島で杉本錬先生とEXILEのあっちさんと講演会をした際に学んだこととして、日本の大和言葉には夜明けのわずかな光の違いを表す言葉が複数あることを紹介。「かわたれ」「朝ぼらけ(本が読めるようになる頃)」「東雲(しののめ)」に加え、「あかつき」「あけぼの」「つとめて」も挙げ、英語圏ではAM6時45分などとしか表現できない15分刻みの微妙な違いを、日本人は5段階の言葉で表現してきたことに感心する。世界共通で朝日・夕日を見つめる(拝む)ことがミトコンドリアダイナミクスを刺激し体内時計をリセットする上で重要だとし、インド哲学などでも太陽を礼拝する文化があると補足する。\n\n【締めくくり:ロサンゼルス探索の予告とまとめ】\nこれからロサンゼルスを探索すると予告し、コラボできる人やロス在住の知人を探しながら歩くと語る。最後に改めて、部屋を暗くしテレビの赤いランプもガムテープで塞ぎ遮光カーテンで真っ暗にして寝ること、しかし朝いきなりカーテンを開けるのは逆効果であることを強調し、フジテレビのADが夜中にそっとカーテンを開けてくれる例えを再度用いて、5段階の夜明けの言葉(しののめ、あかつき、朝ぼらけ、あけぼの、つとめて)であなたの体を徐々に起こすのが理想だと締めくくる。\n\n【まとめ】\nこの動画は、ロサンゼルスでの時差ボケ解消体験(夕日を見つめること)をきっかけに、コルチゾール覚醒反応とミトコンドリアの働きを軸に、「夜は完全な暗闇に、朝は徐々に明るく」という相反する2条件をどう両立させるかを、イーロン・マスクのXプライズ財団の最新動向や日本の大和言葉の繊細な表現力を交えながら語り、体内時計を整えることが健康・若返りの鍵であるという一貫したメッセージを、ユーモアを交えて伝える内容です。"},
      {"name": "トーマスガジェマガ", "isNew": true, "videoTitle": "【iPhone 18シリーズ】全部微妙。折りたたみ「Duo」に見るAppleの苦悩", "videoUrl": "https://www.youtube.com/watch?v=9P5Cl9SVvIQ", "published": "2026-09-17T10:05:35+00:00", "failed": false, "summary": "チャンネル名: トーマスガジェマガ\n動画タイトル: 【iPhone 18シリーズ】全部微妙。折りたたみ「Duo」に見るAppleの苦悩\nURL: https://www.youtube.com/watch?v=9P5Cl9SVvIQ\n公開日時: 2026-09-17T10:05:35+00:00\n形式: 単独トーク形式のガジェット解説動画(Apple新製品発表会の分析・考察)\n\nこの動画は、Appleが発表した「iPhone18シリーズ」(Pro・Pro Max・Duo)について、トーマス氏が「全部微妙」と結論づけつつ、特に折りたたみスマホ「iPhone Duo」が36万4800円という高額である裏にあるApple側の戦略的意図を考察し、今から買うならどれがおすすめかを提案する内容です。\n\n【冒頭:結論の提示】\niPhone18シリーズが発表されたが、結論は「全部微妙。折りたたみに見るAppleの苦悩」であると大きく提示。発表された機種はPro、Pro Max、Duoの3機種で、最大の注目点はAppleから初めて発表された折りたたみスマホ「Duo」の価格が36万4800円という異常な高さであることだと述べる。\n\n【iPhone無印モデルが発表されなかったことの意味】\n3機種の説明の前に、今回iPhone18の無印(標準)モデルが発表されていないという重要な事実を指摘。さらにiPhone17が継続販売されつつ1.5万~3万円の値上げがされたことにも触れ、これはAppleが「9月には無印モデルを発表しない」という明確な判断を下した結果であり、外的要因ではなくApple自身の決断だと分析する。理由として、①iPhone17無印が「完璧すぎる」ためProモデルとの差別化(カメラの数)以上の進化を見せられず、中途半端な進化で期待を裏切るよりは「何もしない」方がブランドイメージ(行け行けどんどんで皆が憧れる企業)を守れると判断したこと、②毎年新型を出すこと自体の「チキンレース」を終わらせたいという業界全体の空気(ジョン・ジャニュアリー氏の発言を引用)があり、スマホ市場がプロダクトライフサイクルの「成熟期」に入り切っていること、そしてシェア50%以上を握るAppleだけがこのチキンレースを自ら終わらせる資格・力を持つという2つの理由を挙げる。\n\n【iPhone18 Proの進化点はカメラのみ】\n発表されたスペック資料は見かけ上大きく変化したように見せているが、実際は「全く進化していない」と指摘。重量が5g増えた以外の変化はカメラの絞り機構(F値がF1.48からF4まで調整可能になった)のみで、体感できる違いは解放F値がF1.78→F1.48になったことによる「わずかな暗所性能向上」だけだと説明。21万円という価格に対しこの程度の進化で見せ方だけが巧みであると評する。\n\n【iPhone Duo(折りたたみ)の36万円の裏にある戦略】\n本題の折りたたみスマホDuoについて、36万4800円という価格から「Appleは最初からDuoを売る気がない」と分析。根拠として、①折りたたみスマホ自体に大衆の需要がない(スマホOSはコンテンツ消費用途であり画面サイズの優位性は限定的、タブレットすら持ち歩かない現状がその証拠)こと、②すでにハイエンドシェアを独占するAppleにとって参入してもシェアも増えず、プラットフォーム収益も変わらないこと、③折りたたみ機構は故障率が高くサポートの手間が増えるというデメリットがメリットを上回ること、を挙げる。売っても損、売らなくても話題性を失うジレンマの解決策として「あえて誰も買えない高価格に設定すれば全て解決する」という結論に至ったと分析し、Galaxyと競合する27万円前後ではなく、わざと誰も買わない36万円という値付けにしたのだと説明する。\n\n【Duoを出した狙い:挑戦するAppleの演出】\nでは売る気がないのになぜ出したのかという問いに対し、「挑戦するAppleの演出」という役割を担わせたと分析。Appleのブランドイメージを保つには「常に挑戦し続けている」「常に話題になっている」ことが必要であり、もし今回Proモデルのカメラの微進化と無印未発表だけだったら「Appleはもうやる気がない」と思われてしまうところを、折りたたみという「昔からあった引き出し」を使うことでiPhoneが再び話題になる空気を演出することに成功したと評する。さらに36万円という価格自体も世間を賛否両論に分ける「炎上ネタ」として機能し、結果的に大衆の関心を集めることに成功したと分析する。\n\n【iPhone Duoの今後の運命:Vision Proと同じ】\nDuoは「コンセプトカー」のような存在であり、話題性と未来の提案が狙いで、今後も売る気のない「スキミングプライシング戦略」(高価格で開発費を回収しつつ、文句を言わない富裕層・インフルエンサー・ガジェットYouTuberのみに売る戦略)のまま、Vision Proと同様に話題を失うまでひっそりと販売が継続されるだろうと予測。発表会の段階でDuoの「仕事」はもう終わっているとまとめる。\n\n【今から買うならどれがおすすめか】\n18シリーズは円安(1ドル165~167円)の影響で全体的に値段が高く、来年は円高・値下げの可能性もあるため、どのモデルも今はおすすめしないと前置きした上で、完成度の高い「iPhone16Pro」(有線充電卓上対応、カメラコントロール、TypeC搭載で不満がない)を推奨。どうしても18シリーズが欲しい人には、相対的に値段が安く見える資産性の高い「iPhone18ProMax」を勧め、変化球としてGalaxy S25も良い選択だと個人的な見解を述べる。\n\n【締めくくり:Appleへの感謝】\n今回の発表会はApple自身のネタ切れを感じさせる内容だったとした上で、大学2年生の頃にiPhone3GSに出会ってから18年間スマホと共にあった自身の人生を振り返り、Appleがもたらしてきたイノベーションへの感謝を述べる。同時に、Vision Proや折りたたみスマホなど他デバイスが全く定着しない現状について、スマホという「ポケットに入る完成品」を我々はすでに持っているからではないかと考察し、来年以降のAppleの新たな挑戦に期待を寄せて締める。\n\n【まとめ】\nこの動画は、iPhone18シリーズ(無印未発表、Pro/Pro Maxのカメラのみの微進化、Duoの異常な高価格)という一見ネガティブな事実の裏に、Appleがブランドイメージを守るために「売る気のない高価格折りたたみスマホ」を話題作りの演出装置として利用しているという戦略を読み解き、スマホ市場全体が成熟期に入り革新が難しくなっている現状を指摘しつつ、それでも18年間イノベーションを牽引してきたAppleへの感謝を伝えるという内容です。\n"},

      {"name": "崔の店長日誌。", "isNew": true, "videoTitle": "そこまでやるの！？運気アップの衣替え！〜右肩上がりの収納方法〜/ 100日マラソン続〜2008日〜", "videoUrl": "https://www.youtube.com/watch?v=H5TTgjKukys", "published": "2026-10-10T20:00:38+00:00", "failed": false, "summary": "チャンネル名: 崔の店長日誌。\n動画タイトル: そこまでやるの！？運気アップの衣替え！〜右肩上がりの収納方法〜/ 100日マラソン続〜2008日〜\nURL: https://www.youtube.com/watch?v=H5TTgjKukys\n公開日時: 2026-10-10T20:00:38+00:00\n形式: 毎日配信「100日マラソン」シリーズ(2008日目)、占い師・崔氏による単独トーク配信\n\nこの動画は、占い師である崔氏が、季節の変わり目(秋の土用)のタイミングで行う「衣替え」が運気アップにつながる理由を風水的観点から解説し、衣替えの準備・クローゼットの開運収納ルール(8割収納2割余白、右肩上がりのハンガー掛けなど)を具体的に紹介する内容です。\n\n【冒頭:娘の運動会と妻からのエピソード】\n10月11日日曜日の挨拶から始まり、前日は娘の保育園の運動会だったと報告。帰り道に妻から「ママ友にパパの体型がかっこいいねと言われた」と伝えられ、「体型は褒められたが首から上(顔)はどうだったのか」と自虐的にツッコむ雑談から始まる。\n\n【本題への導入:土用と衣替えのタイミング】\n今日のテーマ「そこまでやるの、運気アップの衣替え」を提示。現在は「土用」(季節の変わり目で気が乱れる期間)にあたり、10月20日から秋の土用が始まり、11月7日からは暦の上で「立冬」となり冬がスタートするため、このタイミングで今のうちから衣替えをしておくべきだと説明する。\n\n【家の風水とクローゼットの重要性】\n家の方位(西・北西・北など)に溜まった滞りや汚れが運気に大きく影響すると説明。多くの資産家の家を見てきた経験から、彼らの家に「開運グッズ」はほとんどないが、玄関・水場に次いでクローゼットが驚くほど整理整頓されていると語る。これは資産家になる前からの習慣であり、クローゼットの淀んだエネルギーを一掃することが良い流れに乗る鍵だと説明する。\n\n【衣替えが運気アップに重要な理由】\n普段着ている服は良いエネルギーも悪いエネルギーも吸収・発するものであり、春夏秋冬の季節の巡りに合わせてクローゼットの中身を入れ替えることが、旬のものを食べることと同様に良い流れに乗るきっかけになると説明。引っ越しのアドバイスをする際、風水上良い方位・間取りに引っ越した人がクローゼットの整理(衣替え)も同時に行うことで、法位の効果よりも速く金運・出会い運・異性運の変化を実感するケースが多いと自身の経験から語る。\n\n【衣替えを行う際の3つの準備】\n①晴れた日に行うこと(邪気の根本である湿気を、窓を開けて一気に外に追い出すため)。②3年着ていない汚い服は処分し、クローゼットの中に必ず余白(スペース)を作ること(古い服には「息」がこびりついているため処分することで新しい運気が余白に入ってくる、俗に言う「断捨離」)。③これから着る前提の服は必ず「風干し」をして湿気(=穢れ)を払った上で収納すること、の3点を挙げる。\n\n【開運収納ルール①:8割収納・2割余白】\nクローゼットはギチギチに詰め込まず「8割収納・2割余白」が鉄則だと説明。余白を作ることが新しい運気を呼び込み、カビ予防にもつながると語る。\n\n【開運収納ルール②:スーツとネクタイの同時掛けNG】\n1つのハンガーにスーツとネクタイを一緒に掛けるのはNGだと説明。これは自身が借金返済時代から風水の先生に教わって実践している方法だと明かす。ネクタイやベルトなど「長いもの」は縁を運んでくるものなので、くるくる丸めずに伸ばした状態で掛けておくことが、厄払い・縁を引き寄せる意味を持つと語る。\n\n【開運収納ルール③:ハンガーは右肩上がりに並べる】\nセレブ層がこだわるポイントとして、ハンガーにかける服を右側に裾の短いもの・明るい色の服、左側に裾の長いもの・色の濃い服を並べ、全体として「右肩上がり」のグラデーションを作ることを紹介。これは運気・成績・売上が上がっていくイメージを視覚的に刷り込む狙いがあり、尊敬する経営者の奥様が仕事がうまくいかない時期から実践し、ご主人が現在の地位を築く一因になったという伝聞エピソードを紹介する。\n\n【その他の収納テクニック】\n花柄の洋服は一番上に収納する、ストールやスカーフのような「長いもの」はお気に入りの香りと一緒にしまうことを勧める。最後に、クローゼットの一番下には除湿剤を置き、邪気の原因となる余計な水分を吸い取らせることを勧める。\n\n【締めくくり】\n小さなことをコツコツ積み重ねることで運の流れが変わっていくとし、一気に全部やろうとせず、連休の間に少しずつ意識して取り組んでほしいと呼びかける。恒例のガッツポーズと掛け声で締めくくる。\n\n【まとめ】\nこの動画は、季節の変わり目である秋の土用のタイミングで行う「衣替え」が、資産家に共通するクローゼット整理の習慣や風水的な縁・運気の流れと深く結びついていることを説明し、晴れた日に行うこと・古い服を処分して余白を作ること・風干しをすることという準備と、8割収納2割余白・ハンガーの右肩上がり配置・長いものの掛け方といった具体的な開運収納ルールを紹介しながら、小さな習慣の積み重ねが運気の流れを変えるという一貫したメッセージを伝える内容です。\n"},
      {"name": "UP&UP", "isNew": true, "videoTitle": "【警告】世界一恵まれているのに挑戦しない日本人", "videoUrl": "https://www.youtube.com/watch?v=3kJwCnF2axE", "published": "2026-10-10T09:00:10+00:00", "failed": false, "summary": "チャンネル名: UP&UP\n動画タイトル: 【警告】世界一恵まれているのに挑戦しない日本人\nURL: https://www.youtube.com/watch?v=3kJwCnF2axE\n公開日時: 2026-10-10T09:00:10+00:00\n形式: 対談動画からの切り出しショート動画(概要欄によれば本編フル動画が別途公開されている)。字幕全文は約600文字程度の短い対談パートのみ\n\nこの動画は、UP&UPのメンバーの一人が、インフラ・治安・食事などあらゆる面で世界トップレベルに恵まれているにもかかわらず「チャレンジする人」と「応援する人」の両方が少ない日本の現状を指摘し、自分も応援する側・応援される側の両方になることが社会へのインパクトや事業の拡大につながるという考えを語る内容です。\n\n【冒頭:日本はレベルが高いという指摘】\n聞き手から「海外もたくさん見ている中で、日本が持つ可能性や未来を大切にしたいという思いがあるか」と問われ、本人は「日本は他の外国に比べて明らかに全部のレベルが高い」と即答。トイレの清潔さ、食べ物の美味しさ、道路や通信といったインフラまで、「ないものがない」国だと評価する。\n\n【日本の課題:チャレンジする人と応援する人の不足】\nただし唯一の課題として「チャレンジする人が少ない」ことを挙げ、さらにチャレンジする人が少ないということは「応援する人も少ない」ことを意味すると指摘。多くの人が自分のことしか考えていない状態にあると語る。\n\n【自分自身のスタンス:応援する人にも応援される人にもなる】\n聞き手から「どちらかと言えば応援する人になりたいという思いが強いのか」と聞かれ、本人は「応援する人にならないと自分たちも大きくなれない」とした上で、応援する人にも応援される人にも両方なる必要があると説明。社会に対して高いインパクトを残したいと考えているため、応援する人たちを増やし、その輪を広げていくことが重要であり、どれだけ多くの人の人生を自分の事業や活動に巻き込めるかが鍵になると語る。\n\n【まとめ】\nこの動画は、インフラや生活環境のあらゆる面で世界的に恵まれている日本において、挑戦する人とその挑戦を応援する人の双方が不足している現状を指摘し、自分自身は社会への大きなインパクトを残すために「応援する人」と「応援される人」の両方の立場を担い、より多くの人を自分の事業や活動に巻き込んでいきたいという考えを伝える内容です。なお、この動画は本編フル動画(概要欄にリンクあり)からの抜粋クリップであり、取得できた字幕もこの短い対談部分のみであるため、本編全体の詳細な内容までは確認できていません。\n"},
      {"name": "中野優作 / CAR and LIFE.（BUDDICA）", "isNew": true, "videoTitle": "【中古車選びで要注意】車屋歴約20年で「もう売らない」と決めた車3選！売って後悔した理由から“買う前の注意点”を徹底解説", "videoUrl": "https://www.youtube.com/watch?v=nZi4s3Hvsrk", "published": "2026-10-08T10:00:17+00:00", "failed": false, "summary": "チャンネル名: 中野優作 / CAR and LIFE.（BUDDICA）\n動画タイトル: 【中古車選びで要注意】車屋歴約20年で「もう売らない」と決めた車3選！売って後悔した理由から\"買う前の注意点\"を徹底解説\nURL: https://www.youtube.com/watch?v=nZi4s3Hvsrk\n公開日時: 2026-10-08T10:00:17+00:00\n形式: 対談形式の解説動画(聞き手役スタッフとBUDDICA代表・中野優作氏による質疑応答)、最後にお客様との思い出エピソードも紹介\n\nこの動画は、車屋歴約20年・累計取扱台数10万台超の中野優作氏が、過去に「もう売るんじゃなかった」と後悔した3つの車種・カテゴリー(買黒加工車、社外エアロ付き軽自動車、未使用車)について、裏話を交えながら理由を解説し、中古車選びで失敗しないための注意点を伝える内容です。\n\n【冒頭:質問の導入と中野氏の経歴】\n聞き手が「車屋を約20年やってきた中野さんが、今まで何台売ってきたのか」と質問し、中野氏は自身が直接納車したのは5~7万台、店長時代の自分の持ち場全体では10万台を超えると回答。続けて「お客様の失敗を防ぐため、過去に売るんじゃなかったと思う車はあるか」という禁断の質問がなされ、3つあると答える。\n\n【1つ目:買黒(かいぐろ)加工車】\n約20年前に流行した「買黒」(人気の低いシルバーなどの車を全塗装して黒に塗り替える手法)を紹介。セルシオやクラウンなど高級セダンで、不人気色のオークション落札車(30万円)を全塗装・社外アルミ・ローダウンまで施して150万円で販売するビジネスが流行っていたと説明。この手法自体は整備代を計上でき、暇な時期の収益源として悪くなかったが、問題は塗装の品質で、業者によっては安く仕上げるため下地処理が甘く、半年ほどで塗装がペラペラと剥がれるクレームが多発したと明かす。自身が会社員時代に実際に経験したクレーム対応として、納車時はピカピカだった車が半年後にドアを閉めただけで塗装が剥がれ、下地のシルバーが露出したケースを紹介。会社側が保証対応を認めず、こっそり格安で塗り直しをしたエピソードを語る。現在は純正色の価値が見直されており、黒塗装によって価値が上がることはないため、今はこうした買黒車を仕入れて売ることはないと結論づける。\n\n【2つ目:社外エアロ付き軽自動車(エアロセット車)】\nムーブやライフ、ワゴンRなどの軽自動車(本体80万円程度)に黒・白の社外エアロ、アルミ、ナビ、カーボンシートなどをセットし120万円で販売する「エアロセット」が当時よく売れ、収益的にも助けられたと振り返る。しかし社外エアロは純正エアロと違い取り付け精度にずれが生じやすく、熱による変形やアルミメッキの劣化によるクレームが多発。特に一流ブランド(150万円相当)と比べて安い(120万円)分、精度のずれが起きやすいという期待値調整が不十分なまま大量仕入れして販売していたと明かす。具体的なクレーム事例として、正月の初売り日にタバコを吸いながら怒鳴り込んできた客に、燃費が異常に悪い(カタログ値16~17km/Lに対し10km/L)とクレームを受け、ディーラー2社で検査しても異常なしと言われたため同乗して確認したところ、客がベタ踏み運転とアイドリング放置(彼女を待つ間2~3時間エンジンをかけたまま)をしていたことが原因だったと判明したエピソードを紹介。最終的に客は謝罪したが、この経験から「安い商品に高い商品と同じクオリティを求めるお客様を呼び込んでしまった」こと、そしてその対応体制が整っていなかったことが問題だったと総括する。\n\n【3つ目:未使用車】\n未使用車自体は新車との価格差が魅力的な良い商品だが、自分たちのビジネスモデルには合わなかったと説明。当時ディーラーから仕切り(新車価格の15~20%引き)で仕入れていたが、ディーラーより十分安く見せるための価格設定をすると実質の荒利は1台5万円程度にしかならず、コーティングや車検、保険などのセット販売が前提でなければ成立しないビジネスだったと明かす。未使用車専門店が大型店舗で成立させているビジネスモデルは「安売りを極限まで効率化したオペレーション勝負」であり、採用・教育・組織化まで含めた完成されたモデルとして心からリスペクトしているが、自社(BUDDICA)が目指す「中古車業界を盛り上げる」という方向性とは違う筋肉を使うゲームであり、同じ車屋でも業態によって全く別のゲームをしていると説明する(サッカーとフットサル、短距離と長距離走の例え)。\n\n【締めくくり前:思い出に残るお客様エピソード】\n3つの裏話の後、聞き手から「売ってよかったと思う思い出のお客様」を聞かれ、ビッグモーターに入社した初日に接客し、ムーブカスタムを契約してくれた最初のお客様とのエピソードを紹介。契約が決まらず自宅を訪ね、お客様の父親が営む居酒屋で酒を飲みながら説得し、ようやく契約に至った経緯を明かす。その後10年以上会っていなかったが、街で偶然そのお客様の奥様(お花屋さんを営む)と再会し、ずっとYouTubeで応援してくれていたことを知るという心温まる話を紹介。もう一つのエピソードとして、ビッグモーター入社前に不動産(アパート経営)営業をしていた時代、無理な契約を取らせようとする会社の体質に疑問を持ち退職したこと、その際に唯一「卒業おめでとう」と送り出してくれた上司と10年後にFacebook経由で再会し、息子の車の購入を「中野君に任す」と一任されオークションからプリウスを3台並べて選んでもらい、以降家族3台分の車を買ってもらった絆のエピソードを紹介する。\n\n【締めくくり:BUDDICAの利用案内】\n店舗に行きづらい人向けに、LINEやZoomでの相談・契約が可能であること、写真15枚を送るだけで査定できる買取サービス、グレード入力で簡易査定ができる「車メーター」、BUDDICA・Garage・フランチャイズ加盟店含め全国約50店舗(北海道から沖縄まで)に拡大している現状を紹介し、在庫不足のため買取も積極的に行っていると案内する。最後に、この企画はコメント欄のリクエストから作られたものであることを明かし、チャンネル登録とグッドボタンを呼びかけて締めくくる。\n\n【まとめ】\nこの動画は、車屋歴20年の中野優作氏が「買黒加工車の塗装トラブル」「社外エアロ軽自動車の精度ずれによるクレーム」「未使用車の薄利多売モデルとの不適合」という3つの実体験に基づく後悔を正直に語り、価格と品質のトレードオフを正しく期待値調整することの重要性を伝えつつ、長年のお客様との心温まる人間関係のエピソードを通じて、車の売買が単なる商取引以上の意味を持つという一貫したメッセージを伝える内容です。\n"},
      {"name": "サムの本解説ch", "isNew": true, "videoTitle": "なぜ、脳は「見た目」で差別するのか？【要約】脳は見た目から逃れられない", "videoUrl": "https://www.youtube.com/watch?v=xPKkcw-Tr0E", "published": "2026-09-12T11:00:33+00:00", "failed": true, "summary": "チャンネル名: サムの本解説ch\n動画タイトル: なぜ、脳は「見た目」で差別するのか？【要約】脳は見た目から逃れられない\nURL: https://www.youtube.com/watch?v=xPKkcw-Tr0E\n公開日時: 2026-09-12T11:00:33+00:00\n形式: 書籍要約・解説動画(精神科医・和田秀樹氏の著書『脳は見た目から逃れられない』を紹介)\n\nこの動画は、精神科医・和田秀樹氏の著書をもとに、私たちが信じている「美しさ」の基準がメディアや社会によって後天的に脳に刷り込まれたものであること、脳が外見という手軽な情報だけで人を判断してしまう「ハロー効果」の仕組み、そして外見コンプレックスや見た目による判断から抜け出すための具体的な行動を解説する内容です。\n\n【冒頭:問題提起】\n人は相手の顔をわずか0.1秒見ただけで信頼できるかどうかの第一印象を決めてしまうが、その直感に全てを委ねると詐欺師に騙されたり優秀な人を見誤ったりする危険があり、「見た目で判断する人ほど見た目に騙される」と提起。外見で判断された側が深く傷つく一方、恋愛や仕事の不調を顔や体型のせいにしてダイエットに疲れ果てている人に向けて、この動画を見れば不毛な自己嫌悪から抜け出し、表面に騙されず人生の主導権を取り戻せると案内する。著者・和田秀樹氏を30年以上高齢者医療に携わってきた精神医学のエキスパートとして紹介し、本書は「外見を気にするな」という綺麗事ではなく、脳科学・心理学の知見から美の基準の仕組みを解き明かす現実的な内容だと位置づける。\n\n【1章:その「美しい」は誰かに教え込まれたもの】\n痩せている・目がぱっちり二重・鼻が高いといった美の基準を人間の本能だと思いがちだが、これは誤解であり、第一印象を素早く作る働き自体は脳に備わっているものの、「何を美しいと判断するか」という基準は生まれた後にメディアや社会から教え込まれたものだと説明。平安時代の日本ではおかめ顔や長い黒髪が美とされていた例や、1960年代にテレビの普及とともにイギリスの痩せたモデル「ツイッギー」の登場でわずか数年で「痩せていることが美しい」という基準に塗り替えられた例を紹介。心理学の実験で周囲が明らかな間違いを言い続けると約75%の人が一度は多数派に同調してしまうという同調効果にも触れ、この偏った美の基準が美容・ダイエット業界の広告にも利用され、「今のあなたには欠点がある」と思わせることで商品が売れやすくなる構造があると指摘。さらにSNSの加工文化により、日々見る自分の加工顔が脳内の基準になってしまい、無加工の現実の自分にショックを受け人間関係から逃げてしまう危険性についても言及し、これは狭く偏った美の基準に踊らされているだけだと視聴者に語りかける。\n\n【2章:見た目で判断する人ほど見た目に騙される】\n爽やかな身だしなみの上司と寝癖・シワだらけの上司の例を挙げ、多くの人が見た目だけで能力や性格まで期待してしまう「ハロー効果」(1つの目立った特徴に引っ張られて無関係な部分まで優れていると錯覚する心理)を解説。外見の美しさと知的能力・道徳性・仕事の能力の間に明確な関係はないとした上で、脳がこの錯覚を起こす理由は単純に「面倒くさがり」だからであり、相手をじっくり観察するのはエネルギーを使うため、外見という手軽な情報だけで0.1秒で結論を出そうとすると説明。この脳の手抜きを悪用しているのが詐欺師であり、清潔感のある爽やかな営業マンに警戒心を解いて契約してしまう被害者が「悪い人には見えなかった」と語るのは、相手の人柄を見抜いた証拠ではなく外見の印象が優先された結果に過ぎないと指摘。さらにこの手抜きは自分自身にも向き、仕事や恋愛の失敗を全て顔や体型のせいにしてしまうと、話し方や気遣いといった改善可能な原因を見落とす罠にはまると解説。美容整形をしても内面の態度が変わらなければ現実は好転せず、終わりのない修正ループにはまる例も紹介する。「見た目が9割」という言葉についても、本来のメラビアンの法則は「言葉の内容と表情・声のトーンが矛盾する時、人は表情や声を優先して信じる」という意味であり、生まれつきの顔の造形の良さで人生が決まるという意味ではないと誤解を正す。\n\n【3章:顔を変える前に人生の評価軸を増やせ】\n脳の手抜きの仕組みを踏まえ、明日から実践できる3つの具体的行動を提案。行動1「第一印象を24時間保留する」:第一印象を感じた瞬間に「脳が手抜きをしている」と心の中で唱え、その直感とは関係のない客観的な情報(過去の実績データや実際の行動)を最低1つ意図的に探すことで、詐欺被害や人材の見落としのリスクを減らせると説明。行動2「原因を消す目標を行動する目標に変える」:「鼻を高くしたい」「痩せたい」といった変えるのが難しい外見目標ではなく、その先で得たいもの(人に好かれたい、自信を持ちたい等)を考え、「初対面の人と10分間笑顔で楽しく会話できるようになる」といった今すぐ行動できる目標に変換することを提案。行動3「12週間で1つの強みを徹底的に伸ばす」:会話スキル・専門知識・料理・ユーモアなど、すでに得意なことを1つ選び12週間かけて磨き上げ、世間全体からもてはやされたいという願望を捨てて、身近なたった1人から深く信頼される存在を目指すことを勧める。外見の優位性は年齢とともに比重が小さくなる一方、専門知識や思いやりは年齢とともに深みを増すため、表面的な美しさで100人に振り向かれる人生より内面の深さで1人から深い信頼を得る人生の方が豊かだと語る。\n\n【締めくくり:視聴者への問いかけとまとめ】\n「最初は見た目で苦手だと思ったが、話してみたら印象が大きく変わった経験」についてコメント欄で共有してほしいと呼びかける。最後に、美しさの基準はメディアや社会によって脳に教え込まれたものであり、脳は常にエネルギー節約のため外見という表面的情報で相手を判断しようとするが、ルッキズムへの最大の対抗手段は顔を変えることではなく「賢くなること」、すなわち第一印象を疑い多面的な情報を集め、年齢とともに価値が下がりやすい外見ではなく年齢とともに深みを増す好感度や強みに時間とエネルギーを投資することだとまとめる。\n\n【まとめ】\nこの動画は、私たちが信じている美の基準がメディアや社会によって後天的に脳に刷り込まれたものであり、脳が省エネのために外見という表面的情報だけで人を判断する「ハロー効果」というメカニズムを持つことを解き明かした上で、第一印象を24時間保留する・外見目標を行動目標に変える・12週間で1つの強みを磨くという3つの具体的行動によって、見た目に振り回されず年齢とともに深みを増す自分自身の価値に投資していくことが人生の主導権を取り戻す鍵であるという一貫したメッセージを伝える内容です。"},
      {"name": "サラタメさん", "isNew": true, "videoTitle": "【AIの正しい使い方】“今日から”も”10年後”も使えるヤツです。", "videoUrl": "https://www.youtube.com/watch?v=o8mMELmh4Ak", "published": "2026-09-24T03:09:44+00:00", "failed": false, "summary": "チャンネル名: サラタメさん\n動画タイトル: 【AIの正しい使い方】\"今日から\"も\"10年後\"も使えるヤツです。\nURL: https://www.youtube.com/watch?v=o8mMELmh4Ak\n公開日時: 2026-09-24T03:09:44+00:00\n形式: 単独トーク形式の解説動画(様々なビジネスパーソンに会う仕事柄から気づいた「AIガチ勢」と「AI弱者」の使い方の違いを解説)\n\nこの動画は、サラタメ氏が多くのビジネスパーソンと接する仕事の中で気づいた「AIをうまく使いこなすガチ勢」と「AIに情報量で圧倒されてしまう弱者」の2つの決定的な違い(①AIをドSに雑に使うか丁寧に気遣うか、②最新情報を追うか記録・記憶に投資するか)を解説し、AI時代はアホにこそ最高の時代だという持論を語る内容です。\n\n【冒頭:前置きと2つのテーマ提示】\n色々なビジネスパーソン(会社員・経営者・フリーランス、優秀な人からやばめな人まで)に会う仕事柄、AIを使いこなす「AIガチ勢」と「AIに飲み込まれるAI弱者」の違いに気づいたと切り出し、今回解説する2つの違い(①人権なしの奴隷のようにAIを雑に使う特徴、②最新情報より記録・記憶を重視する特徴)を提示。後半で「AI時代はアホにこそ最高の時代」という補足話もすると予告し、話したいことが多すぎるためLINE限定の裏側動画「裏タメ」を新設したことを告知する。\n\n【違い1つ目:AIガチ勢はドSに雑に指示、AI弱者は情報量に殴られる奴隷】\nAIガチ勢は長々としたプロンプトを書かず、シンプルな指示しか出さないと説明。その理由は2つ、①AIが急速に賢くなり続けており(GPT5→6の例)、文脈理解力が上がっているため細かい指示は逆にAI本来の推論力を阻害する、②AIは無限の体力・圧倒的スピード・感情がないという人間と全く異なる性質を持つため、気遣いは無駄であるばかりか害でもあると説明。アメトークでAIに礙儀正しく接していた芸人(ロンブー淳)の例を「AI弱者」の典型として挙げ、自分自身も丁寧に話しかけてしまう癖があると自己言及しつつ、AIとのコミュニケーションと人間とのコミュニケーションの人格を分けるべきだと提案する。\n\n【ガチ勢の具体的アクション4つ】\n①雑に話しかける:音声入力(ボイスインやAquaVoiceを併用)で誤字脱字だらけでも気にせず指示すべきと説明。ローマ字入力でも「進撃の巨人のリバイ兵長になり切って自己紹介して」のような複雑な指示を正確に理解できる実例を示す。②依頼が曖昧なら自分で整理せずAIに質問させる(「質の高い回答のために必要な情報を得るまで質問して」というプロンプトを活用)。A案B案のような評価基準が必要な相談や、条件が多い旅行プラン、原因不明の売上不振相談などで有効と説明。③プロセスまで指示せず、ゴールと現在値だけを明確に伝える(東京から大阪に行きたい、という目的だけ伝えればAIが最適ルートを提案してくれる例、営業資料作成で細かく分析手法を指定するとAIの提案可能性を潰してしまう例を紹介)。④ダメなチャットはすぐ切り替えて引き継ぎ書を作らせる(業界リサーチと個別提案資料作成のように目的が異なるタスクを同じチャットで続けるとノイズが混ざり精度が落ちるため、引き継ぎ書を作らせて別チャットに切り替えるべきと説明)。\n\n【情報量に殴られないために:短く答えさせてガン詰めする】\nAI弱者は情報量が多いほど満足してしまい、AIが出した文章をそのまま自分の成果物として提出してしまう(信頼を落とす行為)と指摘。AIの一発目の回答は70点程度であり、そこから「ここが違う」と叩いて120点に仕上げるのがあるべき姿であり、最初から完璧な「ポン出し」や「完全自動化」を狙う考え方自体が間違っていると説明。短く答えさせて自分がチェックできる量に抑え、方向性が合っていれば徐々にボリュームを増やすという進め方を推奨する。\n\n【違い2つ目:AIガチ勢は最新情報を追わず、記録と記憶に投資する】\nAI弱者はSNSでAI驚き屋のインフルエンサーに踊らされ最新情報を追いかけるが、AIガチ勢は5年後10年後を見据えて「何を積み上げるべきか」を考えており、具体的には「記録する」こと(①最新情報を追わない、②記録する、③記憶に残りに行く、の3点)を重視していると説明。ツールやサービスは誰も追わなくても自然に進化し使いやすくなるため、話題の本だけ読む人と同じ思考パターンで最新ツールを追う必要はなく、自分の課題解決に必要な情報だけ取りに行けばよいと述べる。\n\n【記録することの重要性:自分にしかできない一次情報を貯める】\nググってもAIに聞いても出てこない貴重な一次情報(仕事の仮説・アクション・結果のプロセス、顧客の生のフィードバック、尊敬する上司の言葉、大失敗の経験、誰にも言えない内面の悩みなど)を記録することが重要だと説明。自身も1年ほど前から日記(日付・睡眠時間・体調・気分・食事・体重・メモ)をGoogleドキュメントに音声入力でひたすら書き続けており、誤字脱字があってもAIが識別してくれるため問題ないと明かす。大事な打合せの議事録要約も同じファイルに貼り付けており、このドキュメントをAIに読み込ませて相談すると、自分の過去の目標や悩みを踏まえた的確なフィードバック(体調を気遣うアドバイスなど)が返ってくると実体験を語る。\n\n【記憶に残ることの重要性:人的資本から社会資本へ】\nAI弱者はAIでスキル(文章力・リサーチ力・資料作成力など)を磨こうとするが、AI時代に無双する優秀な人は「人的資本」より「社会資本」(信頼・人脈・コミュニティ)への投資にシフトしていると説明。スキルアップを最後に回し、まず「キーマンに名前を覚えてもらう・思い出してもらう」ことを優先し、仕事を任されてから初めてAIや専門家に相談して仕事を仕上げるという順番の違いを指摘。社内でのセルフブランディング、飲み会・イベント企画、定期的な顧客訪問などの具体例を挙げ、経営者やフリーランスであればSNSでの狭く深い発信も同じ「記憶に残る」ための行動だと説明する。知名度の価値が上がりすぎている現状として、悪名でも名前が知られていれば経済的価値につながってしまう現象(迷惑系YouTuberなど)にも触れ、やや複雑な心境も吐露する。\n\n【補足:AI時代はアホにこそ最高の時代】\n自身を「アホ代表」と称し、雑な指示・曖昧な依頼・最新情報を追わなくていいという今回の話はすべて「アホでもできる」ことだと振り返る。具体例として、専門外だと諦めていた時事解説系コンテンツも、AIがファクトチェックを担ってくれるようになったことで挑戦できるようになったと明かし、話したいことが溢れて収まらなくなったため、新設したLINE限定動画「裏タメ」で今回のAI活用の続編やプライベートな話、進撃の巨人の自由についての哲学的な考察などを配信していくと告知する。\n\n【まとめ】\nこの動画は、AIを使いこなす人とAIに振り回される人の違いが「AIをドSに雑に使い、短く答えさせて叩いて仕上げるか」「AIの情報量にそのまま圧倒されて鵜呑みにするか」、そして「最新情報を追うか、自分にしかできない記録(日記)と人間関係・信頼という記憶に残る行動に投資するか」という2点に集約されるとし、スキルよりも「何ができるか」ではなく「誰に覚えてもらっているか」が今後の価値を左右するという一貫したメッセージを、アホ代表としての親しみやすい語り口で伝える内容です。\n"},

動車のエンジンのように弱く、「ダサい」という感情で動くのはランボルギーニのエンジンのように力強いと比喩する。AIに仕事を奪われるから営業経験を積んだ方がいいという理屈で営業職に就く人の例を挙げ、理屈から入っても構わないが、その先で営業という分野そのものに「結果が出せなかったら人間的にダサい」という感情が芽生えてくる人の方が、エンジンが強く信用できると説明する。\n\n【過去動画との関連:人を信用する時の分野分けへの応用】\n以前の動画で語った「同じ人でも分野によって信用できる部分とできない部分を分けて考えるべき」という話にも、この「ダサい」の感情構造が応用できると説明。その人が「ダサい」と心から感じている分野こそ、その人の中で最も信用できる・守られる部分だと結論づける。\n\n【締めくくり:「ダサい」は大人こそ持つべき高尚な言葉】\n「ダサい」「かっこいい」という言葉は中学生が使うようなガキっぽい、チープな言葉に聞こえるかもしれないが、実は大人こそこの感情の概念を持つべきであり、「高尚でビターチョコレート的な言葉」だと主張。大人になるほど「正しいか正しくないか」という理屈っぽい・ゴール思考的な判断軸に偏りがちだが、それは実は弱く、他人からの信頼も得にくいため、もっと「ダサい・かっこいい」という感情を前面に出して生きていくべきだと締める。最後に視聴者へ「落ち着いている人と情熱的な人、どちらがかっこいいと思いますか?」と問いかけて終わる。\n\n【まとめ】\nこの動画は、「正しいか正しくないか」という理屈のレベルの理解では人の行動を本当には制御できず、腹の底から湧き上がる「ダサい」という感情こそが最も強く人の行動を規定し、最も信用できるものであるとした上で、この「ダサい」と感じる分野は人によって異なり、自分がダサいと感じる分野(エンジンの大きい分野)でこそ力を発揮できるため、大人こそこの感情を軽視せず活かして生きるべきだという一貫したメッセージを伝える内容です。\n"},

  // 既読管理: サーバー側の new_in_last_check は「前回チェックと比較して動画が
  // 変わったか」しか表さず、自動チェックが1回でも走るとリセットされてしまう。
  // 実際にユーザーが読んだかどうかはこのブラウザの localStorage で別管理する。
  const READ_KEY = "ytChecker.readVideoUrls";

  function loadReadSet() {
    try {
      const raw = localStorage.getItem(READ_KEY);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch {
      return new Set();
    }
  }

  function markRead(videoUrl) {
    const set = loadReadSet();
    set.add(videoUrl);
    // 肥大化しすぎないよう直近200件に丸める
    const arr = Array.from(set).slice(-200);
    localStorage.setItem(READ_KEY, JSON.stringify(arr));
  }

  function relTime(iso) {
    const then = new Date(iso).getTime();
    const now = Date.now();
    const diffMs = now - then;
    const min = Math.floor(diffMs / 60000);
    if (min < 60) return `${Math.max(min, 0)}分前`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr}時間前`;
    const day = Math.floor(hr / 24);
    if (day < 30) return `${day}日前`;
    const mon = Math.floor(day / 30);
    return `${mon}ヶ月前`;
  }

  function render(data) {
    const list = document.getElementById("channelList");
    list.innerHTML = "";
    const readSet = loadReadSet();
    let unreadCount = 0;

    // 未読(新着)のチャンネルを上に、既読/変化なしを下に並べる。
    // 同じグループ内では元の(state.json の)並び順を保つ(安定ソート)。
    const sorted = data.channels
      .map((ch) => ({
        ch,
        isUnread: !!ch.summary && !readSet.has(ch.videoUrl),
      }))
      .sort((a, b) => Number(b.isUnread) - Number(a.isUnread));

    sorted.forEach(({ ch, isUnread }) => {
      if (isUnread) unreadCount++;

      const li = document.createElement("li");
      li.className = "channel" + (isUnread ? " is-new" : "");

      const chip = document.createElement("span");
      chip.className = "chip" + (isUnread ? " is-new" : "");
      chip.textContent = ch.failed ? "取得失敗" : (isUnread ? "新着あり" : "変化なし");

      const name = document.createElement("div");
      name.className = "channel-name";
      name.textContent = ch.name;

      const video = document.createElement("a");
      video.className = "video-title";
      video.href = ch.videoUrl;
      video.target = "_blank";
      video.rel = "noopener noreferrer";
      video.textContent = ch.videoTitle;

      const meta = document.createElement("div");
      meta.className = "meta" + (ch.failed ? " fail" : "");
      meta.textContent = ch.failed ? "前回チェック失敗" : `公開: ${relTime(ch.published)}`;

      li.append(chip, name, video, meta);

      if (ch.summary) {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "summary-toggle";
        toggle.textContent = isUnread ? "▸ 詳細な要約を読む(未読)" : "▸ 詳細な要約を読む";

        const body = document.createElement("div");
        body.className = "summary-body";
        body.textContent = ch.summary;

        toggle.addEventListener("click", () => {
          const open = body.classList.toggle("open");
          toggle.textContent = open ? "▾ 要約をたたむ" : "▸ 詳細な要約を読む";
          if (open && isUnread) {
            markRead(ch.videoUrl);
            chip.textContent = ch.failed ? "取得失敗" : "変化なし";
            chip.classList.remove("is-new");
            li.classList.remove("is-new");
          }
        });

        li.append(toggle, body);
      }

      list.appendChild(li);
    });

    document.getElementById("sumNew").textContent = unreadCount;
    document.getElementById("sumIdle").textContent = data.channels.length - unreadCount;
    document.getElementById("sumTotal").textContent = data.channels.length;

    const dot = document.getElementById("updatedDot");
    const text = document.getElementById("updatedText");
    dot.classList.toggle("live", unreadCount > 0);
    text.textContent = `最終チェック: ${relTime(data.checkedAt)}`;
  }

  render(CHANNELS_DATA);
</script>
