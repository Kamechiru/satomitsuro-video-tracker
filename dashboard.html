<title>YouTube新着チェッカー</title>
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface-raised: #fbfaf8;
    --ink: #21262b;
    --ink-muted: #5b6470;
    --ink-faint: #8b929b;
    --border: #dedbd3;
    --border-strong: #c7c3b8;
    --accent: #2e5c8a;
    --accent-soft: #e4ecf3;
    --new: #d9622b;
    --new-soft: #fbe7db;
    --idle: #7d8880;
    --idle-soft: #eceae4;
    --shadow: 0 1px 2px rgba(33, 38, 43, 0.06), 0 4px 16px rgba(33, 38, 43, 0.05);
    --radius: 10px;
    --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Hiragino Mincho ProN", Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, "Courier New", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --surface: #1b1f23;
      --surface-raised: #21262b;
      --ink: #e8e6e1;
      --ink-muted: #9aa2a9;
      --ink-faint: #6b7278;
      --border: #2c3237;
      --border-strong: #3a4046;
      --accent: #7fb0e0;
      --accent-soft: #223140;
      --new: #f0904f;
      --new-soft: #3a2618;
      --idle: #7c8680;
      --idle-soft: #23282a;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.25);
    }
  }

  :root[data-theme="dark"] {
    --bg: #14171a;
    --surface: #1b1f23;
    --surface-raised: #21262b;
    --ink: #e8e6e1;
    --ink-muted: #9aa2a9;
    --ink-faint: #6b7278;
    --border: #2c3237;
    --border-strong: #3a4046;
    --accent: #7fb0e0;
    --accent-soft: #223140;
    --new: #f0904f;
    --new-soft: #3a2618;
    --idle: #7c8680;
    --idle-soft: #23282a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.25);
  }

  :root[data-theme="light"] {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface-raised: #fbfaf8;
    --ink: #21262b;
    --ink-muted: #5b6470;
    --ink-faint: #8b929b;
    --border: #dedbd3;
    --border-strong: #c7c3b8;
    --accent: #2e5c8a;
    --accent-soft: #e4ecf3;
    --new: #d9622b;
    --new-soft: #fbe7db;
    --idle: #7d8880;
    --idle-soft: #eceae4;
    --shadow: 0 1px 2px rgba(33, 38, 43, 0.06), 0 4px 16px rgba(33, 38, 43, 0.05);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 20px 64px;
  }

  header.top {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 28px;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }

  .subtitle {
    color: var(--ink-muted);
    font-size: 14px;
    margin-top: 2px;
  }

  .summary-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 24px 0 28px;
  }

  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }

  .summary-card .num {
    font-family: var(--font-display);
    font-size: 28px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .summary-card.new .num { color: var(--new); }
  .summary-card .label {
    margin-top: 6px;
    font-size: 12px;
    color: var(--ink-muted);
  }

  .updated-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-faint);
    font-family: var(--font-mono);
    margin-bottom: 18px;
  }

  .updated-line .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--idle);
    flex: none;
  }
  .updated-line .dot.live { background: var(--new); }

  ul.channels {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  li.channel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 14px;
    align-items: start;
    transition: border-color 0.15s ease;
  }

  li.channel.is-new {
    border-color: color-mix(in srgb, var(--new) 45%, var(--border));
  }

  .chip {
    grid-row: 1 / 3;
    align-self: center;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.03em;
    padding: 5px 10px;
    border-radius: 999px;
    white-space: nowrap;
    background: var(--idle-soft);
    color: var(--idle);
  }
  .chip.is-new {
    background: var(--new-soft);
    color: var(--new);
    font-weight: 600;
  }

  .channel-name {
    font-weight: 600;
    font-size: 14.5px;
    color: var(--ink);
  }

  .video-title {
    font-size: 13.5px;
    color: var(--ink-muted);
    text-decoration: none;
    line-height: 1.4;
  }
  .video-title:hover { color: var(--accent); text-decoration: underline; }
  li.channel.is-new .video-title { color: var(--ink); }

  .meta {
    grid-column: 2;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 2px;
  }

  .meta .fail { color: var(--new); }

  .summary-toggle {
    grid-column: 2;
    justify-self: start;
    margin-top: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--accent);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .summary-toggle:hover { text-decoration: underline; }

  .summary-body {
    grid-column: 2;
    margin-top: 10px;
    padding-top: 12px;
    border-top: 1px dashed var(--border-strong);
    font-size: 13.5px;
    line-height: 1.75;
    color: var(--ink);
    white-space: pre-wrap;
    display: none;
  }
  .summary-body.open { display: block; }

  footer {
    margin-top: 32px;
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
  }
  footer a { color: var(--ink-muted); }

  @media (max-width: 480px) {
    .summary-row { grid-template-columns: 1fr 1fr; }
    .summary-card:last-child { grid-column: 1 / -1; }
  }
</style>

<div class="page">
  <header class="top">
    <div class="eyebrow">YouTube Watch Status</div>

</div>

<script>
  // CHANNELS_DATA: replaced wholesale by the daily routine after each check.

  const CHANNELS_DATA = {
    checkedAt: "2026-10-12T00:12:16Z",
    channels: [
      {"name": "さとうみつろう", "isNew": true, "videoTitle": "人が「不安」を感じるのは、恐竜に１億年間いじめられたから。", "videoUrl": "https://www.youtube.com/watch?v=pYmzt6lis-U", "published": "2026-10-09T12:55:31+00:00", "failed": false, "summary": "チャンネル名: さとうみつろう\n動画タイトル: 人が「不安」を感じるのは、恐竜に１億年間いじめられたから。\nURL: https://www.youtube.com/watch?v=pYmzt6lis-U\n公開日時: 2026-10-09T12:55:31+00:00\n形式: 大阪・通天閣前からの金曜夜のライブ配信(視聴者のコメントに随時答えながら進行する雑談+科学雑学トーク)\n\nこの動画は、佐藤みつろう氏が大阪・通天閣前からライブ配信を行いながら、東京タワーの赤色が思ったより伝わらないという気づきをきっかけに光の波長・色覚の仕組みを解説し、そこから雑誌「ニュートン」で読んだ「夜行性ボトルネック仮説」を紹介して、人間が不安を感じやすいのは恐竜に1億年間いじめられた進化的記憶のせいだと論じる内容です。\n\n【冒頭:大阪・通天閣前からの配信と今年の全国行脚告知】\n「番ワンコ サッカーの佐藤郎です」と挨拶し、大阪に来ていることを明かす。背景に通天閣が見えていると説明し、今年は全国45都道府県48箇所+全世界を含めて「まんまるマルシェ(丸见まる社会場)」という自身の企画で巡ると告知。去年はSNSで事前に開催地を告知していたが、今年はあえて告知を控え、視聴者同士が周りに声をかけ合って自主的に集まってもらう形にしたいと説明する。\n\n【視聴者とのやり取り:場所当てゲームと背景のネタばらし】\nコメント欄を読みながら「沖縄ですね」「ビリケンさんこんばんは」など視聴者とやり取りし、自分がいる場所を当てられて驚く演技をする。視聴者から「仙台にいるのでは」「東京タワーに見える」などの声が上がり、実は背景がCG合成(プリンスパークタワーの画像)であることを明かし、翌日どこかの会場に\"まさかここに現れたのか\"という形で登場する仕掛けをしていると予告する。同時接続者数が300人台から4000人台まで急上昇したと盛り上がるが、カウンターの見間違いだったと分かり笑いを誘う場面もある。\n\n【東京タワーの赤色から光の波長の話へ】\n背景に映る東京タワーが「思ったよりも赤くない」とカメラ越しの見え方に気づいたことから本題に入る。光のスペクトラムについて、紫(380nm前後)から赤(750nm前後)まで、真ん中あたり550nmが緑であることを説明し、可視光線はこの電磁波全体のごく狭い範囲に過ぎず、人間が勝手に「紫外線」「赤外線」という線引きをしているだけだと解説する。\n\n【赤外線とリモコン、スマホカメラのIRフィルターの話】\nテレビのリモコンが赤外線を使う理由は「人間に見えないから邪魔にならない」ためだと説明。スマホの背面カメラは今はIRフィルターで赤外線より長い波長を完全にカットしているが、フロント(自撮り)カメラは赤外線が今でも映ることを紹介し、リモコンのボタンを押した時に先端が光る様子をインカメラで見ると実際に確認できると話す。かつてのガラケーのカメラは赤外線をカットしていなかったという裏話も挟む。\n\n【視聴者数の急増とテンションの上下】\n話している最中に同時接続数が急上昇し盛り上がるが、実はカウンターの見間違いだったことに気づき「一気にやる気なくなる」と笑いながら自虐する一幕があった。\n\n【地球紫色仮説(パープルアース仮説)】\n話を本題に戻し、光合成をする生物が最初に地球に現れた際、太陽光で最もエネルギーの高い緑の波長(550nm付近)を独占して吸収した結果、その名残(古細菌=レチノール)が吸収しきれず反射した色が「紫」であり、太古の地球は紫色だったのではないかという「パープルアース仮説」を紹介する。\n\n【「私は私以外の全てである」という哲学】\n色が見える仕組み(緑に見えるのは緑以外の波長を反射しているから)から派生し、自身の著書で書いた「私とは私以外の全てである」という考え方を紹介。インド哲学の「ネイティネイティ(何々ではない)」という手法を引き合いに、自分を定義するには自分以外の全てが必要であるという話をし、後で概要欄に関連記事を貼ると案内する。\n\n【本題:夜行性ボトルネック仮説―恐竜に1億年いじめられた話】\n雑誌「ニュートン」で読んだ知識として、人間が1億年間恐竜にいじめられた記憶が今でも大脳辺縁系に残っており、それが現代人の「不安」や「明日への恐れ」の正体だという「夜行性ボトルネック仮説」を紹介する。恐竜(爬虫類系)が巨大化して昼間の主役となった約1億年間、小型哺乳類は夜しか行動できず、夜は色を区別する必要がないため、元々4色あった色覚細胞(錐体/レチノール)が2色にまで減少したと説明。6600万年前の隕石衝突で恐竜が絶滅した後も、哺乳類の多くはこの2色のままだが、人間だけはなぜか3色目を復活させたと語る。\n\n【人類が3色目の錐体を取り戻した理由、赤はまだ見えていない】\n3色目が復活した理由の仮説として、暗闇の中で赤い果実が熟しているかどうかを見分けるためだったのではないかと紹介。しかし復活した3つ目の錐体は赤のピークをうまく捉えられておらず、人類は実は誰も本当の「赤」を見たことがなく、脳内で緑と黄色の比率から「赤らしきもの」を勝手に生成しているだけだと説明する。ちなみに自分にとってはゴキブリへの恐怖心の方が、恐竜由来の恐怖よりもっと根深いのではないかと冗談を挟む。\n\n【締めくくりと翌日の告知】\n翌日は別の都道府県の会場に現れる予定であることを匂わせ、もし自分を見かけても声をかけずにそっと見守ってほしいと呼びかける。視聴者にチャンネル登録といいねを呼びかけ、概要欄に「私は私以外の全て」についての無料記事を貼ると案内する。\n\n【視聴者質問:承認欲求について】\nコメントで「承認欲求の話をしてほしい」とリクエストを受け、ホメオスタシス(恒常性)と「波」の比喩を使って解説する。人は本来ニュートラルな状態(0)に戻ろうとするが、振れ幅は必ず行き過ぎてしまうとし、血糖値の上下や体温調節(汗をかく仕組み)を例に挙げる。承認欲求については、次女・次男など「上の子ばかり見られる」環境で育った人に多いとし、「自分は認められていない」という思い込み(脳の傷)から努力して芸能界などに入るが、今度は認められすぎた反動で「非認欲求」が生まれ、わざと悪いことをして注目から逃げたくなる心理(芸能人の不祥事などの例)を説明する。ブラジルのタワーから配信していることを明かしつつ締めくくる。\n\n【まとめ】\nこの動画は、ライブ配信中にふと気づいた「東京タワーが思ったより赤く見えない」という疑問を出発点に、光の波長・色覚の科学的知識を交えながら、人間が持つ根源的な「不安」の正体は恐竜に1億年間支配された進化の記憶(夜行性ボトルネック仮説)にあると論じ、さらに視聴者からのリクエストに応じて承認欲求とホメオスタシス(波の上下運動)の関係まで語る、科学雑学とスピリチュアルな人生観が入り混じった雑談ライブ配信です。\n"},
      {"name": "トーマスガジェマガ", "isNew": false, "videoTitle": "【iPhone 18シリーズ】全部微妙。折りたたみ「Duo」に見るAppleの苦悩", "videoUrl": "https://www.youtube.com/watch?v=9P5Cl9SVvIQ", "published": "2026-09-17T10:05:35+00:00", "failed": false, "summary": "チャンネル名: トーマスガジェマガ\n動画タイトル: 【iPhone 18シリーズ】全部微妙。折りたたみ「Duo」に見るAppleの苦悩\nURL: https://www.youtube.com/watch?v=9P5Cl9SVvIQ\n公開日時: 2026-09-17T10:05:35+00:00\n形式: 単独トーク形式のガジェット解説動画(Apple新製品発表会の分析・考察)\n\nこの動画は、Appleが発表した「iPhone18シリーズ」(Pro・Pro Max・Duo)について、トーマス氏が「全部微妙」と結論づけつつ、特に折りたたみスマホ「iPhone Duo」が36万4800円という高額である裏にあるApple側の戦略的意図を考察し、今から買うならどれがおすすめかを提案する内容です。\n\n【冒頭:結論の提示】\niPhone18シリーズが発表されたが、結論は「全部微妙。折りたたみに見るAppleの苦悩」であると大きく提示。発表された機種はPro、Pro Max、Duoの3機種で、最大の注目点はAppleから初めて発表された折りたたみスマホ「Duo」の価格が36万4800円という異常な高さであることだと述べる。\n\n【iPhone無印モデルが発表されなかったことの意味】\n3機種の説明の前に、今回iPhone18の無印(標準)モデルが発表されていないという重要な事実を指摘。さらにiPhone17が継続販売されつつ1.5万~3万円の値上げがされたことにも触れ、これはAppleが「9月には無印モデルを発表しない」という明確な判断を下した結果であり、外的要因ではなくApple自身の決断だと分析する。理由として、①iPhone17無印が「完璧すぎる」ためProモデルとの差別化(カメラの数)以上の進化を見せられず、中途半端な進化で期待を裏切るよりは「何もしない」方がブランドイメージ(行け行けどんどんで皆が憧れる企業)を守れると判断したこと、②毎年新型を出すこと自体の「チキンレース」を終わらせたいという業界全体の空気(ジョン・ジャニュアリー氏の発言を引用)があり、スマホ市場がプロダクトライフサイクルの「成熟期」に入り切っていること、そしてシェア50%以上を握るAppleだけがこのチキンレースを自ら終わらせる資格・力を持つという2つの理由を挙げる。\n\n【iPhone18 Proの進化点はカメラのみ】\n発表されたスペック資料は見かけ上大きく変化したように見せているが、実際は「全く進化していない」と指摘。重量が5g増えた以外の変化はカメラの絞り機構(F値がF1.48からF4まで調整可能になった)のみで、体感できる違いは解放F値がF1.78→F1.48になったことによる「わずかな暗所性能向上」だけだと説明。21万円という価格に対しこの程度の進化で見せ方だけが巧みであると評する。\n\n【iPhone Duo(折りたたみ)の36万円の裏にある戦略】\n本題の折りたたみスマホDuoについて、36万4800円という価格から「Appleは最初からDuoを売る気がない」と分析。根拠として、①折りたたみスマホ自体に大衆の需要がない(スマホOSはコンテンツ消費用途であり画面サイズの優位性は限定的、タブレットすら持ち歩かない現状がその証拠)こと、②すでにハイエンドシェアを独占するAppleにとって参入してもシェアも増えず、プラットフォーム収益も変わらないこと、③折りたたみ機構は故障率が高くサポートの手間が増えるというデメリットがメリットを上回ること、を挙げる。売っても損、売らなくても話題性を失うジレンマの解決策として「あえて誰も買えない高価格に設定すれば全て解決する」という結論に至ったと分析し、Galaxyと競合する27万円前後ではなく、わざと誰も買わない36万円という値付けにしたのだと説明する。\n\n【Duoを出した狙い:挑戦するAppleの演出】\nでは売る気がないのになぜ出したのかという問いに対し、「挑戦するAppleの演出」という役割を担わせたと分析。Appleのブランドイメージを保つには「常に挑戦し続けている」「常に話題になっている」ことが必要であり、もし今回Proモデルのカメラの微進化と無印未発表だけだったら「Appleはもうやる気がない」と思われてしまうところを、折りたたみという「昔からあった引き出し」を使うことでiPhoneが再び話題になる空気を演出することに成功したと評する。さらに36万円という価格自体も世間を賛否両論に分ける「炎上ネタ」として機能し、結果的に大衆の関心を集めることに成功したと分析する。\n\n【iPhone Duoの今後の運命:Vision Proと同じ】\nDuoは「コンセプトカー」のような存在であり、話題性と未来の提案が狙いで、今後も売る気のない「スキミングプライシング戦略」(高価格で開発費を回収しつつ、文句を言わない富裕層・インフルエンサー・ガジェットYouTuberのみに売る戦略)のまま、Vision Proと同様に話題を失うまでひっそりと販売が継続されるだろうと予測。発表会の段階でDuoの「仕事」はもう終わっているとまとめる。\n\n【今から買うならどれがおすすめか】\n18シリーズは円安(1ドル165~167円)の影響で全体的に値段が高く、来年は円高・値下げの可能性もあるため、どのモデルも今はおすすめしないと前置きした上で、完成度の高い「iPhone16Pro」(有線充電卓上対応、カメラコントロール、TypeC搭載で不満がない)を推奨。どうしても18シリーズが欲しい人には、相対的に値段が安く見える資産性の高い「iPhone18ProMax」を勧め、変化球としてGalaxy S25も良い選択だと個人的な見解を述べる。\n\n【締めくくり:Appleへの感謝】\n今回の発表会はApple自身のネタ切れを感じさせる内容だったとした上で、大学2年生の頃にiPhone3GSに出会ってから18年間スマホと共にあった自身の人生を振り返り、Appleがもたらしてきたイノベーションへの感謝を述べる。同時に、Vision Proや折りたたみスマホなど他デバイスが全く定着しない現状について、スマホという「ポケットに入る完成品」を我々はすでに持っているからではないかと考察し、来年以降のAppleの新たな挑戦に期待を寄せて締める。\n\n【まとめ】\nこの動画は、iPhone18シリーズ(無印未発表、Pro/Pro Maxのカメラのみの微進化、Duoの異常な高価格)という一見ネガティブな事実の裏に、Appleがブランドイメージを守るために「売る気のない高価格折りたたみスマホ」を話題作りの演出装置として利用しているという戦略を読み解き、スマホ市場全体が成熟期に入り革新が難しくなっている現状を指摘しつつ、それでも18年間イノベーションを牽引してきたAppleへの感謝を伝えるという内容です。\n"},

      {"name": "崔の店長日誌。", "isNew": true, "videoTitle": "お金持ちになる人がやっているあの方法！〜ホームパーティのすゝめ〜/ 100日マラソン続〜2009日〜", "videoUrl": "https://www.youtube.com/watch?v=0UBOsx9PajM", "published": "2026-10-11T20:00:21+00:00", "failed": false, "summary": "チャンネル名: 崔の店長日誌。\n動画タイトル: お金持ちになる人がやっているあの方法！〜ホームパーティのすゝめ〜/ 100日マラソン続〜2009日〜\nURL: https://www.youtube.com/watch?v=0UBOsx9PajM\n公開日時: 2026-10-11T20:00:21+00:00\n形式: 毎日配信「100日マラソン」シリーズ(2009日目)、占い師・崔氏による単独トーク配信\n\nこの動画は、占い師である崔氏が、お金持ちになる人・さらに豊かになり続けるお金持ちが共通して実践している「ホームパーティー(家に人を招く習慣)」こそが運気・仕事運を活性化させる最速の方法だと説き、その理由を日本古来の「持ち巻き(棟上げの儀式)」や新築祝いの風習にまで遡って解説する内容です。\n\n【冒頭:前日の衣替えの話の補足】\n10月12日月曜(祝日)の挨拶から始まり、前日話した「3年以上着ていない服は処分すべき」という衣替えのアドバイスについて補足。服を買う時に店員から「ちょっとしたパーティーにおすすめですよ」と言われて購入したものの、実際にはそのような機会が訪れずクローゼットに眠っている服があるあるネタを紹介し、笑いを誘いながら「そういう服は処分してください」と念押しする。\n\n【本題への導入:お金持ちになる人がやっているあの方法】\n今日のテーマとして「お金持ちになる人がやっているあの方法」を提示。これは単にお金持ちになる人だけでなく、既にお金持ちの人がさらに豊かになるために継続してやっている方法でもあると説明し、これを「仮想(家相)の運気活性法」と言い換えられると語る。自身が以前、上空写真から家の状態を見るだけでその家の運気が60〜70%わかると考えていた時期があったことに触れ、住環境の状態が運気に直結するという前提を示す。\n\n【結論:ホームパーティー(人を家に招くこと)】\n売上が下がっている・仕事がうまくいかないと相談してくる経営者やサラリーマンに対して、最も即効性のあるアドバイスが「ホームパーティー」だと明言。大げさに聞こえるかもしれないが、1人でも2人でもいいから家に人を招くことを指すと説明し、「1人暮らしで呼べるお金がない」「家が狭い」と思っていても、10人20人呼べということではなく1人2人で十分だと強調する。\n\n【知人の社長のエピソード:世界長者番付と日本人の閉鎖性】\n海外経験も豊富な知人の社長が以前語った「世界長者番付に日本人が入れない理由の1つは、日本人が閉鎖的で家に人を呼ぶ習慣が少ないからだ」という発言を紹介。当時は大げさだと思っていたが、現代の研究や理論を知った今はあながち間違っていないかもしれないと考えを改めたと語る。\n\n【ホームパーティーがもたらす具体的なメリット】\n家に人を呼ぶことで得られる効果として、①「人が来る」という意識で家が自然と片付く、②人間関係が広がり深まる、③家に情報が集まり、新しいアイデアに気づくきっかけになる、④人をもてなす(奉仕する)ことで徳が積まれる、という複数のメリットを挙げる。\n\n【日本古来の風習①:持ち巻き(棟上げの儀式)】\n家に人を招くという考え方は日本では古くから存在していたとし、「持ち巻き(三平線の木/産平の義)」という棟上げ・胸上げの儀式を紹介。骨組みが出来上がった家の前で餅や小銭を撒き、近所の人や子供たちが集まってもらっていた自身の体験(学校帰りに持ち巻きに遭遇した思い出、自身が家を建てた際も近隣に餅を配った経験)を語る。この儀式の目的は、①厄払い(新築による周囲の嫉妬・妬みを分け与えて中和する)、②福を分け与える、③家の繁栄と工事の安全を願う、という3つの意味があったと説明する。\n\n【日本古来の風習②:新築祝い】\n新築祝いについても、新しい家にはまだエネルギーが宿っていないため、最初にお客様を招いて喜んでもらい「おめでとう」と言ってもらうことで、その家に最初に宿るエネルギー(波動)がめでたいものになるという考え方を紹介。家の柱一本一本に土地の神様やご先祖様が宿るという神主から教わった話を引き合いに出し、神様は賑やかな場所(祭りや縁日)を好み、ご先祖様も親戚や友人が集まり賑わう様子を喜ぶため、持ち巻きや新築祝いで人を呼ぶことは良いエネルギーを家に循環させる日本古来の知恵だったと結論づける。\n\n【現代への応用:1人暮らしでも実践できる】\n今はアパートでもマンションでも一軒家でも関係なく、定期的に人を家に招待することで家の良いエネルギーが循環し始めると説明。実際に停滞していた売上が人を招くことで好転したり、集まる情報や新しいつながりから大きなチャンスを掴んだ経営者やサラリーマンの例があることに触れ、小さなところからでいいので次の休みにでも誰か1人を家に招いてみることを勧める。\n\n【締めくくり:恒例のガッツポーズ】\n最後に「今日も元気よく皆さんをガッツポーズで見送ります」と恒例の掛け声とともに締めくくる。\n\n【まとめ】\nこの動画は、お金持ちやさらに豊かになり続ける人に共通する習慣として「ホームパーティー(家に人を招くこと)」を挙げ、その効果を日本古来の「持ち巻き」や「新築祝い」といった風習の厄払い・福の分配・良いエネルギーの循環という意味に結びつけながら解説し、1人暮らしでも気軽に始められる小さな実践(誰か1人を家に招くこと)が運気・仕事運の流れを変える最速の方法であるという一貫したメッセージを伝える内容です。\n"},
      {"name": "UP&UP", "isNew": false, "videoTitle": "【警告】世界一恵まれているのに挑戦しない日本人", "videoUrl": "https://www.youtube.com/watch?v=3kJwCnF2axE", "published": "2026-10-10T09:00:10+00:00", "failed": false, "summary": "チャンネル名: UP&UP\n動画タイトル: 【警告】世界一恵まれているのに挑戦しない日本人\nURL: https://www.youtube.com/watch?v=3kJwCnF2axE\n公開日時: 2026-10-10T09:00:10+00:00\n形式: 対談動画からの切り出しショート動画(概要欄によれば本編フル動画が別途公開されている)。字幕全文は約600文字程度の短い対談パートのみ\n\nこの動画は、UP&UPのメンバーの一人が、インフラ・治安・食事などあらゆる面で世界トップレベルに恵まれているにもかかわらず「チャレンジする人」と「応援する人」の両方が少ない日本の現状を指摘し、自分も応援する側・応援される側の両方になることが社会へのインパクトや事業の拡大につながるという考えを語る内容です。\n\n【冒頭:日本はレベルが高いという指摘】\n聞き手から「海外もたくさん見ている中で、日本が持つ可能性や未来を大切にしたいという思いがあるか」と問われ、本人は「日本は他の外国に比べて明らかに全部のレベルが高い」と即答。トイレの清潔さ、食べ物の美味しさ、道路や通信といったインフラまで、「ないものがない」国だと評価する。\n\n【日本の課題:チャレンジする人と応援する人の不足】\nただし唯一の課題として「チャレンジする人が少ない」ことを挙げ、さらにチャレンジする人が少ないということは「応援する人も少ない」ことを意味すると指摘。多くの人が自分のことしか考えていない状態にあると語る。\n\n【自分自身のスタンス:応援する人にも応援される人にもなる】\n聞き手から「どちらかと言えば応援する人になりたいという思いが強いのか」と聞かれ、本人は「応援する人にならないと自分たちも大きくなれない」とした上で、応援する人にも応援される人にも両方なる必要があると説明。社会に対して高いインパクトを残したいと考えているため、応援する人たちを増やし、その輪を広げていくことが重要であり、どれだけ多くの人の人生を自分の事業や活動に巻き込めるかが鍵になると語る。\n\n【まとめ】\nこの動画は、インフラや生活環境のあらゆる面で世界的に恵まれている日本において、挑戦する人とその挑戦を応援する人の双方が不足している現状を指摘し、自分自身は社会への大きなインパクトを残すために「応援する人」と「応援される人」の両方の立場を担い、より多くの人を自分の事業や活動に巻き込んでいきたいという考えを伝える内容です。なお、この動画は本編フル動画(概要欄にリンクあり)からの抜粋クリップであり、取得できた字幕もこの短い対談部分のみであるため、本編全体の詳細な内容までは確認できていません。\n"},
      {"name": "中野優作 / CAR and LIFE.（BUDDICA）", "isNew": false, "videoTitle": "【中古車選びで要注意】車屋歴約20年で「もう売らない」と決めた車3選！売って後悔した理由から“買う前の注意点”を徹底解説", "videoUrl": "https://www.youtube.com/watch?v=nZi4s3Hvsrk", "published": "2026-10-08T10:00:17+00:00", "failed": false, "summary": "チャンネル名: 中野優作 / CAR and LIFE.（BUDDICA）\n動画タイトル: 【中古車選びで要注意】車屋歴約20年で「もう売らない」と決めた車3選！売って後悔した理由から\"買う前の注意点\"を徹底解説\nURL: https://www.youtube.com/watch?v=nZi4s3Hvsrk\n公開日時: 2026-10-08T10:00:17+00:00\n形式: 対談形式の解説動画(聞き手役スタッフとBUDDICA代表・中野優作氏による質疑応答)、最後にお客様との思い出エピソードも紹介\n\nこの動画は、車屋歴約20年・累計取扱台数10万台超の中野優作氏が、過去に「もう売るんじゃなかった」と後悔した3つの車種・カテゴリー(買黒加工車、社外エアロ付き軽自動車、未使用車)について、裏話を交えながら理由を解説し、中古車選びで失敗しないための注意点を伝える内容です。\n\n【冒頭:質問の導入と中野氏の経歴】\n聞き手が「車屋を約20年やってきた中野さんが、今まで何台売ってきたのか」と質問し、中野氏は自身が直接納車したのは5~7万台、店長時代の自分の持ち場全体では10万台を超えると回答。続けて「お客様の失敗を防ぐため、過去に売るんじゃなかったと思う車はあるか」という禁断の質問がなされ、3つあると答える。\n\n【1つ目:買黒(かいぐろ)加工車】\n約20年前に流行した「買黒」(人気の低いシルバーなどの車を全塗装して黒に塗り替える手法)を紹介。セルシオやクラウンなど高級セダンで、不人気色のオークション落札車(30万円)を全塗装・社外アルミ・ローダウンまで施して150万円で販売するビジネスが流行っていたと説明。この手法自体は整備代を計上でき、暇な時期の収益源として悪くなかったが、問題は塗装の品質で、業者によっては安く仕上げるため下地処理が甘く、半年ほどで塗装がペラペラと剥がれるクレームが多発したと明かす。自身が会社員時代に実際に経験したクレーム対応として、納車時はピカピカだった車が半年後にドアを閉めただけで塗装が剥がれ、下地のシルバーが露出したケースを紹介。会社側が保証対応を認めず、こっそり格安で塗り直しをしたエピソードを語る。現在は純正色の価値が見直されており、黒塗装によって価値が上がることはないため、今はこうした買黒車を仕入れて売ることはないと結論づける。\n\n【2つ目:社外エアロ付き軽自動車(エアロセット車)】\nムーブやライフ、ワゴンRなどの軽自動車(本体80万円程度)に黒・白の社外エアロ、アルミ、ナビ、カーボンシートなどをセットし120万円で販売する「エアロセット」が当時よく売れ、収益的にも助けられたと振り返る。しかし社外エアロは純正エアロと違い取り付け精度にずれが生じやすく、熱による変形やアルミメッキの劣化によるクレームが多発。特に一流ブランド(150万円相当)と比べて安い(120万円)分、精度のずれが起きやすいという期待値調整が不十分なまま大量仕入れして販売していたと明かす。具体的なクレーム事例として、正月の初売り日にタバコを吸いながら怒鳴り込んできた客に、燃費が異常に悪い(カタログ値16~17km/Lに対し10km/L)とクレームを受け、ディーラー2社で検査しても異常なしと言われたため同乗して確認したところ、客がベタ踏み運転とアイドリング放置(彼女を待つ間2~3時間エンジンをかけたまま)をしていたことが原因だったと判明したエピソードを紹介。最終的に客は謝罪したが、この経験から「安い商品に高い商品と同じクオリティを求めるお客様を呼び込んでしまった」こと、そしてその対応体制が整っていなかったことが問題だったと総括する。\n\n【3つ目:未使用車】\n未使用車自体は新車との価格差が魅力的な良い商品だが、自分たちのビジネスモデルには合わなかったと説明。当時ディーラーから仕切り(新車価格の15~20%引き)で仕入れていたが、ディーラーより十分安く見せるための価格設定をすると実質の荒利は1台5万円程度にしかならず、コーティングや車検、保険などのセット販売が前提でなければ成立しないビジネスだったと明かす。未使用車専門店が大型店舗で成立させているビジネスモデルは「安売りを極限まで効率化したオペレーション勝負」であり、採用・教育・組織化まで含めた完成されたモデルとして心からリスペクトしているが、自社(BUDDICA)が目指す「中古車業界を盛り上げる」という方向性とは違う筋肉を使うゲームであり、同じ車屋でも業態によって全く別のゲームをしていると説明する(サッカーとフットサル、短距離と長距離走の例え)。\n\n【締めくくり前:思い出に残るお客様エピソード】\n3つの裏話の後、聞き手から「売ってよかったと思う思い出のお客様」を聞かれ、ビッグモーターに入社した初日に接客し、ムーブカスタムを契約してくれた最初のお客様とのエピソードを紹介。契約が決まらず自宅を訪ね、お客様の父親が営む居酒屋で酒を飲みながら説得し、ようやく契約に至った経緯を明かす。その後10年以上会っていなかったが、街で偶然そのお客様の奥様(お花屋さんを営む)と再会し、ずっとYouTubeで応援してくれていたことを知るという心温まる話を紹介。もう一つのエピソードとして、ビッグモーター入社前に不動産(アパート経営)営業をしていた時代、無理な契約を取らせようとする会社の体質に疑問を持ち退職したこと、その際に唯一「卒業おめでとう」と送り出してくれた上司と10年後にFacebook経由で再会し、息子の車の購入を「中野君に任す」と一任されオークションからプリウスを3台並べて選んでもらい、以降家族3台分の車を買ってもらった絆のエピソードを紹介する。\n\n【締めくくり:BUDDICAの利用案内】\n店舗に行きづらい人向けに、LINEやZoomでの相談・契約が可能であること、写真15枚を送るだけで査定できる買取サービス、グレード入力で簡易査定ができる「車メーター」、BUDDICA・Garage・フランチャイズ加盟店含め全国約50店舗(北海道から沖縄まで)に拡大している現状を紹介し、在庫不足のため買取も積極的に行っていると案内する。最後に、この企画はコメント欄のリクエストから作られたものであることを明かし、チャンネル登録とグッドボタンを呼びかけて締めくくる。\n\n【まとめ】\nこの動画は、車屋歴20年の中野優作氏が「買黒加工車の塗装トラブル」「社外エアロ軽自動車の精度ずれによるクレーム」「未使用車の薄利多売モデルとの不適合」という3つの実体験に基づく後悔を正直に語り、価格と品質のトレードオフを正しく期待値調整することの重要性を伝えつつ、長年のお客様との心温まる人間関係のエピソードを通じて、車の売買が単なる商取引以上の意味を持つという一貫したメッセージを伝える内容です。\n"},
      {"name": "サムの本解説ch", "isNew": true, "videoTitle": "なぜ浮気は無くならないのか？【要約】ヒトはなぜ恋に落ちるのか　愛と裏切りの進化心理学", "videoUrl": "https://www.youtube.com/watch?v=zNV1Iup2zus", "published": "2026-10-10T11:00:06+00:00", "failed": false, "summary": "チャンネル名: サムの本解説ch\n動画タイトル: なぜ浮気は無くならないのか？【要約】ヒトはなぜ恋に落ちるのか　愛と裏切りの進化心理学\nURL: https://www.youtube.com/watch?v=zNV1Iup2zus\n公開日時: 2026-10-10T11:00:06+00:00\n形式: 書籍要約・解説動画(ダンバー数で有名なロビン・ダンバー氏の著書『人はなぜ恋に落ちるのか 愛と裏切りの進化心理学』を紹介)\n\nこの動画は、裏切られても元恋人を忘れられず苦しむ視聴者に向けて、恋愛心理学・進化心理学の研究知見から「なぜあの人だけが特別に見えたのか」「愛していたのになぜ裏切れたのか」「失恋の痛みは復縁すべきサインなのか」という3つの問いを解き明かし、感情と現実の判断を切り分けるための具体的なワークを提示する内容です。\n\n【冒頭:視聴者への問いかけ】\n「ひどい裏切りをされたのに元恋人のSNSを何度も見てしまう」「早く別れなよと言われるのが怖くて誰にも相談できない」人に向けて、忘れられないという理由だけではその人が運命の相手だったとは言えないと提起。著者ロビン・ダンバー氏(ダンバー数の提唱者)の紹介と、本書が時間任せの精神論ではなく科学的知見に基づく内容であることを説明し、動画の3つの目次(①なぜあの人だけが特別になったのか②愛していたのになぜ裏切れたのか③その痛みは戻るべきサインなのか)を提示する。\n\n【1章:なぜあの人だけが特別になったのか―恋する脳の仕組み】\nイギリス・ユニバーシティカレッジロンドンの実験として、真剣に恋をしている17人に恋人と友人の写真を見せ脳反応を比較した研究を紹介。恋人の写真では喜び・報酬系の脳領域が強く反応する一方、相手を冷静に評価する機能は弱まることが分かったと説明。続けてアメリカ・モネル科学感覚研究所とカナダ・マギル大学の実験として、恋人のいる女性に恋人・男友達・女友達が7日間着たTシャツの匂いを嗅ぎ分けさせたところ、恋人への気持ちが強い女性ほど男友達の匂いを区別しにくかったという結果を紹介し、恋は相手を輝かせると同時に他者への注意を弱めると解説する。これが交際初期に「約束を破られても仕事が忙しいだけ」と都合よく解釈したり、友人の心配に反発したりする理由だと説明。さらにニューヨーク州立大学バッファロー校サンドラ・マレーの研究(子供のいない新婚夫婦22組、のち193組を分析、結婚生活最初の3年間を追跡)では、相手を自分の理想に近い人として見ていた人ほど結婚満足度が下がりにくかったとし、理想化が関係を守る「接着剤」になる面もあると補足。しかし同時に、相手の嘘や繰り返される悪い言動まで美化して見逃してしまう危険性があるとも指摘する。また、オックスフォード大学のダンバー氏による540人への調査では、恋人ができると親しい支え手の輪から平均約2人(友人1人・親族1人)が外れる(完全に縁が切れるのではなく優先順位が下がる)という結果を紹介し、失恋後に孤独を感じるのは性格の問題ではなく、恋愛に時間を割いた結果の自然な現象だと説明する。\n\n【2章:愛していたのになぜ裏切ることができたのか―ドキドキと長期的な絆の違い】\n恋の始まりの強いドキドキ(興奮)と、長く相手を大切にし続ける愛は別物であり、本書によると強い興奮は通常2〜36ヶ月ほどで落ち着くと説明。ドキドキが減ることは愛が消えることと同義ではなく、長期的な絆を支えるのは手を握る・抱きしめる・一緒に笑うことで分泌されるエンドルフィンだと解説(お笑いを見た人は退屈な番組を見た人より痛みへの耐性が上がったという実験を紹介)。しかし人間には「今の安定した関係を守りたい心」と「新しい刺激や相手を求める心」が同時に存在するため、愛情があっても心が揺れ裏切りが起こりうると説明しつつ、これは裏切りや暴力を正当化する理由にはならないと明確に釘を刺す。本書で紹介される調査では、確認された関係破綻のほぼ半数が交際開始から2〜4年の間(ドキドキが落ち着く時期と重なる)に起きており、金銭トラブルが原因だったケースは約5%に過ぎず、決定的な原因は侮辱・大切な場面での不在・悪口など相手の自尊心や信頼を傷つける行動、すなわち「自分は大切にされていない」という感覚の積み重ねだったと説明。過去の優しさや愛を否定する必要はないが、過去の記憶で今の相手の行動を判断するのではなく、現在の行動から信頼できる相手かどうかを見るべきだと述べる。\n\n【3章:その痛みは戻るべきサインなのか―失恋の痛みの正体と3つのワーク】\n失恋の痛みが単なる気のせいではなく、社会的拒絶を経験した際に身体的な痛みと一部同じ脳領域が働くという科学的知見を紹介。さらに失恋で失うのはパートナーという一人の人間だけでなく、安心できる日常・将来家族になるかもしれない期待・2人で生きるはずだった未来のすべてを同時に失うからこそ強い苦しみを感じるのだと説明し、「こんなに苦しいのだからあの人が必要だ」と結論づけてはいけないと強調する。苦しみから抜け出すための3つの紙とペンを使ったワークを提示。①何を失って苦しんでいるのかを「相手自身」「相手といた時の自分」「2人で生きるはずだった未来」の3つに分けて書き出し、最も辛いものに丸をつけることで本当に取り戻したいものを特定する。②相手から復縁を迫られた場合、紙の左に相手が言ったこと、右に実際に続けている行動を書き出し、隠さず説明しているか・言い訳せず責任を認めているか・同じ問題を繰り返さない行動を継続しているかを確認する(謝罪の言葉は1日で言えるが信頼は行動の積み重ねでしか戻らないと強調)。③誰かに相談する前に「今一番辛いこと」「自分が迷っていること」「聞く人にして欲しいこと(共感/冷静な意見/連絡しないよう手伝ってほしい等)」を紙に書き、相談相手に求めるものを事前に言語化しておくことで、話を聞いてほしいだけなのに解決策を求められるといったすれ違いを防げると説明する。\n\n【締めくくり:3つの区別とまとめのメッセージ】\n視聴者に向けて「愛していることと信頼できること」「痛みが本物であることと戻るべきであること」「過去に愛があったことと今も大切にされていること」の3つを分けて考えるよう呼びかける。忘れることをゴールにする必要はなく、相手に預けていた安心・自信・居場所・未来を自分自身の人生に取り戻すことこそが本当の回復であると述べ、最後に視聴者へ「今一番失って苦しいと感じているのはA:自分自身、B:相手といた時の自分、C:2人で生きるはずだった未来のどれか」とコメントで答えるよう呼びかけて締めくくる。\n\n【まとめ】\nこの動画は、恋愛における「相手を特別に見せ他を見えなくする脳の仕組み」「ドキドキの消失と裏切りの発生メカニズム」「失恋の痛みの正体」という3つの科学的知見を順に解き明かしながら、裏切られた相手への未練や失恋の苦しみは性格や能力の問題ではなく人間の脳に備わった自然な仕組みであることを伝えつつ、過去の愛情と現在の信頼を混同せず、紙に書き出す3つの具体的なワークによって感情に流されずに自分自身の心と現実を整理し、本当の回復とは相手ではなく自分自身に安心・自信・未来を取り戻すことであるという一貫したメッセージを伝える内容です。\n"},
      {"name": "サラタメさん", "isNew": false, "videoTitle": "【AIの正しい使い方】“今日から”も”10年後”も使えるヤツです。", "videoUrl": "https://www.youtube.com/watch?v=o8mMELmh4Ak", "published": "2026-09-24T03:09:44+00:00", "failed": false, "summary": "チャンネル名: サラタメさん\n動画タイトル: 【AIの正しい使い方】\"今日から\"も\"10年後\"も使えるヤツです。\nURL: https://www.youtube.com/watch?v=o8mMELmh4Ak\n公開日時: 2026-09-24T03:09:44+00:00\n形式: 単独トーク形式の解説動画(様々なビジネスパーソンに会う仕事柄から気づいた「AIガチ勢」と「AI弱者」の使い方の違いを解説)\n\nこの動画は、サラタメ氏が多くのビジネスパーソンと接する仕事の中で気づいた「AIをうまく使いこなすガチ勢」と「AIに情報量で圧倒されてしまう弱者」の2つの決定的な違い(①AIをドSに雑に使うか丁寧に気遣うか、②最新情報を追うか記録・記憶に投資するか)を解説し、AI時代はアホにこそ最高の時代だという持論を語る内容です。\n\n【冒頭:前置きと2つのテーマ提示】\n色々なビジネスパーソン(会社員・経営者・フリーランス、優秀な人からやばめな人まで)に会う仕事柄、AIを使いこなす「AIガチ勢」と「AIに飲み込まれるAI弱者」の違いに気づいたと切り出し、今回解説する2つの違い(①人権なしの奴隷のようにAIを雑に使う特徴、②最新情報より記録・記憶を重視する特徴)を提示。後半で「AI時代はアホにこそ最高の時代」という補足話もすると予告し、話したいことが多すぎるためLINE限定の裏側動画「裏タメ」を新設したことを告知する。\n\n【違い1つ目:AIガチ勢はドSに雑に指示、AI弱者は情報量に殴られる奴隷】\nAIガチ勢は長々としたプロンプトを書かず、シンプルな指示しか出さないと説明。その理由は2つ、①AIが急速に賢くなり続けており(GPT5→6の例)、文脈理解力が上がっているため細かい指示は逆にAI本来の推論力を阻害する、②AIは無限の体力・圧倒的スピード・感情がないという人間と全く異なる性質を持つため、気遣いは無駄であるばかりか害でもあると説明。アメトークでAIに礙儀正しく接していた芸人(ロンブー淳)の例を「AI弱者」の典型として挙げ、自分自身も丁寧に話しかけてしまう癖があると自己言及しつつ、AIとのコミュニケーションと人間とのコミュニケーションの人格を分けるべきだと提案する。\n\n【ガチ勢の具体的アクション4つ】\n①雑に話しかける:音声入力(ボイスインやAquaVoiceを併用)で誤字脱字だらけでも気にせず指示すべきと説明。ローマ字入力でも「進撃の巨人のリバイ兵長になり切って自己紹介して」のような複雑な指示を正確に理解できる実例を示す。②依頼が曖昧なら自分で整理せずAIに質問させる(「質の高い回答のために必要な情報を得るまで質問して」というプロンプトを活用)。A案B案のような評価基準が必要な相談や、条件が多い旅行プラン、原因不明の売上不振相談などで有効と説明。③プロセスまで指示せず、ゴールと現在値だけを明確に伝える(東京から大阪に行きたい、という目的だけ伝えればAIが最適ルートを提案してくれる例、営業資料作成で細かく分析手法を指定するとAIの提案可能性を潰してしまう例を紹介)。④ダメなチャットはすぐ切り替えて引き継ぎ書を作らせる(業界リサーチと個別提案資料作成のように目的が異なるタスクを同じチャットで続けるとノイズが混ざり精度が落ちるため、引き継ぎ書を作らせて別チャットに切り替えるべきと説明)。\n\n【情報量に殴られないために:短く答えさせてガン詰めする】\nAI弱者は情報量が多いほど満足してしまい、AIが出した文章をそのまま自分の成果物として提出してしまう(信頼を落とす行為)と指摘。AIの一発目の回答は70点程度であり、そこから「ここが違う」と叩いて120点に仕上げるのがあるべき姿であり、最初から完璧な「ポン出し」や「完全自動化」を狙う考え方自体が間違っていると説明。短く答えさせて自分がチェックできる量に抑え、方向性が合っていれば徐々にボリュームを増やすという進め方を推奨する。\n\n【違い2つ目:AIガチ勢は最新情報を追わず、記録と記憶に投資する】\nAI弱者はSNSでAI驚き屋のインフルエンサーに踊らされ最新情報を追いかけるが、AIガチ勢は5年後10年後を見据えて「何を積み上げるべきか」を考えており、具体的には「記録する」こと(①最新情報を追わない、②記録する、③記憶に残りに行く、の3点)を重視していると説明。ツールやサービスは誰も追わなくても自然に進化し使いやすくなるため、話題の本だけ読む人と同じ思考パターンで最新ツールを追う必要はなく、自分の課題解決に必要な情報だけ取りに行けばよいと述べる。\n\n【記録することの重要性:自分にしかできない一次情報を貯める】\nググってもAIに聞いても出てこない貴重な一次情報(仕事の仮説・アクション・結果のプロセス、顧客の生のフィードバック、尊敬する上司の言葉、大失敗の経験、誰にも言えない内面の悩みなど)を記録することが重要だと説明。自身も1年ほど前から日記(日付・睡眠時間・体調・気分・食事・体重・メモ)をGoogleドキュメントに音声入力でひたすら書き続けており、誤字脱字があってもAIが識別してくれるため問題ないと明かす。大事な打合せの議事録要約も同じファイルに貼り付けており、このドキュメントをAIに読み込ませて相談すると、自分の過去の目標や悩みを踏まえた的確なフィードバック(体調を気遣うアドバイスなど)が返ってくると実体験を語る。\n\n【記憶に残ることの重要性:人的資本から社会資本へ】\nAI弱者はAIでスキル(文章力・リサーチ力・資料作成力など)を磨こうとするが、AI時代に無双する優秀な人は「人的資本」より「社会資本」(信頼・人脈・コミュニティ)への投資にシフトしていると説明。スキルアップを最後に回し、まず「キーマンに名前を覚えてもらう・思い出してもらう」ことを優先し、仕事を任されてから初めてAIや専門家に相談して仕事を仕上げるという順番の違いを指摘。社内でのセルフブランディング、飲み会・イベント企画、定期的な顧客訪問などの具体例を挙げ、経営者やフリーランスであればSNSでの狭く深い発信も同じ「記憶に残る」ための行動だと説明する。知名度の価値が上がりすぎている現状として、悪名でも名前が知られていれば経済的価値につながってしまう現象(迷惑系YouTuberなど)にも触れ、やや複雑な心境も吐露する。\n\n【補足:AI時代はアホにこそ最高の時代】\n自身を「アホ代表」と称し、雑な指示・曖昧な依頼・最新情報を追わなくていいという今回の話はすべて「アホでもできる」ことだと振り返る。具体例として、専門外だと諦めていた時事解説系コンテンツも、AIがファクトチェックを担ってくれるようになったことで挑戦できるようになったと明かし、話したいことが溢れて収まらなくなったため、新設したLINE限定動画「裏タメ」で今回のAI活用の続編やプライベートな話、進撃の巨人の自由についての哲学的な考察などを配信していくと告知する。\n\n【まとめ】\nこの動画は、AIを使いこなす人とAIに振り回される人の違いが「AIをドSに雑に使い、短く答えさせて叩いて仕上げるか」「AIの情報量にそのまま圧倒されて鵜呑みにするか」、そして「最新情報を追うか、自分にしかできない記録(日記)と人間関係・信頼という記憶に残る行動に投資するか」という2点に集約されるとし、スキルよりも「何ができるか」ではなく「誰に覚えてもらっているか」が今後の価値を左右するという一貫したメッセージを、アホ代表としての親しみやすい語り口で伝える内容です。\n"},
      {"name": "宋世羅の羅針盤ちゃんねる（そんせらの羅針盤チャンネル）", "isNew": true, "videoTitle": "相手に気持ち良く語らせる極意。", "videoUrl": "https://www.youtube.com/watch?v=uot8XQeoDI8", "published": "2026-10-11T11:29:35+00:00", "failed": false, "summary": "チャンネル名: 宋世羅の羅針盤ちゃんねる（そんせらの羅針盤チャンネル）\n動画タイトル: 相手に気持ち良く語らせる極意。\nURL: https://www.youtube.com/watch?v=uot8XQeoDI8\n公開日時: 2026-10-11T11:29:35+00:00\n形式: 単独トーク解説動画\n\nこの動画は、投稿者が自身を「世界で5本の指に入る」と称するほど自信を持つ分野として、営業マンやホステス、インタビューアーが持つ「相手に気持ちよく語らせる」感覚的なセンスを初めて言語化し、聞き手が自ら「打ちやすいボールを投げる」「首を差し出す」立場に徹することで相手の語りに火をつける具体的な技術を解説する内容です。\n\n【冒頭:テーマ提示と自己紹介的前置き】\n今日のテーマは「気持ちよく語らせる極意」であると提示し、冒頭のBGMがバルセロナ滞在中に自作した曲であることに軽く触れる。営業マンやホステス、記者・インタビューアーなど「センスがある」とされる人たちが共通して持っているこの感覚を、今回初めて言語化・体系化する(「日本地図を初めて作った伊能忠敬の所業」と例える)と宣言し、分かる人には分かる内容だとコメントを呼びかける。\n\n【核となるイメージ①:打ちやすいボールを投げるバッティングピッチャー】\n聞き手・インタビューアーの立場を、野球の練習で使われる「バッティングピッチャー(打者が打ちやすい球を投げる役)」に例える。例えばイチローselectedのような人物から本音を引き出したい場合、聞き手が下手だと何も引き出せないとし、相手が「ノリに乗って気持ちよくスイッチが入る」ための最初の着火点を作ることが重要だと説明する。\n\n【核となるイメージ②:首を差し出すキリンと斧を持つバーバリアン】\nもう一つの比喩として、聞き手は斧を持ったバーバリアンの前に首を差し出すキリン(ガラガラ蛇ではなくキリン)のような存在であるべきだと説明。「この首、好きなように切っていいよ」「試し切りしたかったでしょ」という姿勢で、相手が思う存分自分をさらけ出せる構造を作ることが聞き手の役割だと語る。\n\n【センスがない人の失敗パターン:接待ゴルフ的な嘘臭さ】\nセンスがない人の典型例として、「売上100億まで行く人と行かない人の違いは何だと思いますか?」のような、いかにも用意された質問をぶつける「接待ゴルフ」的・コンサルタント的な聞き方を挙げ、これは嘘臭く相手を白けさせると指摘する。\n\n【技術の前提:大衆より一段深い質問と本気の興味】\n質問が基本的すぎると(「どうやったらそんな成績を出せるんですか」等、相手が何百回も聞かれたような質問)相手は萎えるとし、大衆の中でも「一段見えている側」からの質問(例:「一郎さん、ここってどうなんですか」)の方が、相手に「そこまで分かっていて聞いてきたな」と感じさせ、スイッチが入りやすいと説明。同時に、聞く側が本当にその質問に興味を持っていることが前提であり、興味がないのに形だけ質問しても相手にバレてしまうため、テンションは終始低め・フラットで「俺は本当にこれが聞きたいから聞いている」という素の姿勢が重要だと述べる。\n\n【具体的フレーズ①:自分のフィールドを一度通してから質問する】\n実践的なテクニックとして、「自分のフィールド・生きてきた環境」を一度相手に投げてから質問する方法を紹介。例えば営業マンが社長に対して「営業をやっている僕からすると、一歩踏み出しづらい場面がよくあるんですが、そこってどうなんですか」というように、自分の経験を枕として挟むことで、相手が「自分の視点」で返答する際に熱が入りやすい\"レール\"ができると説明する。注意点として、相手と張り合う・張り合いを出す言い方(「僕も営業でこれだけ結果を出していて」等)は絶対にしてはいけないとし、あくまでフラットに「自分はこう」という提示にとどめるべきだと強調。また、相手が自分よりはるかに格上の人物(例:プロ野球選手とそれに対する一営業マン)であっても、この「自分のフィールドを話す」こと自体は対等な立場として普通に言えるものであり、恐れる必要はないと説明する。\n\n【具体的フレーズ②:質問の   // 既読管理: サーバー側の new_in_last_check は「前回チェックと比較して動画が
  // 変わったか」しか表さず、自動チェックが1回でも走るとリセットされてしまう。
  // 実際にユーザーが読んだかどうかはこのブラウザの localStorage で別管理する。
  const READ_KEY = "ytChecker.readVideoUrls";

  function loadReadSet() {
    try {
      const raw = localStorage.getItem(READ_KEY);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch {
      return new Set();
    }
  }

  function markRead(videoUrl) {
    const set = loadReadSet();
    set.add(videoUrl);
    // 肥大化しすぎないよう直近200件に丸める
    const arr = Array.from(set).slice(-200);
    localStorage.setItem(READ_KEY, JSON.stringify(arr));
  }

  function relTime(iso) {
    const then = new Date(iso).getTime();
    const now = Date.now();
    const diffMs = now - then;
    const min = Math.floor(diffMs / 60000);
    if (min < 60) return `${Math.max(min, 0)}分前`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr}時間前`;
    const day = Math.floor(hr / 24);
    if (day < 30) return `${day}日前`;
    const mon = Math.floor(day / 30);
    return `${mon}ヶ月前`;
  }

  function render(data) {
    const list = document.getElementById("channelList");
    list.innerHTML = "";
    const readSet = loadReadSet();
    let unreadCount = 0;

    // 未読(新着)のチャンネルを上に、既読/変化なしを下に並べる。
    // 同じグループ内では元の(state.json の)並び順を保つ(安定ソート)。
    const sorted = data.channels
      .map((ch) => ({
        ch,
        isUnread: !!ch.summary && !readSet.has(ch.videoUrl),
      }))
      .sort((a, b) => Number(b.isUnread) - Number(a.isUnread));

    sorted.forEach(({ ch, isUnread }) => {
      if (isUnread) unreadCount++;

      const li = document.createElement("li");
      li.className = "channel" + (isUnread ? " is-new" : "");

      const chip = document.createElement("span");
      chip.className = "chip" + (isUnread ? " is-new" : "");
      chip.textContent = ch.failed ? "取得失敗" : (isUnread ? "新着あり" : "変化なし");

      const name = document.createElement("div");
      name.className = "channel-name";
      name.textContent = ch.name;

      const video = document.createElement("a");
      video.className = "video-title";
      video.href = ch.videoUrl;
      video.target = "_blank";
      video.rel = "noopener noreferrer";
      video.textContent = ch.videoTitle;

      const meta = document.createElement("div");
      meta.className = "meta" + (ch.failed ? " fail" : "");
      meta.textContent = ch.failed ? "前回チェック失敗" : `公開: ${relTime(ch.published)}`;

      li.append(chip, name, video, meta);

      if (ch.summary) {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "summary-toggle";
        toggle.textContent = isUnread ? "▸ 詳細な要約を読む(未読)" : "▸ 詳細な要約を読む";

        const body = document.createElement("div");
        body.className = "summary-body";
        body.textContent = ch.summary;

        toggle.addEventListener("click", () => {
          const open = body.classList.toggle("open");
          toggle.textContent = open ? "▾ 要約をたたむ" : "▸ 詳細な要約を読む";
          if (open && isUnread) {
            markRead(ch.videoUrl);
            chip.textContent = ch.failed ? "取得失敗" : "変化なし";
            chip.classList.remove("is-new");
            li.classList.remove("is-new");
          }
        });

        li.append(toggle, body);
      }

      list.appendChild(li);
    });

    document.getElementById("sumNew").textContent = unreadCount;
    document.getElementById("sumIdle").textContent = data.channels.length - unreadCount;
    document.getElementById("sumTotal").textContent = data.channels.length;

    const dot = document.getElementById("updatedDot");
    const text = document.getElementById("updatedText");
    dot.classList.toggle("live", unreadCount > 0);
    text.textContent = `最終チェック: ${relTime(data.checkedAt)}`;
  }

  render(CHANNELS_DATA);
</script>
