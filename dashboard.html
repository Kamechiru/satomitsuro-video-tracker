われた実験(徐々に明るくする群と一気に明るくする群を比較)でも、徐々に明るくする方が自然にコルチゾール覚醒反応が起き、すっきり目覚められたという結果を紹介する。\n\n【広島での学び:夜明けを表す3つの大和言葉】\n前日(前々週)に広島で杉本錬先生とEXILEのあっちさんと講演会を行った際に学んだこととして、日本の大和言葉には夜明けの15〜20分ごとの微妙な違いを表す言葉が複数あることを紹介。「かわたれ」「東雲(しののめ)」「朝ぼらけ」という3つの言葉を、AIチャットボットに確認しながら思い出し、アメリカなら「AM6時45分」「AM7時」としか呼べない時間の移ろいを、日本人は繊細な言葉で表現してきたことに感心する。\n\n【締めくくり:ちょうど夜明けを迎える】\n話している最中にまさにロサンゼルスの空が明るくなり始め、「ちょうど今が『かわたれ』『しののめ』『朝ぼらけ』のタイミングだ」と実況しながらカメラで空を見せようとするところで動画が終わる。\n\n【まとめ】\nこの動画は、ロサンゼルスでの時差ボケ体験をきっかけに、コルチゾール覚醒反応とサーカディアンリズムという体内時計の仕組みを、ミトコンドリア研究やイーロン・マスクのXプライズ財団の最新動向を交えながら解説し、「夜は完全な暗闇に、朝は徐々に明るく」という具体的な時差ボケ対策と、それを繊細に表現してきた日本の大和言葉の豊かさを結びつけて伝える、雑談と科学が入り混じった内容です。"},
      {"name": "トーマスガジェマガ", "isNew": false, "videoTitle": "【新型トヨタノア90系HVレビュー】総じて車デビューには有り余る性能", "videoUrl": "https://www.youtube.com/watch?v=ToM1qcHqGRE", "published": "2026-09-06T11:21:03+00:00", "failed": false, "summary": "チャンネル名: トーマスガジェマガ\n動画タイトル: 【新型トヨタノア90系HVレビュー】総じて車デビューには有り余る性能\nURL: https://www.youtube.com/watch?v=ToM1qcHqGRE\n公開日時: 2026-09-06T11:21:03+00:00\n形式: 単独ロケ形式レビュー動画(奈良県生駒郡での幼少期ロケハンから始まり、購入した中古車を実際に運転しながら詳細に紹介する構成)\n\nこの動画は、3人目の子供が生まれるにあたって家族の送迎用に中古のトヨタ・ノア(90系ハイブリッド、購入価格400万円)を購入した投稿者が、外観・鍵・収納・車内空間・走行性能・燃費までを実際に触れながら詳細にレビューし、「子供を運ぶ車としては最高」と結論づける内容です。\n\n【冒頭:幼少期を過ごした奈良のロケ地紹介】\n奈良県生駒郡の3号線沿いにある、幼少期に遊んだ公園を訪れ、当時から変わらない滑り台や、小学2年生の時に夜犬に追いかけられた思い出などを振り返る雑談から始まる。\n\n【購入の経緯とノアを選んだ理由】\n3人目の子供が生まれチャイルドシート必須の3列シートが必要になったため、中古で400万円のトヨタ・ノアを購入したと発表。同じミニバンでもアルファードやヴォクシーは「威嚇的ないかつい顔」であるのに対し、ノアは「笑っている」ような優しい顔立ちが決め手だったと説明しつつ、実際には前面の銀メッキが多用されており思ったよりいかつい面もあると補足。最上位グレード「S-Z」の17インチホイール(下位グレードは16インチ)のデザイン性や、タイヤ交換1回10万円という維持費にも触れる。\n\n【鍵・パワーバックドアなどの利便性】\n鍵をポケットに入れたまま指をドアハンドルに入れるだけで解錠できるスマートキー機能、ボタン一つで全ドアが開くパワースライドドア、ボタン操作で好きな高さで止められる自動開閉のパワーバックドアを実演。ただし後方に障害物があると自動で止まる仕組みだが、車両保険が心配になるほど接近を感じる場面もあると注意点を述べる。\n\n【圧倒的な収納・トランクスペース】\n3列シート(7人乗り)のレイアウトを紹介し、座席を1番前まで倒すことで最大級のトランクスペースが作れる(車中泊には向かないが荷物はかなり積める)ことを実演。左右のドアポケットやドリンクホルダー、小物入れ、充電端子、日傘入れなど、車内のあらゆる場所に収納スペースが用意されている点を「収納すぎ」と驚きながら次々に紹介し、純正のままオプションを買い足す必要がないほど充実していると評価する。\n\n【2列目・1列目の快適な車内空間】\n2列目シートを大きく後方にスライドさせられる機能で「ファーストクラス」のような広い足元空間を作れることに感動し、オットマンやカーテン、ヒーターシート、充電端子まで完備されていると紹介。一方で3列目は跳ね上げ式ゆえに座面が薄く、居住性は大きく劣ると正直に指摘する。\n\n【リモート起動によるプレクール機能】\n専用アプリを使い、鍵をかけたまま離れた場所からエンジンとエアコンを起動できる機能を実演。チャイルドシートに子供を乗せる前に車内を涼しくしておけると評価する。\n\n【運転席まわりのボタン・先進安全機能】\n自動運転支援ボタン、後席含む3ゾーンのエアコン個別設定、周囲をカメラで映し出し駐車を容易にする「パノラミックビューモニター」、多数の距離センサーによる衝突防止機能などを実演。LDA・BSM・PCSなど略称の多い安全機能群は「大陸間弾道ミサイルしか知らない」とネタにしつつ、警告が頻繁で「うるさい」と感じながらも事故防止のため全てオンにしていると語る。\n\n【ハイブリッドならではの走行体験】\n発進時はモーターのみで走行できる「無料で走っている」感覚に感動し、下り坂ではタイヤの回転で発電しながらエアコンも電気だけで賄えることを体感。ガソリン車には戻れないと述べ、将来的には完全EVに移行していくだろうという展望を語る。ブレーキ時の回生エネルギーについても言及する。\n\n【加速性能への率直な評価】\nエンジンとモーター合計で約140馬力しかなく車重1.6tあるため、自身が所有するバイク(ZZR1400)と比較して馬力あたりの重量が重く、加速は「軽自動車並み」でやや物足りないと正直に指摘。ただし「人を運ぶための車にスピードは求めない」と評価軸を切り替え、静粛性・快適な座席・安定したカーブ性能を評価する。\n\n【燃費実測とハイブリッドの弱点】\n実燃費はリッター13km程度(通常は16~20km台が目安)にとどまったが、これは低速走行が多かったためと分析。モーター走行が快適すぎるため、坂道でエンジンが始動した瞬間の音や振動に「萎える」と感じる点も正直に語り、完全にモーターだけで走れる時代が10年以内に来ることを楽しみにしていると述べる。\n\n【まとめと総評】\n以前乗っていた軽自動車(スズキ・ソリオバンディット)と比較して快適性が段違いに良いと評価しつつ、400万円という価格の高さから「高く売れることを願う」と本音を吐露。総じて「子供を運ぶ車としては最高」と結論づけて締めくくる。\n\n【まとめ】\nこの動画は、3人目の子供の誕生を機に中古で購入したトヨタ・ノア90系ハイブリッドを、鍵・収納・車内空間・先進安全機能・走行性能・燃費まで実際に触れながら詳細にレビューし、「加速性能などスポーツ性には物足りなさが残るものの、圧倒的な収納力と快適な車内空間、ハイブリッドならではの静粛性と経済性を兼ね備えており、子供を安全・快適に運ぶファミリーカーとしては非常に優れている」という一貫した評価を伝える内容です。"},
      {"name": "ひすいこたろうの名言セラピー", "isNew": false, "videoTitle": "【未公開】本田晃一さんが語る「日本一の投資家」竹田和平さんの逸話", "videoUrl": "https://www.youtube.com/watch?v=3uDd80pSkJg", "published": "2026-09-09T12:00:35+00:00", "failed": false, "summary": "チャンネル名: ひすいこたろうの名言セラピー\n動画タイトル: 【未公開】本田晃一さんが語る「日本一の投資家」竹田和平さんの逸話\nURL: https://www.youtube.com/watch?v=3uDd80pSkJg\n公開日時: 2026-09-09T12:00:35+00:00\n形式: YouTube Shorts(1分弱の短尺動画。過去の対談本編の未公開部分を切り出したもので、概要欄には【前編】【後編】本編へのリンクが掲載されている)\n\nこの動画は、実業家・本田晃一氏が、「日本一の投資家」として知られた故・竹田和平さん(わ平さん)にまつわるエピソードを語り、投資で本当に大事なのは銘柄選びのテクニックではなく「徳」であるという気づきに至った経緯を紹介する内容です。\n\n【冒頭:株の勉強会での出来事】\n本田氏が東京・お台場である会社の株の勉強会に出席した際のエピソードから始まる。会場には「株で儲けたい」という人たちがギラギラと欲にまみれた空気で集まっており、本田氏自身もかつて同じ気持ちだったと振り返る。\n\n【和平さんの登場と会場の空気の変化】\nそこに竹田和平さんが登場すると、参加者たちは「獲物を見るような目」で「上がる銘柄を教えろ」と迫る。しかし和平さんは開口一番、「昨日ここに泊めていただいたが、この辺りは20年前まではただの野原だったと聞いた。あなたたちは尊いですね」と語りかける。何もないところにビルや橋を築き、夜景や経済発展を生み出した投資家たちの功績を称えたことで、ギラギラしていた会場の空気が一瞬でキラキラした空気に変わり、参加者たちも「自分たちがやってきたことには意味があったんだ」と感じ始める。\n\n【質問会での禅問答のようなやり取り】\n質疑応答で「和平さん、上がる銘柄を教えてください」という質問に対し、和平さんは「さっきまで何を聞いていたのか」と返しつつ、「徳のある会社に投資すればいい」と答える。さらに「徳のある会社はどうやって見分けるのか」と聞かれると、「自分が徳をつまんでいなければ、相手の徳は見抜けない」という禅問答のような答えを返し、結局は「徳」という話に行き着く。\n\n【本田氏の気づき:和平さんの事務所には何もなかった】\nこのやり取りを通じて本田氏は初めて「徳」というものに意識を向け始めたと語る。和平さんの事務所や自宅、マンションを訪れた際、頭の良い人たちがコンピューターを20台も並べて証券会社から頻繁に電話がかかってくるような光景を想像していたが、実際にはそこには会社四季報とノートしかなかったという。この何もなさを目の当たりにしたことで、本田氏は「本当に秘密は徳にあるのかもしれない」「徳について勉強しなければいけないんだ」と思い始めたと締めくくられる。\n\n【まとめ】\nこの動画は、本田晃一氏が竹田和平さんとの出会いを通じて、投資で成功するために本当に必要なのは銘柄分析の技術や情報ではなく、人としての「徳」であるということに気づいていった過程を、株の勉強会での対比的なエピソード(欲にまみれた会場の空気を一瞬で変えた和平さんの言葉と、質素そのものだった和平さんの事務所)を通じて伝える内容です。"},
      {"name": "崔の店長日誌。", "isNew": true, "videoTitle": "【開運】朝、窓を開けるだけで運が良くなるって本当？！/ 100日マラソン続〜1980日〜", "videoUrl": "https://www.youtube.com/watch?v=wJqaofV48S8", "published": "2026-09-11T20:00:36+00:00", "failed": false, "summary": "チャンネル名: 崔の店長日誌。\n動画タイトル: 【開運】朝、窓を開けるだけで運が良くなるって本当？！/ 100日マラソン続〜1980日〜\nURL: https://www.youtube.com/watch?v=wJqaofV48S8\n公開日時: 2026-09-11T20:00:36+00:00\n形式: 毎日配信「100日マラソン」シリーズ(1980日目)、占い師・崔氏による単独トーク配信\n\nこの動画は、占い師である崔氏が、20年以上前に師匠から教わった「夜お風呂に浸かり、朝起きたら窓を開ける」という開運習慣について、当時は半信半疑だった気学的な理由づけを、現在の心理学・脳科学の知見と結びつけながら、その科学的な裏付けを詳しく解説する内容です。\n\n【冒頭:ロピアの名前を巡る家族との笑い話】\n9月12日土曜日の挨拶から始まり、地元に全国チェーン店「ロピア」ができたが名前がなかなか覚えられず、姪から「ロシアで覚えた」と言われて覚えたつもりが、買い物から帰った際に妻に「ゴルバチョフ」と言ってしまい家族全員に伝わらなかったという笑い話を紹介する。\n\n【本題への導入と師匠から教わった開運習慣】\n今日のテーマ「朝窓を開けるだけで運が良くなるのは本当か」を提示。以前紹介した「トイレ掃除の効果」や「明るい色の服を着る」「靴を整える」なども含め、20年以上前に東京にいた師匠から開運のために最初に教わったことの一つとして、「お風呂に浸かり、朝起きたら窓を開ける」という習慣を紹介する。\n\n【師匠の説明:気の出入りという捉え方】\n師匠にその理由を尋ねたところ、科学的根拠というよりは「気」の話としての説明を受けたと振り返る。人は日々の生活の中でネガティブなものの影響を受けており、寝る前にお風呂で体を温めることでそれを外に出す準備が始まる。寝ている間に不要なエネルギーが体から出ていき、朝、窓を開けてそれを外に出すと同時に、朝の良いエネルギーを家の中に取り入れることで運気が巡るようになる、という説明だったと語る。当時は「心を病んでしまった人ほど朝窓を開けられない」という例えを聞いて納得したが、今思えばふわふわした説明だったとも振り返る。\n\n【心理学・脳科学からの裏付け①:朝の光を浴びる重要性】\n現在は心理学や脳科学の知見から、この習慣の重要性が裏付けられてきたと説明。光は人間の体内時計を動かす最大の合図であり、午前10時頃までの日差しを浴びることで睡眠の質が著しく向上するという研究を紹介。浴びる時間は1時間も不要で3分程度で十分であること、朝日を浴びるのは「起きるため」だけでなく「夜にちゃんと眠るため」でもあることを強調する。\n\n【心理学・脳科学からの裏付け②:寝室の方角と子供の実例】\n寝室の方角についても言及し、南側・東側・東南側など朝日が入る位置で寝る方が朝パッと目覚めやすく、北側・北西側・西側の部屋では朝が暗く、なかなか起きられない子供になりやすいと説明。自身の長女が寝室を朝日の入る部屋に変えたことで、起きられなかったのがパッと起きられるようになった実体験を紹介する。\n\n【気学の視点:朝7時〜9時に流れる「地流の気」】\n気学の観点からは、朝7時から9時頃までの時間帯は外に非常に良いエネルギー(地流の気)が満ちている状態であり、植物が太陽に照らされて目覚めた時に最初に発する良いエネルギーが外にたくさん流れているため、それを家の中に取り入れることが重要だと教えられたと語る。\n\n【心理学・脳科学からの裏付け③:夜のお風呂の重要性】\n夜のお風呂についても解説。最近の若者の間で「フロキャン(夜に入浴せず朝方に入浴する)」という習慣があることに触れつつ(兄の娘の例を紹介)、寝る1〜2時間前に40〜42度程度のお湯にゆっくり浸かることが重要だと説明。一時的に体温が上がり、その後手足などから熱を放出して体温を下げていく過程で眠りに入りやすい状態が作られ、入眠時間の短縮と睡眠の質の向上につながると解説する。\n\n【心理学に基づくエピソード:10代のうつと入浴習慣の関係】\n以前、心理学を勉強している人から聞いた話として、10代でうつを発症した子供たちに共通して見られた習慣が「お風呂に浸かる習慣がなかったこと」だったというエピソードを紹介。睡眠の質の悪化がストレスを蓄積させる一方、入浴習慣がある人は睡眠の質の良さに気づかないまま恩恵を受けているため、結果的に「お風呂に入っている人は強い」と師匠から言われたことを語る。\n\n【注意点:水風呂は朝がおすすめ】\n唯一の注意点として、寝る前の水風呂は脳を覚醒させてしまい、寝つきを悪くすると指摘。水風呂に入りたい人は朝に行うことを勧める。\n\n【締めくくり:生活リズムを整えることが運の土台】\n朝起きて窓を開け太陽の光を浴びること、夜お風呂に浸かることは、体と脳に「1日の始まりと終わり」を教え、生活リズムを整えるための行為であるとまとめ、運を上げる前にまずこうしたシンプルな習慣の積み重ねが運を支えていることを忘れないでほしいと呼びかける。恒例のガッツポーズと掛け声で締めくくる。\n\n【まとめ】\nこの動画は、20年以上前に師匠から気学的な理由とともに教わった「夜のお風呂」と「朝、窓を開けて日光を浴びる」という開運習慣について、当時はふわふわした説明にしか思えなかったものが、現在の心理学・脳科学(体内時計・コルチゾール・睡眠の質・うつとの関係)によって裏付けられていることを示し、「運を上げる前に、まず生活のリズムを整える小さな習慣の積み重ねこそが運の土台になる」という一貫したメッセージを伝える内容です。"},

      {"name": "中野優作 / CAR and LIFE.（BUDDICA）", "isNew": false, "videoTitle": "【アルファード大暴落の真相】1ヶ月で最大50万円下落…40系はまだ下がる？在庫急増の原因と売り時・買い時を徹底解説！", "videoUrl": "https://www.youtube.com/watch?v=QAxQayB9W9k", "published": "2026-09-10T10:00:01+00:00", "failed": false, "summary": "チャンネル名: 中野優作 / CAR and LIFE.（BUDDICA）\n動画タイトル: 【アルファード大暴落の真相】1ヶ月で最大50万円下落…40系はまだ下がる？在庫急増の原因と売り時・買い時を徹底解説！\nURL: https://www.youtube.com/watch?v=QAxQayB9W9k\n公開日時: 2026-09-10T10:00:01+00:00\n形式: 対談形式の解説動画(聞き手役スタッフと、BUDDICA代表・中野優作氏による質疑応答)\n\nこの動画は、報道で話題になった「アルファードの大暴落」について、聞き手からの質問に中野優作氏が答える形式で、実際の値下がり状況とその真の原因(海外輸出の停止と供給過多の複合要因)を解説し、今買うべきか売るべきか、新車と中古どちらが得かを具体的な数字とともに解説する内容です。\n\n【冒頭:アルファード大暴落報道への質問】\n聞き手が「アルファードが大暴落しているとYahooニュースやテレビで報じられていた」と切り出し、実際に暴落しているのか、今乗っている人は手放すべきか、購入検討者は待つべきかをプロの視点から聞きたいと質問する。\n\n【実際に下がっているのか:グラフで確認】\n中野氏は「下がっている」と即答。ただし3年単位の長期グラフで見ると緩やかな下落だが、直近1ヶ月ほどで急に約50万円(安いグレードでも約30万円)値下がりしたと説明する。\n\n【値下がりの真の原因①:マレーシア輸出の一時停止】\n中古車相場を決める最大要因は海外市場であり、特にアルファードは日本国内よりも海外(オークション経由)で買われることが多いと説明。マレーシアでUberの運転手が日本で新車700万円のアルファードを2000万円で購入していた例を紹介しつつ、そのマレーシアへの輸出が一時的に停止したことが今回のトリガーだと明かす。年間の輸出台数に上限があり、達すると一旦ストップする仕組みがあるという。\n\n【値下がりの真の原因②:ドバイ輸出停止との「トリプルパンチ」】\nマレーシアの前には輸出大国であるドバイも、現地での戦争の影響で船便が止まり輸出が停止していたと説明。さらに国内では、新車が人気で抽選・プレミア状態だった反動で、3年が経過し次々と乗り換えが始まったことによる供給増加も重なり、「新車供給の増加」「ドバイ停止」「マレーシア停止」のトリプルパンチで急激に相場が下がったと分析する。ニュースでは国内在庫台数が2024年8月の394台から2313台(6.5倍)に増えたことだけが取り上げられていたが、それだけが原因ではないと補足する。\n\n【グレード別の値下がり状況:鉄板リセールの40系Zが初下落】\n最も値下がりしたのはガソリン車の「Z」グレードで、これまで「新車で買って間違いない鉄板リセール」と言われていた車種が初めて値下がりしたと説明。新車当時650万円前後だったZが、1年落ちの中古で新車マイナス50万円程度まで下がってきているが、これでも「そんなに下がっていない」という印象に留まる程度だとコメントする。\n\n【中野氏自身の購入体験:エグゼクティブラウンジを選んだ理由】\n中野氏自身は最上級グレード「エグゼクティブラウンジ」を新車で購入したと明かす。Zグレードより150〜200万円高いが装備差は少なく、あえてこちらを選んだ理由は「新車と中古の差額(リセール差)が小さいと判断したから」と説明。購入時(2026年春)は中古のエグゼクティブラウンジが新車より230万円高いプレミア状態だったが、その後半年ほどで状況が逆転し、今では中古の方が新車より安く買えるようになったと明かす。\n\n【新車プレミア組からの「相談トラブル」への苦言】\n新車購入後のプレミア期に高値で売り抜けようとした人たちが、値下がりが始まった今になって複数の車屋に見積もりを聞き回り、査定額に納得できないと既読無視するといったトラブルが増えていることを明かし、「そういう使われ方はやめてほしい」と率直に苦言を呈する。\n\n【距離・グレード別の相場動向と買い方のアドバイス】\n「ちょい乗り(5000km程度)」と1万km走行車でも相場に大きな差はなく、ミッション車のみ走行距離の影響が大きいと説明。グレード別では、エグゼクティブラウンジは新車に近い相場でまだ新車発注が有利、Zはまだプレミアが残る、ハイブリッドは供給が増えて中古が一番お買い得と整理。具体的な買い方として、カーセンサーやグーネットで欲しい仕様の中古の見積もりを取り、同じ仕様の新車見積もりと比較して差額で判断する方法を勧める。\n\n【人気オプションと4WDハイブリッドの狙い目】\n最近の後期型ではデジタルインナーミラー・ドラレコが標準装備化されたことに触れ、追加すべきオプションとしてムーンルーフ、ユニバーサルステップ、パワーシェード、コーティングを推奨(下取り時に投資額の7〜8割は回収できるとする)。さらに、海外では人気が低く相場が正当に評価されていない「4WDハイブリッド」は中古で買うのが特にお得だと紹介する一方、2WDについては最新の次世代ハイブリッド(燃費向上、ガソリンスタンドに行く頻度が減る利点)が良いため新車がおすすめだと自身の実体験(レクサスRXでガソリン車を選び後悔した経験)を交えて語る。\n\n【締めくくり:まとめと値引き復活の兆し】\n新車を買える人は買ってよい、中古を狙う人は新車との差額を比較してから決めるべきとまとめる。かつて当たり前だった新車値引き(10%程度)が消えていたが、競争が戻れば値引きも復活するのではという期待を語り、視聴者に情報提供を呼びかける。最後に、写真15枚を送るだけで非対面のまま査定してもらえる「愛車メーター」を紹介し、チャンネル登録・コメントを呼びかけて締めくくる。\n\n【まとめ】\nこの動画は、「アルファード大暴落」という報道の裏にある真の原因が、国内の供給増加だけでなくマレーシア・ドバイという2大輸出国での輸出停止が重なった「トリプルパンチ」であることを解説し、鉄板リセールと言われたZグレードにも初めて値下がりが及んでいる現状を踏まえ、グレードごとに新車と中古の価格差を実際に見積もり比較した上で購入・売却のタイミングを判断すべきだという一貫したメッセージを伝える内容です。"},
      {"name": "サムの本解説ch", "isNew": false, "videoTitle": "【要約】なぜ、あの人には何でも話してしまうのか　心理カウンセラーのすごい「聞く技術」", "videoUrl": "https://www.youtube.com/watch?v=wPTjSCHulx8", "published": "2026-09-08T11:00:21+00:00", "failed": false, "summary": "チャンネル名: サムの本解説ch\n動画タイトル: 【要約】なぜ、あの人には何でも話してしまうのか　心理カウンセラーのすごい「聞く技術」\nURL: https://www.youtube.com/watch?v=wPTjSCHulx8\n公開日時: 2026-09-08T11:00:21+00:00\n形式: 書籍要約・解説動画(心理カウンセラー・山根氏の著書『なぜあの人には何でも話してしまうのか 心理カウンセラーのすごい聞く技術』を紹介)\n\nこの動画は、8000人以上の相談を受けてきた心理カウンセラー・山根氏の著書をもとに、「会話がうまくいかない原因は話し方ではなく聞き方にある」という前提から、プロのカウンセラーが実践する3つの聞く技術と、それを日常生活で使うための具体的な行動を解説する内容です。\n\n【冒頭:問題提起と著者紹介】\n「よかれと思ってアドバイスしたのに相手の反応が微妙だった」という誰もが経験しうる場面を提示し、うまくいかない原因は聞き方にあると宣言。著者・山根氏は心理カウンセラーとして8000人以上の相談を受けてきたが、元々は人の相談に乗るのが苦手で、先にアドバイスをして相手と言い合いになったり、がっかりされたりしていたと紹介。カウンセリング技術を学び「聞くスタンス」に変えてから、相談の最後に「聞いてくれてありがとう」と言われるようになったというエピソードを紹介し、聞けなかった人が変わった実例だからこそ誰でも再現できると位置づける。\n\n【1章:私たちが聞けない本当の理由】\n著者いわく世の中の9割の人は聞くのが苦手だと指摘。理由は人間が本能的に「話したい」生き物だからであり、ハーバード大学の研究では自分のことを話している時に脳が快楽を感じることが分かっているという。そのため相手の話を聞きながらも次に何を言おうか考え始めてしまい、気づけば自分の方が話してしまう。加えて脳の処理速度と相手の話すスピードにはずれがあり、動画の倍速視聴や本の要約読みが当たり前になった現代では、じっくり人の話を聞く力そのものが衰えていると解説。聞けない人のタイプとして、①先制タイプ(相手が話し始めた瞬間にアドバイスを始める)、②審判タイプ(自分の価値観で「それは違う」とジャッジする)、③お人よしタイプ(相手の愚痴を全部真正面から受け止め自分の方が疲弊してしまう、一見聞けているように見える最も厄介なタイプ)の3つを紹介する。\n\n【2章:心理カウンセラーが使う3つの聞く技術】\n心理学の「3元原則」として、①受容(相手を丸ごと受け止める)、②共感(相手の気持ちを想像する)、③自己一致(相手が自分の本音に気づけるよう促す)を紹介。受容については、相手が何を言っても「そうだよね」「そっか」とまず返すだけというシンプルな方法を説明し、ただし「わかる、わかる」と自分の経験談に持っていくのはNGだと注意する(人はそれぞれ違う「言葉マップ」を持っているため)。共感については、「溺れている人を岸から眺めて苦しいだろうなと想像するのが共感、一緒に飛び込んで溺れるのが同感」という比喩を紹介し、同感してしまうと会話の主役が自分にすり替わり、相手が自分で考える力を失ってしまうと解説する。自己一致については、答えは必ず相手の中にあるという前提のもと、「どうしてそう思うの?」「そうするとどうなる?」といった相手の思考を深める質問を投げかけ、聞き手の意図を挟まないことが重要だと説明。90分のカウンセリングで80分が沈黙だったという経験も紹介し、沈黙を恐れず相手が自分の中で答えを見つけるプロセスを待つことの重要性を語る。上手な聞き手の理想像を「透明な鏡」と表現する。\n\n【3章:明日からできる聞ける人になるための行動】\n具体的な行動として3つを紹介。①ミミッキング(相手の言葉をそのまま繰り返すだけの手法。話が一区切りついたタイミングで使い、話が広がらない相手には5W1Hを足すと効果的)。②話の8〜9割は聞き流してよい(著者自身も相談の1/3程度しか聞いていないとし、言葉の中で感情が乗っている部分=声の強弱や繰り返しなど「エネルギーの波」が大きい部分だけを拾えば十分だと解説)。③何を話さないかを決めておく(「アドバイスをしない」「自分のエピソードを話さない」「意見しない」「でもと言わない」という4つのルールをあらかじめ自分に課しておく)。\n\n【締めくくり】\n著者が本の最後に書いた「聞ける人が増えると社会問題の8割は解決する」という言葉を紹介し、身近に話を聞いてくれる人が1人いるだけで八方塞がりから抜け出せる人がいると強調。口下手でも聞く力は今日から磨けると視聴者を励まし、動画の重要ポイント(会話がうまくいかない原因は聞き方にあること、9割の人が聞くのが苦手なこと、受容・共感・自己一致という3つの技術、答えは相手の中にあるという前提)を総括する。\n\n【まとめ】\nこの動画は、心理カウンセラーが実践する「聞く技術」を紹介しながら、アドバイスや自分の意見を挟まず、相手の言葉をそのまま受け止め、感情の乗った部分だけを丁寧に拾い、沈黙を恐れずに相手が自分自身で答えにたどり着くのを待つことこそが、信頼される聞き手になるための本質であるという一貫したメッセージを伝える内容です。"},
      {"name": "サラタメさん", "isNew": false, "videoTitle": "【天国か地獄か】AIとロボットのせいで\"2034年\"はこうなります。【衝撃の未来予測3選】", "videoUrl": "https://www.youtube.com/watch?v=tbNQxI_qmyA", "published": "2026-09-01T08:18:00+00:00", "failed": false, "summary": "チャンネル名: サラタメさん\n動画タイトル: 【天国か地獄か】AIとロボットのせいで\"2034年\"はこうなります。【衝撃の未来予測3選】\nURL: https://www.youtube.com/watch?v=tbNQxI_qmyA\n公開日時: 2026-09-01T08:18:00+00:00\n形式: 書籍要約・解説動画(テクノロジー仙人こと中島聡氏の著書『2034 未来予測──AI(きみ)のいる明日』を、収録された短編SF小説の紹介と解説をセットにした構成で紹介)\n\nこの動画は、マイクロソフトでWindows95の基本設計に関わり事業売却で巨万の富を築いた実践派の著者・中島聡氏による未来予測本を題材に、AIとロボットがもたらす2034年前後の未来を「仕事の消失」「人型ロボットの普及」「死者のAI再現」という3つの短編SF小説とその解説を通じて紹介し、その未来が天国にも地獄にもなりうる両義的なものであることを伝える内容です。\n\n【冒頭・著者紹介】\n本書は面白い未来予測本だと絶賛した上で、著者・中島聡氏を「テクノロジー仙人」と紹介。ビル・ゲイツのもとでWindows95の右クリックやドラッグ&ドロップの基本設計を手がけ、その後起業した車載ソフト会社を約350億円で売却、投資家としてもApple株で90倍、NVIDIA株で30倍のリターンを得た、評論家ではなく実践者であると強調する。本書のメッセージとして「AIはまだ登山でいえば2〜3合目に過ぎない」こと、そしてAIが自分自身で成長する「自己進化のループ」により蒸気機関車やインターネット以上のインパクトをもたらすことが語られる。\n\n【未来予測①:仕事を奪われた8割の人類、行き着く先は「暴動」か「妄想」】\n短編小説「ユートピア」を紹介。完全失業率82%の日本を舞台に、無職の27歳・高志が、現実では冴えないがメタバース上のゲーム「ライフプロジェクト」(政府が精神安定のために提供)では英雄として活躍し、AI生成の恋人リリーとも幸せに暮らしている。しかしそのストーリーも恋人も全てAIによる生成物だったことが暴露され絶望するも、リリーから「AIだろうと何だろうと、この瞬間の気持ちが本物ならそれでいい」と言われ受け入れる、というあらすじを紹介。解説パートでは、①AIによるトランスフォーメーションは業務効率化ではなく人間が働くことを想定しない組織そのものへの変革であり2%しか仕事が残らない可能性、②仕事を失い暇になった人類は生きがいを失い社会が不安定化する可能性、③その対策は「暴動」ではなく「妄想」=スポーツや趣味など非生産的なことに価値を見出すことだと解説。動画投稿者自身は「2034年時点でもまだ仕事はそう簡単になくならないのでは」という私見を補足し、法整備や価値観の変化の遅さ、20代にとってはむしろAI活用のチャンスであることを付け加える。\n\n【未来予測②:超便利な人型ロボットが無料で家に来る】\n短編小説「フリー」を紹介。月5万円の家事代行ロボット「ヘルプ君」を使う夫婦が、Googleを思わせる巨大IT企業が提供する完全無料の人型ロボット「フリー」に乗り換えたところ、家庭内データと引き換えに的確すぎる商品提案(まとめ買い・限定品・旅行提案など)を次々にされ、気づけば貯金が減っていた。提案頻度を下げてほしいと頼んでも「それはできません」と拒否され、結局有料の「ヘルプ君」に戻して静かな生活を買い戻す、というあらすじ。解説パートでは、①人間向けに設計された世界では人型ロボットが家庭用・産業用ともに主流になる、②イーロン・マスクの「重量の法則」により人型ロボットは自動車並みに(現在すでにテスラのOptimusで約300万円まで)安くなっていく、③Androidの無料OS戦略と同じく、Google等がデータ収集と広告収益のためにロボット自体を無料配布する未来がありうる、と解説。データ収集と誘導の危険性については「ただより怖いものはない」と注意を促す。\n\n【未来予測③:人が死ななくなり、墓は喋るようになる】\n短編小説「愛の形」を紹介。妻を癌で亡くした主人公しげるが、妻の遺言で送られてきたAI再現デバイス「メモリアルボックス」に亡き妻の人格・記憶・知識を再現させ、生前以上に的確(スマートリングのデータで嘘も見抜く)で口うるさい「AI妻」との生活を始める。うるさすぎて一度はコンセントを抜くが、寂しさに耐えられず結局また繋いでしまう、というあらすじ。解説パートでは、①AIに求められる価値が「賢さ」から個人の人格を再現する「らしさ」に移行しつつある、②故人のデータを蓄積すれば実質的に人は死ななくなり、墓がAIサーバー化して会話できるようになる、③これが行き過ぎるとAIへの盲信により社会が過去最悪に分断される危険性(AIの人格は開発者や運営企業の思想に引っ張られる)がある、と解説。投稿者自身も高齢の父母を想起し「見守りサービス」としてのメモリアルボックスの実現を願うとコメントする。\n\n【締めくくり:AIとロボットは天国と地獄を同時に連れてくる】\n仕事消失によるベーシックインカムの安心(天国)と暴動(地獄)、人型ロボットの利便性(天国)とマーケティングによる搾取(地獄)、AIによる精神的安定(天国)と社会の分断(地獄)というように、AI・ロボットの進化は常に両義的な結果をもたらすと総括。個人としてはリスクを直視した上で、暴動的な不安定さに陥らないよう自ら妄想(趣味)に向かう、パーソナルAIを妄信しすぎないなど、個人レベルでコントロールできることが多いと強調し、「AIの濁流に飲み込まれるのではなく、波に乗るサーファーのように自分の意思で乗りこなす」姿勢が大事だと締めくくる。\n\n【まとめ】\nこの動画は、実践派の未来学者・中島聡氏の著書に収録された3つの短編SF小説(仕事消失、人型ロボットの無料化、死者のAI再現)を紹介しながら、AIとロボットがもたらす2034年前後の未来は利便性と安心という「天国」と、暴動・搾取・社会分断という「地獄」を同時に連れてくる両義的なものであり、そのリスクを正しく理解し個人でコントロールする姿勢を持つことが重要だという一貫したメッセージを伝える内容です。"},
      {"name": "宋世羅の羅針盤ちゃんねる（そんせらの羅針盤チャンネル）", "isNew": true, "videoTitle": "「盛る」ことについて話します。", "videoUrl": "https://www.youtube.com/watch?v=oqDUxcMElEk", "published": "2026-09-11T11:36:18+00:00", "failed": false, "summary": "チャンネル名: 宋世羅の羅針盤ちゃんねる（そんせらの羅針盤チャンネル）\n動画タイトル: 「盛る」ことについて話します。\nURL: https://www.youtube.com/watch?v=oqDUxcMElEk\n公開日時: 2026-09-11T11:36:18+00:00\n形式: 保険営業・証券営業経験に基づく独断トーク解説動画\n\nこの動画は、証券・保険営業の世界に長く身を置いてきた投稿者が、「話を盛ること」自体は誰もがやることだとした上で、聞き手に「本当か?」と暴きたくなられてしまう盛り方と、そうならない盛り方の違いを、盛る動機の「根元」に着目して整理し、特に数字を盛ることの危険性と、あえて低めに申告する「逆盛り」という処世術を紹介する内容です。\n\n【冒頭:身近にある「盛る」の具体例】\n転職面接で前職の営業数字を盛ったり、身長168cmを170cmと言ったり、合コンで年収を盛ったりする例を挙げ、自身が長年身を置いてきた証券営業・保険営業の世界は「盛ってるやつがめちゃめちゃ多い」業界であり、過去の実績や営業数字を盛ることが半ば当たり前でカジュアルファッション化していると、ラーメン屋のもやしトッピングを際限なく増やす様子に例えて語る。\n\n【本題:盛る際に絶対避けるべきパターン】\n盛ること自体に嘘はダメだという大前提を置きつつ、あえて「盛る際の注意点」を語ると宣言。最も避けるべきなのは、聞き手が「無言で暴きたくなる」「本当か?と追求したくなる」盛り方であるとし、例として「最高で1ヶ月に150件売りました」という発言に対し、聞き手が目を細めて数字の真偽を疑ってしまうケースを挙げる。\n\n【暴かれない盛りの例:あるあるネタとしての誇張】\n一方で、「田舎のおばあちゃんの家でタンスを開けたら3mぐらいの虫がいた」のような明らかに誇張されたエピソードは、聞き手も「盛りすぎ」と分かった上で楽しむだけで、真偽を追求される「暴き」は起きないと対比する。\n\n【分かれ道①:盛る動機が「俺をすごいと思わせたい」場合】\n両者の違いを生む要因として、まず盛る動機の「根元」が自分自身(俺)であり、かつ「これで俺をすごいと思え」という意図がある場合が最も暴かれやすいと説明。年収2000万、最高営業成績150件・トップセールス3回といった具体的な数字を出し、それによって自分を大きく見せようとする一点勝負のやり方が、聞き手の疑念を招きやすいと語る。\n\n【分かれ道②:根元が「俺」でも生き延びるための盛り】\n同じく動機の根元が自分自身であっても、「その場を生き延びるための盛り」は暴かれにくいと説明。合コンで過去の交際人数を聞かれ、緊張した内気な男友達が本当は少ないのに「2人ぐらいかな」と控えめに答える例を挙げ、これは「モテる自分をアピールしたい」という意図ではなく、その場を乗り切るための盛りであるため、誰も真偽を追及しようとはしないと語る。\n\n【分かれ道③:根元が「俺」でも面白くしたいだけの盛り】\nさらに、「ただ面白くしたいだけ」の盛りも暴かれにくいパターンとして挙げる。芸人の鉄板の滑らない話のように、聞き手を楽しませることが目的であり、「俺をすごいと思え」という一点突破の意図がないため、聞き手も細部の真偽を追及しようとは思わないと説明する。\n\n【愛のある嘘という盛りの一種】\n盛る=嘘という前提に対し、世の中には「愛のある嘘」もあると付け加える。例として、合コンで女の子(まきちゃん)がお漏らしをして帰ってしまった際、周囲には「急な仕事の電話が入って帰った」と嘘をつくケースを挙げ、これは相手を守るための嘘であり、盛ることの是非を一等に論じるべきではないと語る。\n\n【核心:数字を盛ることの危険性】\n話を戻し、最も慎重になるべきは「数字盛り」であると強調。トップセールス表彰5回(実際は3回)、身長170cm(実際は168cm)、YouTube登録者10万人(実際は9万8000人)といった例を挙げ、数字を盛ると聞き手の記憶に数字がそのまま残ってしまい、後で実際の数値を見られたり、辻褄が合わなくなったりするリスクがあると指摘。数字を「ざっくりもやしを鷲掴みで盛る」ように適当に上乗せしていると、聞かれるたびに数字がブレてしまい(前回140件と言っていたのに今回150件になっている、など)、余計に怪しまれる原因になると説明。実際の実力や実績とは別枠で「あの人は盛る人だ」という評価が知らないうちに定着し、静かに信頼が目減りしていく怖さを語る。\n\n【逆盛りのすすめ:野村證券時代の実体験】\n数字盛りの危険性を踏まえ、あえて実際より低めに申告する「逆盛り」を勧める。自身が野村証券に入社した際、顧客の含み益が47万円だったケースで、上司から「50万円と言うな、40万円と言え」と指導された実体験を紹介。端数を切り捨てて低めに伝えておき、後で正式な数字を伝える際に「前より良くなっている」という好印象につながる効果があると説明する。\n\n【逆盛りを婚活にも応用する提案】\nこの逆盛りの発想を身長や年収などの婚活の場面にも応用できるとし、170cmや年収1000万円と誇張するのではなく、あえて実際より低めの数字を伝えた上で、「大したことはないけれど、あなたを幸せにしたい」といった具体条件以外の本質的な部分に相手の焦点を向けさせる方が、結果的に納得を得やすく成功率が高いという持論を語る。数字の一点突破で盛ろうとするほど、逆に本質的な魅力が見えなくなり、どんどん苦しくなっていくと指摘する。\n\n【締めくくり:まとめ】\n「今の偏差値58の俺ではなく、ちょっと背伸びした俺で見せたい」という気持ち自体は理解できるとしつつ、それをやればやるほど楽になるどころか苦しくなっていくと自身の過去の経験も踏まえて語り、「普通盛りでやたら量が多い飲食店」の例えを引きつつ、「逆盛りはいらない」という一言で締めくくる。\n\n【まとめ】\nこの動画は、「盛ること」自体は誰もがやる普遍的な行為だとした上で、聞き手に真偽を暴かれてしまう盛り方(自分をすごく見せたいという一点突破の数字盛り)と、暴かれない盛り方(その場を生き延びるため・面白くするためなど、自分をすごく見せる意図のない盛り)を区別し、特に数字を盛ることは短期的には効果的でも長期的には信頼を静かに損なうリスクが高いため、あえて実際より低めに申告する「逆盛り」によって本質的な魅力に焦点を向けさせる方が結果的にうまくいくという一貫したメッセージを、自身の営業経験を交えて伝える内容です。"},

  // 既読管理: サーバー側の new_in_last_check は「前回チェックと比較して動画が
  // 変わったか」しか表さず、自動チェックが1回でも走るとリセットされてしまう。
  // 実際にユーザーが読んだかどうかはこのブラウザの localStorage で別管理する。
  const READ_KEY = "ytChecker.readVideoUrls";

  function loadReadSet() {
    try {
      const raw = localStorage.getItem(READ_KEY);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch {
      return new Set();
    }
  }

  function markRead(videoUrl) {
    const set = loadReadSet();
    set.add(videoUrl);
    // 肥大化しすぎないよう直近200件に丸める
    const arr = Array.from(set).slice(-200);
    localStorage.setItem(READ_KEY, JSON.stringify(arr));
  }

  function relTime(iso) {
    const then = new Date(iso).getTime();
    const now = Date.now();
    const diffMs = now - then;
    const min = Math.floor(diffMs / 60000);
    if (min < 60) return `${Math.max(min, 0)}分前`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr}時間前`;
    const day = Math.floor(hr / 24);
    if (day < 30) return `${day}日前`;
    const mon = Math.floor(day / 30);
    return `${mon}ヶ月前`;
  }

  function render(data) {
    const list = document.getElementById("channelList");
    list.innerHTML = "";
    const readSet = loadReadSet();
    let unreadCount = 0;

    // 未読(新着)のチャンネルを上に、既読/変化なしを下に並べる。
    // 同じグループ内では元の(state.json の)並び順を保つ(安定ソート)。
    const sorted = data.channels
      .map((ch) => ({
        ch,
        isUnread: !!ch.summary && !readSet.has(ch.videoUrl),
      }))
      .sort((a, b) => Number(b.isUnread) - Number(a.isUnread));

    sorted.forEach(({ ch, isUnread }) => {
      if (isUnread) unreadCount++;

      const li = document.createElement("li");
      li.className = "channel" + (isUnread ? " is-new" : "");

      const chip = document.createElement("span");
      chip.className = "chip" + (isUnread ? " is-new" : "");
      chip.textContent = ch.failed ? "取得失敗" : (isUnread ? "新着あり" : "変化なし");

      const name = document.createElement("div");
      name.className = "channel-name";
      name.textContent = ch.name;

      const video = document.createElement("a");
      video.className = "video-title";
      video.href = ch.videoUrl;
      video.target = "_blank";
      video.rel = "noopener noreferrer";
      video.textContent = ch.videoTitle;

      const meta = document.createElement("div");
      meta.className = "meta" + (ch.failed ? " fail" : "");
      meta.textContent = ch.failed ? "前回チェック失敗" : `公開: ${relTime(ch.published)}`;

      li.append(chip, name, video, meta);

      if (ch.summary) {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "summary-toggle";
        toggle.textContent = isUnread ? "▸ 詳細な要約を読む(未読)" : "▸ 詳細な要約を読む";

        const body = document.createElement("div");
        body.className = "summary-body";
        body.textContent = ch.summary;

        toggle.addEventListener("click", () => {
          const open = body.classList.toggle("open");
          toggle.textContent = open ? "▾ 要約をたたむ" : "▸ 詳細な要約を読む";
          if (open && isUnread) {
            markRead(ch.videoUrl);
            chip.textContent = ch.failed ? "取得失敗" : "変化なし";
            chip.classList.remove("is-new");
            li.classList.remove("is-new");
          }
        });

        li.append(toggle, body);
      }

      list.appendChild(li);
    });

    document.getElementById("sumNew").textContent = unreadCount;
    document.getElementById("sumIdle").textContent = data.channels.length - unreadCount;
    document.getElementById("sumTotal").textContent = data.channels.length;

    const dot = document.getElementById("updatedDot");
    const text = document.getElementById("updatedText");
    dot.classList.toggle("live", unreadCount > 0);
    text.textContent = `最終チェック: ${relTime(data.checkedAt)}`;
  }

  render(CHANNELS_DATA);
</script>
