      {"name": "南山紘輝（コーチング）", "isNew": false, "videoTitle": "(初回チェック前)", "videoUrl": "https://www.youtube.com/@nalpus", "published": "2026-10-12T02:28:23Z", "failed": false, "summary": null},

  // 既読管理: サーバー側の new_in_last_check は「前回チェックと比較して動画が変わったか」しか
  // 表さず、自動チェックが走るとリセットされる。実際にユーザーが読んだかどうかは
  // このブラウザの localStorage で動画URLごとに別管理する。
  const READ_KEY = "ytChecker.readVideoUrls";

  function loadReadSet() {
    try {
      const raw = localStorage.getItem(READ_KEY);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch {
      return new Set();
    }
  }

  function markRead(url) {
    try {
      const set = loadReadSet();
      set.add(url);
      localStorage.setItem(READ_KEY, JSON.stringify(Array.from(set).slice(-300)));
    } catch {}
  }

  function relTime(iso) {
    const then = new Date(iso).getTime();
    if (!then) return "";
    const min = Math.floor((Date.now() - then) / 60000);
    if (min < 60) return `${Math.max(min, 0)}分前`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr}時間前`;
    const day = Math.floor(hr / 24);
    if (day < 30) return `${day}日前`;
    return `${Math.floor(day / 30)}ヶ月前`;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // r: {url, name, title, published, summary, failed, unreadLabel, readLabel, metaPrefix}
  function makeRow(r, isUnread) {
    const li = el("li", "channel" + (isUnread ? " is-new" : ""));
    const chip = el("span", "chip" + (isUnread ? " is-new" : ""),
      r.failed ? "取得失敗" : (isUnread ? r.unreadLabel : r.readLabel));
    const name = el("div", "channel-name", r.name);
    const video = el("a", "video-title", r.title);
    video.href = r.url;
    video.target = "_blank";
    video.rel = "noopener noreferrer";
    const meta = el("div", "meta" + (r.failed ? " fail" : ""),
      r.failed ? "前回チェック失敗" : `${r.metaPrefix}公開: ${relTime(r.published)}`);
    li.append(chip, name, video, meta);

    if (r.summary) {
      const toggle = el("button", "summary-toggle",
        isUnread ? "▸ 詳細な要約を読む(未読)" : "▸ 詳細な要約を読む");
      toggle.type = "button";
      const body = el("div", "summary-body", r.summary);
      toggle.addEventListener("click", () => {
        const open = body.classList.toggle("open");
        toggle.textContent = open ? "▾ 要約をたたむ" : "▸ 詳細な要約を読む";
        if (open && isUnread) {
          isUnread = false;
          markRead(r.url);
          chip.textContent = r.failed ? "取得失敗" : r.readLabel;
          chip.classList.remove("is-new");
          li.classList.remove("is-new");
          updateUnreadCount(-1);
        }
      });
      li.append(toggle, body);
    }
    return li;
  }

  let unreadTotal = 0;
  function updateUnreadCount(delta) {
    unreadTotal += delta;
    document.getElementById("sumNew").textContent = unreadTotal;
    document.getElementById("updatedDot").classList.toggle("live", unreadTotal > 0);
  }

  // 未読を上に。同じグループ内は元の並びを保つ(安定ソート)。
  function fillList(listId, rows, readSet, emptyText) {
    const list = document.getElementById(listId);
    list.innerHTML = "";
    const tagged = rows
      .map((r) => ({ r, u: !!r.summary && !readSet.has(r.url) }))
      .sort((a, b) => Number(b.u) - Number(a.u));
    if (!tagged.length) list.append(el("li", "empty-note", emptyText));
    let unread = 0;
    tagged.forEach(({ r, u }) => {
      if (u) unread++;
      list.append(makeRow(r, u));
    });
    return unread;
  }

  function render(data) {
    const readSet = loadReadSet();
    const chRows = data.channels.map((ch) => ({
      url: ch.videoUrl, name: ch.name, title: ch.videoTitle, published: ch.published,
      summary: ch.summary, failed: ch.failed,
      unreadLabel: "新着あり", readLabel: "変化なし", metaPrefix: "",
    }));
    const apRows = (data.appearances || [])
      .slice()
      .sort((a, b) => (a.published < b.published ? 1 : -1))
      .map((a) => ({
        url: a.url, name: a.persons.join("・") + " が出演", title: a.title,
        published: a.published, summary: a.summary, failed: false,
        unreadLabel: "出演あり", readLabel: "確認済み", metaPrefix: a.hostChannel + " ・ ",
      }));

    unreadTotal = 0;
    unreadTotal += fillList("channelList", chRows, readSet, "");
    unreadTotal += fillList("appearanceList", apRows, readSet,
      "直近2週間で見つかった出演動画はありません。");

    document.getElementById("sumNew").textContent = unreadTotal;
    document.getElementById("sumApp").textContent = apRows.length;
    document.getElementById("sumTotal").textContent = chRows.length;
    document.getElementById("subtitle").textContent =
      `${chRows.length}チャンネルの新着動画と、他チャンネルへの出演を毎朝自動チェック`;
    document.getElementById("updatedDot").classList.toggle("live", unreadTotal > 0);
    document.getElementById("updatedText").textContent = data.checkedAt
      ? `最終チェック: ${relTime(data.checkedAt)}` : "まだチェックされていません";
  }

  render(CHANNELS_DATA);
</script>
