<style>
  :root {

    --surface: #ffffff;
    --surface-raised: #fbfaf8;
    --ink: #21262b;
    --ink-muted: #5b6470;
    --ink-faint: #8b929b;
    --border: #dedbd3;
    --border-strong: #c7c3b8;
    --accent: #2e5c8a;
    --accent-soft: #e4ecf3;
    --new: #d9622b;
    --new-soft: #fbe7db;

      --surface: #1b1f23;
      --surface-raised: #21262b;
      --ink: #e8e6e1;
      --ink-muted: #9aa2a9;
      --ink-faint: #6b7278;
      --border: #2c3237;
      --border-strong: #3a4046;
      --accent: #7fb0e0;
      --accent-soft: #223140;
      --new: #f0904f;
      --new-soft: #3a2618;
      --idle: #7c8680;
      --idle-soft: #23282a;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.25);
    }
  }

  :root[data-theme="dark"] {
    --bg: #14171a;
    --surface: #1b1f23;
    --surface-raised: #21262b;
    --ink: #e8e6e1;
    --ink-muted: #9aa2a9;
    --ink-faint: #6b7278;
    --border: #2c3237;
    --border-strong: #3a4046;
    --accent: #7fb0e0;
    --accent-soft: #223140;
    --new: #f0904f;
    --new-soft: #3a2618;
    --idle: #7c8680;
    --idle-soft: #23282a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.25);
  }

  :root[data-theme="light"] {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface-raised: #fbfaf8;
    --ink: #21262b;
    --ink-muted: #5b6470;
    --ink-faint: #8b929b;
    --border: #dedbd3;
    --border-strong: #c7c3b8;
    --accent: #2e5c8a;

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 20px 64px;
  }

  header.top {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 28px;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;

  h1 {

    margin-top: 2px;
  }

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 24px 0 28px;
  }

  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }

  .summary-card .num {
    font-family: var(--font-display);
    font-size: 28px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .summary-card.new .num { color: var(--new); }
  .summary-card .label {
    margin-top: 6px;
    font-size: 12px;
    color: var(--ink-muted);
  }

  .updated-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-faint);
    font-family: var(--font-mono);
    margin-bottom: 18px;
  }

  .updated-line .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--idle);
    flex: none;
  }
  .updated-line .dot.live { background: var(--new); }

  ul.channels {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  li.channel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 14px;
    align-items: start;
    transition: border-color 0.15s ease;
  }

  li.channel.is-new {
    border-color: color-mix(in srgb, var(--new) 45%, var(--border));
  }

  .chip {
    grid-row: 1 / 3;
    align-self: center;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.03em;
    padding: 5px 10px;
    border-radius: 999px;
    white-space: nowrap;
    background: var(--idle-soft);
    color: var(--idle);
  }
  .chip.is-new {
    background: var(--new-soft);
    color: var(--new);
    font-weight: 600;
  }

  .channel-name {
    font-weight: 600;
    font-size: 14.5px;
    color: var(--ink);
  }

  .video-title {
    font-size: 13.5px;
    color: var(--ink-muted);
    text-decoration: none;
    line-height: 1.4;
  }
  .video-title:hover { color: var(--accent); text-decoration: underline; }
  li.channel.is-new .video-title { color: var(--ink); }

  .meta {
    grid-column: 2;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 2px;
  }

  .meta .fail { color: var(--new); }

  .summary-toggle {
    grid-column: 2;
    justify-self: start;
    margin-top: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--accent);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .summary-toggle:hover { text-decoration: underline; }

  .summary-body {
    grid-column: 2;
    margin-top: 10px;
    padding-top: 12px;
    border-top: 1px dashed var(--border-strong);
    font-size: 13.5px;
    line-height: 1.75;
    color: var(--ink);
    white-space: pre-wrap;
    display: none;
  }
  .summary-body.open { display: block; }

  footer {
    margin-top: 32px;
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
  }
  footer a { color: var(--ink-muted); }

  @media (max-width: 480px) {
    .summary-row { grid-template-columns: 1fr 1fr; }
    .summary-card:last-child { grid-column: 1 / -1; }
  }
</style>

      {"name": "トーマスガジェマガ", "isNew": false, "videoTitle": "【東京一人旅】2年4ヶ月ぶりに思い出の古巣を訪ねる【渋谷区代々木】", "videoUrl": "https://www.youtube.com/watch?v=miqOT4tOEUg", "published": "2026-08-06T10:42:17+00:00", "failed": false, "summary": "チャンネル名: トーマスガジェマガ\n動画タイトル: 【東京一人旅】2年4ヶ月ぶりに思い出の古巣を訪ねる【渋谷区代々木】\nURL: https://www.youtube.com/watch?v=miqOT4tOEUg\n公開日時: 2026-08-06T10:42:17+00:00\n形式: 一人称視点の東京旅行密着VLOG(方言混じりのトークをしながら街を歩く形式)\n\nこの動画は、かつて10年間東京・代々木に住んでいた投稿者が、2年4ヶ月ぶりに東京を訪れ、友人と会う前の時間を使ってかつての生活圏(新宿・代々木周辺)を一人で巡り、思い出の場所の変わりぶりに衝撃を受けていく様子を記録したノスタルジー系VLOGです。\n\n【冒頭:品川到着と東京行きの経緯】\n品川駅14時50分に到着したところから始まり、東京で友人と会う予定があり2日ほど滞在すること、山手線に乗って新宿駅へ向かうことが語られます。久々の東京で「迷いがない」自分の足取りに、初めて上京しアタフタしていた頃を思い出すとコメント。ジョークで「エアフォース1で東京に来た(実際は飛行機ではない)」と発言。\n\n【ホテル手配と動画の趣旨説明】\n移動中、3時15分になってまだ宿を取っていないことに気づくが慌てず、3時半の友人との待ち合わせを優先。新宿イテル200を1万6000円で確保し「文句なし」とコメント。ここで今日の動画の趣旨を説明:「俺のための俺による俺の動画」として、自分がかつて住んでいた場所を巡り、それを映像に残すことで後でノスタルジックに浸るための記録であると述べます。\n\n【新宿伊勢丹・高島屋での買い物】\nまず新宿伊勢丹本店を訪れ、格式の高さやトイレの綺麗さを絶賛(「これが日本の頂点」)。次に高島屋へ移動し、シガールなどの果物・菓子を1万円ほどで店員に見繕ってもらい購入。あまりの暑さに、ビルの中を通って冷房エリアを繋いでショートカットする移動テクニックを実演しながら代々木方面へ向かいます。\n\n【新宿と梅田・京都の街づくり比較論】\n移動中、新宿は大きなビルが林立していても印象に残る道が多い一方、大阪・梅田はビルの中やビルの隙間ばかり歩かされて「梅田って何やったん」となりがちだと比較。徐々に発展させた街でないと印象に残る道は作れない、既存の道をそのまま生かして建物だけ作っていくべきという持論を語り、京都も同様の問題を抱えていると指摘します。\n\n【代々木駅裏:焼肉店の消失に衝撃】\n代々木駅の裏側へ。かつて奥さんと死ぬほど通っていた焼肉屋がビルごと綺麗に取り壊されて更地(新築中)になっているのを発見し、「2年間で俺が行ってた店がもうなくなってる」と衝撃を受けます。「儲かってしゃあないから次々と新しい建物建てよるんやね」とコメント。\n\n【代々木駅と周辺の再開発ラッシュ】\n「東京の10年間俺が過ごした嬉しい恥ずかしい代々木駅」に到着。かつて立てこもり事件があった居酒屋のビルも取り壊されて更地になっているのを発見し「取り壊しも建てんのも早え」と驚愕。近くの焼肉屋(こちらも過去に店長が人質に取られる立てこもり事件があったが2ヶ月ほどで営業再開したとのエピソードを紹介)はまだ健在。代々木ビレッジがあった場所も変わりすぎて分からなくなっていたほか、学校法人高宮学園(予備校=「よゼミ」)による新築ビルプロジェクト(建築完了予定2028年、高さ44m)の看板を発見。少子化なのに教育費が1人当たり上がっているため予備校はむしろ儲かっているらしいという世間話も交えます。\n\n【丸満ストアと近所のグルメ・有名人遭遇エピソード】\n昔よく通っていた店(1皿2000円で当時は高いと思っていたが今思うとそうでもない、と回想)や丸満ストアを訪問。この街はツタヤとダイソー以外は何でも揃っていたが、後にダイソーもできて「完璧な街になってしまった」と評価。近所でお笑い芸人・トロサーモンの久保田さんと頻繁にすれ違っていたエピソード(ガソリンスタンドやファミリーマート前でタクシーから降りてくるところなど)も紹介されます。\n\n【アニメ聖地・思い出の建物の消失ラッシュ】\n「天気の子」の高校のビルや「君の名は。」のビルも取り壊されて別の建物に変わっていることを発見し「新陳代謝速すぎ」と繰り返し驚きます。マクドナルドは健在(「代々木の美容専門学生の胃袋を支えるマクドナルド」)だが、よく行っていたガスト入りのビルは丸ごと消失。代々木エリアには大阪と違い身なりの汚いお年寄りがおらず「みんな品がある、金持ってまんねん」とコメント。\n\n【渋谷の寿司店を探すも見つからず牛たん屋へ】\n渋谷の思い出の寿司店(元は大久保にあった店)を食べに行こうとするが、店舗が見つからず、新宿にできている可能性に賭けて探すも発見できず。結局「今日のお昼は寿司じゃなくなりました」と諦め、あまり思い入れのない牛たん専門店(牛たん本村)で食事を済ませます。ここで「思ってるほど俺思い出ないのかもしれない」「変化が激しすぎて新陳代謝に追いつけません」と率直な感想を述べます。\n\n【歌舞伎町だけが変わらない理由の考察】\n一方で歌舞伎町だけは細かいビルが乱立する昔ながらの光景を保っていることに気づき、これは権利関係が複雑すぎて新しい建物を建てるのが難しいためだと聞いた話を紹介。活気があってクリーンなエリアはどんどん建て替えられて梅田や渋谷のように上へ上へ伸びて個性を失っていくが、歌舞伎町の混沌はそれゆえに維持されているのではないかと考察します。ただし歌舞伎町自体には強い思い出はないと振り返ります。\n\n【まとめの独白と帰宅】\n「東京なんかおってもろくなことない、旅行で来る場所じゃない、住む場所だ」「まず家を確保しないとこんなとこ楽しめない」と結論づけ、東京での思い出巡りに一区切りをつけます。ダメ元でかつての大家さんの家を訪ねるも不在で会えず、16時に「さよなら代々木」と告げてホテルへ引き上げます。\n\n【エンディング:予期せぬ再会】\n帰り道、高島屋の紙袋を持つ投稿者に気づいた人物から声をかけられ、思いがけず懐かしい顔と再会するシーンで動画は締めくくられます。\n\n【まとめ】\n2年4ヶ月ぶりに訪れた東京・代々木周辺で、かつて通っていた焼肉屋、居酒屋、アニメ聖地の建物などが次々と取り壊され・建て替えられている現実を目の当たりにし、「新陳代謝の速さ」に驚きと一抹の寂しさを覚えながらも、複雑な地権関係ゆえに変わらない歌舞伎町との対比を通じて、東京という街の変化の激しさと、そこに残る/残らない思い出について率直に語る個人的な旅の記録動画です。"},
      {"name": "ひすいこたろうの名言セラピー", "isNew": false, "videoTitle": "あなたも持っている、最高の超能力とは？", "videoUrl": "https://www.youtube.com/watch?v=_8pIu8QNyvg", "published": "2026-08-05T12:00:30+00:00", "failed": false, "summary": "チャンネル名: ひすいこたろうの名言セラピー\n動画タイトル: あなたも持っている、最高の超能力とは？\nURL: https://www.youtube.com/watch?v=_8pIu8QNyvg\n公開日時: 2026-08-05T12:00:30+00:00\n形式: 音楽とナレーションによる短い朗読・解説動画\n\nこの動画は、宮沢賢治の生き方とエピソードを通じて「最高の超能力とは、どんな時も人に優しくできることである」というメッセージを伝える動画です。\n\n【冒頭:賢治の少年時代のエピソード】\n独自の宇宙観を描いた作家・宮沢賢治が子供の頃、「大きくなったら何になるか」と聞かれた際に「何になるかわからない。でも、偉い人だけにはなりたくない。偉い人よりも人のために働く人になりたかった」と答えたというエピソードが紹介されます。\n\n【教師時代のエピソード:0点をつけない賢治】\n賢治が教師をしていた時期、答案用紙に何も書かなくても生徒に絶対に零点をつけず、名前だけ書いても20点を与えていたというエピソードが語られます。その理由として、「例え何もできなくたって、0点の存在などこの世にいないから」という賢治の考えが紹介されます。\n\n【教師を辞めて農民になった理由】\n安定した職である教師を辞めて農民になろうとした際、思いとどまらせようとした校長に対し、賢治が語った言葉が紹介されます。「私はもっと土にまみれて働きたいんです。教師をして生徒たちを立派な農民に育てるのも大切な仕事です。でもそれだけでは本当の農民の苦しみは分かりません。雨が降れば田んぼが流され、日照りが続けば稲の枯れるのをじっと見ている他に何もできない人たち。その人たちのことを思うと、のんびり教師などしていられないんです。その人たちと一緒になって働き、その人たちのために今すぐ役に立ちたいんです。」という言葉が紹介されます。\n\n【母親の口癖】\n賢治の母親の口癖として、「人というものは、人のために何かしてあげるために生まれてきたんです」という言葉が紹介されます。\n\n【賢治こそ最高の超能力者だったという主張】\n宮沢賢治こそ最高の超能力者だったとし、透視能力・テレパシー・念力などどんな能力よりもすごい超能力があるとして、「それはどんな時も人に優しくできること。それこそ最高の超能力です」と語られます。\n\n【賢治が生まれた年の大地震のエピソード】\n賢治が生まれた1896年は、マグニチュード8.2の巨大地震(明治三陸地震)が日本を襲い、2万人以上の死者を出したこと、震源地が賢治の生まれた岩手県東北であったことが紹介されます。賢治はその2ヶ月後という大混乱のさなかに生まれ、それでもあれだけ優しい人に育ったという点が強調されます。\n\n【賢治の言葉の引用】\n「世界が全体幸福にならないうちは個人の幸福はありえない」という宮沢賢治の言葉が紹介されます。\n\n【締めくくり】\n「というわけで今日も頑張ったね。お疲れ様でした。」という視聴者へのねぎらいの言葉で締めくくられます。\n\n【まとめ】\n宮沢賢治の教師時代・農民への転身・生い立ちにまつわる複数のエピソードと言葉を通じて、透視やテレパシーのような特殊な能力ではなく、「どんな時も人に優しくできること」こそが誰もが持ちうる最高の超能力であるというメッセージを伝える動画です。"},
      {"name": "崔の店長日誌。", "isNew": true, "videoTitle": "【お盆】こんなお話を聞すると運が強く良くなります 〜命のバトン〜 / 100日マラソン続〜1946日〜", "videoUrl": "https://www.youtube.com/watch?v=8InQt_KMqF8", "published": "2026-08-08T20:00:31+00:00", "failed": false, "summary": "チャンネル名: 崔の店長日誌。\n動画タイトル: 【お盆】こんなお話を聞すると運が強く良くなります 〜命のバトン〜 / 100日マラソン続〜1946日〜\nURL: https://www.youtube.com/watch?v=8InQt_KMqF8\n公開日時: 2026-08-08T20:00:31+00:00\n形式: 毎日配信の「100日マラソン」シリーズ(1946日目)、店主・崔氏によるトーク配信\n\nこの動画は、お盆の時期にちなみ、ご先祖様の生き方を知ることが自分自身の運を強く良くしていく理由を、自身の祖父母のエピソードと合わせて語る内容です。\n\n【冒頭:近況とテーマ紹介】\n「皆さんおはようございます」という挨拶から、今日が8月9日日曜日であること、最近紹介した「無水カレー」は低カロリーだが美味しくて食べ過ぎると太るので気をつけてほしいという軽い近況話をした後、今日のテーマが「こんな話を聞くと運は強くなるし良くなる」というお盆にちなんだご先祖様の話であることを紹介します。\n\n【裕福な家庭の共通点】\nこれまで多くの人の話を聞いてきた経験から、代々金持ちになったり裕福な家庭で育った人たちは、ご先祖様の話をたくさん聞かされている人が多いという傾向があると紹介します。自分のおじいちゃん・おばあちゃんがどうやって生きてきたかという話をよく聞かされていることが多いとした上で、自身の体験談に入ります。\n\n【祖父母のエピソード:渡日と温泉を掘り当てた祖父】\n自身の父方・母方どちらの祖父も10代で韓国から日本に渡ってきたこと、母方の祖父は渡日時の年齢が14歳だったこと、親に仕送りをするためによその国へ渡り、お金になることは何でもやってきたという苦労話を紹介します。最終的にこの祖父は「そんなところに温泉が出るはずがない」と笑われながらも掘り続け、本当に温泉を当てて多くの人に感謝された人物だったこと、しかしその温泉は大繁盛したにもかかわらず、生活する分ぐらいの利益しか取らず、地域の人たちに貢献することを大切にしていたというエピソードを、後にその仕事を継いだ叔父から聞かされたと明かします。この生き方が「家得(家訓)」として子や孫に伝わっていると語ります。\n\n【なぜご先祖様の話を知ると運が良くなるのか(科学的根拠)】\nご先祖様のストーリーを子供たちや自分たちが知ることで運が良くなり強くなっていくことには科学的根拠が存在するとし、まず「時間軸」という概念が生まれることを説明します。祖父母がいたから父母がいて今の自分がいるというこの時間軸を知ることが、子供にとっても今生きている自分にとっても、アイデンティティを形成する大きなきっかけになると語られます。自分はある日突然現れた1人ではなく、ちゃんとご先祖様がいて自分がいるという時間軸の中に「自分の居場所がある」ということに気づけるのが1つ目のポイントだと説明します。\n\n【困難を乗り越える力への気づき】\n誰もが人生の中でたくさんの苦労や困難を乗り越えてきた過程があり、ご先祖様がそうした障害を乗り越えてきたことを知ることで「自分にもそれを乗り越える力がある」と気づけることが2つ目のポイントだと語られます。祖父母や父母が乗り越えてきたことを知ることで自分自身の家族モデルとして学習でき、自分が困難にぶつかった時「この人が乗り越えてきた以上、私だってきっとできる」という大きなきっかけになると説明します。崔氏自身も20代半ばで借金を抱えるなどの困難を経験したが、祖父母が乗り越えてきたものに比べたら大したことがなかったのかもしれないと思えると振り返り、困難な時でも先祖がそばにいて応援してくれていたのだろうと感じると語ります。\n\n【ご先祖様の生き方から学べること】\n先祖の中には、諦めなかった人、家族を守った人、何度もやり直した人、何度も人に頭を下げた人、人を助けた人などさまざまな生き方があったとし、それぞれが「何のためにそうしてきたのか」を考える中でさらなる気づきがあると語られます。\n\n【核心のメッセージ:私は大切にされていた】\n今この場所に自分がいるという事実、そしてこの国が辿ってきた様々な困難を間違いなく乗り越えてきたご先祖様が自分にも存在したことは間違いないと述べ、父母と疎遠だったり絶縁していたり、家系やお墓が分からなくても大丈夫だと語りかけます。自分のために生きてくれた人たち、命のバトンを継いでくれた人たちがいるということ、何よりも「自分は大切にされていた」ということに気づいてほしいと繰り返し強調します。周りに繋がりがないと感じ孤独を嘆く時があっても、今ここにいるという事実そのものが大切にされていた証であり、大切にされなかった人・愛されなかった人は誰もおらず、全ての存在に価値があることを忘れないでほしいと語られます。\n\n【締めくくり】\n崔氏自身も祖父母や父母の話を聞く中で自分自身が気づかされたことだとし、この乗り越えてきた人たちの力・魂・血が自分の中に流れているということを、自分も子供たちに伝えていると明かします。これは自分が父や母から教えてもらったことであり、自分には乗り越えられない障害はなく、叶えられない夢もない、自分は思った通りに生きていける強大な運を持った人間なんだという自己肯定感の話に繋げ、お盆という日を迎える中でこのことを忘れないようにしようと呼びかけます。最後に恒例の「行きます、行きます、せーの、よっしゃ!」の掛け声で締めくくられます。\n\n【まとめ】\nこの動画は、お盆というご先祖様に思いを馳せる時期に、自身の祖父母(10代で韓国から日本に渡り、苦労の末に温泉を掘り当てながらも私利を求めず地域に貢献した祖父)のエピソードを軸に、ご先祖様の生き方を知ることで「時間軸の中に自分の居場所がある」「先祖が乗り越えてきた困難を知ることで自分にも乗り越える力があると気づける」「自分は大切にされてきた命のバトンの継承者である」という3つの気づきが得られ、それが自己肯定感を高め運を強く良くしていくのだという一貫したメッセージを伝える内容です。"},
      {"name": "UP&UP", "isNew": false, "videoTitle": "【注意】約束を破る人は一発で運気が落ちます。100年栄える人だけが知っている「人生が劇的に良くなる約束」の守り方", "videoUrl": "https://www.youtube.com/watch?v=8BQoyvSd1aU", "published": "2026-08-07T09:00:06+00:00", "failed": false, "summary": "チャンネル名: UP&UP\n動画タイトル: 【注意】約束を破る人は一発で運気が落ちます。100年栄える人だけが知っている「人生が劇的に良くなる約束」の守り方\nURL: https://www.youtube.com/watch?v=8BQoyvSd1aU\n公開日時: 2026-08-07T09:00:06+00:00\n形式: 対談形式のトーク動画(ホストと出演者による会話、動画終盤にイベント告知あり)\n\nこの動画は、個人の天才的な結果には再現性がないのに対し、組織で人を育て結果を出し続けるためには「約束を守らせられるかどうか」がすべてであるという主張を軸に、自分自身との約束を守ることの重要性を、駅伝の名将のエピソードやスピリチュアルな話を交えて語る内容です。\n\n【冒頭:組織づくりと約束の重要性】\nUP&UPのメンバーは「天才」が多く成功に再現性がないと指摘した上で、組織で人を育てて結果を残す環境を作るには「約束を守らせられるかどうか」が最も重要だと語られます。自分との約束が守れないことから自己概念が下がっていくと説明されます。\n\n【青学駅伝・原監督のエピソード】\n箱根駅伝で何度も優勝している青山学院大学の原監督がチーム作りで最も大事にしているのが「約束を守らせること」だというテレビでの発言を紹介。学生寮から外の練習に出る際、下駄箱の名札を「外出中」にして裏返すルールがあり、これを忘れて30km先まで練習に行ってしまった場合でも一度戻ってこなければならず(往復で計90km近くになる)、戻った後は先輩からなぜ守れなかったのかフィードバックを受けるという徹底したルール運用が紹介されます。\n\n【赤信号のスピリチュアルな喩え】\n4回の臨死体験を経てあの世の情報に詳しいという人物の話として、「神様は人が多すぎて全てをチェックできないが、赤信号を守ったかどうかだけは必ずチェックしている」という説を紹介。赤信号を無視すると積んできた徳がゼロに戻り、赤信号を守る人は他の約束も守るようになるという考え方が語られ、実際に横断歩道で信号無視していた外国人観光客のグループを目撃したエピソードも紹介されます。\n\n【自己中心性についての考察】\n約束が守れない根本原因は「自己中」であるとし、自己中心性そのものを否定するのではなく、それを受け入れた上で「利己的」に振れるのではなく「理的」に働かせることで物事がうまく回り出すという原理原則が語られます。\n\n【日々のコツコツとした習慣管理】\niPhoneのメモに「1日5分の読書」「5分のストレッチ」「5分の自己啓発本の音声」「5分の奥さんへの愛情表現」など毎日の習慣目標を記録し、地味に継続していることを紹介。「当たり前のことを特別に熱心に誰もできないぐらいやる」という、以前ある社長から教わった言葉が引用されます。\n\n【自己管理の4分野】\n自分との約束が守れる状態を「自己管理」と定義し、それを「時間管理」「健康管理」「金銭管理」「意識感情管理(ご機嫌でいること)」の4分野に整理。機嫌のいい上司と機嫌の悪い部下どちらについていきたいかは自明であるとし、これらの約束が守れない人が社会的トラブルを起こすと語られます。\n\n【組織の「水質」の比喩】\n会議への遅刻、レポート提出の遅れ、経費精算の遅延など、小さな約束破りが積み重なることで組織全体が「濁った水槽」のようになり、そこに優秀な人材(綺麗な金魚)をいくら入れても弱っていくという比喩が語られます。この「水質」を担保できる経営者でなければ、組織は100年以上長く続かないと説明されます。\n\n【100年企業訪問エピソード】\n100年以上続いている企業を訪問し「どうやって100年続いたのか」を聞き回る活動をしているとし、訪問した企業の経営者は皆「規律」を大切にしていると答えると紹介されます。\n\n【締めくくりの自戒】\n「自分との約束を破り続けて成功できる人がいたらYouTubeを始めた方がいい」というジョークを交え、自分自身も夫婦間の約束(帰宅時間の事前連絡)を守れずに何度も怒られていることを告白し、笑いを交えて締めくくられます。\n\n【告知:マジックモーメント8月27日】\n最後に8月27日開催の3回目のイベント「マジックモーメント」の告知が行われ、約100名のスタッフが連日ミーティングを重ねて準備していること、過去の参加者から「人生が変わった」というメッセージが届いていること、参加者診断で「あなたはどのタイプ」を測定する企画があることなどが紹介されます。\n\n【まとめ】\nこの動画全体を通して語られるのは、「組織で長期的に結果を出すためには、天才的なひらめきや個人の才能ではなく、自分自身や組織内の小さな約束を一つひとつ確実に守り続けることこそが土台になる」というメッセージであり、駅伝の名門チームの厳格なルール運用からスピリチュアルな赤信号の喩え、日々の小さな習慣管理まで、様々な角度から「約束を守ること」の重要性を説く内容です。\n"},
      {"name": "中野優作 / CAR and LIFE.（BUDDICA）", "isNew": true, "videoTitle": "社員の車を愛車メータで査定してみました！トヨタ プリウス編", "videoUrl": "https://www.youtube.com/watch?v=QuflI2_z698", "published": "2026-08-08T10:00:19+00:00", "failed": false, "summary": "チャンネル名: 中野優作 / CAR and LIFE.（BUDDICA）\n動画タイトル: 社員の車を愛車メータで査定してみました！トヨタ プリウス編\nURL: https://www.youtube.com/watch?v=QuflI2_z698\n公開日時: 2026-08-08T10:00:19+00:00\n形式: 短尺の企画動画(社員の愛車を「愛車メーター」という査定アプリで5秒査定するミニコーナー)\n\nこの動画は、BUDDICAの社員が実際に乗っているトヨタ・プリウスを、5秒で査定額が分かるという「愛車メーター」というツールを使って査定し、さらに実際の買取価格も提示するというミニ企画動画です。\n\n【冒頭:企画紹介と車両情報の確認】\n「あなたの車撮影します。愛車メーターというね、5秒で金額が分かる代物があるからこれやるよ」と社員に声をかけ査定企画が始まります。対象の車両は平成28年式のトヨタ・プリウス、グレードはSツーリングセレクション、走行距離は12万7000kmであることが確認されます。\n\n【愛車メーターでの査定結果】\nアプリでの査定額は95万7000円と提示され、社員本人からは「ちょっといまいちやね、もうちょっとつけてほしいよね」という反応が返ります。\n\n【カスタムパーツと購入経緯の確認】\nこの査定額はグレードの詳細までは考慮していないが、車両の状態が良くモデリスタのエアロパーツが装着されていることを指摘。さらにアルパインの社外ナビとデジタルインナーミラーが後付けされていることも確認し、これらを友人から120万円で譲ってもらって購入したという経緯が語られ、「それは安いね、状態もいいよね」とコメントされます。\n\n【実際の買取査定額の提示】\n事故歴がないことを確認した上で、実際の買取価格として110万円という金額が提示され、社員は「いい金額です」と満足の反応を見せます。売却について尋ねられると「売りたい気持ちもあります」と笑いながら答えます。\n\n【今後の見通しに関するアドバイス】\n走行距離がすでに10万kmを超えているため、ここから相場が大きく下がることはないとアドバイス。車検が来年1月に控えていることを踏まえ、そこまで乗っても大きく評価額が変わることはないため、その時期にまた査定に来てほしいと案内して締めくくられます。\n\n【まとめ】\n社員自身の愛車(平成28年式プリウス、走行距離12万7000km)を題材に、アプリ査定(95万7000円)と実店舗での買取査定(110万円)の違いを実演しながら、カスタムパーツの有無や走行距離が査定額に与える影響、そして「走行距離10万km超では相場が大きく下がりにくい」という中古車売買の実務知識を短時間で分かりやすく紹介する内容です。"},
      {"name": "サムの本解説ch", "isNew": true, "videoTitle": "【要約】心配事の９割は起こらない　減らす、手放す、忘れる「禅の教え」", "videoUrl": "https://www.youtube.com/watch?v=mrPf9YpKnL8", "published": "2026-08-08T11:06:13+00:00", "failed": false, "summary": "チャンネル名: サムの本解説ch\n動画タイトル: 【要約】心配事の９割は起こらない　減らす、手放す、忘れる「禅の教え」\nURL: https://www.youtube.com/watch?v=mrPf9YpKnL8\n公開日時: 2026-08-08T11:06:13+00:00\n形式: 書籍要約・解説動画(枡野俊明氏著『心配事の9割は起こらない』を紹介)\n\nこの動画は、実態のない未来の不安や他人との比較に苦しむ現代人に向けて、禅の教えをもとに不安の正体を暴き、それを消し去るための具体的な考え方と行動を解説する内容です。\n\n【冒頭:問題提起】\n明日のミスへの不安、老後のお金への不安、SNSでの他人との比較、職場の人間関係への気疲れなど、まだ起きていない未来やコントロールできないことへの不安で心がいっぱいになっていないかと問いかけます。そうした不安は実は9割が実際には起こらないことが科学的にも2000年以上続く禅の教えからも証明されているとし、私たちは実態のない幽霊のような不安に怯えて人生の貴重な時間をドブに捨て続けていると指摘。その不安を根こそぎ消し去る方法を解説すると予告します。\n\n【著者紹介と目次】\n著者の枡野俊明氏は建功寺の住職でありながら多摩美術大学教授として庭園デザインの講義を持ち、世界が尊敬する日本人100人にも選ばれた実績を持つ人物として紹介されます。目次は「1. 不安の正体はあなたの脳が作り出した妄想である」「2. 頭の中の妄想を焼き尽くす没入の技術」「3. 競争社会の呪縛を解き、不動の心を手に入れる」の3章構成であることが示されます。\n\n【1. 不安の正体はあなたの脳が作り出した妄想である】\n禅の言葉「莫妄想(まくもうぞう)」(余計なことは考えるな、心を曇らせるな)を紹介し、禅で言う妄想とは欲・執着・他人との比較を指すと説明。著者が何千人もの悩みを聞く中で気づいた「人が食事も喉を通らないほど悩んでいることの正体は、実はただの思い込みや取り越し苦労に過ぎない」という事実を紹介し、故事「幽霊の正体見たり枯れ尾花」を引き合いに、私たちは頭の中で不安を勝手に巨大な幽霊に育てあげ、自分1人で怯えているだけだと説明します。妄想を生む原因は2つあるとし、1つ目は他人との比較。ここで「他はこれ我にあらず」(他人の人生は自分と1mmも関係がない)という言葉が紹介され、他人の成功も失敗も自分の価値には無関係であり、比較という無駄な作業を排除するだけで悩みの9割が消滅すると説きます。2つ目の原因は「今を生きていないこと」。過去の後悔や未来への心配で心が今ここにない状態を指摘し、禅の「一期一会」「今ここ」という一呼吸に全力を注ぐ姿勢の大切さを説明します。\n\n【2. 頭の中の妄想を焼き尽くす没入の技術】\n不安を消すために前向きな未来を想像するような一般的な自己啓発とは真逆に、ポジティブな未来すら妄想の一種と捉え、今目の前の作業に100%没入することを勧めます。禅で最も大切にされる言葉として「一掃除二勤行三学問」が紹介され、学問より掃除(目の前の環境を整えるために体を動かすこと)が最も尊いとされることを説明。具体例として、①「今やらないでいつやるのか」というエピソードで、今の仕事に手を抜いて「いつかやりたい仕事が来たら本気を出そう」と考える人は禅の視点では一生輝けないとし、どんな些細な仕事も自分を磨く神聖な修行として100%没入すべきだと説きます。②「置かれた場所を極楽にする」というエピソードで、庭園デザイナーでもある著者の「場所が自分を輝かせるのではない、自分がその場所を照らすのだ」という言葉を紹介し、庭を作る際に石や木の個性を100%受け入れてどう輝かせるかを考え抜く姿勢と同様に、今いる環境を受け入れ自分にできる最高の一歩を踏み出すことで、その場所が黄金のように輝く極楽に変わると説明します。\n\n【3. 競争社会の呪縛を解き、不動の心を手に入れる】\n成果主義のビジネス社会で周りの目や数字に一喜一憂する現代人に対し、著者は「勝っても負けても同じである」という一見驚くようなメッセージを提唱します。勝ち負けにこだわりすぎると手段を選ばなくなる恐ろしい罠にはまると指摘し、禅の言葉「日和天気の如し」(成績が良い時はいい風が吹いているだけ、悪い時は悪い風が吹いているだけで、自分の人間としての価値とは無関係)を紹介。他人という外側の物差しではなく、比べる対象を「昨日の自分」に切り替えることで焦りが消えると説きます。さらにイチロー選手の「努力せずに何かできるようになる人のことを天才と言うなら僕は違う。努力した結果何かができるようになる人のことを天才と言うなら僕はそうだ」という言葉を引用し、他人の才能を羨むより自分にできる努力をコツコツ積み重ねることを勧めます。最後に「おかげ様の循環に入る」という考え方を紹介し、自分1人の力で成し遂げたと思って傲慢になると次に負けるのが怖くなりプレッシャーに押しつぶされるが、全ての結果を周囲の支えのおかげだと受け入れることでプレッシャーから解放され、本来の実力を発揮できる不動の心が手に入ると説明します。\n\n【締めくくり】\n不安の正体は自分が作り出しただの妄想に過ぎないと再確認し、①今ここ・目の前のことに100%没入すること、②勝ち負けの物差しを捨てて自分軸(昨日の自分との比較)で生きることという2つの武器を得たとまとめます。今日から大きく深呼吸をして目の前の小さな一歩に集中することで、心が驚くほど軽くなり景色が黄金のように輝き始めると述べ、視聴者に本の一読を勧めて締めくくられます。\n\n【まとめ】\nこの動画全体を通じて語られるのは、私たちが抱える不安の9割は実態のない脳内の妄想に過ぎず、その原因は「他人との比較」と「今ここに心がないこと」の2つにあるという禅の教えです。目の前の作業や環境に100%没入する「没入の技術」と、勝ち負けの物差しを他人から昨日の自分へ切り替え周囲への感謝(おかげ様)を受け入れる「不動の心」という2つの実践によって、競争や比較に振り回されず心穏やかに生きられるようになるというメッセージで締めくくられています。"},

      {"name": "宋世羅の羅針盤ちゃんねる（そんせらの羅針盤チャンネル）", "isNew": false, "videoTitle": "年収別・毎月の貯蓄額あるある。", "videoUrl": "https://www.youtube.com/watch?v=vq1eS35QhPY", "published": "2026-08-06T12:03:59+00:00", "failed": false, "summary": "チャンネル名: 宋世羅の羅針盤ちゃんねる（そんせらの羅針盤チャンネル）\n動画タイトル: 年収別・毎月の貯蓄額あるある。\nURL: https://www.youtube.com/watch?v=vq1eS35QhPY\n公開日時: 2026-08-06T12:03:59+00:00\n形式: 保険営業マンとしての実務経験に基づくトーク解説動画\n\nこの動画は、9年間保険営業マンとして数多くの顧客と接してきた投稿者「そん」氏が、自身の経験だけに基づく偏見混じりの感覚として、年収・属性別に「実際に毎月いくら貯蓄できているのが平均的なのか」を独身若手から年収2〜3億円層まで段階的に紹介する内容です。\n\n【冒頭:自己紹介と近況】\n今日のテーマが「年収別・毎月の貯蓄額あるある」であることを紹介した上で、自身が保険営業マンを丸9年やっており、副業でモルディブでのグラビア撮影があったことを明かし、際どいところまで解禁したので楽しみにしていてほしいと軽く触れます。仕事柄、毎月新規の顧客といろいろな状況の人に会う中で、金融関係の仕事をしていない一般の人は自分の貯蓄額が世間的に多いのか少ないのか分からないものだと指摘し、それを自身の9年間の経験だけに基づいて偏見交じりに紹介していくという趣旨を説明します。「貯蓄」の定義として銀行預金だけでなく株式・投資信託の積立なども含めた「月に余らせる金額」というイメージだと補足し、教科書的には「手取りの25%が理想」とされるが、実際は年収・状況・家族構成によって大きく変わるとして本題に入ります。\n\n【独身若手男性(手取り20〜30万)】\n毎月5万円貯蓄できていれば「結構優秀」(偏差値63相当)とコメント。投稿者自身はこの時期、貯蓄はゼロどころかマイナスだったと告白します。\n\n【独身若手女性(同水準)】\n同じ手取り水準でも女性は5万円貯蓄している人がより多く(偏差値56相当)、男性より貯蓄している人の割合が高いと説明。理由として、女性の方が現実を見ている、あるいは実家暮らしの割合が多い可能性を挙げます。\n\n【独身男性(手取り40万、年収700〜800万)】\n仕事もバリバリで手取り40万をもらう30歳前後の独身男性は、意外にも月2万円程度しか貯蓄していないと説明。理由として、この層は「余らせよう」という意識自体がまだ薄く、結婚してから資産形成を考え始める人が多く、今はまだ「翼を広げたい」時期であるためだとし、逆に言えばこの年収帯で資産形成を意識している時点で偏差値が跳ね上がるとコメントします。\n\n【独身女性(手取り40万)】\n同水準の女性は対照的に月12万円貯蓄しているとし、男女で「お金を余らせる」意識の差が大きく出る層だと説明。男性は「俺はこんな大手で稼いでいる、優秀だ」という自己主張が強い一方、女性はこの層でも「調子に乗っていない」謙虚な人が多く、会社への感謝の気持ちが強い傾向があると分析します。\n\n【若手共働き夫婦(通称「フレッシュハッピーセット」、世帯手取り54万=夫32万・妻22万、世帯年収780万)】\n「妻の手取り22万がそのまま丸々貯蓄になっている」という思い込みが一般的だが、実際にはそれより少なく、偏差値50ラインは月15万円だと説明。旅行や贅沢で月7万円程度使ってしまい、22万から15万程度に落ち着くのが実態だといいます。\n\n【年収3000万クラス(手取り月150〜200万、個人事業主・経営者層)】\nこのクラスは月70〜80万貯蓄していそうなイメージがあるが、実際は月20万円程度しか貯蓄していないと説明。理由として、成功者としての自負や、後輩への奢りなど交際費が増えることを挙げ、この層は「貯蓄割合が最も低い層」であり、年間の貯蓄額で見ると前述のフレッシュハッピーセット夫婦とさほど変わらないことがある、という意外な比較ポイントを提示します。\n\n【年収5000万〜1億クラス】\n月150万円貯蓄できていれば「かなり優秀」で、年間換算で1800万円の資産増加に相当すると説明。年収の半分が税金で持っていかれる上、生活水準も高い(高級住宅、高級車、グリーン車移動、夜の飲み)ため、これでも優秀な部類だとします。さらに興味深い点として、年収6000万の人と年収1億の人(収入で4000万円の差)でも、年間の余剰資産額はほとんど変わらない(優秀な人で1800万円前後、使う人だと300万円程度)ことを指摘し、これを「宇宙の物理法則」に例えて表現します。理由として、この層の「ちょっとした贅沢」の単位そのものが大きく(ホテルのグレードアップで数十万円単位など)、年収が上がるにつれて贅沢の「選択回数」が増えるだけで、結果的に残る金額は変わらないと説明します。年収の増分ごとの余剰額の変化についても、1000万→2000万や2000万→3000万は差が出るが、3000万→5000万は大きく変わり、5000万→8000万・8000万→1億はほとんど変わらないという傾向を整理します。\n\n【超番外編:年収2億〜3億クラス】\n年収1億の人が年間1800〜2000万円程度しか余らせないのに対し、年収2億の人は年間6000万円も余らせるようになり、ここで一気に差が広がると説明。人間が無理なく使える金額の上限は月120万円程度、その次のバーが月350〜400万円程度で、それ以上を継続的に使う人はほとんど見たことがない(夜の街に極端に使う一部の例外を除く)と語ります。\n\n【締めくくり】\n最後に、物理法則の話から漫画で読んだ相対性理論の話を思い出したが全く意味が分からなかった、という軽いオチで締めくくられます。\n\n【まとめ】\nこの動画全体を通じて語られるのは、「年収が上がれば貯蓄額も比例して増えるわけではなく、年収帯によって『余らせる意識』の有無や生活水準のインフレの度合いが大きく異なり、特に年収3000万〜1億円のレンジでは贅沢の単位が大きくなるだけで実際に残る金額はほとんど頭打ちになる」という、実務経験に基づいた具体的な数字を交えたリアルな金銭感覚の解説です。"},
      {"name": "BUDDICAの中野クン", "isNew": false, "videoTitle": "『ビッグモーター創業者と言ってること一緒』過去最大にキツかったハナテン時代を振り返る中で、中野優作が明かした中古車業界への想い", "videoUrl": "https://www.youtube.com/watch?v=TjuWiDAIL8s", "published": "2026-08-07T10:00:17+00:00", "failed": false, "summary": "チャンネル名: BUDDICAの中野クン\n動画タイトル: 『ビッグモーター創業者と言ってること一緒』過去最大にキツかったハナテン時代を振り返る中で、中野優作が明かした中古車業界への想い\nURL: https://www.youtube.com/watch?v=TjuWiDAIL8s\n公開日時: 2026-08-07T10:00:17+00:00\n形式: 焼肉店での同窓会形式の対談配信(旧・花店(ハナテン)出身メンバー6名による座談会、フィクション建前でのぶっちゃけトーク)\n\nこの動画は、BUDDICA代表・中野優作氏が10年ぶりに商売として大阪に戻ってきたことを記念し、10年前に中古車販売会社「花店」がビッグモーターにM&Aされた際、買収する側(中野含む本部メンバー)と買収された側(旧花店社員)としてぶつかり合った当時のメンバー6名を集め、「全部フィクション」という建前のもと、給料未払い事件・断捨離・琵琶湖事件などの当時の裏話を忖度なく語り合う内容です。\n\n【冒頭:大阪襲来と乾杯】\n「10年ぶりに開拓ということで乾杯」からスタート。8月8日に大阪堺支社をオープンするために大阪へ「商売で」戻ってきたのは10年ぶりであることを明かし、大阪への強い思い入れを語ります。中野氏は10年前、全職(ビッグモーター)時代の最後の仕事として、大阪にあった花店をM&Aした子会社を再生させる仕事を担当し、「捏造も痛めてしびれるような血の滲む思いで」働いた過去があると振り返り、当時の魂を燃やした話を聞きたい人が多いだろうと考え、当時のメンバーを大阪に集めて特別会を開いたという企画趣旨が説明されます。「今日は忖度なしで昔の思い出話、ブラック話、パワハラ話を話していきましょう」「全部フィクションということで」という前置きのもと、焼肉を食べながらの座談会が始まります。\n\n【メンバー紹介】\n6人でのメンバー紹介が行われます。①辻さん(車屋22年目、中野が入社時に一発目にロープレをしてくれた師匠的存在で、後に立場が逆転し中野が店長として辻さんをロープレする関係になった、現在は九州エリアマネージャー)、②長尾さん(社員番号1692、中野とほぼ同期で当時ライバル視されていた、四国のトップセールスで現在は関西エリアマネージャー)、③森浦さん(元リクルート出身で「自称バリトンボイス」、彦根のトップセールスから奈良原の店長に抜擢された人物)、④大久保さん(花店側の新卒2年目社員としてM&Aを経験、その後独立して京都で中古車業を営み、中野のコミュニティに突然現れて再会した特別ゲスト)、⑤内藤さん(兵庫県のストライキが起きた店舗の店長代理を経て店長となった人物)、そして中野優作氏本人の6名です。\n\n【買収発表の経緯:中野視点】\n中野氏はM&Aの実施を2016年10月頃、社長から電話で「トップシークレット」として直接告げられていたと明かします。当時は嬉しさもありつつ「これは1年ぐらいで潰されて辞めることになるんだろうな」と考えていたとし、橋本徹氏が「ピンチヒッターとして大阪を立て直し、嫌われて出ていく」と語っていた話を引用し、自分も同じ立場だと感じていたと振り返ります。当初は4月1日の全社集会で発表される予定だったが、正月の初売りで花店側が好調な数字(3日で50台)を出したことに本部が激怒し、急遽1月に発表・実行が前倒しになったという裏話が語られます。\n\n【買収された側の視点】\n各メンバーが当時をどう受け止めたかが語られます。森浦さんは店長から「吸収されるでみたいな」トップダウンで知らされ、店内は「ファイティングポーズが上がっている」戦闘的な雰囲気だったと振り返ります。大久保さんは新卒2年目で入社説明会は「花店」だったのに入社時にはすでに看板が「ビッグモーター」に変わっていたという経験を語り、「わけわからんまま」だったものの、株を持っていたため買収時に価格が1.3〜1.5倍になり「よっしゃ」という気持ちもあったと明かします。辻さんは当時店長をしており、いきなり「移動できる」と言われ、行き先も分からないまま「とりあえず行ってみよう」という状態だったと振り返ります。\n\n【断捨離事件】\n中野氏は花店の店舗に「もう仕事にならないから断捨離します」と宣言し、20年使い込まれたテーブルやリサイクルショップで買った椅子などを全て入れ替えたことを明かします。その際、赤い太字の「びっくりマーク」付きの通達文で「このテーブルは前提として片付けてください」といった指示を出し、現場からは「圧力をかけられ、辞めさせようとしているのか」と受け取られ、みんな身構えていたと森浦さんが振り返ります。\n\n【給料未払い事件(1回目・2回目)】\n給料日に給料が無告知で振り込まれないという事件が2ヶ月連続で発生したことが語られます。1回目の際、中野氏は500人規模の問い合わせ対応に忙殺され、本社に激怒の電話をかけに行ったと振り返ります。2回目の際は現場の店長たちから「わざとやってるんだろう」と激しく詰められ、中野氏は自分が出世レースに乗ったことへの妨害だと自責的に思い込んでいたとし、レジからお金を出して立て替え払いをするよう店舗に指示するなど現場対応に奔走し、裏の駐車場でうずくまるように座り込んでいたと明かします。辻さんも自身が赴任した店舗で初日から給料未払いに遭遇し「皆さんよろしくお願いします」と挨拶しても誰も返事してくれなかったという経験を語ります。\n\n【文化の違いと環境改善】\n花店では小さな透明テーブルに灰皿が置かれ、お客さんと堂々とタバコを吸いながら商談するのが当たり前だった文化や、Excelが1店舗1台のPCにしか入っていなかった、LINEのダウンロード率が半分程度だったといった当時のITリテラシーの低さが語られます。一方で、深夜1〜2時までの残業が当たり前だった花店の労働文化に対し、ビッグモーター側が「ちゃんと帰る」文化を持ち込み、生産性を上げながら労働時間を下げる方針を導入したことが、良かった変化として紹介されます。中野氏自身は当時「ブラックなロード」をかけていたのは自分の采配のミスだったと振り返ります。\n\n【琵琶湖事件】\n花店で最も売れていた店舗(琵琶湖店)には「触らない方がいい」と言われていたが、いよいよ本部として介入した瞬間、店の営業5人全員が「辞めます」と言いに来たという事件が語られます。緊急事態を受け、中野氏は西日本の元先輩・レジェンドたちで構成する「ドリームチーム」を自ら招集し、10人を集めて2日間で50台を売り切るという結果を出し、これによって現場の空気が一変し「圧倒的な実力」を見せつけたことが店舗全体の風向きを変えたと振り返ります。\n\n【鉄砲(空注文)問題と和歌山事件】\n当時本部のメンバーは、売れていない店舗に配属されると自分の評価のために「鉄砲(実際には成約していない架空の契約)」を上げさせられていたという裏事情が明かされます。中野氏はこの慣行に反対し、最終日報と2ヶ月後の実際の納車数を突き合わせて実数を可視化しようとしたところ、和歌山店に無断で本部の別部長が突然乗り込み、事前にクラウド上で見えていたホット案件(成約確度の高い商談)7件に鉄砲を積んで「20台売れた」というレコードを演出したという事件が起きたことが語られます。この結果、翌週の店長会で和歌山店の順位が急落し、中野氏は「値引きと鉄砲を止めたらこうなる」と反論し、注文書を全てリストアップして実態を社長に報告、この件が人事につながったという裏話が明かされます。この一連の出来事の中で、中野氏が人前で初めて涙を流したエピソードにも触れられ、当時支えてくれたのが長尾さんだったことが語られます。\n\n【辻さんとの「君いいね」エピソード】\n中野氏が新人営業だった頃、当時店長だった辻さんにロープレをしてもらい「君いいね」と言われたことが今も語られる思い出として紹介されます。辻さんは四国のトップセールスとして「登り龍」と呼ばれるほどの実績(1人で1日78台に及ぶ生産性)を上げていた伝説の存在で、中野氏は休みを使って辻さんの店に見学に行ったり、辻さんが監修したDVDを購入して勉強していたと振り返ります。辻さんが花店に転職した後、中野氏がビッグモーター側からその活躍を聞き、声をかけるのが遅れたことを辻さんから「はよ言ってくれたら」と指摘されたことも紹介されます。\n\n【各メンバーがバディカに来た理由】\n内藤さんは、中野氏のYouTubeを誰よりも見ており本も読んでいたと大久保さん経由で紹介され、一度考える時間をもらったものの実際には一晩で即決したことを明かします。大久保さんは中野氏のYouTubeに憧れて独立を志し、中野氏に近づくのが一番早いと考えてニュートラル(コミュニティ)に参加したと語ります。森浦さんは元部下からの紹介で連絡が来て「やめるんやろ」という中野氏の勘違いから始まり、転勤続   // 既読管理: サーバー側の new_in_last_check は「前回チェックと比較して動画が
  // 変わったか」しか表さず、自動チェックが1回でも走るとリセットされてしまう。
  // 実際にユーザーが読んだかどうかはこのブラウザの localStorage で別管理する。
  const READ_KEY = "ytChecker.readVideoUrls";

  function loadReadSet() {
    try {
      const raw = localStorage.getItem(READ_KEY);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch {
      return new Set();
    }
  }

  function markRead(videoUrl) {
    const set = loadReadSet();
    set.add(videoUrl);
    // 肥大化しすぎないよう直近200件に丸める
    const arr = Array.from(set).slice(-200);
    localStorage.setItem(READ_KEY, JSON.stringify(arr));
  }

  function relTime(iso) {
    const then = new Date(iso).getTime();
    const now = Date.now();
    const diffMs = now - then;
    const min = Math.floor(diffMs / 60000);
    if (min < 60) return `${Math.max(min, 0)}分前`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr}時間前`;
    const day = Math.floor(hr / 24);
    if (day < 30) return `${day}日前`;
    const mon = Math.floor(day / 30);
    return `${mon}ヶ月前`;
  }

  function render(data) {
    const list = document.getElementById("channelList");
    list.innerHTML = "";
    const readSet = loadReadSet();
    let unreadCount = 0;

    // 未読(新着)のチャンネルを上に、既読/変化なしを下に並べる。
    // 同じグループ内では元の(state.json の)並び順を保つ(安定ソート)。
    const sorted = data.channels
      .map((ch) => ({
        ch,
        isUnread: !!ch.summary && !readSet.has(ch.videoUrl),
      }))
      .sort((a, b) => Number(b.isUnread) - Number(a.isUnread));

    sorted.forEach(({ ch, isUnread }) => {
      if (isUnread) unreadCount++;

      const li = document.createElement("li");
      li.className = "channel" + (isUnread ? " is-new" : "");

      const chip = document.createElement("span");
      chip.className = "chip" + (isUnread ? " is-new" : "");
      chip.textContent = ch.failed ? "取得失敗" : (isUnread ? "新着あり" : "変化なし");

      const name = document.createElement("div");
      name.className = "channel-name";
      name.textContent = ch.name;

      const video = document.createElement("a");
      video.className = "video-title";
      video.href = ch.videoUrl;
      video.target = "_blank";
      video.rel = "noopener noreferrer";
      video.textContent = ch.videoTitle;

      const meta = document.createElement("div");
      meta.className = "meta" + (ch.failed ? " fail" : "");
      meta.textContent = ch.failed ? "前回チェック失敗" : `公開: ${relTime(ch.published)}`;

      li.append(chip, name, video, meta);

      if (ch.summary) {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "summary-toggle";
        toggle.textContent = isUnread ? "▸ 詳細な要約を読む(未読)" : "▸ 詳細な要約を読む";

        const body = document.createElement("div");
        body.className = "summary-body";
        body.textContent = ch.summary;

        toggle.addEventListener("click", () => {
          const open = body.classList.toggle("open");
          toggle.textContent = open ? "▾ 要約をたたむ" : "▸ 詳細な要約を読む";
          if (open && isUnread) {
            markRead(ch.videoUrl);
            chip.textContent = ch.failed ? "取得失敗" : "変化なし";
            chip.classList.remove("is-new");
            li.classList.remove("is-new");
          }
        });

        li.append(toggle, body);
      }

      list.appendChild(li);
    });

    document.getElementById("sumNew").textContent = unreadCount;
    document.getElementById("sumIdle").textContent = data.channels.length - unreadCount;
    document.getElementById("sumTotal").textContent = data.channels.length;

    const dot = document.getElementById("updatedDot");
    const text = document.getElementById("updatedText");
    dot.classList.toggle("live", unreadCount > 0);
    text.textContent = `最終チェック: ${relTime(data.checkedAt)}`;
  }

  render(CHANNELS_DATA);
</script>
