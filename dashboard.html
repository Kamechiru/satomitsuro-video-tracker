    channels: [
      {"name": "さとうみつろう", "isNew": false, "videoTitle": "「1問でペットボトル1本」AIが世界の水を奪い始めた", "videoUrl": "https://www.youtube.com/watch?v=ZVAOq9ZCIvc", "published": "2026-08-22T08:55:06+00:00", "failed": false, "summary": "チャンネル名: さとうみつろう\n動画タイトル: 「1問でペットボトル1本」AIが世界の水を奪い始めた\nURL: https://www.youtube.com/watch?v=ZVAOq9ZCIvc\n公開日時: 2026-08-22T08:55:06+00:00\n形式: 単独トーク解説動画(AIと水資源問題について、電力会社出身の知識を交えて解説)\n\nこの動画は、ChatGPTなどのAIへの質問1回がペットボトル1本分の水を消費するという事実をきっかけに、AIの普及が世界的な「水の奪い合い」を引き起こしている実態と、その解決策としてイーロンマスクが構想する「宇宙AI」計画までを解説する内容です。\n\n【冒頭:AIが水を飲むという衝撃の事実】\nChatGPTに恋愛相談や道案内など簡単な質問を10秒間するだけで、ペットボトル1本分(500ml)の水が消費されると紹介。AIは思考する際に大量の熱を出し、その排熱をクーリングタワーで水を使って気化熱により逃がしているためだと説明する。2025年に北米大陸でAIを冷やすためだけに使われた水は1兆Lにのぼり、人間が1年に飲む水(730L)換算で13億人分に相当すると衝撃データを紹介する。\n\n【AIと人間のエネルギー効率比較】\n元電力会社勤務だった経験を踏まえ、人間の脳が動くのに必要な電力は約20W(体全体で100W)であるのに対し、AIのGPUクラスターはMW級の電力を使うと説明。水の消費量も人間よりAIの方が580倍多く、電気は3000倍多いと試算し、人間が減りAIが増える社会は水と電気の奪い合いに直結すると指摘する。\n\n【AIチップの製造構造と水消費】\nGPUを設計するのが世界一の時価総額を誇るNVIDIA(アメリカ)、実際に製造するのが台湾のTSMCのみであることを説明。半導体の回路線幅が現在2nmまで微細化していることに触れ、TSMCの工場では地下水などを純水化してウェハーを洗浄するために1日数万トンの水を使うと紹介。この水使用が原因で工場建設に対する地元の反発が起きていることや、熊本に新設中のTSMC工場、震災に見舞われた熊本への「笑わボランティア」活動にも触れる。日本政府が対抗して千歳に設立した国産半導体会社「ラピダス」も同様に大量の水を使うと説明する。\n\n【イーロンマスクの宇宙AI構想】\n水と電力問題を同時に解決する策として、イーロンマスクが宇宙空間にAIのデータセンターを建設する「AI1」構想を提唱していることを紹介。宇宙では太陽光で電力を得られ、パネルを広げて赤外線放射で熱を宇宙space に逃がせるため水が不要になるとし、2028年までに100万機の衛星投入を計画していること、既に1万機飛んでいるスターリンク衛星よりも技術的に単純だというマスクの発言を紹介する。\n\n【宇宙AI構想への懸念】\n筆者自身の懸念として、衛星1機の打ち上げで電離層に穴が開くことが研究で分かっており、100万機を5年運用すると仮定すると1日550機が落下・再突入する計算になり、毎日550箇所で電離層に穴が開くことになると指摘。さらにアルミの粉が撒かれることで地球固有の周波数(シューマン共振、7.83Hz)が変化してしまう可能性にも言及する。\n\n【締めくくり:人間の効率性とAIの限界】\n人間の体内にあるATP合成酵素(合成モーター)はエネルギー効率100%を実現しており、これは生物が38億年かけて進化させたものであるため、AIが同等の効率に達するには同じく長い年月がかかるだろうと自説を述べる。発電から送電、AIの計算に至るまでのエネルギーロスの大きさを指摘し、人間が減りAIが増える社会は手放しに喜べるものではないと述べる。NTTが研究する光を使った集積回路など抜本的な技術革新がない限り、日本のような水資源国はますますAI関連企業に狙われると警鐘を鳴らして締めくくる。\n\n【まとめ】\nこの動画は、AIへの何気ない質問がペットボトル1本分の水を消費するという身近な事実から出発し、AI冷却・半導体製造にまつわる莫大な水消費の実態、イーロンマスクの宇宙AI構想とそのリスク、そして人間の持つエネルギー効率の高さを対比させながら、「AIの急速な普及は水と電力をめぐる世界的な奪い合いを引き起こしており、その代償を私たちはまだ十分に理解していない」という一貫したメッセージを伝える内容です。"},
      {"name": "トーマスガジェマガ", "isNew": false, "videoTitle": "【まだ折り畳みスマホを愛せない理由】コスパ最悪【Galaxy Z Fold8】", "videoUrl": "https://www.youtube.com/watch?v=bfMrNqAK0vY", "published": "2026-08-26T11:31:41+00:00", "failed": false, "summary": "チャンネル名: トーマスガジェマガ\n動画タイトル: 【まだ折り畳みスマホを愛せない理由】コスパ最悪【Galaxy Z Fold8】\nURL: https://www.youtube.com/watch?v=bfMrNqAK0vY\n公開日時: 2026-08-26T11:31:41+00:00\n形式: 単独トーク解説動画(ガジェットレビューチャンネル。折りたたみスマホをまだレビューしていない理由を自問自答形式で語る内容)\n\nこの動画は、話題の折りたたみスマホ「Galaxy Z Fold8」シリーズを技術的には市場最高と絶賛しつつも、「コストパフォーマンスが最悪」という理由から自分がまだ折りたたみスマホをレビューしていない、そして今後もレビューする予定がないことを論理立てて説明する内容です。\n\n【冒頭:結論の提示】\n折りたたみスマホを1台もレビューしていない理由をそろそろ説明した方がいいと考え、今回はコスパが最悪だからという結論を先に提示。\n\n【Galaxy Z Fold8のスペック紹介と絶賛】\n最近話題のGalaxy Z Fold8は、閉じた状態は縦が短く開くと横に非常に長いという、写真・漫画・動画の視聴に特化した比率を採用していると紹介。9月に発表されるとされるiPhoneの折りたたみモデルにも影響を与えたとされるサムスンへの液晶パネル大量発注の噂にも触れる。フォールド8は薄さ4.5mm、ウルトラは4.1mmでありながら重量201g/215gという、開閉機構があるにもかかわらずiPhone並みの軽さを実現している点、CPUはスナップドラゴン8エリート級、メモリ・ストレージも妥協なし、薄いのに20Wの無線充電にまで対応している点を挙げ、「全てのスマホの完全上位互換であり市場最高のスマホ」と高く評価。車で言えばレクサスLMのようなラグジュアリーな最高ランクの存在だと表現する。\n\n【コスパ最悪という結論の理由:価格】\n皮肉にもこのレクサスLMと同じ理由でコスパが最悪だと指摘。価格は27万円〜30万円からで、「憧れるけど買えない」という価格の妥当性の問題を抱えていると説明。自分自身はそもそも20万円のスマホですら高いと感じる派であり、現在のスマホ市場は「外れなしのバーゲンセール状態」で、14万円のGalaxy S26でも8万円のPixel 10Aでも基本的にできることは同じであるため、20万円を超えるスマホに払う価値はないと持論を展開する。\n\n【折りたたみである必然性への疑問】\n「大画面が開けて嬉しい」という折りたたみスマホの魅力について、自分ならではの切り返しを展開。もし本当に大画面を求めているなら、日常的にタブレットを持ち歩いているはずだが実際は持ち歩いていない人が多く、これは「大画面はあれば嬉しいが、タブレットを持ち運ぶほどの必要性はない」という程度のニーズであることの証拠だと指摘。折りたたみスマホは「普段はスマホ、必要な時だけ大画面」という都合の良さを提供するが、その利便性に13万円(Galaxy S26との価格差)を払う価値があるかは疑問だと述べ、「レクサスLMを選ばない理由と全く同じ」で、400万円のノアでも普通に走れるのと同様、14万円のスマホで足りるなら14万円で良いと結論づける。\n\n【スマホOSというもう一つの弱点】\n折りたたみスマホの最大の弱点として、大画面があってもスマホOS(AndroidもiOSも)ではコンテンツ消費しかできないことを挙げる。高額を払っても「遊びの質が上がるだけ」で贅沢品の域を出ないと指摘。一方でパソコンは30万円を投資してクリエイティブな仕事で回収できる可能性があるため、高額でも納得できると対比させる。\n\n【最近のスマホ値上げが追い風になっている側面】\niPhone 17 Proの価格が購入時18万9800円から現在19万4800円に値上がりしていることに触れ、この物価高騰により「iPhone最上位モデルを買うくらいなら折りたたみスマホを買えばいい」という誤解が生まれやすくなっている側面があると指摘しつつも、これは折りたたみスマホが手頃になったのではなく、単にiPhoneが高すぎるだけだと釘を刺す。\n\n【リセールバリューの弱さという致命的な欠点】\n27万円もするにもかかわらず出口戦略(資産価値)が弱い点を大きな欠点として指摘。メルカリでは液晶が液漏れしたジャンク品が多数出回っており、iPhone 17 Proなら18万円で買って19万4800円で売れる「実質無料ロジック」が折りたたみスマホでは通用しないと説明。サムスンの追加保証(約4万円で2年間、1回目の修理1.5万円、2回目2万円)を含めると最低31万円かかることにも言及する。\n\n【デザインコンセプトへの疑問】\n横長を売りにするあまり、スマホアプリやWebブラウザが最適化されている縦長の普段使いの体験を犠牲にしているGalaxy Z Fold8のコンセプト自体にも違和感を示す。\n\n【まとめと今後の展望】\n折りたたみスマホの課題は「コスト」と「OS(コンテンツ消費専用である点)」に集約されると総括。9月に噂されるiPhoneの折りたたみモデルも同じ課題を抱えているだろうと予想し、iPadとの共食いを避けたいApple側の事情にも触れつつ、Appleとして何らかの対抗策を示す必要があると予想する。最終的に「iPhone miniと同じ運命(需要が振るわない)を辿るのではないか」と予想して締めくくる。\n\n【まとめ】\nこの動画は、技術的には「市場最高のスマホ」と認めるGalaxy Z Fold8シリーズを、価格の妥当性・スマホOSの限界・資産価値の弱さという3つの観点から冷静に分析し、「折りたたみスマホは魅力的な体験を提供するが、その体験に対して現状の価格(27万円超)を払う合理的な理由は見出せず、レビューする価値すら感じられない」という一貫したコスパ批判のメッセージを伝える内容です。"},

      {"name": "崔の店長日誌。", "isNew": true, "videoTitle": "明日は何色にする？/ 100日マラソン続〜1967日〜", "videoUrl": "https://www.youtube.com/watch?v=DLyk7h0Pyks", "published": "2026-08-29T20:00:22+00:00", "failed": false, "summary": "チャンネル名: 崔の店長日誌。\n動画タイトル: 明日は何色にする？/ 100日マラソン続〜1967日〜\nURL: https://www.youtube.com/watch?v=DLyk7h0Pyks\n公開日時: 2026-08-29T20:00:22+00:00\n形式: 毎日配信「100日マラソン」シリーズ(1967日目)、店主・崔氏によるトーク配信\n\nこの動画は、8月30日(月曜日)から新しい1週間が始まるタイミングに合わせて、どんな色の服やワンポイントを身につけるかによって心理状態や周囲からの印象、ひいては「運の流れ」が変わるということを、心理学の知見を交えながら色ごとに具体的に解説する内容です。\n\n【冒頭:金曜夜のライブ配信の感想】\n8月30日日曜日の配信であることを伝えた後、金曜の夜に脳科学とコーチングのスペシャリストである南山孝樹氏が深夜にライブ配信をしていたエピソードを紹介。夜中の配信はメモが止まらなくなるのでやめてほしいと冗談を言いつつも、全ての話を聞き終えて「あんたほんまに脳科学の宝石箱や」と感嘆したと振り返る。\n\n【本日のテーマ導入】\n本日のテーマは「明日は何色にする？」であると紹介し、月曜日という新しいスタートのタイミングでどんな色を身につけるかによって流れが大きく変わるという話をしていくと予告する。\n\n【コメント欄の反響と車の色の話】\n前日に洋服の色についての話をしたところ、コメント欄に「この動画を見るようになって明るい色の服を着るようになった」という声が多数寄せられたことを紹介。視聴者から寄せられた「車の色は?」という質問に対し、車の色に運の意味合いは特にないが、自身の母からは「絶対に白にしろ」と言われていたと明かし、その理由は夜でも目立つため人に気づかれやすく、周りからも見られやすいからだと説明する。\n\n【色と運の関係についての心理学的な前提】\n赤は勝負運、ピンクは恋愛運といった話がよくあるが、色を身につけることで運が科学的に上がるという根拠は「全く」ないと明言。ただし、色によって感情の覚醒度合いや他者からの印象・受け取られ方が変わることは心理学で研究され続けている事実であり、色が自分の心理状態や行動に影響し、それが人からの印象を変え、結果として流れが変わることを総合して「運が変わる」と言われているのだと解説する。\n\n【固定観念への反論】\n「この色は自分に似合わない」「ピンクの上下は恥ずかしい」という感覚は完全な固定観念にすぎないと指摘。街でピンクを着ている人を見ても「恥ずかしい」とは思わず、むしろ「今日は良いことがあるのかな」「デートかな」と好意的に受け取ることが多いはずだとし、周りの人は思っている以上に他人に興味がないので、気にせず好きな色を身につけていいと勧める。\n\n【目的別・色ごとの解説:赤】\n勝負の日は赤、という考え方は心理学的にも間違いではないとし、赤は活動性・強さの象徴・覚醒・刺激・身体的魅力を指す色だと説明。自分のスイッチを入れたい、やる気を出したい時に、スカーフやネクタイ、靴下などワンポイントで、かつ目につく場所に取り入れるのがおすすめだとし、「覚醒」とは自分の中でまだ眠っている能力や感覚が新たに目覚めることを意味すると補足する。\n\n【目的別・色ごとの解説:ピンク】\nピンクは心理学的には「恋愛運」というより「人との距離を縮める色」であり、柔らかさ・優しさ・親しみやすさを表すイメージだと解説。悪い印象で受け取られにくい色であるとし、たとえ話としてビートたけしの映画「アウトレイジ」に出てくる強面の男たちが全員ピンクのスーツを着て会議をしていたら話が全く入ってこないだろうと想像を語り、色が人物の印象そのものに与える影響の大きさを示す。\n\n【目的別・色ごとの解説:白】\n白は基本的に「新しいスタートの色」であり、何かを新しく始める日や、神社への「一日参り」の日などに結びつけられる色だと紹介する。\n\n【目的別・色ごとの解説:オレンジ】\n仕事運によく結びつけられる色としてオレンジを紹介。エネルギー・活発さ・楽しさに加え、赤の「覚醒」よりもさらに高い「高覚醒」をもたらし、自分自身の意識をより高いところで目覚めさせる色だと説明。ポジティブな感情と結びつきやすいため、頑張りたい時や動きたいのに動けない時にもおすすめだとし、営業・接客・イベント・交流会でのワンポイント使いを提案。自身が師匠から仕事運について最初に教わった色でもあり、実際に経営する飲食店の制服を基本的にオレンジにしていたエピソードを明かす。\n\n【目的別・色ごとの解説:黄色】\n元気そのものがある時よりも、「元気が欲しい」「今日はなんとなくだるい」と感じる時に身につけるとよい色として黄色を紹介。幸福・明るさ・楽観性との関連が言われている色であり、気分が乗らない日や明るく過ごしたい日にどこかに取り入れると効果があると説明する。\n\n【目的別・色ごとの解説:緑】\n「万能の色」として緑を紹介。自然・調和・安定・安心・平和を指す色であり、穏やかに過ごしたい日や、人間関係を円滑に回していきたい場面で重要な色になると説明する。\n\n【目的別・色ごとの解説:水色・ブルー系】\n商談や会議などで使われることの多い色としてブルー系を紹介。冷静さや知性を指す色であり、感情的になりたくない時や、冷静さ・信頼感を示したい時におすすめだと説明。ここまでの色を踏まえ、大舞台や発表の際の「勝負服」としては赤・オレンジ・ピンク・緑・水色など目的に応じて使い分けられることに触れる。\n\n【目的別・色ごとの解説:黒】\n最後に黒を紹介し、黒が悪い色というわけではなく、色は偏らせずいろいろ使い分けることが重要だと前置き。黒は集中力・威厳・重圧感、そして「守る」という意味合いを持つ色であり、他人の影響を受けたくない時に自分を守るために身につけられることがあると説明。自身のイメージとして、田舎のヤンキーが黒い服で統一していることが多いのは、実は彼らが素直で純粋、それゆえに臆病な部分があり、自分をいかつく見せることで守ろうとしている表れではないかと自説を語る。\n\n【締めくくり】\n色を1つ、ワンポイントだけ身につけることを意識するだけでも流れが変わるきっかけになると強調し、月曜日から皆が何色を身につけるかを今から考えてみてほしいと呼びかけて、元気よくガッツポーズで締めくくる。\n\n【まとめ】\nこの動画は、色を身につけること自体に科学的に運を上げる根拠はないとしながらも、色が人の心理状態・行動・他者からの印象に与える心理学的な影響を、赤・ピンク・白・オレンジ・黄色・緑・水色・黒という具体的な色ごとに解説し、「月曜日という新しいスタートにどんな色を選ぶかという小さな一歩が、気分や行動、そして人生の流れそのものを変えるきっかけになる」という一貫したメッセージを伝える内容です。"},
      {"name": "UP&UP", "isNew": false, "videoTitle": "今の時代、AIとの付き合い方を学ばないと『マジ』で損します。仕事の8割が消える時代に「一生貧乏」になる人の特徴", "videoUrl": "https://www.youtube.com/watch?v=SAMQHa5drV8", "published": "2026-08-28T09:00:06+00:00", "failed": false, "summary": "チャンネル名: UP&UP\n動画タイトル: 今の時代、AIとの付き合い方を学ばないと『マジ』で損します。仕事の8割が消える時代に「一生貧乏」になる人の特徴\nURL: https://www.youtube.com/watch?v=SAMQHa5drV8\n公開日時: 2026-08-28T09:00:06+00:00\n形式: 複数講師による対談形式のトーク配信(AI・ロボットが仕事を奪う未来社会について語り合う内容。イベント「マジックモーメント」の宣伝も含む)\n\nこの動画は、AI・ロボットの急速な進化によって今後7年ほどで仕事の8割がなくなるとされる中、それでも人間に残される価値は何かを対談形式で語り合い、視聴者に「人が人を喜ばせる力」を磨くことの重要性を伝える内容です。\n\n【冒頭:権力構造の変化についての議論】\nこれまでお金を持つ人が権力を持っていた時代から、喜びや楽しみ・ワクワクを環境として人に提供できる人に価値が移っていくという世界観が語られる。ロボットにはできない「人が人を喜ばせる」ことこそが人間に残された役割だという方向性が冒頭から示される。\n\n【自分時間の増加という未来予測】\n将来的にロボットやAIが働いてくれるようになり、お金を稼ぐ・評価されるという概念が薄れていくと、1日24時間のうち労働時間が大幅に減り「自分時間」が増えると予測。お金の心配がなくなった時代には、自分の人生の時間を怒涛のように楽しめる能力があるかどうかが重要になり、その「楽しむ」という価値を幅広く人に提供できる人には、飛行機のファーストクラスやルイヴィトンの洋服が用意されるような、まるでセレブのような待遇が与えられるようになるかもしれないと語られる。エネルギー(電気)を生み出した人に権力が移っていく可能性にも言及。時代の価値基準が「侍が偉い時代→兵隊が偉い時代→お金持ち・ビジネスマンが偉い時代」と移り変わってきたように、次はベーシックインカム(ユニバーサルハイインカム/アバンダンス)によりお金に縛られない人生の時代が来るという見立てが語られる。\n\n【アメリカの雇用市場の異変】\nJPモルガンが今年新卒採用をゼロにしたという衝撃的な話題を紹介。アメリカのスタートアップ・ベンチャー企業数百社に取材したところ、「今年新卒を採用するか」という問いに「取らない」と答えた企業が64%にのぼったという調査結果を紹介し、若者が就職できない時代が既に始まっていると指摘する。\n\n【失業と治安悪化への懸念】\nベーシックインカムのような「働かなくても生活できる社会」に到達するまでの過渡期(今後6〜7年ほど)が最も厳しい時期になると予測。この期間に失業者が急増し治安が悪化するとし、既に「闇バイト」のような形でその兆候が現れ始めていると指摘。日本国内の殺人事件の内訳として、家族間殺人・若年層(10代)による殺人・海外から来た人による殺人が目立つとし、共通する要因は「貧困」であると分析。この傾向が今後7年でさらに加速すると懸念を示す。\n\n【ロボットの台数予測と「営業」という人間の武器】\n10年後にはロボットの世界の台数が100億台に達するという予測(現在の世界人口80億人を上回る数)を紹介し、旅行の際に「今日はどのロボットを連れて行く？」というような感覚になる未来像を語る。この過渡期を乗り越えるために何が必要かという問いに対し、「営業(個人が持てる人間的な営業力)」が鍵になると回答。AIやセールスロボットから営業をかけられても人は「買いたくない」と感じるものであり、AIには真似できない人間らしい営業・接客が今後さらに重要になると説明する。\n\n【若者たちの新たな働き方】\nAIによって従来の仕事が奪われる中、20代の優秀な若者たちが農業やスナック経営など、人間臭さが伴うビジネスを始めているという実例が紹介される。AIでできる仕事は誰でもコピーできてしまうため、そういった「人間にしかできない」仕事にシフトしている若者が増えているという。\n\n【締めくくり:イベント「マジックモーメント」への誘導】\n「人が人を喜ばせる」というロボットにはできない力を体現する存在として登壇者(大島さん)が称賛される中、この続きの詳しい話は今後開催されるリアルイベント「マジックモーメント」で話すという流れになり、視聴者に来場を呼びかけて拍手と歓声とともに配信を締めくくる。\n\n【まとめ】\nこの動画は、AI・ロボットの台頭により今後7年ほどで仕事の8割が消失し、その過渡期に失業や治安悪化という厳しい現実が待っているという警鐘を鳴らしつつ、「AIには真似できない、人が人を喜ばせる力・人間的な営業力こそが、これからの時代に価値を持ち続ける」という一貫したメッセージを、対談形式とイベント告知を交えて伝える内容です。"},
      {"name": "中野優作 / CAR and LIFE.（BUDDICA）", "isNew": false, "videoTitle": "【1年半で200万円下落！？】クラウン4兄弟のリセールを徹底比較！1年前の予想を答え合わせしたら“明暗”がハッキリ分かれました", "videoUrl": "https://www.youtube.com/watch?v=Enx7tQ_HExg", "published": "2026-08-27T10:00:31+00:00", "failed": false, "summary": "チャンネル名: 中野優作 / CAR and LIFE.（BUDDICA）\n動画タイトル: 【1年半で200万円下落！？】クラウン4兄弟のリセールを徹底比較！1年前の予想を答え合わせしたら“明暗”がハッキリ分かれました\nURL: https://www.youtube.com/watch?v=Enx7tQ_HExg\n公開日時: 2026-08-27T10:00:31+00:00\n形式: 中古車販売会社BUDDICA関係者2名による対談形式の車両解説動画(BUDDICA東京にて撮影。1年前に行ったリセール予測動画の答え合わせ企画)\n\nこの動画は、1年前に予測していたトヨタ「クラウン4兄弟」(エステート・スポーツ・クロスオーバー・セダン)のリセールバリュー(下取り・買取価格)について、実際のデータをもとに答え合わせを行い、それぞれの下落率や買取相場、狙い目のグレードを具体的な金額とともに解説する内容です。\n\n【冒頭:企画の経緯】\n1年前にクラウンシリーズのリセール予測動画を撮影し、当時はクラウンスポーツが改良されたタイミングで、セダンやエステートはまだ発売前だった状況を振り返る。今回はクラウン4兄弟全てのデータが出揃ったため、予測が当たったかどうかの答え合わせと、BUDDICAとしての買取金額の目安を初めて公開すると宣言する。\n\n【第1位:クラウンエステート】\nリセールが最も良かったのはクラウンエステートで、1年前の予測が的中したと確認。新車本体価格(Zグレード)は635万円で乗り出し680万〜700万円程度。買取金額の目安は状態や距離次第で550万〜650万円程度(距離2万km以下・評価点4以上が目安)とし、カーセンサーの売値相場も600万〜700万円が最多だったと紹介。新車から約2年で100万円程度(オプション込みなら150万円程度)下落し、月10万円ほどの償却ペースだが、この4兄弟の中では最も下落が緩やかで「中古で狙い目になる可能性がある」と評価。関東の一部地域で降雹被害(地球温暖化の影響)が増えており、被害歴のある車体は査定額が50万円ほど下がる点にも言及。\n\n【第2位:クラウンスポーツ】\n2番目に良かったのはクラウンスポーツ。新車本体価格590万円、乗り出し630万〜640万円程度。買取金額の目安は450万〜500万円で、3年落ち・3万km程度のデータをもとに算出。3年で180万円程度(月5万円ペース)の下落であり、「悪くない」ペースと評価。カーセンサーの売値相場は500万〜550万円が最多で、新車から150万円ほど安く買える点も紹介。買取と販売の差益(車屋の利益)は本来50万円ほど欲しいところ、実際は30万〜40万円程度が現実的なラインになるという業界の内情も明かされる。\n\n【第3位:クラウンクロスオーバー】\n3番目はクラウンクロスオーバーで、1年前の「スポーツより下がる」という予測が的中したと確認。新車本体価格595万円、乗り出し630万円程度。買取金額の目安は3年落ち・3万km以内で430万〜480万円。3年で200万円程度下落しており、スポーツ(3年で180万円)よりやや下落幅が大きいものの、従来のクラウンからすれば悪くない下落率と評価。カーセンサー相場は460万〜510万円台が最多で、新車比150万円以上お得に買えると紹介。7月23日にマイナーチェンジが発表され9月から改良モデルの発売が始まる予定であることにも触れ、モデルチェンジ後の相場変動は「半年〜1年後に緩やかに20万〜30万円程度下がる可能性がある」と予測する。\n\n【第4位:クラウンセダン】\n最も高額な新車本体価格730万円(乗り出し770万〜800万円近く)を誇るクラウンセダンについて解説。データがまだ少ない新しい車種だが、買取金額の目安は550万〜650万円程度とし、1年半で約200万円下落していると試算。3年落ちになればさらに下がり500万円を切る可能性、300万円近くまで落ちる可能性にも言及。中古相場では600万円台前半から出物があり、新車と比べて200万円もの差が出る車は国産では珍しく、レクサスLSクラスに匹敵する下落幅だと指摘。乗り心地・故障リスク・快適性の面でBMW5シリーズなど輸入車と比較しても遜色なく、「ちょっと高いけれど狙い目」だと評価する。\n\n【総括:人気色と各モデルの相場まとめ】\n人気色は黒・白を基準とし、茶色系・赤・シルバーなどは今後さらに相場が下がる可能性(30万円程度)があると予測。改めてエステート(550万〜650万円、12万km以内)、スポーツ(450万〜500万円)、クロスオーバー(430万〜480万円、3年・3万km以内)、セダン(状態次第で550万〜650万円)という買取目安金額を総まとめする。オプション・状態次第でこの金額から上下すると補足。\n\n【締めくくり:査定サービスの案内】\n自社の車両査定サービス「愛メーター」を紹介し、写真15枚で誰でも査定額を出せること、そのまま売却も可能であることを案内。BUDDICAが全国20店舗まで拡大し、フランチャイズ展開も始まったことを紹介し、出張査定にも対応していると案内して締めくくる。\n\n【まとめ】\nこの動画は、1年前に予測したトヨタ「クラウン4兄弟」のリセールバリューを実データで答え合わせし、エステートが最も下落が緩やかで狙い目である一方、セダンは高額なぶん下落額も最大となるなど、「4兄弟それぞれで明暗がはっきり分かれた」ことを具体的な金額とともに解説し、「中古で狙うならエステートかクロスオーバー、状態の良い個体を見極めれば新車よりお得にクラウンの魅力を味わえる」という実用的なメッセージを伝える内容です。"},
      {"name": "サムの本解説ch", "isNew": true, "videoTitle": "〇〇すれば、悩みの９割は解決する【要約】科学が解明した　悩んでもしょうがないことリスト", "videoUrl": "https://www.youtube.com/watch?v=ASyISdogGlI", "published": "2026-08-29T11:00:10+00:00", "failed": false, "summary": "チャンネル名: サムの本解説ch\n動画タイトル: 〇〇すれば、悩みの９割は解決する【要約】科学が解明した　悩んでもしょうがないことリスト\nURL: https://www.youtube.com/watch?v=ASyISdogGlI\n公開日時: 2026-08-29T11:00:10+00:00\n形式: 書籍要約・解説動画(石川正斗氏の著書『科学が解明した 悩んでもしょうがないことリスト』を紹介)\n\nこの動画は、集中できない・SNSで他人に嫉妬する・上司の顔色を思い出して不安になるといった現代人特有の悩みが、実は本人の性格や意思の弱さのせいではなく、大昔の環境に適応した脳の仕組みが現代とずれて誤作動しているだけであることを進化心理学の観点から解き明かし、悩みを「しょうがないもの」「変えられるもの」「放置してはいけないもの」の3つに分類して対処する具体的な方法を解説する内容です。\n\n【冒頭:よくある悩みのシナリオ提示】\n朝は今日こそ集中して定時で帰ろうと決意するのに、パソコンの前に座ると集中力が続かずSNSに1時間も費やしてしまう、同世代の友人の昇進や副業成功の投稿を見て嫉妬し、他人の幸せを素直に喜べない自分を「性格が悪い」と責めてしまう、夜になると上司の嫌な表情や自分の失敗を思い出して会社に行くのが怖くなる、という具体的な日常シーンを提示。こうした不安・嫉妬・注意散漫は性格の悪さではなく、かつて祖先を過酷な環境から生き残らせた心の働きが現代でも自動的に作動しているだけだと述べ、感情が湧くこととその感情ゆえに現実の問題を放置することは別問題であると整理する。\n\n【著者・書籍紹介と目次予告】\n著者は認知科学を専門とし、生物学・脳科学・心理学の学際領域を研究してきた石川正斗氏。本書『科学が解明した 悩んでもしょうがないことリスト』は不安・嫉妬・注意散漫・SNS疲れなど現代人の51の悩みを進化心理学の視点から読み解いた1冊であると紹介。今回は全51項目ではなく、多くの悩みに共通する正体と「しょうがないこと」「変えられること」の見分け方に絞り、①悩みが消えないのはあなたのせいではない、②悩みは3つに分けると楽になる、③感情を変えるな、感情の後を変えろ、という3章構成で解説すると予告する。\n\n【1. 悩みが消えないのはあなたのせいではない】\n人間の心や脳の仕組みは、スマホやパソコンが溢れる現代社会に合わせて作られたものではなく、数百万年もの間、食料不足や猛獣に怯える過酷な環境で、わずかな異変に気づき危険を避け群れの仲間の顔色を伺う敏感な心を持つ人だけが生き残って子孫を残せたと説明。著者はこの「古い心」と「新しい社会」のずれを「生物学的な不適合」と呼んでいると紹介する。具体例として、狩猟採集時代に木の実集めに没頭しすぎて背後のライオンの気配に気づかなかった人は真っ先に食べられて淘汰されたため、目の前の作業から瞬時に注意を切り替える力が生存に必要だったと解説し、パソコン作業中にスマホのLINE通知が気になってしまうのも同じ本能によるものだと述べる。不安が消えない理由についても、動物は危険に対し「戦う・逃げる・隠れる」のいずれかを選び行動が完結すると脳が安心するが、現代人は上司を殴ったり全力で逃げたりできないため「隠れる」(嫌なメールを未読放置する、布団に潜る)を選びがちであり、隠れるだけでは脳が危険の終了を確認できず警戒アラームが鳴り続けてしまうと説明。さらに上司への報告を先延ばしにしてしまう理由についても、悪い報告なら叱られ、良い報告でも次の仕事が増えるため、脳にとってはどちらに転んでも新たな負担が生まれる行為であり、先延ばしには短期的な利益があるのだと解説する。\n\n【2. 悩みは3つに分けると楽になる】\n悩みを3つの箱に分けて整理する方法を提示。1つ目の箱「湧いてくる反応はしょうがない」では、不安・嫉妬・怒り・他人の目への恐怖は理屈で命令して消せるものではないと説明し、無人ドリンク販売コーナーの実験(募金箱の上に花の写真を貼った週より、じっと見つめる目の写真を貼った週の方が10週間にわたり一貫して支払い額が多かった)を紹介し、人は誰も見ていなくても視線の気配だけで本能的にルールを守ろうとすることを示す。2つ目の箱「環境や行動は変えられる」では、SNSで他人の成功を見て嫉妬してしまう例を挙げ、狩猟採集時代の嫉妬は仲間に獲物の再分配を求めるための武器だったが、現代のSNSに映る成功者は自分に何かを分配してくれる「仲間」ではないため、苦しい感情だけが残る「勘違いの嫉妬」だと説明。しかもスマホ経由で24時間、世界中の何千人もの成功のハイライトが流れ込む異常な環境が、自分だけが取り残されているという錯覚を強めるとし、SNSアプリを消す・ミュートにするなど、環境そのものは自分の意思で変えられると述べる。3つ目の箱「現実の危険は放置しない」では、威圧的な上司を怖いと感じること自体は正常な反応だが、実際に日常的な暴言やパワハラを受けているなら、それは現代社会のルール違反という現実の危険であり、我慢して耐えるのではなく人事部への相談や記録保持といった現実的な防衛行動が必要だと強調。同様に、注意がそれやすいという本能的な性質があっても、車の運転中や危険な機械の操作中にスマホを見続けることを放置してよい理由にはならないと釘を刺す。\n\n【3. 感情を変えるな、感情の後を変えろ】\n本能から自然に湧き上がる感情を「ホットハート」、意識的に論理的に考える理性を「クールマインド」と呼ぶ本書の概念を紹介。ホットハートに対して「不安になるな」「嫉妬するな」と理屈で命令しても感情の暴走は止められないが、クールマインドを使えば感情が湧いた後にどう行動するか、どんな環境を用意しておくかは工夫できると説明。著者が提唱する「心のメガネ」という考え方を紹介し、視力が悪くても眼鏡で補うのが当たり前であるように、記憶力の弱さや注意力の散漫さもテクノロジーや仕組みで補えばよいとし、忘れやすいならスマホのリマインダーを使う、報告を避けがちなら進捗が自動共有されるクラウドを導入する、考えがまとまらないならAIに話しかけて論点を整理してもらう、といった「失敗しにくい仕組み作り」を提案する。さらに、常に最大の結果を追い求める「マキシマイザー」と、ある程度で満足できる「サティスファイサー」という2つのタイプを紹介し、マキシマイザーは目標未達なら苦しみ、達成してもすぐ次の目標を探すため一生虚しさが続く構造になっていると指摘。資本主義社会が「もっと稼げ、もっと優秀になれ」と煽ることで人々を意図的にマキシマイザーに仕立てあげているとし、自分なりの「ここまでできれば十分」という合格ラインをあらかじめ決めておくサティスファイサーの姿勢が必要だと説く。\n\n【締めくくり:3つのアクションプラン】\n視聴者に向けて具体的な行動を提案。アクション1として、今一番悩んでいることを1つ紙に書き出し、「しょうがない感情」「変えられる環境」「放置できない現実の問題」の3つに分解してみること。アクション2として、忘れっぽいなら通知設定をする、夜中にお菓子を食べてしまうならお菓子コーナーに近づかないルールを作るなど、自分の苦手を補う仕組みを1つ作ること。アクション3として、収入や資格、貯金額などについて、家族との時間や健康を犠牲にしてまで上を目指さないという自分なりの「十分なライン」を明確に書き出すことを提案する。最後に、著者の石川氏自身が50代後半からダンススクールに通い始め、10年以上の練習で体の柔軟性は劇的に伸びたもののリズム感だけは全く上達しなかったというエピソードを紹介し、人には努力して伸びることと伸びにくいことが必ずあるとし、変えられない感情や生まれ持った弱さとの戦いをやめ、変えられる場所・仕組み・環境の方へ努力と時間を移していくべきだと締めくくる。\n\n【まとめ】\nこの動画は、集中できない・不安が消えない・SNSで嫉妬してしまうといった現代人の悩みの正体が、狩猟採集時代に適応した心の仕組みと現代社会とのずれによる「誤作動」であることを進化心理学の知見で解き明かし、「感情はしょうがない、環境は変えられる、危険は放置しない」という3つの区別を意識して、変えられない感情との無駄な戦いをやめ、変えられる仕組みや環境に力を注ぐことこそが悩みを楽にする鍵であるという一貫したメッセージを伝える内容です。"},

  // 既読管理: サーバー側の new_in_last_check は「前回チェックと比較して動画が

  const READ_KEY = "ytChecker.readVideoUrls";

  function loadReadSet() {
    try {
      const raw = localStorage.getItem(READ_KEY);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch {
      return new Set();
    }
  }

  function markRead(videoUrl) {
    const set = loadReadSet();
    set.add(videoUrl);
    // 肥大化しすぎないよう直近200件に丸める
    const arr = Array.from(set).slice(-200);
    localStorage.setItem(READ_KEY, JSON.stringify(arr));
  }

  function relTime(iso) {
    const then = new Date(iso).getTime();
    const now = Date.now();
    const diffMs = now - then;
    const min = Math.floor(diffMs / 60000);
    if (min < 60) return `${Math.max(min, 0)}分前`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr}時間前`;
    const day = Math.floor(hr / 24);
    if (day < 30) return `${day}日前`;
    const mon = Math.floor(day / 30);
    return `${mon}ヶ月前`;
  }

      name.textContent = ch.name;

      const video = document.createElement("a");
      video.className = "video-title";
      video.href = ch.videoUrl;
      video.target = "_blank";
      video.rel = "noopener noreferrer";
      video.textContent = ch.videoTitle;

      const meta = document.createElement("div");
      meta.className = "meta" + (ch.failed ? " fail" : "");
      meta.textContent = ch.failed ? "前回チェック失敗" : `公開: ${relTime(ch.published)}`;

      li.append(chip, name, video, meta);

      if (ch.summary) {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "summary-toggle";
        toggle.textContent = isUnread ? "▸ 詳細な要約を読む(未読)" : "▸ 詳細な要約を読む";

        const body = document.createElement("div");
        body.className = "summary-body";
        body.textContent = ch.summary;

        toggle.addEventListener("click", () => {
          const open = body.classList.toggle("open");
          toggle.textContent = open ? "▾ 要約をたたむ" : "▸ 詳細な要約を読む";
          if (open && isUnread) {
            markRead(ch.videoUrl);
            chip.textContent = ch.failed ? "取得失敗" : "変化なし";
            chip.classList.remove("is-new");
            li.classList.remove("is-new");
          }
        });

        li.append(toggle, body);
      }

      list.appendChild(li);
    });

    document.getElementById("sumNew").textContent = unreadCount;
    document.getElementById("sumIdle").textContent = data.channels.length - unreadCount;
    document.getElementById("sumTotal").textContent = data.channels.length;

    const dot = document.getElementById("updatedDot");
    const text = document.getElementById("updatedText");
    dot.classList.toggle("live", unreadCount > 0);
    text.textContent = `最終チェック: ${relTime(data.checkedAt)}`;
  }

  render(CHANNELS_DATA);
</script>
