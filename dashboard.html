や、自身が神奈川で5000人と行った集団祈りのギネス世界記録樹立の瞬間に、統計的に異常な数値の偏りを見せたという実験結果を紹介。人間の集合意識がグラビトン(重力)を介して物理世界に影響を与えているのではないかと考察する。\n\n【締めくくり:告知と質疑応答】\n旧暦7月7日の今日は本来、お墓参りをして「来週の満月に迷わず帰ってきてください」と先祖に報告する日であると説明。今年12月24日クリスマスイブに那覇で月が真上90度に南中する珍しい現象が起きることも予告する。レイビレッジでの満月宿泊イベントの参加者募集、熊本大雨被害への「笑わボランティア」の告知、来年開始予定の「月ヨガ」サービスの紹介を行い、視聴者コメントに応答しながら配信を締めくくる。\n\n【まとめ】\nこの動画は、世界中の古代文明が申し合わせなく「夏の満月の夜に死者が帰ってくる」と信じてきた謎を、天文学(天の川銀河中心のブラックホールの位置)・物理学(ブレーンワールド仮説、重力=思いの理論)、そして乱数発生器による集団祈りの実験結果を結びつけて解き明かし、「旧暦や祈りという古来の智慧は非科学的なオカルトではなく、むしろ現代科学がようやく追いついてきた真実である」という一貫したメッセージを伝える内容です。"},
      {"name": "トーマスガジェマガ", "isNew": false, "videoTitle": "【Galaxy A57レビュー】入門スマホ界の不遇なダークホース", "videoUrl": "https://www.youtube.com/watch?v=08NM1b9p1HQ", "published": "2026-08-17T11:05:06+00:00", "failed": false, "summary": "チャンネル名: トーマスガジェマガ\n動画タイトル: 【Galaxy A57レビュー】入門スマホ界の不遇なダークホース\nURL: https://www.youtube.com/watch?v=08NM1b9p1HQ\n公開日時: 2026-08-17T11:05:06+00:00\n形式: ガジェットレビュー動画(Galaxy A57の実機レビュー。開封、デザイン、ベンチマーク、カメラ・バッテリー検証、他機種との比較を通して評価する構成)\n\nこの動画は、これまで「日本人には向かない不遇な存在」だったGalaxy Aシリーズの最新モデル「Galaxy A57」を購入・検証し、8万円という価格でありながら大画面・軽量・独自機能を兼ね備えた優れたエントリースマホであると結論づけるレビュー動画です。\n\n【冒頭:Galaxy Aシリーズの立ち位置】\nGalaxyといえば毎年CMを打つSシリーズが有名だが、Aシリーズは毎年ひっそりと発売され評判も良くなかったと説明。A20シリーズは途上国向け、これまでのA50シリーズも「日本人が使える代物ではない」ほどの出来だったとし、SamsungもAシリーズにやる気がなかったと指摘しつつ、今年のA57だけは違うと期待感を示す。\n\n【スペック概要とGalaxy S26との比較】\nCPUが刷新され、ボディの薄さがハイエンドのGalaxy S26と同じになったこと、6.7インチの大画面ながら軽量である点、Android最強とされるGalaxy OS「One UI」を搭載しつつ価格は7万9800円である点を紹介。ディスプレイサイズ・重量(179g、S26と12gしか違わない)・CPU(Exynos 1680)・メモリ8GB・ストレージ128GBというスペックを提示し「悪くない」と評価する。\n\n【開封・デザインの評価】\n箱が非常に開けやすい設計になっている点をGalaxy S26の開けにくい箱と対比してユーモラスに紹介。ボディデザインについては「Simple is best」と高く評価し、シンプルで完成度の高い外観だと述べる。\n\n【重量比較】\nPixel 10AやiPhone17と比較し、ガラスフィルム・ケース込みでも189g・222gに収まる軽さを強調。6.3インチのiPhone17 Proが251gであることと対比し、持ち上げた時に「段ボールが入っていないような」軽さだと表現する。\n\n【弱点1:無線充電非対応・指紋認証の遅さ】\n8万円という価格ゆえのコストカットとして無線充電に非対応であること、指紋認証に約0.5秒かかり最新機種と比べてやや遅い(Mate20 Pro時代の感覚に近い)ことを指摘する。\n\n【インターフェース・ポート】\n上部マイク、右側電源・音量ボタン、下部にSIMスロット・Type-C端子・スピーカーを備え、物理SIMとeSIMのデュアルSIMに対応している点を紹介する。\n\n【大画面と軽さの両立という強み】\n6.7インチながら他社の同サイズ機種(Xiaomiなど、軒並み200g超)と比べて圧倒的に軽量であること、ベゼルが細く画面の情報量が多いため文字が大きく見やすい点を強調。120Hzのリフレッシュレートにも対応していることを紹介する。\n\n【ベンチマーク・バッテリー計測】\niPhone17・Galaxy A57・Pixel10Aの順にベンチマークスコアを比較し、Galaxy A57が134万点、Pixel10Aが154万点、iPhone17が215万点という結果を示す(3Dゲームには不向きだが普段使いには十分と評価)。バッテリーは18時間54分駆動という結果で、6.7インチ機としては十分だと評価する。\n\n【普段使いでの比較】\niPhone17と地図アプリのルート検索などを比較し、大きな差は出ないが一部iPhoneの方が最適なルートを示す場面もあると紹介する。\n\n【目玉機能:通話自動録音+文字起こし機能】\nGalaxyシリーズ独自の機能として、通話を全自動で録音し文字起こしまで行う機能を実演。実際に電話をかけて通話を録音し、LINEのチャット形式のように文字起こしされる様子を見せる。iPhoneやPixelは相手に録音を通知する仕様(米国の法律に合わせているため)だが、日本では無断録音が合法であるため、Galaxyはこの機能を日本向けにそのまま使える点を高く評価。自身のGalaxy S26でこの機能を使い続け、録音件数がすでに300件近くになっていることも明かす。\n\n【音質・撮影テスト】\n純正ボイスレコーダーアプリの音質はGalaxy S26と同等であることを確認。動画・写真撮影テストでは、Galaxy S26・iPhone17 Pro・Pixel10Aと比較し、日中の撮影は互角レベルだが、夜間・超広角では暗いレンズゆえのノイズや手ブレが目立つこと、iPhone17 Proには画質面で一歩譲ることを指摘。一方、室内撮影では明るさ・色味の面でiPhone17 Proに引けを取らない結果に驚きを見せつつも、シャッター速度が遅いため動く被写体(子供やペット)の写真がブレやすいという弱点も紹介する。\n\n【総合評価:欠点とその対策】\n処理能力の低さ、望遠レンズなし、無線充電非対応、画面出力非対応、ストレージ128GBのみといったカタログ上の弱点は「最初から期待していない」レベルとして許容範囲とし、ストレージ不足への対策としてPCバックアップやGoogleフォトなどのクラウド利用(月額200円程度)を推奨する。\n\n【隠れた弱点】\nカタログに載らない欠点として、室内での写真撮影時にシャッター速度が遅く動く被写体がブレやすいこと、指紋・顔認証に0.5秒程度かかることを挙げるが、いずれも運用でカバー可能と評価する。\n\n【競合機種との比較・結論】\nライバル機種としてiPhone17e(10万円)、Pixel10A(8万円)、Galaxy A57(8万円)を挙げ、自分ならGalaxy A57を選ぶと明言。理由は自動通話録音文字起こし機能と優秀なボイスレコーダー機能であり、指紋・カメラの弱点は許容範囲と評価する。AQUOS sense6やarrows Alphaなどの安価なミドルスマホは体験の質が大きく劣るため非推奨とする。\n\n【「じじばば向けスマホ」という評価と皮肉】\n大画面と通話自動録音機能が老眼・詐欺電話対策に有効であるとして「Galaxy A57は真にじじばば向けスマホなのではないか」と評価する一方、実際の高齢者層は「安さ」と「嫌韓感情」から同価格帯のAQUOS sense6(国産に見えるが実際は中国資本)を選んでしまう現実を皮肉交じりに指摘。上位機種にはiPhoneやPixelに、下位価格帯にはAQUOSに挟まれ、市場での立ち位置がないことが売れない理由だと分析する。\n\n【締めくくり】\n価格をAQUOS sense6と同水準まで下げてブランドイメージを一度払拭し、世代を重ねて徐々に価格を戻していく戦略を提案しつつ、視聴者にはエントリースマホを探しているならGalaxy A57を選択肢に入れてほしいと呼びかけ、チャンネル登録やブログ・書籍・Twitterの宣伝を行って動画を締めくくる。\n\n【まとめ】\nこの動画は、これまで「ゴミ」扱いされてきたGalaxy Aシリーズの最新作「Galaxy A57」が、大画面・軽量・独自の通話自動録音文字起こし機能という強みを備えながら8万円という価格を実現した優れたエントリースマホであり、市場でのポジショニングに恵まれていないだけの「不遇なダークホース」であるという一貫した評価を、詳細なスペック比較・実機テストを通じて伝えるレビュー動画です。"},
      {"name": "ひすいこたろうの名言セラピー", "isNew": true, "videoTitle": "どん底の時、思い出してほしい", "videoUrl": "https://www.youtube.com/watch?v=hGUtYAICUQU", "published": "2026-08-19T12:00:08+00:00", "failed": false, "summary": "チャンネル名: ひすいこたろうの名言セラピー\n動画タイトル: どん底の時、思い出してほしい\nURL: https://www.youtube.com/watch?v=hGUtYAICUQU\n公開日時: 2026-08-19T12:00:08+00:00\n形式: 短尺(1分程度)の癒し系メッセージ動画、蓮(ハス)の花にまつわる仏教的エピソードを語る構成\n\nこの動画は、人生が好転せず苦しい時にこそ思い出してほしい「ハスの花」の話を通じて、泥のように苦しい環境こそが美しい花を咲かせる糧になるというメッセージを伝える短編動画です。\n\n【蓮の生態と仏教における位置づけ】\n仏教において蓮は重要な花であり、お釈迦様の台座にもなっていることを紹介。蓮は水中で育つ植物で、根は蓮根(レンコン)であるが、水があまりに綺麗すぎると根が支えを得られず栄養を取れずに育たないという生態的特徴があると説明する。\n\n【泥が汚れているほど美しく育つという逆説】\n蓮は水が泥で汚れていればいるほど美しく育つとし、「泥より出て泥に染まらず」という言葉の通り、泥があるからこそ大輪の美しい花を咲かせるのだと語る。仏教ではこれを「お不染」と呼ぶことを紹介する。\n\n【茎の空洞構造とエゴを手放すことの象徴】\n蓮の花の茎は根と同様に中が空洞であり、真ん中に余分なものがなくスペースがあることに触れ、これをエゴを捨て去り覚醒したお釈迦様のような状態になぞらえ、「中虚」と呼ばれることを紹介する。泥の中で余分なエゴを解き放つ時に大輪の花が咲くのだと語る。\n\n【締めくくり】\n「間もなく大輪の花が咲くね」という言葉で視聴者を励まし、「今日も頑張ったね、お疲れ様でした」とねぎらいの言葉をかけて動画を締めくくる。\n\n【まとめ】\nこの動画は、泥の中でこそ美しく育つ蓮の花の生態と仏教的な教え(お不染・中虚)を通じて、「どん底の苦しい環境こそが、エゴを手放し大輪の花を咲かせるための糧になる」という一貫したメッセージを、短い時間の中で優しく語りかける内容です。"},
      {"name": "崔の店長日誌。", "isNew": true, "videoTitle": "人生が変わる時、必ずある人と出会っている！/ 100日マラソン続〜1957日〜", "videoUrl": "https://www.youtube.com/watch?v=3Gbq0_X23aU", "published": "2026-08-19T20:00:26+00:00", "failed": false, "summary": "チャンネル名: 崔の店長日誌。\n動画タイトル: 人生が変わる時、必ずある人と出会っている！/ 100日マラソン続〜1957日〜\nURL: https://www.youtube.com/watch?v=3Gbq0_X23aU\n公開日時: 2026-08-19T20:00:26+00:00\n形式: 毎日配信「100日マラソン」シリーズ(1957日目)、店主・崔氏によるトーク配信\n\nこの動画は、人生の転機には必ず特別な人との出会いが存在していたという気づきから、自身の過去を振り返って見出した「人生を変えてくれる人」の10のパターンを紹介する内容です。\n\n【冒頭:登録者数18万人突破の報告】\n8月20日木曜日、サロン開設について触れつつ、コメント欄でYouTubeチャンネル登録者数が18万人を突破したことに気づき感謝を述べる。サロンを始めてもYouTubeの毎日更新は続けると約束する。\n\n【本題導入】\n今日のテーマは「人生が変わる時、必ずある人と出会っている」であると紹介。自身の過去を振り返り、周りの人の意見も参考にしながら、人生を変えてくれる人のパターンを10個にまとめたと説明する。\n\n【1. お前ならできると本気で信じてくれる人】\n20代前半で講演依頼がうまくいかず悔しくて眠れなかった翌朝、母から「お前には人の前に立って話す才能があったんだね、だってどんなことをやっても悔しくて眠れなかった夜なんてなかったでしょう」と言われたエピソードを紹介。この言葉を信じて続けてこられたと語る。\n\n【2. 自分の当たり前をぶち壊してくれる人】\n自転車の練習をする長女が「1番になるために人参を食べたら1位になれる」という夢を見た話や、次女がイメージトレーニングのアドバイスだけで自転車に乗れるようになったエピソードを紹介し、子供たちが自分の常識を壊してくれたと語る。\n\n【3. 自分よりちょっと先を行ってる人】\n講演を行う先輩たちだけでなく、年下の人からも多くの刺激を受けてきたと振り返り、年齢に関係なく自分の人生のモデルとなる人がいたことを紹介する。\n\n【4. 厳しいことを言ってくれる人】\n師匠や取引先の社長たちからの厳しい言葉を振り返り、「人に対して諦めがある場合、厳しいことも怒りも湧いてこない」とし、厳しさの裏にあったのは愛だったと今になって思うと語る。\n\n【5. 失敗している自分を見捨てない人】\n妻のエピソードを紹介。多くの人に嫌われて仲間外れにされた経験で落ち込んでいた時に「あなたは私以外の誰に好かれたいの」と言われたことを\"名言\"として紹介し、大きな支えになったと語る。\n\n【6. あなたはあなたのままでいいと教えてくれる人】\n成長を焦っていた時期に、友人から「あなたはあなたのままでいい」と言われたエピソードを紹介する。\n\n【7. 自分の才能を見つけてくれる人】\n個人鑑定の仕事で出会ったお客様たちから「あなたにはこういう力がある」と気づかされてきたことを紹介する。\n\n【8. 行動する姿を見せてくれる人】\n年上の先輩たちが「誰かにやれと言う前に自分がやらなくては」という姿勢を見せてくれたことが、自身の人生にも生きていると語る。\n\n【9. 人生のタイミングを変えてくれる人】\n出会った当時は意味が分からなかった言葉やアドバイスが、40代になって振り返ると重要な意味を持っていたと気づく経験を紹介し、当時は気づかなかった「起動修正」をしてくれていた人がいたと語る。\n\n【10. この人みたいになりたいと思える人】\nかつて働いていたお店に来店した80代の夫婦が、音楽が流れる部屋でカラオケも歌わず2人で踊っていた光景を見て憧れを抱いたエピソードを紹介。「どうやったら仲良くいられるのか」と尋ねたところ、「私たち夫婦はお互いが理解し合えてないってことを理解し合えました」という言葉をもらい、今になってその意味が分かってきたと語る。\n\n【締めくくり:縁は探すものではなく気づくもの】\n紹介した10人との出会いは全て「良縁」であり、時にはムカつくこともあったが大きな出会いだったと振り返る。「良縁は探すものでも引き寄せるものでもなく、自分自身が誰かの良縁になれているかが重要だ」と締めくくり、いつも通り「せーの、よっしゃ」の掛け声でガッツポーズをして配信を終える。\n\n【まとめ】\nこの動画は、人生を変えてくれた人々を10のパターン(信じてくれる人、常識を壊してくれる人、先を行く人、厳しさをくれる人、見捨てない人、あなたのままでいいと言ってくれる人、才能を見つけてくれる人、行動を見せてくれる人、タイミングを変えてくれる人、憧れの人)に分類して振り返りながら、「良縁とは探し求めるものではなく、自分自身が誰かにとっての良縁になれているかどうかが本質である」という一貫したメッセージを伝える内容です。"},
      {"name": "UP&UP", "isNew": false, "videoTitle": "【※閲覧注意】真面目に生きる人は一瞬で損をします。一生貧乏から抜け出せない人が無意識にやっている「最悪の習慣」", "videoUrl": "https://www.youtube.com/watch?v=5dRROj1qUkw", "published": "2026-08-14T09:00:06+00:00", "failed": false, "summary": "チャンネル名: UP&UP\n動画タイトル: 【※閲覧注意】真面目に生きる人は一瞬で損をします。一生貧乏から抜け出せない人が無意識にやっている「最悪の習慣」\nURL: https://www.youtube.com/watch?v=5dRROj1qUkw\n公開日時: 2026-08-14T09:00:06+00:00\n形式: 対談・ロケ形式のトーク動画(北三道サロンからの配信、大島さん・藤本さんら複数名が参加)\n\nこの動画は、「世界一うるさいマッサージ」という一見敬遠したくなる体験を通じて既成概念を壊された経験を入り口に、斎藤一人氏の教えや遊び心を経営に取り入れた企業事例を紹介しながら、「真面目になりすぎず遊び心を持つことの大切さ」を語る対談動画です。\n\n【冒頭:マッサージ嫌いだったのに感動した体験の予告】\n冒頭、「世界一うるさいマッサージ」という一見敬遠したくなる店に実際に行ってみたところ大感動だった、既成概念が壊されたという体験談が予告的に語られる。\n\n【オープニング:北三道サロンからの配信、装置の紹介】\n今回の配信は北三道サロンという場所から行われており、心地よい空間であることに触れつつ、オーナーの株式会社スピテック代表・吉川氏を紹介。背後に置かれた装置について尋ねると、1970年代にロシアで開発された、元は超能力開発を裏テーマに作られた装置で、アルミ製で外部からの光・電磁波だけでなく「タイムウェーブ」という情報も遮断・反射する仕組みだと説明。エストニアから輸入したもので、こうした空間づくりのために家具も1960年代のドイツ・ポーランド製のものを集めているとのこと。\n\n【大島さんのタイでのお寿司店開業報告】\n話題は大島さんへ。タイでお寿司屋「寿司祝い」を6月にオープンし、タイの芸能人が多く来店するなど好調なスタートを切ったことを報告。12月にたさんがタイを訪れるタイミングでツアーを企画したいという話も出る。\n\n【「世界一うるさいマッサージ」体験談】\n大島さんが実際に体験した「世界一うるさいマッサージ」というお店の話。1年前のオープン時から誘われていたが、マッサージは静かに受けたいものという固定観念から敬遠していたが、今回思い切って訪問。3階建ての建物で、3階が40人規模の円卓型マッサージルーム、DJブースとプロジェクションマッピングを備えた空間で、マッサージの技術自体も非常に高いレベルながら、同時に本格的なエンターテインメントショーが展開される。さらに「一生に一度しか行けない、リピート禁止」というコンセプトを持ち、ドンペリを飲みながらマッサージを受け、最後はみんなで踊り出すという、疲れるためではなく癒されるはずが最終的に「疲れた」と言って帰るような衝撃の体験だったと語る。この経験から「〜でなければならない」という概念が完全に壊された、「こんなに遊んでいいんだ」という気づきを得たと振り返る。\n\n【斎藤一人氏の教え:「真面目になるな」】\n大島さんが最近のテーマにしている「遊び」について、かつて大変お世話になった斎藤一人氏(日本有数の納税者として知られる大成功者)から、50歳の誕生日に「真面目になるなよ」というメッセージを受け取ったエピソードを紹介。「真面目」は「じめ(暗い)」に通じる言葉であり、いつの間にか人の目を気にしてつまらない人間になっていないかと指摘されたと振り返る。さらに、「遊ぶ」という言葉はもともと神様に歌や舞を奉納することを意味する高波動・高次元の言葉であり、遊ぶことこそが神様と繋がることだと考えるようになったと語る。あわせて、日商1日2億円を売り上げるエステサロン経営者の「仕事は遊び、遊びは仕事」という口癖を紹介し、この考え方を大事にしてから業績が伸びたというエピソードも添える。\n\n【「遊び心」と新しいアイデアの掛け算】\nこの話を受け、藤本さんが「サービス業には遊びの感覚がないと枠を超えた発想は生まれない」とコメント。過去に啓介氏がYouTubeで語っていた「新しいものは既存の流行りの組み合わせから生まれる」という話を引き合いに、プロジェクションマッピングとうるさいマッサージの掛け合わせもまさにその実例であると分析。大島さんは、この発想を寿司屋にも応用できないか(一生に一度・リピート禁止の寿司屋)というアイデアを語り、その場にいたメンバーが盛り上がる。\n\n【AI時代における「遊び」の重要性】\n話題はAI・フィジカルAI・AGIの進歩によって、ビジネスや職業という概念自体が変化し、エンターテインメントやスポーツ、イベントといった領域に人々の関心が移っていくだろうという未来予測へ。ロボットと共存する時代において「人生を楽しむ」「遊ぶ」ことがより一層大事になっていくという見解が共有される。\n\n【封筒会社の「おし活手当」エピソード】\n啓介氏が最近出会った、封筒印刷・製造という地味な業種の会社の社長のユニークな取り組みを紹介。「うちは封筒を作る会社であると同時に、社員の推し活を応援する会社」というコンセプトのもと、推し活手当や推し活関連の福利厚生を採用ページに掲げたところ、応募が大幅に増えたというエピソード。これも「遊び」を経営に取り入れた好例として盛り上がる。\n\n【ドリームマネージャー制度の紹介】\nさらに、アメリカの清掃会社発祥とされる「ドリームマネージャー」という役職・部署の存在を紹介。社員に会社のビジョンを押し付けるのではなく、社員個人の夢(マイホームを建てる、など)の実現を専門にサポートする部署を設けたところ、結果的に会社の売上も伸びたという事例。栃木県にある日本企業がこの仕組みを取り入れており、その社長が着想を得たのは啓介氏の過去の発信だったというエピソードも紹介され、盛り上がりを見せる。\n\n【8月27日開催イベント「マジックモーメント」の告知】\n話題は8月27日に開催される3回目のイベント「マジックモーメント」の告知に移る。約100名のクルーが連日ミーティングを重ねて準備をしていること、過去の参加者から「人生が変わった」というメッセージが多数寄せられていることが紹介される。「良質な情報との出会いが人生を変える」という考えのもと、今回も1人でも多くの人に来てほしいと呼びかける。イベント関連の余興として、簡易診断で「あなたはどのタイプ」というテストをその場のメンバーで試し、盛り上がりながら締めくくる。\n\n【まとめ】\nこの動画は、「世界一うるさいマッサージ」という規格外のエンターテインメント体験を入り口に、斎藤一人氏の「真面目になるな」という教えや、「仕事は遊び、遊びは仕事」という考え方、封筒会社の推し活手当やドリームマネージャー制度といった具体的な事例を交えながら、「既成概念を壊し、遊び心を仕事や人生に取り入れることこそが、AI時代においてますます重要になる」という一貫したメッセージを伝える対談形式のトーク動画です。"},
      {"name": "中野優作 / CAR and LIFE.（BUDDICA）", "isNew": true, "videoTitle": "【INTERIOR REFRESH SPRAY】新技術「空気触媒」が家でも体験できる！特許技術「進化銀®」の消臭スプレーが数量限定販売！", "videoUrl": "https://www.youtube.com/watch?v=j8PY0psCHk4", "published": "2026-08-19T10:00:14+00:00", "failed": false, "summary": "チャンネル名: 中野優作 / CAR and LIFE.（BUDDICA）\n動画タイトル: 【INTERIOR REFRESH SPRAY】新技術「空気触媒」が家でも体験できる！特許技術「進化銀®」の消臭スプレーが数量限定販売！\nURL: https://www.youtube.com/watch?v=j8PY0psCHk4\n公開日時: 2026-08-19T10:00:14+00:00\n形式: 短尺の商品紹介・タイアップ動画(対談形式、車の消臭施工技術を家庭用に応用した新商品のPR)\n\nこの動画は、車の内装施工で使われている特許技術「進化銀®」を用いた消臭スプレーが家庭でも使えるDIY商品として数量限定で発売されたことを紹介する、短いPR動画です。\n\n【商品の紹介】\nペットが粗相をしたクッションが施工前はひどい匂いだったのに、新しい消臭スプレーをかけたところ匂いが完全に消えたという体験談から始まる。風を当てれば当てるほど匂いの元となる菌と戦い続けてくれる「空気触媒」技術を使っており、車の施工やベビーカーの施工でも使われている技術を家庭で使えるDIY商品として発売したと紹介される。\n\n【技術の解説】\n匂いが消える仕組みについて、特許技術で銀がスプレーの中に溶け込んでおり、これが匂いの元となる菌を抑制する仕組みであると説明。この技術はもともと医療現場でのオペ室の菌抑制や、災害時の混雑した環境で感染が広がらないようにするために開発されたものであり、それを車用にアレンジしてもらったといういきさつが語られる。一般的な除菌スプレーとの違いとして、除菌スプレーは匂いの元の菌を蓋しているだけで、成分が混ざって逆に嫌な匂いになったり、蓋が取れると匂いが戻ってしまうことがあるのに対し、この商品は特許技術によって菌そのものを抑える点が異なると説明される。\n\n【購入案内】\n商品は楽天のECサイトから購入可能であることが案内される。出演者が洗っていないスーツを1週間着て匂った状態にスプレーしたところ、全く匂わなくなったという体験を語り、デニムなど匂いが気になるアイテムにも使えると紹介。数量限定であるため早めの購入を勧めて締めくくる。\n\n【まとめ】\nこの動画は、車の内装施工に使われている特許技術「進化銀®」を応用した消臭スプレーが家庭用DIY商品として数量限定で発売されたことを、実体験を交えて紹介する短いタイアップ・PR動画です。"},
      {"name": "サムの本解説ch", "isNew": true, "videoTitle": "結局、最強の運動は〇〇〇〇【要約】体力おばけへの道　自分史上最高の「動ける体」を手に入れよ！", "videoUrl": "https://www.youtube.com/watch?v=1lgUc5LW6E4", "published": "2026-08-18T11:00:15+00:00", "failed": false, "summary": "チャンネル名: サムの本解説ch\n動画タイトル: 結局、最強の運動は〇〇〇〇【要約】体力おばけへの道　自分史上最高の「動ける体」を手に入れよ！\nURL: https://www.youtube.com/watch?v=1lgUc5LW6E4\n公開日時: 2026-08-18T11:00:15+00:00\n形式: 書籍要約・解説動画(理学療法士・沢木氏著、循環器内科医・国本氏監修『体力おばけへの道 超ハードモード編』を紹介)\n\nこの動画は、夕方の疲労感や日々の体力不足に悩む人に向けて、「根性で追い込む」という従来の体力作りの常識を覆し、科学的根拠に基づいた最短で「壊れにくく動ける体」を作る方法を紹介する書籍要約動画です。\n\n【冒頭:問題提起】\n夕方に疲れ果てる、階段で息切れする、休んでも体が重いといった悩みを提示し、これらは年齢や根性不足のせいではないと否定。本当の体力とは限界まで耐える根性ではなく、「必要な時にしっかり動けて、疲れても早く回復できる力」であると再定義する。\n\n【著者・書籍紹介】\n紹介する本は、整形外科病院でのトレーナー主任やトップアスリート指導の経験を持つ機能解剖学のスペシャリスト・沢木氏と、循環器内科の専門医である国本氏が監修した『体力おばけへの道 超ハードモード編』。医学的根拠と現場での再現性を兼ね備えた内容であるとし、①長く・痩せて・追い込むが体力作りを失敗させる、②体が変わる3つの仕組み、③明日から始める超HIITの実践方法、という3章構成で紹介すると予告する。\n\n【1. 長く・痩せて・追い込むが体力作りを失敗させる】\n3つの「罠」を紹介。罠1は「体力をつけるにはとにかく長くジョギングする」というもので、著者自身が学生時代に根性トレーニングにはまったが理想の体にはなれなかった経験を紹介し、一定ペースの有酸素運動だけでは心肺機能と全身の筋肉を同時に目覚めさせるスイッチが入らないと説明。罠2は「痩せれば動けるようになる」というもので、極端な食事制限は脂肪だけでなく筋肉というエネルギーを使う装置まで削り取ってしまい、体重が減っても疲れやすくなる悪循環に陥ると指摘。罠3は「筋肉痛が強いほど効いている」というもので、運動生理学の「刺激・回復・適応」の原則を無視して回復が追いつかないまま追い込みを重ねると、睡眠の質低下や免疫低下、怪我につながると警告する。\n\n【2. なぜ頑張っても体力がつかないのか:体が変わる3つの仕組み】\n体力を「行動体力」(筋力・心肺持久力・柔軟性・バランス能力)と「防衛体力」(睡眠・疲労回復・免疫・ストレス対応)の2つに分類。脂肪を燃料、筋肉を燃料を使う装置、筋力をその装置を動かすスイッチと例え、この3つが連動していることを説明。体を変える鍵は「刺激→回復→適応」というサイクルであり、運動している最中ではなく、その後の食事と休養によって回復することで初めて体力が向上すると解説する。\n\n【3. 明日から始める超HIITの実践方法】\n道具を使わない3種目のエクササイズを紹介。①フルバーピー(しゃがんで両手を床につきジャンプで足を伸ばし、腕立て伏せをしてから再びジャンプする全身運動)を最もエネルギーが必要な最初に配置。②アリゲーターステップ(腕立て伏せの姿勢で左右の足をワニのように素早く動かす運動)で体幹の安定と股関節のコントロール能力を鍛える。③スーパースプリント(その場での高速もも上げ)を、体力の消耗した終盤でも調整しやすい最後の種目として配置。各種目20秒、休憩30秒を基本(フェーズ1)とし、慣れてきたら休憩を20秒(フェーズ2)、さらに10秒(フェーズ3)に短縮していく3段階の強度設定を紹介。フェーズを進める基準は日数ではなく、フォームが崩れず出力を維持できたか、翌日に強い疲労や関節痛が残っていないかという体のサインで判断すべきと強調する。\n\n【締めくくり】\n体を変えるのは根性ではなく、正しい刺激と回復の設計であると再度強調し、超HIITの基本セット(各種目20秒・休憩30秒)から始め、翌日の体調を確認しながら少しずつ強度を高めていくよう勧める。書籍の詳細は概要欄のリンクを参照するよう案内して締めくくる。\n\n【まとめ】\nこの動画は、「長く走る」「痩せる」「限界まで追い込む」という従来の体力作りの3つの思い込みを覆し、行動体力と防衛体力を刺激・回復・適応のサイクルで積み上げる科学的な仕組みと、道具不要の3種目からなる「超HIIT」の実践法を紹介しながら、「体力とは根性で耐える力ではなく、日常にたっぷり余裕を残すための力であり、正しい設計に基づけば誰でも壊れにくく動ける体を最短で手に入れられる」という一貫したメッセージを伝える内容です。"},

  // 既読管理: サーバー側の new_in_last_check は「前回チェックと比較して動画が
  // 変わったか」しか表さず、自動チェックが1回でも走るとリセットされてしまう。
  // 実際にユーザーが読んだかどうかはこのブラウザの localStorage で別管理する。
  const READ_KEY = "ytChecker.readVideoUrls";

  function loadReadSet() {
    try {
      const raw = localStorage.getItem(READ_KEY);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch {
      return new Set();
    }
  }

  function markRead(videoUrl) {
    const set = loadReadSet();
    set.add(videoUrl);
    // 肥大化しすぎないよう直近200件に丸める
    const arr = Array.from(set).slice(-200);
    localStorage.setItem(READ_KEY, JSON.stringify(arr));
  }

  function relTime(iso) {
    const then = new Date(iso).getTime();
    const now = Date.now();
    const diffMs = now - then;
    const min = Math.floor(diffMs / 60000);
    if (min < 60) return `${Math.max(min, 0)}分前`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr}時間前`;
    const day = Math.floor(hr / 24);
    if (day < 30) return `${day}日前`;
    const mon = Math.floor(day / 30);
    return `${mon}ヶ月前`;
  }

  function render(data) {
    const list = document.getElementById("channelList");
    list.innerHTML = "";
    const readSet = loadReadSet();
    let unreadCount = 0;

    // 未読(新着)のチャンネルを上に、既読/変化なしを下に並べる。
    // 同じグループ内では元の(state.json の)並び順を保つ(安定ソート)。
    const sorted = data.channels
      .map((ch) => ({
        ch,
        isUnread: !!ch.summary && !readSet.has(ch.videoUrl),
      }))
      .sort((a, b) => Number(b.isUnread) - Number(a.isUnread));

    sorted.forEach(({ ch, isUnread }) => {
      if (isUnread) unreadCount++;

      const li = document.createElement("li");
      li.className = "channel" + (isUnread ? " is-new" : "");

      const chip = document.createElement("span");
      chip.className = "chip" + (isUnread ? " is-new" : "");
      chip.textContent = ch.failed ? "取得失敗" : (isUnread ? "新着あり" : "変化なし");

      const name = document.createElement("div");
      name.className = "channel-name";
      name.textContent = ch.name;

      const video = document.createElement("a");
      video.className = "video-title";
      video.href = ch.videoUrl;
      video.target = "_blank";
      video.rel = "noopener noreferrer";
      video.textContent = ch.videoTitle;

      const meta = document.createElement("div");
      meta.className = "meta" + (ch.failed ? " fail" : "");
      meta.textContent = ch.failed ? "前回チェック失敗" : `公開: ${relTime(ch.published)}`;

      li.append(chip, name, video, meta);

      if (ch.summary) {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "summary-toggle";
        toggle.textContent = isUnread ? "▸ 詳細な要約を読む(未読)" : "▸ 詳細な要約を読む";

        const body = document.createElement("div");
        body.className = "summary-body";
        body.textContent = ch.summary;

        toggle.addEventListener("click", () => {
          const open = body.classList.toggle("open");
          toggle.textContent = open ? "▾ 要約をたたむ" : "▸ 詳細な要約を読む";
          if (open && isUnread) {
            markRead(ch.videoUrl);
            chip.textContent = ch.failed ? "取得失敗" : "変化なし";
            chip.classList.remove("is-new");
            li.classList.remove("is-new");
          }
        });

        li.append(toggle, body);
      }

      list.appendChild(li);
    });

    document.getElementById("sumNew").textContent = unreadCount;
    document.getElementById("sumIdle").textContent = data.channels.length - unreadCount;
    document.getElementById("sumTotal").textContent = data.channels.length;

    const dot = document.getElementById("updatedDot");
    const text = document.getElementById("updatedText");
    dot.classList.toggle("live", unreadCount > 0);
    text.textContent = `最終チェック: ${relTime(data.checkedAt)}`;
  }

  render(CHANNELS_DATA);
</script>
