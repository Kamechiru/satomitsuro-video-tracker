    channels: [
      {"name": "さとうみつろう", "isNew": false, "videoTitle": "「1問でペットボトル1本」AIが世界の水を奪い始めた", "videoUrl": "https://www.youtube.com/watch?v=ZVAOq9ZCIvc", "published": "2026-08-22T08:55:06+00:00", "failed": false, "summary": "チャンネル名: さとうみつろう\n動画タイトル: 「1問でペットボトル1本」AIが世界の水を奪い始めた\nURL: https://www.youtube.com/watch?v=ZVAOq9ZCIvc\n公開日時: 2026-08-22T08:55:06+00:00\n形式: 単独トーク解説動画(AIと水資源問題について、電力会社出身の知識を交えて解説)\n\nこの動画は、ChatGPTなどのAIへの質問1回がペットボトル1本分の水を消費するという事実をきっかけに、AIの普及が世界的な「水の奪い合い」を引き起こしている実態と、その解決策としてイーロンマスクが構想する「宇宙AI」計画までを解説する内容です。\n\n【冒頭:AIが水を飲むという衝撃の事実】\nChatGPTに恋愛相談や道案内など簡単な質問を10秒間するだけで、ペットボトル1本分(500ml)の水が消費されると紹介。AIは思考する際に大量の熱を出し、その排熱をクーリングタワーで水を使って気化熱により逃がしているためだと説明する。2025年に北米大陸でAIを冷やすためだけに使われた水は1兆Lにのぼり、人間が1年に飲む水(730L)換算で13億人分に相当すると衝撃データを紹介する。\n\n【AIと人間のエネルギー効率比較】\n元電力会社勤務だった経験を踏まえ、人間の脳が動くのに必要な電力は約20W(体全体で100W)であるのに対し、AIのGPUクラスターはMW級の電力を使うと説明。水の消費量も人間よりAIの方が580倍多く、電気は3000倍多いと試算し、人間が減りAIが増える社会は水と電気の奪い合いに直結すると指摘する。\n\n【AIチップの製造構造と水消費】\nGPUを設計するのが世界一の時価総額を誇るNVIDIA(アメリカ)、実際に製造するのが台湾のTSMCのみであることを説明。半導体の回路線幅が現在2nmまで微細化していることに触れ、TSMCの工場では地下水などを純水化してウェハーを洗浄するために1日数万トンの水を使うと紹介。この水使用が原因で工場建設に対する地元の反発が起きていることや、熊本に新設中のTSMC工場、震災に見舞われた熊本への「笑わボランティア」活動にも触れる。日本政府が対抗して千歳に設立した国産半導体会社「ラピダス」も同様に大量の水を使うと説明する。\n\n【イーロンマスクの宇宙AI構想】\n水と電力問題を同時に解決する策として、イーロンマスクが宇宙空間にAIのデータセンターを建設する「AI1」構想を提唱していることを紹介。宇宙では太陽光で電力を得られ、パネルを広げて赤外線放射で熱を宇宙space に逃がせるため水が不要になるとし、2028年までに100万機の衛星投入を計画していること、既に1万機飛んでいるスターリンク衛星よりも技術的に単純だというマスクの発言を紹介する。\n\n【宇宙AI構想への懸念】\n筆者自身の懸念として、衛星1機の打ち上げで電離層に穴が開くことが研究で分かっており、100万機を5年運用すると仮定すると1日550機が落下・再突入する計算になり、毎日550箇所で電離層に穴が開くことになると指摘。さらにアルミの粉が撒かれることで地球固有の周波数(シューマン共振、7.83Hz)が変化してしまう可能性にも言及する。\n\n【締めくくり:人間の効率性とAIの限界】\n人間の体内にあるATP合成酵素(合成モーター)はエネルギー効率100%を実現しており、これは生物が38億年かけて進化させたものであるため、AIが同等の効率に達するには同じく長い年月がかかるだろうと自説を述べる。発電から送電、AIの計算に至るまでのエネルギーロスの大きさを指摘し、人間が減りAIが増える社会は手放しに喜べるものではないと述べる。NTTが研究する光を使った集積回路など抜本的な技術革新がない限り、日本のような水資源国はますますAI関連企業に狙われると警鐘を鳴らして締めくくる。\n\n【まとめ】\nこの動画は、AIへの何気ない質問がペットボトル1本分の水を消費するという身近な事実から出発し、AI冷却・半導体製造にまつわる莫大な水消費の実態、イーロンマスクの宇宙AI構想とそのリスク、そして人間の持つエネルギー効率の高さを対比させながら、「AIの急速な普及は水と電力をめぐる世界的な奪い合いを引き起こしており、その代償を私たちはまだ十分に理解していない」という一貫したメッセージを伝える内容です。"},
      {"name": "トーマスガジェマガ", "isNew": true, "videoTitle": "【まだ折り畳みスマホを愛せない理由】コスパ最悪【Galaxy Z Fold8】", "videoUrl": "https://www.youtube.com/watch?v=bfMrNqAK0vY", "published": "2026-08-26T11:31:41+00:00", "failed": false, "summary": "チャンネル名: トーマスガジェマガ\n動画タイトル: 【まだ折り畳みスマホを愛せない理由】コスパ最悪【Galaxy Z Fold8】\nURL: https://www.youtube.com/watch?v=bfMrNqAK0vY\n公開日時: 2026-08-26T11:31:41+00:00\n形式: 単独トーク解説動画(ガジェットレビューチャンネル。折りたたみスマホをまだレビューしていない理由を自問自答形式で語る内容)\n\nこの動画は、話題の折りたたみスマホ「Galaxy Z Fold8」シリーズを技術的には市場最高と絶賛しつつも、「コストパフォーマンスが最悪」という理由から自分がまだ折りたたみスマホをレビューしていない、そして今後もレビューする予定がないことを論理立てて説明する内容です。\n\n【冒頭:結論の提示】\n折りたたみスマホを1台もレビューしていない理由をそろそろ説明した方がいいと考え、今回はコスパが最悪だからという結論を先に提示。\n\n【Galaxy Z Fold8のスペック紹介と絶賛】\n最近話題のGalaxy Z Fold8は、閉じた状態は縦が短く開くと横に非常に長いという、写真・漫画・動画の視聴に特化した比率を採用していると紹介。9月に発表されるとされるiPhoneの折りたたみモデルにも影響を与えたとされるサムスンへの液晶パネル大量発注の噂にも触れる。フォールド8は薄さ4.5mm、ウルトラは4.1mmでありながら重量201g/215gという、開閉機構があるにもかかわらずiPhone並みの軽さを実現している点、CPUはスナップドラゴン8エリート級、メモリ・ストレージも妥協なし、薄いのに20Wの無線充電にまで対応している点を挙げ、「全てのスマホの完全上位互換であり市場最高のスマホ」と高く評価。車で言えばレクサスLMのようなラグジュアリーな最高ランクの存在だと表現する。\n\n【コスパ最悪という結論の理由:価格】\n皮肉にもこのレクサスLMと同じ理由でコスパが最悪だと指摘。価格は27万円〜30万円からで、「憧れるけど買えない」という価格の妥当性の問題を抱えていると説明。自分自身はそもそも20万円のスマホですら高いと感じる派であり、現在のスマホ市場は「外れなしのバーゲンセール状態」で、14万円のGalaxy S26でも8万円のPixel 10Aでも基本的にできることは同じであるため、20万円を超えるスマホに払う価値はないと持論を展開する。\n\n【折りたたみである必然性への疑問】\n「大画面が開けて嬉しい」という折りたたみスマホの魅力について、自分ならではの切り返しを展開。もし本当に大画面を求めているなら、日常的にタブレットを持ち歩いているはずだが実際は持ち歩いていない人が多く、これは「大画面はあれば嬉しいが、タブレットを持ち運ぶほどの必要性はない」という程度のニーズであることの証拠だと指摘。折りたたみスマホは「普段はスマホ、必要な時だけ大画面」という都合の良さを提供するが、その利便性に13万円(Galaxy S26との価格差)を払う価値があるかは疑問だと述べ、「レクサスLMを選ばない理由と全く同じ」で、400万円のノアでも普通に走れるのと同様、14万円のスマホで足りるなら14万円で良いと結論づける。\n\n【スマホOSというもう一つの弱点】\n折りたたみスマホの最大の弱点として、大画面があってもスマホOS(AndroidもiOSも)ではコンテンツ消費しかできないことを挙げる。高額を払っても「遊びの質が上がるだけ」で贅沢品の域を出ないと指摘。一方でパソコンは30万円を投資してクリエイティブな仕事で回収できる可能性があるため、高額でも納得できると対比させる。\n\n【最近のスマホ値上げが追い風になっている側面】\niPhone 17 Proの価格が購入時18万9800円から現在19万4800円に値上がりしていることに触れ、この物価高騰により「iPhone最上位モデルを買うくらいなら折りたたみスマホを買えばいい」という誤解が生まれやすくなっている側面があると指摘しつつも、これは折りたたみスマホが手頃になったのではなく、単にiPhoneが高すぎるだけだと釘を刺す。\n\n【リセールバリューの弱さという致命的な欠点】\n27万円もするにもかかわらず出口戦略(資産価値)が弱い点を大きな欠点として指摘。メルカリでは液晶が液漏れしたジャンク品が多数出回っており、iPhone 17 Proなら18万円で買って19万4800円で売れる「実質無料ロジック」が折りたたみスマホでは通用しないと説明。サムスンの追加保証(約4万円で2年間、1回目の修理1.5万円、2回目2万円)を含めると最低31万円かかることにも言及する。\n\n【デザインコンセプトへの疑問】\n横長を売りにするあまり、スマホアプリやWebブラウザが最適化されている縦長の普段使いの体験を犠牲にしているGalaxy Z Fold8のコンセプト自体にも違和感を示す。\n\n【まとめと今後の展望】\n折りたたみスマホの課題は「コスト」と「OS(コンテンツ消費専用である点)」に集約されると総括。9月に噂されるiPhoneの折りたたみモデルも同じ課題を抱えているだろうと予想し、iPadとの共食いを避けたいApple側の事情にも触れつつ、Appleとして何らかの対抗策を示す必要があると予想する。最終的に「iPhone miniと同じ運命(需要が振るわない)を辿るのではないか」と予想して締めくくる。\n\n【まとめ】\nこの動画は、技術的には「市場最高のスマホ」と認めるGalaxy Z Fold8シリーズを、価格の妥当性・スマホOSの限界・資産価値の弱さという3つの観点から冷静に分析し、「折りたたみスマホは魅力的な体験を提供するが、その体験に対して現状の価格(27万円超)を払う合理的な理由は見出せず、レビューする価値すら感じられない」という一貫したコスパ批判のメッセージを伝える内容です。"},
      {"name": "ひすいこたろうの名言セラピー", "isNew": true, "videoTitle": "ひすい幸せ手帳の会。次回は、9月9日、重陽の節句のワークです！", "videoUrl": "https://www.youtube.com/watch?v=Kr6oMkGvf_Q", "published": "2026-08-26T12:08:00+00:00", "failed": false, "summary": "チャンネル名: ひすいこたろうの名言セラピー\n動画タイトル: ひすい幸せ手帳の会。次回は、9月9日、重陽の節句のワークです！\nURL: https://www.youtube.com/watch?v=Kr6oMkGvf_Q\n公開日時: 2026-08-26T12:08:00+00:00\n形式: 短尺(1分未満)の名言・実話エピソード紹介動画\n\nこの動画は、雨の日に思い出し笑いをしてしまうという投稿者(女性)が語る、10年以上前に当時付き合っていた彼氏(現在の夫)が見せた「ゴミ袋男」エピソードを通じて、雨の日という憂鬱な出来事が幸せな思い出に変わった実話を紹介する短編動画です。\n\n【冒頭:雨の日への独特な感情】\n普通は雨の日は満員電車や仕事があって憂鬱になるものだが、投稿者は朝窓を開けて雨を見ると、雨が強ければ強いほど思い出し笑いをしてしまうと語り始める。\n\n【10年以上前のゴミ袋男エピソード】\n当時付き合っていた彼氏は自他共に認めるおしゃれな人で、平日に2人の記念日が来るときは服にこだわる人だった。ある年、2人の記念日が台風と重なった際、彼は普通ならおしゃれな服を諦めそうなところを、大事なブランドの服を濡らさないために頭から靴まで大きなゴミ袋で覆い、テープで留めて駅まで歩いてきたというエピソードを紹介。道行く人は皆ぎょっとしていたという。カッパやコートを使わなかった理由は、彼が「手をふさぎたくない」ためにすぐ捨てられるビニール袋を選んだからだと明かす。\n\n【待ち合わせでの再会と衝撃】\n待ち合わせ場所には何事もなかったかのように、いつも通りおしゃれな姿で現れた彼。食事をしながら朝のゴミ袋の顛末を聞いた投稿者は、全身ゴミ袋姿の彼を想像して大声で笑ってしまったと振り返る。\n\n【「袋男」という表現】\n小説『箱男』になぞらえて、彼のことを「袋男」と評する一節が挿入される。\n\n【締めくくり:今も続く幸せな思い出】\nあれから10年以上経った今でも、窓を開けて雨を見るとあの日のことを思い出して笑ってしまうと語り、この出来事が自分を10年間幸せにし続けている思い出であると明かす。そして、この「全身ゴミ袋男」だった彼氏が、現在の投稿者の夫であることを明かして締めくくる。\n\n【まとめ】\nこの動画は、台風の日に大事な服を守るためゴミ袋を頭からかぶって現れた恋人という一見滑稽なエピソードを通じて、「ちょっとした変わったこだわりや不格好な行動の裏にある思いやりや個性こそが、何年経っても色褪せない幸せな思い出になる」という、名言セラピーらしい温かいメッセージを短く伝える内容です。"},
      {"name": "崔の店長日誌。", "isNew": true, "videoTitle": "明るい色の服を着ると「出会い」や「運」まで変わるって本当？/ 100日マラソン続〜1966日〜", "videoUrl": "https://www.youtube.com/watch?v=K9itzlgRis4", "published": "2026-08-28T20:00:22+00:00", "failed": false, "summary": "チャンネル名: 崔の店長日誌。\n動画タイトル: 明るい色の服を着ると「出会い」や「運」まで変わるって本当？/ 100日マラソン続〜1966日〜\nURL: https://www.youtube.com/watch?v=K9itzlgRis4\n公開日時: 2026-08-28T20:00:22+00:00\n形式: 毎日配信「100日マラソン」シリーズ(1966日目)、店主・崔氏によるトーク配信\n\nこの動画は、亡くなった師匠から昔よく言われていた「明るい色の服を着ると運や出会いが変わる」という教えについて、心理学的・科学的な研究結果を交えながら改めて詳しく解説する内容です。\n\n【冒頭:過去の「レインボーカラーのマフラー」エピソード】\n何年も前、娘がテレビの占いコーナーで「今日パパの天秤座は最凶、でもラッキーアイテムがあれば大丈夫」と言われ、そのラッキーアイテムが「レインボーカラーのマフラー」だったため「今日は詰んだ」と思ったという昔話を披露し、以来レインボーカラーのマフラーは見たことがないと笑いを取る。\n\n【テーマ導入と師匠の教え】\n今日のテーマは「明るい色の服を着ると出会いや運まで変わるって本当？」であると紹介。亡くなった師匠が生前、明るい色の服を着ることの重要性をずっと説いていたことを振り返り、東京でサラリーマンをしていた当時の自分は「そんなの変わるわけない」と思っていたと明かす。師匠は、特に女性が明るい色の服を着ると幸運が舞い込み、明るい色の服を着た女性が隣にいる男性の運も上がる、と語っていたという。\n\n【20年間の個人鑑定で見えた傾向】\n20年間で7000組以上を鑑定してきた経験の中で、最も多かった相談は離婚相談だったと明かし、離婚相談に来る人は「ユニフォームが決まっているのか」と思うほど圧倒的に黒い服を着ている人が多かったと振り返る。師匠は「チーム離婚にはユニフォームカラーがある」と辛口に語っていたといい、逆に20年間でピンクの服に花柄スカートを履いた女性が離婚相談に来たことは一度もなかったと述べる(黒が悪い、明るい色が良いという単純な話ではないと前置きした上で)。\n\n【科学的根拠1:色と気分の結びつき】\n1895年から2022年にかけて132回行われた研究(参加者延べ4万2266人)の結果を紹介し、明るい色の服を着ている人はポジティブな感情に、暗い色の服を着ている人はネガティブな感情に結びつきやすい傾向があるという研究結果を紹介。ただし色と感情の結びつきには文化差・個人差があることにも触れる。\n\n【科学的根拠2:「着衣認知」という心理学】\n服の色を変えると自分自身も変わるという心理学の概念「着衣認知」を紹介。人は何を着るかによって考え方・心理状態・行動まで影響を受けるとされ、医者やナースの服を自分が着ることで注意力・集中力が高まる例、制服やユニフォームが一体感や自覚を生む例を挙げる。明るい色の服を着る→気分が少し上がる→表情が変わる→姿勢や行動が変わる→人から話しかけやすくなる→新しい人との接点が生まれる、という「連鎖」が起きると説明し、服の色は他人からの印象だけでなく、着ている本人の表情や姿勢を通じて対人評価にも影響すると解説する。\n\n【自身の体験と師匠の教えの実践】\n自身もYouTube撮影時は黒い服(遊び心は入れつつ)で仕事モードの意識を高める一方、プライベートでは明るい色を多く着ると明かす。師匠から「将来セレブになった時、自分は一体どんな色の服を着ているだろうかを今から着ておきなさい」と言われていたことを紹介し、ブランドや高級品でなくても、その色を今から身につけることでそれ自体が引き寄せられてくると語っていたエピソードを紹介。また、恋愛・結婚がうまくいかない相談者に赤い服を勧めたところ出会いが変わったという実例にも触れる。\n\n【黒い服の意味・使い分け】\n黒が悪いわけではなく、黒はブロックする・仕事に集中するという意味合いがあり、学生服やスーツ、OL・サラリーマンの装いに黒やグレーが多いのはそのためだと説明。深い関係になりたくない相手に対しては暗い色の服でブロックするという使い方もできると師匠が語っていたことを紹介する。\n\n【締めくくり:明日から実践できること】\nいきなり性格や言動を変えるのは難しくても、服の色を変えることは比較的簡単にできる自己変革の手段であると強調。今日は明るく生きようと思った日に、自分の気分に合った明るい色を選ぶこと自体が自分への意思表示になり、気分→姿勢→行動→運や出会いの変化へとつながっていくと、心理学・脳科学の観点からも裏付けられていると締めくくる。\n\n【まとめ】\nこの動画は、亡くなった師匠が生前説いていた「明るい色の服を着ると運や出会いが変わる」という教えを、20年間の個人鑑定の経験談と「着衣認知」などの心理学研究の裏付けを交えて解説し、「服の色を変えるという小さな行動が、気分・表情・姿勢・対人関係を連鎖的に変化させ、結果として運や出会いを引き寄せる」という一貫したメッセージを伝える内容です。"},
      {"name": "UP&UP", "isNew": true, "videoTitle": "今の時代、AIとの付き合い方を学ばないと『マジ』で損します。仕事の8割が消える時代に「一生貧乏」になる人の特徴", "videoUrl": "https://www.youtube.com/watch?v=SAMQHa5drV8", "published": "2026-08-28T09:00:06+00:00", "failed": false, "summary": "チャンネル名: UP&UP\n動画タイトル: 今の時代、AIとの付き合い方を学ばないと『マジ』で損します。仕事の8割が消える時代に「一生貧乏」になる人の特徴\nURL: https://www.youtube.com/watch?v=SAMQHa5drV8\n公開日時: 2026-08-28T09:00:06+00:00\n形式: 複数講師による対談形式のトーク配信(AI・ロボットが仕事を奪う未来社会について語り合う内容。イベント「マジックモーメント」の宣伝も含む)\n\nこの動画は、AI・ロボットの急速な進化によって今後7年ほどで仕事の8割がなくなるとされる中、それでも人間に残される価値は何かを対談形式で語り合い、視聴者に「人が人を喜ばせる力」を磨くことの重要性を伝える内容です。\n\n【冒頭:権力構造の変化についての議論】\nこれまでお金を持つ人が権力を持っていた時代から、喜びや楽しみ・ワクワクを環境として人に提供できる人に価値が移っていくという世界観が語られる。ロボットにはできない「人が人を喜ばせる」ことこそが人間に残された役割だという方向性が冒頭から示される。\n\n【自分時間の増加という未来予測】\n将来的にロボットやAIが働いてくれるようになり、お金を稼ぐ・評価されるという概念が薄れていくと、1日24時間のうち労働時間が大幅に減り「自分時間」が増えると予測。お金の心配がなくなった時代には、自分の人生の時間を怒涛のように楽しめる能力があるかどうかが重要になり、その「楽しむ」という価値を幅広く人に提供できる人には、飛行機のファーストクラスやルイヴィトンの洋服が用意されるような、まるでセレブのような待遇が与えられるようになるかもしれないと語られる。エネルギー(電気)を生み出した人に権力が移っていく可能性にも言及。時代の価値基準が「侍が偉い時代→兵隊が偉い時代→お金持ち・ビジネスマンが偉い時代」と移り変わってきたように、次はベーシックインカム(ユニバーサルハイインカム/アバンダンス)によりお金に縛られない人生の時代が来るという見立てが語られる。\n\n【アメリカの雇用市場の異変】\nJPモルガンが今年新卒採用をゼロにしたという衝撃的な話題を紹介。アメリカのスタートアップ・ベンチャー企業数百社に取材したところ、「今年新卒を採用するか」という問いに「取らない」と答えた企業が64%にのぼったという調査結果を紹介し、若者が就職できない時代が既に始まっていると指摘する。\n\n【失業と治安悪化への懸念】\nベーシックインカムのような「働かなくても生活できる社会」に到達するまでの過渡期(今後6〜7年ほど)が最も厳しい時期になると予測。この期間に失業者が急増し治安が悪化するとし、既に「闇バイト」のような形でその兆候が現れ始めていると指摘。日本国内の殺人事件の内訳として、家族間殺人・若年層(10代)による殺人・海外から来た人による殺人が目立つとし、共通する要因は「貧困」であると分析。この傾向が今後7年でさらに加速すると懸念を示す。\n\n【ロボットの台数予測と「営業」という人間の武器】\n10年後にはロボットの世界の台数が100億台に達するという予測(現在の世界人口80億人を上回る数)を紹介し、旅行の際に「今日はどのロボットを連れて行く？」というような感覚になる未来像を語る。この過渡期を乗り越えるために何が必要かという問いに対し、「営業(個人が持てる人間的な営業力)」が鍵になると回答。AIやセールスロボットから営業をかけられても人は「買いたくない」と感じるものであり、AIには真似できない人間らしい営業・接客が今後さらに重要になると説明する。\n\n【若者たちの新たな働き方】\nAIによって従来の仕事が奪われる中、20代の優秀な若者たちが農業やスナック経営など、人間臭さが伴うビジネスを始めているという実例が紹介される。AIでできる仕事は誰でもコピーできてしまうため、そういった「人間にしかできない」仕事にシフトしている若者が増えているという。\n\n【締めくくり:イベント「マジックモーメント」への誘導】\n「人が人を喜ばせる」というロボットにはできない力を体現する存在として登壇者(大島さん)が称賛される中、この続きの詳しい話は今後開催されるリアルイベント「マジックモーメント」で話すという流れになり、視聴者に来場を呼びかけて拍手と歓声とともに配信を締めくくる。\n\n【まとめ】\nこの動画は、AI・ロボットの台頭により今後7年ほどで仕事の8割が消失し、その過渡期に失業や治安悪化という厳しい現実が待っているという警鐘を鳴らしつつ、「AIには真似できない、人が人を喜ばせる力・人間的な営業力こそが、これからの時代に価値を持ち続ける」という一貫したメッセージを、対談形式とイベント告知を交えて伝える内容です。"},
      {"name": "中野優作 / CAR and LIFE.（BUDDICA）", "isNew": true, "videoTitle": "【1年半で200万円下落！？】クラウン4兄弟のリセールを徹底比較！1年前の予想を答え合わせしたら“明暗”がハッキリ分かれました", "videoUrl": "https://www.youtube.com/watch?v=Enx7tQ_HExg", "published": "2026-08-27T10:00:31+00:00", "failed": false, "summary": "チャンネル名: 中野優作 / CAR and LIFE.（BUDDICA）\n動画タイトル: 【1年半で200万円下落！？】クラウン4兄弟のリセールを徹底比較！1年前の予想を答え合わせしたら“明暗”がハッキリ分かれました\nURL: https://www.youtube.com/watch?v=Enx7tQ_HExg\n公開日時: 2026-08-27T10:00:31+00:00\n形式: 中古車販売会社BUDDICA関係者2名による対談形式の車両解説動画(BUDDICA東京にて撮影。1年前に行ったリセール予測動画の答え合わせ企画)\n\nこの動画は、1年前に予測していたトヨタ「クラウン4兄弟」(エステート・スポーツ・クロスオーバー・セダン)のリセールバリュー(下取り・買取価格)について、実際のデータをもとに答え合わせを行い、それぞれの下落率や買取相場、狙い目のグレードを具体的な金額とともに解説する内容です。\n\n【冒頭:企画の経緯】\n1年前にクラウンシリーズのリセール予測動画を撮影し、当時はクラウンスポーツが改良されたタイミングで、セダンやエステートはまだ発売前だった状況を振り返る。今回はクラウン4兄弟全てのデータが出揃ったため、予測が当たったかどうかの答え合わせと、BUDDICAとしての買取金額の目安を初めて公開すると宣言する。\n\n【第1位:クラウンエステート】\nリセールが最も良かったのはクラウンエステートで、1年前の予測が的中したと確認。新車本体価格(Zグレード)は635万円で乗り出し680万〜700万円程度。買取金額の目安は状態や距離次第で550万〜650万円程度(距離2万km以下・評価点4以上が目安)とし、カーセンサーの売値相場も600万〜700万円が最多だったと紹介。新車から約2年で100万円程度(オプション込みなら150万円程度)下落し、月10万円ほどの償却ペースだが、この4兄弟の中では最も下落が緩やかで「中古で狙い目になる可能性がある」と評価。関東の一部地域で降雹被害(地球温暖化の影響)が増えており、被害歴のある車体は査定額が50万円ほど下がる点にも言及。\n\n【第2位:クラウンスポーツ】\n2番目に良かったのはクラウンスポーツ。新車本体価格590万円、乗り出し630万〜640万円程度。買取金額の目安は450万〜500万円で、3年落ち・3万km程度のデータをもとに算出。3年で180万円程度(月5万円ペース)の下落であり、「悪くない」ペースと評価。カーセンサーの売値相場は500万〜550万円が最多で、新車から150万円ほど安く買える点も紹介。買取と販売の差益(車屋の利益)は本来50万円ほど欲しいところ、実際は30万〜40万円程度が現実的なラインになるという業界の内情も明かされる。\n\n【第3位:クラウンクロスオーバー】\n3番目はクラウンクロスオーバーで、1年前の「スポーツより下がる」という予測が的中したと確認。新車本体価格595万円、乗り出し630万円程度。買取金額の目安は3年落ち・3万km以内で430万〜480万円。3年で200万円程度下落しており、スポーツ(3年で180万円)よりやや下落幅が大きいものの、従来のクラウンからすれば悪くない下落率と評価。カーセンサー相場は460万〜510万円台が最多で、新車比150万円以上お得に買えると紹介。7月23日にマイナーチェンジが発表され9月から改良モデルの発売が始まる予定であることにも触れ、モデルチェンジ後の相場変動は「半年〜1年後に緩やかに20万〜30万円程度下がる可能性がある」と予測する。\n\n【第4位:クラウンセダン】\n最も高額な新車本体価格730万円(乗り出し770万〜800万円近く)を誇るクラウンセダンについて解説。データがまだ少ない新しい車種だが、買取金額の目安は550万〜650万円程度とし、1年半で約200万円下落していると試算。3年落ちになればさらに下がり500万円を切る可能性、300万円近くまで落ちる可能性にも言及。中古相場では600万円台前半から出物があり、新車と比べて200万円もの差が出る車は国産では珍しく、レクサスLSクラスに匹敵する下落幅だと指摘。乗り心地・故障リスク・快適性の面でBMW5シリーズなど輸入車と比較しても遜色なく、「ちょっと高いけれど狙い目」だと評価する。\n\n【総括:人気色と各モデルの相場まとめ】\n人気色は黒・白を基準とし、茶色系・赤・シルバーなどは今後さらに相場が下がる可能性(30万円程度)があると予測。改めてエステート(550万〜650万円、12万km以内)、スポーツ(450万〜500万円)、クロスオーバー(430万〜480万円、3年・3万km以内)、セダン(状態次第で550万〜650万円)という買取目安金額を総まとめする。オプション・状態次第でこの金額から上下すると補足。\n\n【締めくくり:査定サービスの案内】\n自社の車両査定サービス「愛メーター」を紹介し、写真15枚で誰でも査定額を出せること、そのまま売却も可能であることを案内。BUDDICAが全国20店舗まで拡大し、フランチャイズ展開も始まったことを紹介し、出張査定にも対応していると案内して締めくくる。\n\n【まとめ】\nこの動画は、1年前に予測したトヨタ「クラウン4兄弟」のリセールバリューを実データで答え合わせし、エステートが最も下落が緩やかで狙い目である一方、セダンは高額なぶん下落額も最大となるなど、「4兄弟それぞれで明暗がはっきり分かれた」ことを具体的な金額とともに解説し、「中古で狙うならエステートかクロスオーバー、状態の良い個体を見極めれば新車よりお得にクラウンの魅力を味わえる」という実用的なメッセージを伝える内容です。"},
      {"name": "サムの本解説ch", "isNew": false, "videoTitle": "〇〇力が幸福度を爆上げする理由【要約】仕事も人間関係もうまくいく放っておく力　もっと「ドライ」でいい、99の理由", "videoUrl": "https://www.youtube.com/watch?v=oGPFm33IMHI", "published": "2026-08-25T11:00:08+00:00", "failed": false, "summary": "チャンネル名: サムの本解説ch\n動画タイトル: 〇〇力が幸福度を爆上げする理由【要約】仕事も人間関係もうまくいく放っておく力　もっと「ドライ」でいい、99の理由\nURL: https://www.youtube.com/watch?v=oGPFm33IMHI\n公開日時: 2026-08-25T11:00:08+00:00\n形式: 書籍要約・解説動画(禅僧・松野俊明氏著『仕事も人間関係もうまくいく放っておく力 もっと「ドライ」でいい、99の理由』を紹介)\n\nこの動画は、大きなトラブルもないのに毎日疲れてしまう人に向けて、その疲労の原因は「自分ではコントロールできないことにまで全力で向き合ってしまっていること」にあると指摘し、禅の教えに基づく「放っておく力」の身につけ方を解説する書籍要約動画です。\n\n【冒頭:問題提起】\n上司の顔色を読み、後輩をフォローし、大きなトラブルもないのに1日の終わりにどっと疲れてモヤモヤが消えないという経験を提示し、この疲れの原因は自分のやり方が悪いのではなく、他人の評価・過去の後悔・未来への不安・SNSの反応など、自分ではどうにもできない悩みにエネルギーを使い続けていることにあると再定義する。\n\n【著者・書籍紹介】\n紹介する本は曹洞宗の禅僧である松野俊明氏の著書で、禅(座禅や日常の実践を通じて自分の心の本質を直接見つめる教え)をベースに、①なぜ気にしすぎで疲れるのか、②禅が教える放っておく力の本質、③明日からできる放っておく力の鍛え方、という3章構成で紹介すると予告する。\n\n【1. なぜ私たちは気にしすぎで疲れるのか】\n疲れの原因を3つ紹介。1つ目は「他人を変えようとすること」で、何十年連れ添っても片付けない夫を変えようとする妻の相談例を挙げ、他人は思い通りにならず変えようとするたびにエネルギーを消耗すると説明。2つ目は「他人の評価を気にしすぎること」で、10人に気に入られようと10人分の自分を演じ、SNSでいい人の仮面をかぶり続けることで自分を見失ってしまうと指摘。3つ目は「情報やSNSに振り回されること」で、見たくない情報を浴び続けることは体に毒であり、SNSで盛ることにエネルギーを使うくらいなら自分磨きに使うべきだと述べる。\n\n【2. 禅が教える放っておく力の本質】\n放っておいていいことは放っておく、ただし無責任な投げ出しではなく、コントロールできることとできないことを見極めてエネルギーの使い先を変えることだと説明。ポイント1は「他人のことは放っておいて自分が変わることに集中する」ことで、友人関係は「半分、いや3割理解し合えれば上等」という松野氏の言葉を紹介し、職場もプライベートに踏み込まずドライでいいと説く。ポイント2は「過去と未来は放っておく」ことで、後悔も不安も実体のない妄想であり、後悔は「検証」に変えることで次に活かせる経験になると説明する。\n\n【3. 明日からできる放っておく力の鍛え方】\n99個のヒントの中から3つを紹介。①「便利屋さんにならない」こと。断れない人ほど頼まれ仕事の山に埋もれてしまうため、できないことははっきり断るべきだと説く。②「怒りを3秒で沈める呪文を持つ」こと。松野氏が禅の師匠から教わった「焦るな、焦るな、焦るな」「大丈夫、大丈夫、大丈夫」という言葉を3回唱える方法を紹介。③「比べるなら昨日の自分と比べる」こと。他人と比較するのではなく、絶好調の自分をベンチマークにして更新していく姿勢を勧める。\n\n【締めくくり】\n寝る前にスマホを見る時間を減らし、その時間で今日できたことを1つ思い出す習慣を提案。禅の言葉「人事を尽くして天命を待つ」を紹介し、「これは自分にコントロールできることか」と自問する習慣が放っておく力の第一歩になると締めくくる。\n\n【まとめ】\nこの動画は、日々の疲労やモヤモヤの正体を「コントロールできないことに反応し続ける自分自身」にあると喝破し、禅僧・松野俊明氏の教えに基づいて、他人・過去・未来を放っておき、断る力・怒りを鎮める呪文・昨日の自分との比較という具体的な習慣によって、「放っておいていいことを放っておくことこそが、仕事も人間関係も軽やかにする鍵である」という一貫したメッセージを伝える内容です。"},

      {"name": "宋世羅の羅針盤ちゃんねる（そんせらの羅針盤チャンネル）", "isNew": true, "videoTitle": "自分の内面にある歪んだ部分について。", "videoUrl": "https://www.youtube.com/watch?v=BoapyBUfm3E", "published": "2026-08-27T11:49:55+00:00", "failed": false, "summary": "チャンネル名: 宋世羅の羅針盤ちゃんねる（そんせらの羅針盤チャンネル）\n動画タイトル: 自分の内面にある歪んだ部分について。\nURL: https://www.youtube.com/watch?v=BoapyBUfm3E\n公開日時: 2026-08-27T11:49:55+00:00\n形式: 保険営業・金融営業の経験に基づく独断と偏見のトーク解説動画(記念すべきチャンネルの1本目の投稿)\n\nこの動画は、誰もが持っているとされる幼少期などの経験に由来する「歪み」(コンプレックスやこだわり)について、それを無理に解消しようとするのではなく、自覚した上でエネルギー源として活かすべきだという考え方を、自身の経験や営業マン採用の実例を交えて語る内容です。\n\n【冒頭:自己紹介と緊張】\n年間保険業のトップセールス経験があるという投稿者が、記念すべき1本目の投稿であることに緊張しつつ、ラーメンの食べ過ぎで「わがままボディ」になってきたと自虐から入る。\n\n【「歪み」の定義と具体例】\n「自分の歪んだ部分」というテーマを提示し、幼少期に親から「お兄ちゃんと違って要領が悪いね」と言われた経験や、学生時代にクラスの女子から「抱かれたくない男」に認定された経験、逆に「勉強ができる子、優秀な子」であり続けなければというプレッシャーを持たされた経験など、強烈な過去の経験が煮詰まって「歪み」になっていく例を挙げる。\n\n【自身の歪みの告白:中学時代のいじめ体験】\n自身の歪みの原点として、中学時代に不良にいじめられ、休み時間に不良と出会わないよう遠回りして音楽室まで避難していた経験を告白。その時の「ビビって逃げた自分」への悔しさが、その後20数年間「精神的に強くなりたい」という生きるテーマの根底にあり続けており、トップセールスやお金持ちを目指す動機も突き詰めればこの「ビビらない強い自分でありたい」という歪みに行き着くと分析する。\n\n【他人の歪みの例:大成功した経営者の学歴コンプレックス】\n金融営業の経験から接してきた、資本主義で大成功している60代・70代の経営者が、いまだに「自分には学がないから」と学歴コンプレックスを口にし続ける例を紹介し、これも歪みの一種だと説明する。\n\n【歪みは解消しなくてもいいという主張】\n歪みは他人から見ればピンとこない、どうでもいいことに見えるものだが、多くの人が何かしらの歪みを持っており、中には自覚していない人も多いと指摘。歪みは無理に解消できるものではなく、一生その歪みと戦い続けること自体がその人の人生であり、その戦いの跡がその人の「味」や「魅力」になると主張する。\n\n【歪みを隠すのではなく「ポップに」表現することの重要性】\n歪みを他人から見て匂う(気づかれる)ことを隠そうとする人がいるが、これは最もダサく、陰で「あの人は承認欲求がえぐいよね」などと評論されてしまうと指摘。自身は「証人欲求(承認欲求)が強いんだよね」「キャバクラでちやほやされるために仕事を頑張っている」などと自らポップに歪みを開示することで、周囲から「面白い人」と受け入れられやすくなると説明する。\n\n【他人の歪みへの憧れと注意点】\n野村證券時代の「毎日200件飛び込み営業をしてトップセールスになった」という伝説的な社員の例を挙げ、これも真面目さや才能ではなく、その人固有の「歪み」がその継続的な行動量を支えていたのだと分析。他人の歪みに影響されてスイッチが入ることはあっても、全く同じ歪みを他人が持とうとするのは無理があり危険だと注意を促す。\n\n【自己PRへの応用:「歪み」から自分の強みを見つける】\n就職活動などで「あなたのできることは？」と聞かれてもパッと思いつかない人が多い現実に触れ、表面化された資格や実績ではなく「自分がどんな歪みを持っているか」を考えた方が答えが出やすいと提案。塾の成績が悪く親から夕飯を抜かれた経験から「水準」に異様なこだわりを持つようになった、という架空の例を挙げ、こうした歪みを持つ人材は営業経験の有無に関わらず即採用すると述べ、自身が採用する立場ならどう評価するかを具体的に語る。\n\n【歪みを見極めて適材適所に活かす】\n外から見て「この人はこの部分が歪んでいる」と分かる場合、その歪みが本気になるポイントであり、それを見極めて適材適所に当てはめることが重要だと説明。学生時代のグループワークで「役に立たない」と省かれた経験から「役割」に強くこだわるようになった人材の例を挙げ、そうした人材に明確な役割を与えると高いパフォーマンスを発揮すると解説する。歪みの種類は人によって様々であり(役割へのこだわり、水準へのこだわり、メンタルの弱さへのコンプレックスなど)、その歪みが活きるフィールドも人それぞれ異なると総括する。\n\n【締めくくり】\n1人1人が変なこだわりや過去との戦いを抱えており、他人からは理解しがたくても、その人にとってはドラマがあり、それを踏まえれば「1人1人がエモく見える」と語る。自分がよく観るサスペンス映画の登場人物が皆それぞれ違った歪みを持っているように、現実の人間も同様だとまとめて締めくくる。\n\n【まとめ】\nこの動画は、幼少期のいじめ体験に由来する自身の「歪み」を赤裸々に告白しながら、「歪みは無理に解消するものではなく、自覚した上でポップに表現し、エネルギー源・自己PRの武器として活かすべきものである」という一貫したメッセージを、営業マン採用の視点や具体的なエピソードを交えて伝える、チャンネル記念すべき第1回目の投稿です。"},

  // 既読管理: サーバー側の new_in_last_check は「前回チェックと比較して動画が
  // 変わったか」しか表さず、自動チェックが1回でも走るとリセットされてしまう。
  // 実際にユーザーが読んだかどうかはこのブラウザの localStorage で別管理する。
  const READ_KEY = "ytChecker.readVideoUrls";

  function loadReadSet() {
    try {
      const raw = localStorage.getItem(READ_KEY);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch {
      return new Set();
    }
  }

  function markRead(videoUrl) {
    const set = loadReadSet();
    set.add(videoUrl);
    // 肥大化しすぎないよう直近200件に丸める
    const arr = Array.from(set).slice(-200);
    localStorage.setItem(READ_KEY, JSON.stringify(arr));
  }

  function relTime(iso) {
    const then = new Date(iso).getTime();
    const now = Date.now();
    const diffMs = now - then;
    const min = Math.floor(diffMs / 60000);
    if (min < 60) return `${Math.max(min, 0)}分前`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr}時間前`;
    const day = Math.floor(hr / 24);
    if (day < 30) return `${day}日前`;
    const mon = Math.floor(day / 30);
    return `${mon}ヶ月前`;
  }

  function render(data) {
    const list = document.getElementById("channelList");
    list.innerHTML = "";
    const readSet = loadReadSet();
    let unreadCount = 0;

    // 未読(新着)のチャンネルを上に、既読/変化なしを下に並べる。
    // 同じグループ内では元の(state.json の)並び順を保つ(安定ソート)。
    const sorted = data.channels
      .map((ch) => ({
        ch,
        isUnread: !!ch.summary && !readSet.has(ch.videoUrl),
      }))
      .sort((a, b) => Number(b.isUnread) - Number(a.isUnread));

    sorted.forEach(({ ch, isUnread }) => {
      if (isUnread) unreadCount++;

      const li = document.createElement("li");
      li.className = "channel" + (isUnread ? " is-new" : "");

      const chip = document.createElement("span");
      chip.className = "chip" + (isUnread ? " is-new" : "");
      chip.textContent = ch.failed ? "取得失敗" : (isUnread ? "新着あり" : "変化なし");

      const name = document.createElement("div");
      name.className = "channel-name";
      name.textContent = ch.name;

      const video = document.createElement("a");
      video.className = "video-title";
      video.href = ch.videoUrl;
      video.target = "_blank";
      video.rel = "noopener noreferrer";
      video.textContent = ch.videoTitle;

      const meta = document.createElement("div");
      meta.className = "meta" + (ch.failed ? " fail" : "");
      meta.textContent = ch.failed ? "前回チェック失敗" : `公開: ${relTime(ch.published)}`;

      li.append(chip, name, video, meta);

      if (ch.summary) {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "summary-toggle";
        toggle.textContent = isUnread ? "▸ 詳細な要約を読む(未読)" : "▸ 詳細な要約を読む";

        const body = document.createElement("div");
        body.className = "summary-body";
        body.textContent = ch.summary;

        toggle.addEventListener("click", () => {
          const open = body.classList.toggle("open");
          toggle.textContent = open ? "▾ 要約をたたむ" : "▸ 詳細な要約を読む";
          if (open && isUnread) {
            markRead(ch.videoUrl);
            chip.textContent = ch.failed ? "取得失敗" : "変化なし";
            chip.classList.remove("is-new");
            li.classList.remove("is-new");
          }
        });

        li.append(toggle, body);
      }

      list.appendChild(li);
    });

    document.getElementById("sumNew").textContent = unreadCount;
    document.getElementById("sumIdle").textContent = data.channels.length - unreadCount;
    document.getElementById("sumTotal").textContent = data.channels.length;

    const dot = document.getElementById("updatedDot");
    const text = document.getElementById("updatedText");
    dot.classList.toggle("live", unreadCount > 0);
    text.textContent = `最終チェック: ${relTime(data.checkedAt)}`;
  }

  render(CHANNELS_DATA);
</script>
