凄まじさ(オスプレイが飛来すると鼓膜より先に建物の窓枠が振動で揺れる現象)を音の物理的性質(疎密波が空気中より個体中を速く伝わる)を交えて説明し、基地負担を金銭的恩恵で正当化する意見に対しては、基地跡地に都市開発をした方が経済効果が高いという試算があることを紹介して反論する。\n\n【締めくくり】\n沖縄が戦争前は450年間平和が続いた場所であったことに触れ、視聴者に沖縄の複雑な事情への理解を求めつつ配信を終了。最後に9月1日から10日まで熊本へボランティア活動に赴くことを告知して締めくくる。\n\n【まとめ】\nこの動画は、沖縄県知事選挙への関心をきっかけに、沖縄という土地が持つ地政学的な重要性、フラクタル理論による宇宙・自然界とのつながり、琉球王国独自の女性中心の霊的統治構造、そして米軍基地問題という重い現実までを一貫した視点で語り、「沖縄は単純な政治的立場では語りきれない、独自の歴史と痛みを抱えた特別な場所である」という一貫したメッセージを、沖縄出身者ならではの実体験を交えて伝える内容です。"},

      {"name": "崔の店長日誌。", "isNew": true, "videoTitle": "靴・バッグ・トイレの使い方を見れば分かるあなたの運！/ 100日マラソン続〜1968日〜", "videoUrl": "https://www.youtube.com/watch?v=HP_oblpj-wU", "published": "2026-08-30T20:00:13+00:00", "failed": false, "summary": "チャンネル名: 崔の店長日誌。\n動画タイトル: 靴・バッグ・トイレの使い方を見れば分かるあなたの運！/ 100日マラソン続〜1968日〜\nURL: https://www.youtube.com/watch?v=HP_oblpj-wU\n公開日時: 2026-08-30T20:00:13+00:00\n形式: 毎日配信「100日マラソン」シリーズ(1968日目)、店主・崔氏によるトーク配信\n\nこの動画は、物の扱い方(靴の揃え方・バッグの置き方・トイレの使い方)に、その人の心の状態や運の良さが表れるという、著者が過去に個人鑑定の師匠から教わった実体験に基づく気づきを紹介する内容です。\n\n【冒頭:蕎麦屋でのエピソード】\n8月31日月曜日、8月最終日であることを伝えた後、行きつけの蕎麦屋で、向かいの席の男性が冷たいザルそばをフーフーと冷ましながら食べていたのが気になり、そばの味が入ってこなかったという小さな体験談を紹介する。\n\n【本題への導入:友人のトイレ使用エピソード】\n本日のテーマ「運がいい人は靴・バッグの扱い方、トイレの使い方を見れば分かる」を提示。先日、自分より年下ながら大きな成功を収めている友人が事務所に遊びに来た際、友人が使った後のトイレが想像以上に丁寧に、綺麗に使われていたことに気づき、かつて師匠から言われた言葉を思い出したというエピソードを語る。\n\n【師匠との思い出:個人鑑定時代の的中エピソード】\n個人鑑定業をしていた頃、上昇期にある2人の客に同じようなアドバイスをしたところ、師匠が「最初に来た子はすぐ結果が出るが、次の子は結果が出るまで時間がかかり、もう一度来るだろう」と予言し、その通りになったというエピソードを紹介。師匠にその根拠を尋ねたところ、占いの技術やコツではなく、来客時のスリッパの脱ぎ方・揃え方、バッグの置き方、トイレを使った後の丁寧さの違いだったと明かされる。\n\n【物の扱い方が心の扱い方を映すという解説】\n師匠が語った内容として、①物を雑に扱う習慣がある人は日常の様々な場面でも雑な行動が出やすいこと、②運がいい人とは「目の前の些細な変化に気づける人」であり、周囲への配慮に敏感だからこそチャンスにも気づけること、③その配慮は「今使う人」だけでなく「次に使う人の気持ち」を想像することにもつながること、を順に説明する。\n\n【心の余裕と配慮の関係】\n3つ目の要素として、「心に余裕がないと、人は目の前のことで精一杯になり周囲への配慮が狭くなる」という師匠の言葉を紹介。個人鑑定に来る相談者の多くが何かに困っている状態だからこそ、そういう時ほど周囲への配慮を忘れないことが状況を変える鍵になると説く。\n\n【結論:「やるから」ではなく「やる自分になる」ことが重要】\n師匠の言葉として「トイレを綺麗にするから運が良くなるのではなく、それを普段からやる自分になっていることが運を呼び込む」という核心的なメッセージを紹介。当時は理解できなかったこの言葉が、後に多くの成功者を見てきた経験を通じて、成功者は皆、物を丁寧に扱う人だったと腑に落ちたと振り返る。\n\n【締めくくりの1発ネタ:「神々アドバイザー」誤変換エピソード】\n月曜恒例の小ネタとして、買い物中に「開運アドバイザーさんですか」と話しかけられたお客さんの母親が「神々アドバイザー」と聞き間違えたエピソードを紹介し、今後「神々アドバイザー」を自称すると冗談交じりに宣言して、恒例のガッツポーズで締めくくる。\n\n【まとめ】\nこの動画は、友人のトイレの使い方から蘇った過去の師匠との思い出を通じて、「靴やバッグ、トイレを丁寧に扱うこと自体が運を呼ぶのではなく、それを普段から当たり前にできる自分であることこそが、周囲への配慮を生み、結果として運の良さにつながる」という一貫したメッセージを伝える内容です。"},
      {"name": "UP&UP", "isNew": false, "videoTitle": "今の時代、AIとの付き合い方を学ばないと『マジ』で損します。仕事の8割が消える時代に「一生貧乏」になる人の特徴", "videoUrl": "https://www.youtube.com/watch?v=SAMQHa5drV8", "published": "2026-08-28T09:00:06+00:00", "failed": false, "summary": "チャンネル名: UP&UP\n動画タイトル: 今の時代、AIとの付き合い方を学ばないと『マジ』で損します。仕事の8割が消える時代に「一生貧乏」になる人の特徴\nURL: https://www.youtube.com/watch?v=SAMQHa5drV8\n公開日時: 2026-08-28T09:00:06+00:00\n形式: 複数講師による対談形式のトーク配信(AI・ロボットが仕事を奪う未来社会について語り合う内容。イベント「マジックモーメント」の宣伝も含む)\n\nこの動画は、AI・ロボットの急速な進化によって今後7年ほどで仕事の8割がなくなるとされる中、それでも人間に残される価値は何かを対談形式で語り合い、視聴者に「人が人を喜ばせる力」を磨くことの重要性を伝える内容です。\n\n【冒頭:権力構造の変化についての議論】\nこれまでお金を持つ人が権力を持っていた時代から、喜びや楽しみ・ワクワクを環境として人に提供できる人に価値が移っていくという世界観が語られる。ロボットにはできない「人が人を喜ばせる」ことこそが人間に残された役割だという方向性が冒頭から示される。\n\n【自分時間の増加という未来予測】\n将来的にロボットやAIが働いてくれるようになり、お金を稼ぐ・評価されるという概念が薄れていくと、1日24時間のうち労働時間が大幅に減り「自分時間」が増えると予測。お金の心配がなくなった時代には、自分の人生の時間を怒涛のように楽しめる能力があるかどうかが重要になり、その「楽しむ」という価値を幅広く人に提供できる人には、飛行機のファーストクラスやルイヴィトンの洋服が用意されるような、まるでセレブのような待遇が与えられるようになるかもしれないと語られる。エネルギー(電気)を生み出した人に権力が移っていく可能性にも言及。時代の価値基準が「侍が偉い時代→兵隊が偉い時代→お金持ち・ビジネスマンが偉い時代」と移り変わってきたように、次はベーシックインカム(ユニバーサルハイインカム/アバンダンス)によりお金に縛られない人生の時代が来るという見立てが語られる。\n\n【アメリカの雇用市場の異変】\nJPモルガンが今年新卒採用をゼロにしたという衝撃的な話題を紹介。アメリカのスタートアップ・ベンチャー企業数百社に取材したところ、「今年新卒を採用するか」という問いに「取らない」と答えた企業が64%にのぼったという調査結果を紹介し、若者が就職できない時代が既に始まっていると指摘する。\n\n【失業と治安悪化への懸念】\nベーシックインカムのような「働かなくても生活できる社会」に到達するまでの過渡期(今後6〜7年ほど)が最も厳しい時期になると予測。この期間に失業者が急増し治安が悪化するとし、既に「闇バイト」のような形でその兆候が現れ始めていると指摘。日本国内の殺人事件の内訳として、家族間殺人・若年層(10代)による殺人・海外から来た人による殺人が目立つとし、共通する要因は「貧困」であると分析。この傾向が今後7年でさらに加速すると懸念を示す。\n\n【ロボットの台数予測と「営業」という人間の武器】\n10年後にはロボットの世界の台数が100億台に達するという予測(現在の世界人口80億人を上回る数)を紹介し、旅行の際に「今日はどのロボットを連れて行く？」というような感覚になる未来像を語る。この過渡期を乗り越えるために何が必要かという問いに対し、「営業(個人が持てる人間的な営業力)」が鍵になると回答。AIやセールスロボットから営業をかけられても人は「買いたくない」と感じるものであり、AIには真似できない人間らしい営業・接客が今後さらに重要になると説明する。\n\n【若者たちの新たな働き方】\nAIによって従来の仕事が奪われる中、20代の優秀な若者たちが農業やスナック経営など、人間臭さが伴うビジネスを始めているという実例が紹介される。AIでできる仕事は誰でもコピーできてしまうため、そういった「人間にしかできない」仕事にシフトしている若者が増えているという。\n\n【締めくくり:イベント「マジックモーメント」への誘導】\n「人が人を喜ばせる」というロボットにはできない力を体現する存在として登壇者(大島さん)が称賛される中、この続きの詳しい話は今後開催されるリアルイベント「マジックモーメント」で話すという流れになり、視聴者に来場を呼びかけて拍手と歓声とともに配信を締めくくる。\n\n【まとめ】\nこの動画は、AI・ロボットの台頭により今後7年ほどで仕事の8割が消失し、その過渡期に失業や治安悪化という厳しい現実が待っているという警鐘を鳴らしつつ、「AIには真似できない、人が人を喜ばせる力・人間的な営業力こそが、これからの時代に価値を持ち続ける」という一貫したメッセージを、対談形式とイベント告知を交えて伝える内容です。"},
      {"name": "中野優作 / CAR and LIFE.（BUDDICA）", "isNew": true, "videoTitle": "洗車道具を簡単収納！車にも詰めちゃうバケツセット", "videoUrl": "https://www.youtube.com/watch?v=BWooD_EnaAk", "published": "2026-08-30T10:00:28+00:00", "failed": false, "summary": "チャンネル名: 中野優作 / CAR and LIFE.（BUDDICA）\n動画タイトル: 洗車道具を簡単収納！車にも詰めちゃうバケツセット\nURL: https://www.youtube.com/watch?v=BWooD_EnaAk\n公開日時: 2026-08-30T10:00:28+00:00\n形式: ショート動画(スタッフとの会話形式によるガジェット紹介)\n\nこの動画は、洗車用品を1つのバケツにまとめて収納できる「フェニックスバケツセット」を、中野優作氏がスタッフとのやり取りを通じて紹介する短尺のガジェット紹介動画です。\n\n【導入:スタッフが洗車道具を手で大量に運ぶ様子】\nスタッフがシャンプーなど洗車道具を両手いっぱいに抱えて運んでくる様子に対し、中野氏が「洗車するだけで引っ越しみたいになっている」と指摘し、「洗車は段取り8割、仕事2割」という持論を述べる。\n\n【フェニックスバケツセットの紹介】\nフェニックスシャンプー、コーティング剤、下地剤、リムーバーなど洗車用品一式がすべて収納できる専用バケツを紹介。開発に時間をかけたキャスターストッパー付きの椅子としても使える機能性を持ち、腰痛持ちのスタッフでも座ったまま洗車作業ができる点をアピールする。\n\n【収納力とコンパクトさのアピール】\n片付けの際は軽自動車の後部座席にもすっぽり収まるほどコンパクトに収納できることを実演し、スタッフが「めちゃくちゃスマート」と驚く様子を見せる。\n\n【購入案内】\nこのバケツセットがAmazonですぐに購入できることを紹介し、「時短で行こう」と締めくくる。\n\n【まとめ】\nこの動画は、洗車道具一式をコンパクトに収納・運搬でき、椅子としても使える「フェニックスバケツセット」の実用性を、スタッフとの軽妙なやり取りを通じて紹介し、「段取りを整えることで洗車作業がスマートになる」という実用的なメッセージを伝える短尺のガジェット紹介動画です。"},
      {"name": "サムの本解説ch", "isNew": false, "videoTitle": "〇〇すれば、悩みの９割は解決する【要約】科学が解明した　悩んでもしょうがないことリスト", "videoUrl": "https://www.youtube.com/watch?v=ASyISdogGlI", "published": "2026-08-29T11:00:10+00:00", "failed": false, "summary": "チャンネル名: サムの本解説ch\n動画タイトル: 〇〇すれば、悩みの９割は解決する【要約】科学が解明した　悩んでもしょうがないことリスト\nURL: https://www.youtube.com/watch?v=ASyISdogGlI\n公開日時: 2026-08-29T11:00:10+00:00\n形式: 書籍要約・解説動画(石川正斗氏の著書『科学が解明した 悩んでもしょうがないことリスト』を紹介)\n\nこの動画は、集中できない・SNSで他人に嫉妬する・上司の顔色を思い出して不安になるといった現代人特有の悩みが、実は本人の性格や意思の弱さのせいではなく、大昔の環境に適応した脳の仕組みが現代とずれて誤作動しているだけであることを進化心理学の観点から解き明かし、悩みを「しょうがないもの」「変えられるもの」「放置してはいけないもの」の3つに分類して対処する具体的な方法を解説する内容です。\n\n【冒頭:よくある悩みのシナリオ提示】\n朝は今日こそ集中して定時で帰ろうと決意するのに、パソコンの前に座ると集中力が続かずSNSに1時間も費やしてしまう、同世代の友人の昇進や副業成功の投稿を見て嫉妬し、他人の幸せを素直に喜べない自分を「性格が悪い」と責めてしまう、夜になると上司の嫌な表情や自分の失敗を思い出して会社に行くのが怖くなる、という具体的な日常シーンを提示。こうした不安・嫉妬・注意散漫は性格の悪さではなく、かつて祖先を過酷な環境から生き残らせた心の働きが現代でも自動的に作動しているだけだと述べ、感情が湧くこととその感情ゆえに現実の問題を放置することは別問題であると整理する。\n\n【著者・書籍紹介と目次予告】\n著者は認知科学を専門とし、生物学・脳科学・心理学の学際領域を研究してきた石川正斗氏。本書『科学が解明した 悩んでもしょうがないことリスト』は不安・嫉妬・注意散漫・SNS疲れなど現代人の51の悩みを進化心理学の視点から読み解いた1冊であると紹介。今回は全51項目ではなく、多くの悩みに共通する正体と「しょうがないこと」「変えられること」の見分け方に絞り、①悩みが消えないのはあなたのせいではない、②悩みは3つに分けると楽になる、③感情を変えるな、感情の後を変えろ、という3章構成で解説すると予告する。\n\n【1. 悩みが消えないのはあなたのせいではない】\n人間の心や脳の仕組みは、スマホやパソコンが溢れる現代社会に合わせて作られたものではなく、数百万年もの間、食料不足や猛獣に怯える過酷な環境で、わずかな異変に気づき危険を避け群れの仲間の顔色を伺う敏感な心を持つ人だけが生き残って子孫を残せたと説明。著者はこの「古い心」と「新しい社会」のずれを「生物学的な不適合」と呼んでいると紹介する。具体例として、狩猟採集時代に木の実集めに没頭しすぎて背後のライオンの気配に気づかなかった人は真っ先に食べられて淘汰されたため、目の前の作業から瞬時に注意を切り替える力が生存に必要だったと解説し、パソコン作業中にスマホのLINE通知が気になってしまうのも同じ本能によるものだと述べる。不安が消えない理由についても、動物は危険に対し「戦う・逃げる・隠れる」のいずれかを選び行動が完結すると脳が安心するが、現代人は上司を殴ったり全力で逃げたりできないため「隠れる」(嫌なメールを未読放置する、布団に潜る)を選びがちであり、隠れるだけでは脳が危険の終了を確認できず警戒アラームが鳴り続けてしまうと説明。さらに上司への報告を先延ばしにしてしまう理由についても、悪い報告なら叱られ、良い報告でも次の仕事が増えるため、脳にとってはどちらに転んでも新たな負担が生まれる行為であり、先延ばしには短期的な利益があるのだと解説する。\n\n【2. 悩みは3つに分けると楽になる】\n悩みを3つの箱に分けて整理する方法を提示。1つ目の箱「湧いてくる反応はしょうがない」では、不安・嫉妬・怒り・他人の目への恐怖は理屈で命令して消せるものではないと説明し、無人ドリンク販売コーナーの実験(募金箱の上に花の写真を貼った週より、じっと見つめる目の写真を貼った週の方が10週間にわたり一貫して支払い額が多かった)を紹介し、人は誰も見ていなくても視線の気配だけで本能的にルールを守ろうとすることを示す。2つ目の箱「環境や行動は変えられる」では、SNSで他人の成功を見て嫉妬してしまう例を挙げ、狩猟採集時代の嫉妬は仲間に獲物の再分配を求めるための武器だったが、現代のSNSに映る成功者は自分に何かを分配してくれる「仲間」ではないため、苦しい感情だけが残る「勘違いの嫉妬」だと説明。しかもスマホ経由で24時間、世界中の何千人もの成功のハイライトが流れ込む異常な環境が、自分だけが取り残されているという錯覚を強めるとし、SNSアプリを消す・ミュートにするなど、環境そのものは自分の意思で変えられると述べる。3つ目の箱「現実の危険は放置しない」では、威圧的な上司を怖いと感じること自体は正常な反応だが、実際に日常的な暴言やパワハラを受けているなら、それは現代社会のルール違反という現実の危険であり、我慢して耐えるのではなく人事部への相談や記録保持といった現実的な防衛行動が必要だと強調。同様に、注意がそれやすいという本能的な性質があっても、車の運転中や危険な機械の操作中にスマホを見続けることを放置してよい理由にはならないと釘を刺す。\n\n【3. 感情を変えるな、感情の後を変えろ】\n本能から自然に湧き上がる感情を「ホットハート」、意識的に論理的に考える理性を「クールマインド」と呼ぶ本書の概念を紹介。ホットハートに対して「不安になるな」「嫉妬するな」と理屈で命令しても感情の暴走は止められないが、クールマインドを使えば感情が湧いた後にどう行動するか、どんな環境を用意しておくかは工夫できると説明。著者が提唱する「心のメガネ」という考え方を紹介し、視力が悪くても眼鏡で補うのが当たり前であるように、記憶力の弱さや注意力の散漫さもテクノロジーや仕組みで補えばよいとし、忘れやすいならスマホのリマインダーを使う、報告を避けがちなら進捗が自動共有されるクラウドを導入する、考えがまとまらないならAIに話しかけて論点を整理してもらう、といった「失敗しにくい仕組み作り」を提案する。さらに、常に最大の結果を追い求める「マキシマイザー」と、ある程度で満足できる「サティスファイサー」という2つのタイプを紹介し、マキシマイザーは目標未達なら苦しみ、達成してもすぐ次の目標を探すため一生虚しさが続く構造になっていると指摘。資本主義社会が「もっと稼げ、もっと優秀になれ」と煽ることで人々を意図的にマキシマイザーに仕立てあげているとし、自分なりの「ここまでできれば十分」という合格ラインをあらかじめ決めておくサティスファイサーの姿勢が必要だと説く。\n\n【締めくくり:3つのアクションプラン】\n視聴者に向けて具体的な行動を提案。アクション1として、今一番悩んでいることを1つ紙に書き出し、「しょうがない感情」「変えられる環境」「放置できない現実の問題」の3つに分解してみること。アクション2として、忘れっぽいなら通知設定をする、夜中にお菓子を食べてしまうならお菓子コーナーに近づかないルールを作るなど、自分の苦手を補う仕組みを1つ作ること。アクション3として、収入や資格、貯金額などについて、家族との時間や健康を犠牲にしてまで上を目指さないという自分なりの「十分なライン」を明確に書き出すことを提案する。最後に、著者の石川氏自身が50代後半からダンススクールに通い始め、10年以上の練習で体の柔軟性は劇的に伸びたもののリズム感だけは全く上達しなかったというエピソードを紹介し、人には努力して伸びることと伸びにくいことが必ずあるとし、変えられない感情や生まれ持った弱さとの戦いをやめ、変えられる場所・仕組み・環境の方へ努力と時間を移していくべきだと締めくくる。\n\n【まとめ】\nこの動画は、集中できない・不安が消えない・SNSで嫉妬してしまうといった現代人の悩みの正体が、狩猟採集時代に適応した心の仕組みと現代社会とのずれによる「誤作動」であることを進化心理学の知見で解き明かし、「感情はしょうがない、環境は変えられる、危険は放置しない」という3つの区別を意識して、変えられない感情との無駄な戦いをやめ、変えられる仕組みや環境に力を注ぐことこそが悩みを楽にする鍵であるという一貫したメッセージを伝える内容です。"},

  // 既読管理: サーバー側の new_in_last_check は「前回チェックと比較して動画が
  // 変わったか」しか表さず、自動チェックが1回でも走るとリセットされてしまう。
  // 実際にユーザーが読んだかどうかはこのブラウザの localStorage で別管理する。
  const READ_KEY = "ytChecker.readVideoUrls";

  function loadReadSet() {
    try {
      const raw = localStorage.getItem(READ_KEY);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch {
      return new Set();
    }
  }

  function markRead(videoUrl) {
    const set = loadReadSet();
    set.add(videoUrl);
    // 肥大化しすぎないよう直近200件に丸める
    const arr = Array.from(set).slice(-200);
    localStorage.setItem(READ_KEY, JSON.stringify(arr));
  }

  function relTime(iso) {
    const then = new Date(iso).getTime();
    const now = Date.now();
    const diffMs = now - then;
    const min = Math.floor(diffMs / 60000);
    if (min < 60) return `${Math.max(min, 0)}分前`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr}時間前`;
    const day = Math.floor(hr / 24);
    if (day < 30) return `${day}日前`;
    const mon = Math.floor(day / 30);
    return `${mon}ヶ月前`;
  }

  function render(data) {
    const list = document.getElementById("channelList");
    list.innerHTML = "";
    const readSet = loadReadSet();
    let unreadCount = 0;

    // 未読(新着)のチャンネルを上に、既読/変化なしを下に並べる。
    // 同じグループ内では元の(state.json の)並び順を保つ(安定ソート)。
    const sorted = data.channels
      .map((ch) => ({
        ch,
        isUnread: !!ch.summary && !readSet.has(ch.videoUrl),
      }))
      .sort((a, b) => Number(b.isUnread) - Number(a.isUnread));

    sorted.forEach(({ ch, isUnread }) => {
      if (isUnread) unreadCount++;

      const li = document.createElement("li");
      li.className = "channel" + (isUnread ? " is-new" : "");

      const chip = document.createElement("span");
      chip.className = "chip" + (isUnread ? " is-new" : "");
      chip.textContent = ch.failed ? "取得失敗" : (isUnread ? "新着あり" : "変化なし");

      const name = document.createElement("div");
      name.className = "channel-name";
      name.textContent = ch.name;

      const video = document.createElement("a");
      video.className = "video-title";
      video.href = ch.videoUrl;
      video.target = "_blank";
      video.rel = "noopener noreferrer";
      video.textContent = ch.videoTitle;

      const meta = document.createElement("div");
      meta.className = "meta" + (ch.failed ? " fail" : "");
      meta.textContent = ch.failed ? "前回チェック失敗" : `公開: ${relTime(ch.published)}`;

      li.append(chip, name, video, meta);

      if (ch.summary) {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "summary-toggle";
        toggle.textContent = isUnread ? "▸ 詳細な要約を読む(未読)" : "▸ 詳細な要約を読む";

        const body = document.createElement("div");
        body.className = "summary-body";
        body.textContent = ch.summary;

        toggle.addEventListener("click", () => {
          const open = body.classList.toggle("open");
          toggle.textContent = open ? "▾ 要約をたたむ" : "▸ 詳細な要約を読む";
          if (open && isUnread) {
            markRead(ch.videoUrl);
            chip.textContent = ch.failed ? "取得失敗" : "変化なし";
            chip.classList.remove("is-new");
            li.classList.remove("is-new");
          }
        });

        li.append(toggle, body);
      }

      list.appendChild(li);
    });

    document.getElementById("sumNew").textContent = unreadCount;
    document.getElementById("sumIdle").textContent = data.channels.length - unreadCount;
    document.getElementById("sumTotal").textContent = data.channels.length;

    const dot = document.getElementById("updatedDot");
    const text = document.getElementById("updatedText");
    dot.classList.toggle("live", unreadCount > 0);
    text.textContent = `最終チェック: ${relTime(data.checkedAt)}`;
  }

  render(CHANNELS_DATA);
</script>
