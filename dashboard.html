<title>YouTube新着チェッカー</title>
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface-raised: #fbfaf8;
    --ink: #21262b;
    --ink-muted: #5b6470;
    --ink-faint: #8b929b;
    --border: #dedbd3;
    --border-strong: #c7c3b8;
    --accent: #2e5c8a;
    --accent-soft: #e4ecf3;
    --new: #d9622b;
    --new-soft: #fbe7db;
    --idle: #7d8880;
    --idle-soft: #eceae4;
    --shadow: 0 1px 2px rgba(33, 38, 43, 0.06), 0 4px 16px rgba(33, 38, 43, 0.05);

    --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Hiragino Mincho ProN", Georgia, serif;

    --font-mono: ui-monospace, "SF Mono", Menlo, "Courier New", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --surface: #1b1f23;
      --surface-raised: #21262b;
      --ink: #e8e6e1;
      --ink-muted: #9aa2a9;
      --ink-faint: #6b7278;
      --border: #2c3237;
      --border-strong: #3a4046;
      --accent: #7fb0e0;
      --accent-soft: #223140;
      --new: #f0904f;
      --new-soft: #3a2618;
      --idle: #7c8680;
      --idle-soft: #23282a;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.25);
    }
  }

  :root[data-theme="dark"] {
    --bg: #14171a;
    --surface: #1b1f23;
    --surface-raised: #21262b;
    --ink: #e8e6e1;
    --ink-muted: #9aa2a9;
    --ink-faint: #6b7278;
    --border: #2c3237;
    --border-strong: #3a4046;
    --accent: #7fb0e0;
    --accent-soft: #223140;
    --new: #f0904f;
    --new-soft: #3a2618;
    --idle: #7c8680;
    --idle-soft: #23282a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.25);
  }

  :root[data-theme="light"] {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface-raised: #fbfaf8;
    --ink: #21262b;
    --ink-muted: #5b6470;
    --ink-faint: #8b929b;
    --border: #dedbd3;
    --border-strong: #c7c3b8;
    --accent: #2e5c8a;
    --accent-soft: #e4ecf3;
    --new: #d9622b;
    --new-soft: #fbe7db;
    --idle: #7d8880;
    --idle-soft: #eceae4;
    --shadow: 0 1px 2px rgba(33, 38, 43, 0.06), 0 4px 16px rgba(33, 38, 43, 0.05);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 20px 64px;
  }

  header.top {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 28px;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }

  .subtitle {
    color: var(--ink-muted);
    font-size: 14px;
    margin-top: 2px;
  }

  .summary-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 24px 0 28px;
  }

  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }

  .summary-card .num {
    font-family: var(--font-display);
    font-size: 28px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .summary-card.new .num { color: var(--new); }
  .summary-card .label {
    margin-top: 6px;
    font-size: 12px;
    color: var(--ink-muted);
  }

  .updated-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-faint);
    font-family: var(--font-mono);
    margin-bottom: 18px;
  }

  .updated-line .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--idle);
    flex: none;
  }
  .updated-line .dot.live { background: var(--new); }

  ul.channels {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  li.channel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 14px;
    align-items: start;
    transition: border-color 0.15s ease;
  }

  li.channel.is-new {
    border-color: color-mix(in srgb, var(--new) 45%, var(--border));
  }

  .chip {
    grid-row: 1 / 3;
    align-self: center;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.03em;
    padding: 5px 10px;
    border-radius: 999px;
    white-space: nowrap;
    background: var(--idle-soft);
    color: var(--idle);
  }
  .chip.is-new {
    background: var(--new-soft);
    color: var(--new);
    font-weight: 600;
  }

  .channel-name {
    font-weight: 600;
    font-size: 14.5px;
    color: var(--ink);
  }

  .video-title {
    font-size: 13.5px;
    color: var(--ink-muted);
    text-decoration: none;
    line-height: 1.4;
  }
  .video-title:hover { color: var(--accent); text-decoration: underline; }
  li.channel.is-new .video-title { color: var(--ink); }

  .meta {
    grid-column: 2;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 2px;
  }

  .meta .fail { color: var(--new); }

  .summary-toggle {
    grid-column: 2;
    justify-self: start;
    margin-top: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--accent);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .summary-toggle:hover { text-decoration: underline; }

  .summary-body {
    grid-column: 2;
    margin-top: 10px;
    padding-top: 12px;
    border-top: 1px dashed var(--border-strong);
    font-size: 13.5px;
    line-height: 1.75;
    color: var(--ink);
    white-space: pre-wrap;
    display: none;
  }
  .summary-body.open { display: block; }

  footer {
    margin-top: 32px;
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
  }
  footer a { color: var(--ink-muted); }

  @media (max-width: 480px) {
    .summary-row { grid-template-columns: 1fr 1fr; }
    .summary-card:last-child { grid-column: 1 / -1; }
  }
</style>

<div class="page">
  <header class="top">
    <div class="eyebrow">YouTube Watch Status</div>

</div>

    channels: [
      {"name": "さとうみつろう", "isNew": true, "videoTitle": "ハーバード大学の研究で判明した「暗い寝室」の効果とは？！", "videoUrl": "https://www.youtube.com/watch?v=Q0-y69AdSJk", "published": "2026-09-12T09:00:06+00:00", "failed": false, "summary": "チャンネル名: さとうみつろう\n動画タイトル: ハーバード大学の研究で判明した「暗い寝室」の効果とは？！\nURL: https://www.youtube.com/watch?v=Q0-y69AdSJk\n公開日時: 2026-09-12T09:00:06+00:00\n形式: ロサンゼルス滞在中に撮影された単独トーク配信(前回動画に続く時差ボケ・体内時計シリーズ)\n\nこの動画は、佐藤みつろう氏がロサンゼルス滞在中に実際に成功させた時差ボケ解消法として「夕日を見つめる」ことを紹介しつつ、朝日を浴びることの重要性、部屋を真っ暗にして寝ることの効果、そして「夜は真っ暗、朝は徐々に明るく」という相反する2つの条件を両立させるための(半分ネタの)アイデアを、イーロン・マスクのXプライズ財団や大和言葉の話を交えながら語る内容です。\n\n【冒頭:ロサンゼルスでの奇跡的な日付】\n「おはようございます。佐藤郎です」と挨拶し、今日が9月11日でロサンゼルス現地時間が奇しくも「9時11分」であったことに驚きを示しつつ、部屋をできる限り真っ暗にして寝る健康法について伝えると宣言する。\n\n【時差ボケ解消の実践:夕日を見つめる】\n一般的に「地球を西回りすると時差ボケしないが東回り(日本→アメリカ)は時差ボケする」と言われる中、前夜21時に羽田を出て機内で5時間ほど寝て体は朝のつもりでいたが、ロサンゼルス到着時は夕方で、そこから眠りに入る体を作る必要があったと説明。実際に時差ボケ解消に成功した方法は「夕日を見つめる」という簡単なことだったと明かし、朝日を見つめて体内時計をリセットする健康法と同様に、夕日でも同じ効果があると説明する。\n\n【イーロン・マスクのXプライズ財団とミトコンドリア研究】\n世界一の資産家イーロン・マスクが、10年間人間を若返らせることに成功した団体に150億円を与える「Xプライズ」というコンペを開催しており、世界200チームの応募のうち20チームが残っていて、ハーバードなどトップクラスの機関を含め、日本からもMIT系や大阪大学の吉森教授(泡盛関連)のチームが残っていることを紹介。残った20チームのほとんどがミトコンドリアの研究をしているとし、若返り・健康の鍵はミトコンドリアにあると語る。ミトコンドリアが最も多く存在する場所として、心臓、脳、そして目から入る光を捉える「視交叉(本人は「師匠株」と発音)」の3つを挙げ、ミトコンドリア自体が体内時計を司る主役であると説明する。\n\n【コルチゾール覚醒反応(CAR)と夕日の効果】\n朝日を見ることでコルチゾールが急上昇し血糖値が上がって覚醒する「コルチゾール・アウェイクネス・レスポンス(CAR)」について説明し、その逆の夕日にも特有の太陽光スペクトラムがあり、それを体が判別して「今は夕方だ」とリセットしてくれると解説。他にも冷水シャワーや、自身が実践している「週波音(周波数音)を耳から聞く」ライフハックも併用したが、一番の要因は自差(時差)ボケの成功だったと語る。\n\n【ライフハック界隈のガムテープ習慣】\nなぜ部屋を暗くすべきかについて、健康オタクの「ミトコンドリア界隈」で旅行時にガムテープを持ち歩き、テレビリモコンの赤色LEDやホテルの人感センサーの緑色LEDなど、瞼を閉じていても皮膚を突き破って視交叉に信号を送ってしまう微弱な光源を塞ぐことが流行っていると紹介する。\n\n【自身の体験:沖縄でクーラーをやめた話】\nできる限りナチュラルに生活しようとクーラーをやめていた時期に沖縄で窓を開けて寝ていたが、街灯や自販機の光でミトコンドリアが刺激されることに気づき、結局クーラーに戻してカーテンを閉め真っ暗にしたところ、以前(窓を開けカーテンも開けていた時)より体調が良くないことに気づいたというエピソードを紹介。その理由として、自然界では朝日はゆっくりと徐々に昇るものであり、実験でも「いきなり光を当てる群」と「徐々に明るくなる群」では後者の方が目覚めが良かったという研究結果があると説明する。\n\n【矛盾する2条件とフジテレビのADさんネタ】\n「夜は真っ暗にしたいが、朝は徐々に明るくしたい」という相反する条件を両立させる方法として、夜中にこっそり部屋に入ってきてカーテンをゆっくり開けてくれる「フジテレビの目覚ましドッキリのアシスタントディレクター」が必要だと冗談交じりに語り、原始の森で寝ていればこの矛盾は自然に解決するが、都会に住んでいるから街灯や自販機の光を防ぐ必要が生じ、この矛盾が生まれるのだと説明する。\n\n【日本の大和言葉:夜明けを表す5つの段階】\n先々週広島で杉本錬先生とEXILEのあっちさんと講演会をした際に学んだこととして、日本の大和言葉には夜明けのわずかな光の違いを表す言葉が複数あることを紹介。「かわたれ」「朝ぼらけ(本が読めるようになる頃)」「東雲(しののめ)」に加え、「あかつき」「あけぼの」「つとめて」も挙げ、英語圏ではAM6時45分などとしか表現できない15分刻みの微妙な違いを、日本人は5段階の言葉で表現してきたことに感心する。世界共通で朝日・夕日を見つめる(拝む)ことがミトコンドリアダイナミクスを刺激し体内時計をリセットする上で重要だとし、インド哲学などでも太陽を礼拝する文化があると補足する。\n\n【締めくくり:ロサンゼルス探索の予告とまとめ】\nこれからロサンゼルスを探索すると予告し、コラボできる人やロス在住の知人を探しながら歩くと語る。最後に改めて、部屋を暗くしテレビの赤いランプもガムテープで塞ぎ遮光カーテンで真っ暗にして寝ること、しかし朝いきなりカーテンを開けるのは逆効果であることを強調し、フジテレビのADが夜中にそっとカーテンを開けてくれる例えを再度用いて、5段階の夜明けの言葉(しののめ、あかつき、朝ぼらけ、あけぼの、つとめて)であなたの体を徐々に起こすのが理想だと締めくくる。\n\n【まとめ】\nこの動画は、ロサンゼルスでの時差ボケ解消体験(夕日を見つめること)をきっかけに、コルチゾール覚醒反応とミトコンドリアの働きを軸に、「夜は完全な暗闇に、朝は徐々に明るく」という相反する2条件をどう両立させるかを、イーロン・マスクのXプライズ財団の最新動向や日本の大和言葉の繊細な表現力を交えながら語り、体内時計を整えることが健康・若返りの鍵であるという一貫したメッセージを、ユーモアを交えて伝える内容です。"},
      {"name": "トーマスガジェマガ", "isNew": false, "videoTitle": "【新型トヨタノア90系HVレビュー】総じて車デビューには有り余る性能", "videoUrl": "https://www.youtube.com/watch?v=ToM1qcHqGRE", "published": "2026-09-06T11:21:03+00:00", "failed": false, "summary": "チャンネル名: トーマスガジェマガ\n動画タイトル: 【新型トヨタノア90系HVレビュー】総じて車デビューには有り余る性能\nURL: https://www.youtube.com/watch?v=ToM1qcHqGRE\n公開日時: 2026-09-06T11:21:03+00:00\n形式: 単独ロケ形式レビュー動画(奈良県生駒郡での幼少期ロケハンから始まり、購入した中古車を実際に運転しながら詳細に紹介する構成)\n\nこの動画は、3人目の子供が生まれるにあたって家族の送迎用に中古のトヨタ・ノア(90系ハイブリッド、購入価格400万円)を購入した投稿者が、外観・鍵・収納・車内空間・走行性能・燃費までを実際に触れながら詳細にレビューし、「子供を運ぶ車としては最高」と結論づける内容です。\n\n【冒頭:幼少期を過ごした奈良のロケ地紹介】\n奈良県生駒郡の3号線沿いにある、幼少期に遊んだ公園を訪れ、当時から変わらない滑り台や、小学2年生の時に夜犬に追いかけられた思い出などを振り返る雑談から始まる。\n\n【購入の経緯とノアを選んだ理由】\n3人目の子供が生まれチャイルドシート必須の3列シートが必要になったため、中古で400万円のトヨタ・ノアを購入したと発表。同じミニバンでもアルファードやヴォクシーは「威嚇的ないかつい顔」であるのに対し、ノアは「笑っている」ような優しい顔立ちが決め手だったと説明しつつ、実際には前面の銀メッキが多用されており思ったよりいかつい面もあると補足。最上位グレード「S-Z」の17インチホイール(下位グレードは16インチ)のデザイン性や、タイヤ交換1回10万円という維持費にも触れる。\n\n【鍵・パワーバックドアなどの利便性】\n鍵をポケットに入れたまま指をドアハンドルに入れるだけで解錠できるスマートキー機能、ボタン一つで全ドアが開くパワースライドドア、ボタン操作で好きな高さで止められる自動開閉のパワーバックドアを実演。ただし後方に障害物があると自動で止まる仕組みだが、車両保険が心配になるほど接近を感じる場面もあると注意点を述べる。\n\n【圧倒的な収納・トランクスペース】\n3列シート(7人乗り)のレイアウトを紹介し、座席を1番前まで倒すことで最大級のトランクスペースが作れる(車中泊には向かないが荷物はかなり積める)ことを実演。左右のドアポケットやドリンクホルダー、小物入れ、充電端子、日傘入れなど、車内のあらゆる場所に収納スペースが用意されている点を「収納すぎ」と驚きながら次々に紹介し、純正のままオプションを買い足す必要がないほど充実していると評価する。\n\n【2列目・1列目の快適な車内空間】\n2列目シートを大きく後方にスライドさせられる機能で「ファーストクラス」のような広い足元空間を作れることに感動し、オットマンやカーテン、ヒーターシート、充電端子まで完備されていると紹介。一方で3列目は跳ね上げ式ゆえに座面が薄く、居住性は大きく劣ると正直に指摘する。\n\n【リモート起動によるプレクール機能】\n専用アプリを使い、鍵をかけたまま離れた場所からエンジンとエアコンを起動できる機能を実演。チャイルドシートに子供を乗せる前に車内を涼しくしておけると評価する。\n\n【運転席まわりのボタン・先進安全機能】\n自動運転支援ボタン、後席含む3ゾーンのエアコン個別設定、周囲をカメラで映し出し駐車を容易にする「パノラミックビューモニター」、多数の距離センサーによる衝突防止機能などを実演。LDA・BSM・PCSなど略称の多い安全機能群は「大陸間弾道ミサイルしか知らない」とネタにしつつ、警告が頻繁で「うるさい」と感じながらも事故防止のため全てオンにしていると語る。\n\n【ハイブリッドならではの走行体験】\n発進時はモーターのみで走行できる「無料で走っている」感覚に感動し、下り坂ではタイヤの回転で発電しながらエアコンも電気だけで賄えることを体感。ガソリン車には戻れないと述べ、将来的には完全EVに移行していくだろうという展望を語る。ブレーキ時の回生エネルギーについても言及する。\n\n【加速性能への率直な評価】\nエンジンとモーター合計で約140馬力しかなく車重1.6tあるため、自身が所有するバイク(ZZR1400)と比較して馬力あたりの重量が重く、加速は「軽自動車並み」でやや物足りないと正直に指摘。ただし「人を運ぶための車にスピードは求めない」と評価軸を切り替え、静粛性・快適な座席・安定したカーブ性能を評価する。\n\n【燃費実測とハイブリッドの弱点】\n実燃費はリッター13km程度(通常は16~20km台が目安)にとどまったが、これは低速走行が多かったためと分析。モーター走行が快適すぎるため、坂道でエンジンが始動した瞬間の音や振動に「萎える」と感じる点も正直に語り、完全にモーターだけで走れる時代が10年以内に来ることを楽しみにしていると述べる。\n\n【まとめと総評】\n以前乗っていた軽自動車(スズキ・ソリオバンディット)と比較して快適性が段違いに良いと評価しつつ、400万円という価格の高さから「高く売れることを願う」と本音を吐露。総じて「子供を運ぶ車としては最高」と結論づけて締めくくる。\n\n【まとめ】\nこの動画は、3人目の子供の誕生を機に中古で購入したトヨタ・ノア90系ハイブリッドを、鍵・収納・車内空間・先進安全機能・走行性能・燃費まで実際に触れながら詳細にレビューし、「加速性能などスポーツ性には物足りなさが残るものの、圧倒的な収納力と快適な車内空間、ハイブリッドならではの静粛性と経済性を兼ね備えており、子供を安全・快適に運ぶファミリーカーとしては非常に優れている」という一貫した評価を伝える内容です。"},
      {"name": "ひすいこたろうの名言セラピー", "isNew": false, "videoTitle": "【未公開】本田晃一さんが語る「日本一の投資家」竹田和平さんの逸話", "videoUrl": "https://www.youtube.com/watch?v=3uDd80pSkJg", "published": "2026-09-09T12:00:35+00:00", "failed": false, "summary": "チャンネル名: ひすいこたろうの名言セラピー\n動画タイトル: 【未公開】本田晃一さんが語る「日本一の投資家」竹田和平さんの逸話\nURL: https://www.youtube.com/watch?v=3uDd80pSkJg\n公開日時: 2026-09-09T12:00:35+00:00\n形式: YouTube Shorts(1分弱の短尺動画。過去の対談本編の未公開部分を切り出したもので、概要欄には【前編】【後編】本編へのリンクが掲載されている)\n\nこの動画は、実業家・本田晃一氏が、「日本一の投資家」として知られた故・竹田和平さん(わ平さん)にまつわるエピソードを語り、投資で本当に大事なのは銘柄選びのテクニックではなく「徳」であるという気づきに至った経緯を紹介する内容です。\n\n【冒頭:株の勉強会での出来事】\n本田氏が東京・お台場である会社の株の勉強会に出席した際のエピソードから始まる。会場には「株で儲けたい」という人たちがギラギラと欲にまみれた空気で集まっており、本田氏自身もかつて同じ気持ちだったと振り返る。\n\n【和平さんの登場と会場の空気の変化】\nそこに竹田和平さんが登場すると、参加者たちは「獲物を見るような目」で「上がる銘柄を教えろ」と迫る。しかし和平さんは開口一番、「昨日ここに泊めていただいたが、この辺りは20年前まではただの野原だったと聞いた。あなたたちは尊いですね」と語りかける。何もないところにビルや橋を築き、夜景や経済発展を生み出した投資家たちの功績を称えたことで、ギラギラしていた会場の空気が一瞬でキラキラした空気に変わり、参加者たちも「自分たちがやってきたことには意味があったんだ」と感じ始める。\n\n【質問会での禅問答のようなやり取り】\n質疑応答で「和平さん、上がる銘柄を教えてください」という質問に対し、和平さんは「さっきまで何を聞いていたのか」と返しつつ、「徳のある会社に投資すればいい」と答える。さらに「徳のある会社はどうやって見分けるのか」と聞かれると、「自分が徳をつまんでいなければ、相手の徳は見抜けない」という禅問答のような答えを返し、結局は「徳」という話に行き着く。\n\n【本田氏の気づき:和平さんの事務所には何もなかった】\nこのやり取りを通じて本田氏は初めて「徳」というものに意識を向け始めたと語る。和平さんの事務所や自宅、マンションを訪れた際、頭の良い人たちがコンピューターを20台も並べて証券会社から頻繁に電話がかかってくるような光景を想像していたが、実際にはそこには会社四季報とノートしかなかったという。この何もなさを目の当たりにしたことで、本田氏は「本当に秘密は徳にあるのかもしれない」「徳について勉強しなければいけないんだ」と思い始めたと締めくくられる。\n\n【まとめ】\nこの動画は、本田晃一氏が竹田和平さんとの出会いを通じて、投資で成功するために本当に必要なのは銘柄分析の技術や情報ではなく、人としての「徳」であるということに気づいていった過程を、株の勉強会での対比的なエピソード(欲にまみれた会場の空気を一瞬で変えた和平さんの言葉と、質素そのものだった和平さんの事務所)を通じて伝える内容です。"},
      {"name": "崔の店長日誌。", "isNew": true, "videoTitle": "『夢占い』って本当に当たるの？！/ 100日マラソン続〜1981日〜", "videoUrl": "https://www.youtube.com/watch?v=s-wUj5o1bFk", "published": "2026-09-12T20:00:01+00:00", "failed": false, "summary": "チャンネル名: 崔の店長日誌。\n動画タイトル: 『夢占い』って本当に当たるの？！/ 100日マラソン続〜1981日〜\nURL: https://www.youtube.com/watch?v=s-wUj5o1bFk\n公開日時: 2026-09-12T20:00:01+00:00\n形式: 毎日配信「100日マラソン」シリーズ(1981日目)、占い師・崔氏による単独トーク配信\n\nこの動画は、占い師である崔氏が、視聴者からよく寄せられる「怖い夢は当たるのか」という質問に答える形で、悪夢を見るメカニズムを脳科学の観点(ストレスと自律神経、扁桃体)から解説し、悪夢対策(入浴・アロマ・コップの水・ブレインダンプ)を紹介した上で、「吉夢(意味のある夢)」についても自身の体験を交えて語る内容です。\n\n【冒頭:近所にできたスーパー「ロピア」の焼肉弁当の話】\n9月13日日曜日の挨拶から始まり、前日話題にした近所の新しいスーパー「ロピア」の焼肉弁当を実際に食べたところ、スーパーの弁当とは思えないクオリティの高さに驚いたという雑談を紹介する。\n\n【本題への導入:夢占いに関する相談の多さ】\n今日のテーマ「夢占いは本当に当たるのか」を提示し、視聴者からの相談で多いのは良い夢よりも怖い夢を見た時にどう捉えるべきかという質問だと説明。長年夢占いを研究してきた仲の良い先生の話や自身の経験から辿り着いた一つの答えとして、「大切な人が亡くなる夢」など一見悪そうな夢が実は悪い夢ではないことが多いという前置きをした上で、悪夢と吉夢(きちょう、良いことが起きる前触れ)をどう見分けるかを脳科学とスピリチュアルの両面から解説すると述べる。\n\n【悪夢の具体例と自身の体験】\n追われる夢、落ちる夢、遅刻する夢、喧嘩する夢、パニックになる夢、溺れる夢、災害の夢など悪夢の例を挙げ、自身も全てに心当たりがあると語る。20代半ばに足を骨折し手術まで1週間入院した際、仕事が残っている状態で1週間連続して「追われる夢」を見たエピソードを紹介する。\n\n【悪夢のメカニズム:ストレスと扁桃体】\n悪夢のほとんどの原因は普段抱えているストレスであると説明。追われる夢は逃げたいものや仕事のプレッシャー、落ちる夢は自己コントロールを失っている状態、遅刻する夢は責任やプレッシャー、喧嘩する夢は抱えている感情の表れだと解説。災害の夢についても、実際の災害報道の映像を見ることで知らず知らずのうちにストレスを受け、それが夢に反映されるだけであり、見たから実際に災害が起きるわけではないと説明。メカニズムとして、ストレスが蓄積し一定量を超えると自律神経が興奮状態になり、眠りの浅いレム睡眠が長く続くようになり、その際に脳の奥にある扁桃体が過剰に活性化することで悪夢を見ると解説する。\n\n【悪夢対策①:入浴とブルーライト対策】\n睡眠の質を上げることが運にもつながる重要な要素であるとし、対策として、就寝前のブルーライト(スマホ)を控えること、入浴は寝る1〜2時間前に済ませること、起きたら朝窓を開けて空気を入れ替えること(夜勤の人も同じ手順でよい、すでに窓を開けっぱなしの人はそのままでよい)を挙げる。\n\n【悪夢対策②:アロマとコップ1杯の水】\n睡眠の質を上げ悪夢を防ぐ香りとして、ラベンダー(風水でも邪気を払う効果があるとされる)、ベルガモット、サンダルウッド(白檀)を紹介。さらに自身の先生から教わった方法として、枕元にコップ1杯の水を置くことを紹介し、寝ている間に体から出る余計なものを水が吸い取ってくれるという言い伝えを説明。自身の子供たちが怖い夢を連続で見ていた時期にコップの水を置いたところピタッと収まった実体験を語り、水にアロマを入れるとさらに効果的だと補足する。\n\n【悪夢対策③:ブレインダンプ(脳のゴミ出し)】\n自身の息子が手術から帰ってきた時期、手術結果への不安から夢見が悪く、起きるたびに息子の呼吸を確認するほど不安定だった経験を紹介。その時に勧められた「ブレインダンプ」という手法(寝る前に不安なことや明日やるべきこと、ムカついたことを紙に書き殴る)を実践したところ、脳が情報を整理されたと認識し、頭の中でぐるぐる巡る不安を防ぐことができ、実際に眠れるようになった効果を語る。\n\n【夢を覚えているかどうかとストレス数値の関係】\n人は基本的に起きてから朝の5分で夢を忘れるようになっており、悪夢を全く覚えていない人はストレス数値が低い状態であるため安心してよいと説明。逆にストレスの限界を超えてくると、悪夢をいつまでも覚えていることが多いと解説する。\n\n【吉夢(意味のある夢)について】\n悪夢とは対照的な「吉夢」として、昔は「啓示」や「典型」とも呼ばれた意味のある夢を紹介。自身が最も多く経験したのは亡くなった人と会話する夢(祖父や祖母との会話)で、非常に具体的な内容を言われるため夢だと気づくと語る。他にも美しい風景や景色を見る夢が吉兆になることがあり、金運に関しては、トイレに落ちる夢や糞まみれになる夢を見たら宝くじを買うとよいとされ、実際に宝くじが当たった人が多かったという経験談を紹介する。夢に意味がないものは存在しないとし、覚えていない場合は安心してよく、良い夢を見たと思ったら行動に移すことが大事だと語る。加えて、吉夢・啓示的な夢は昼寝の時に見ることが多いという自身の経験にも触れる。\n\n【締めくくり】\n今日のテーマ「夢占いは当たるのか」について、全ての夢には意味があるとまとめ、睡眠の質を上げる工夫をしてみてほしいと呼びかける。恒例のガッツポーズと掛け声で締めくくる。\n\n【まとめ】\nこの動画は、視聴者から多く寄せられる「怖い夢」への不安に対し、悪夢の多くは日常のストレスが自律神経と扁桃体の働きを通じて引き起こされる脳科学的な現象であることを説明した上で、入浴・アロマ・コップの水・ブレインダンプといった具体的な対策を紹介し、一方で亡くなった人との会話や美しい景色を見る夢のような「吉夢」には意味があるとして、すべての夢には何らかの意味があり、悪い夢は対策を、良い夢は行動につなげてほしいという一貫したメッセージを伝える内容です。"},

      {"name": "中野優作 / CAR and LIFE.（BUDDICA）", "isNew": false, "videoTitle": "【アルファード大暴落の真相】1ヶ月で最大50万円下落…40系はまだ下がる？在庫急増の原因と売り時・買い時を徹底解説！", "videoUrl": "https://www.youtube.com/watch?v=QAxQayB9W9k", "published": "2026-09-10T10:00:01+00:00", "failed": false, "summary": "チャンネル名: 中野優作 / CAR and LIFE.（BUDDICA）\n動画タイトル: 【アルファード大暴落の真相】1ヶ月で最大50万円下落…40系はまだ下がる？在庫急増の原因と売り時・買い時を徹底解説！\nURL: https://www.youtube.com/watch?v=QAxQayB9W9k\n公開日時: 2026-09-10T10:00:01+00:00\n形式: 対談形式の解説動画(聞き手役スタッフと、BUDDICA代表・中野優作氏による質疑応答)\n\nこの動画は、報道で話題になった「アルファードの大暴落」について、聞き手からの質問に中野優作氏が答える形式で、実際の値下がり状況とその真の原因(海外輸出の停止と供給過多の複合要因)を解説し、今買うべきか売るべきか、新車と中古どちらが得かを具体的な数字とともに解説する内容です。\n\n【冒頭:アルファード大暴落報道への質問】\n聞き手が「アルファードが大暴落しているとYahooニュースやテレビで報じられていた」と切り出し、実際に暴落しているのか、今乗っている人は手放すべきか、購入検討者は待つべきかをプロの視点から聞きたいと質問する。\n\n【実際に下がっているのか:グラフで確認】\n中野氏は「下がっている」と即答。ただし3年単位の長期グラフで見ると緩やかな下落だが、直近1ヶ月ほどで急に約50万円(安いグレードでも約30万円)値下がりしたと説明する。\n\n【値下がりの真の原因①:マレーシア輸出の一時停止】\n中古車相場を決める最大要因は海外市場であり、特にアルファードは日本国内よりも海外(オークション経由)で買われることが多いと説明。マレーシアでUberの運転手が日本で新車700万円のアルファードを2000万円で購入していた例を紹介しつつ、そのマレーシアへの輸出が一時的に停止したことが今回のトリガーだと明かす。年間の輸出台数に上限があり、達すると一旦ストップする仕組みがあるという。\n\n【値下がりの真の原因②:ドバイ輸出停止との「トリプルパンチ」】\nマレーシアの前には輸出大国であるドバイも、現地での戦争の影響で船便が止まり輸出が停止していたと説明。さらに国内では、新車が人気で抽選・プレミア状態だった反動で、3年が経過し次々と乗り換えが始まったことによる供給増加も重なり、「新車供給の増加」「ドバイ停止」「マレーシア停止」のトリプルパンチで急激に相場が下がったと分析する。ニュースでは国内在庫台数が2024年8月の394台から2313台(6.5倍)に増えたことだけが取り上げられていたが、それだけが原因ではないと補足する。\n\n【グレード別の値下がり状況:鉄板リセールの40系Zが初下落】\n最も値下がりしたのはガソリン車の「Z」グレードで、これまで「新車で買って間違いない鉄板リセール」と言われていた車種が初めて値下がりしたと説明。新車当時650万円前後だったZが、1年落ちの中古で新車マイナス50万円程度まで下がってきているが、これでも「そんなに下がっていない」という印象に留まる程度だとコメントする。\n\n【中野氏自身の購入体験:エグゼクティブラウンジを選んだ理由】\n中野氏自身は最上級グレード「エグゼクティブラウンジ」を新車で購入したと明かす。Zグレードより150〜200万円高いが装備差は少なく、あえてこちらを選んだ理由は「新車と中古の差額(リセール差)が小さいと判断したから」と説明。購入時(2026年春)は中古のエグゼクティブラウンジが新車より230万円高いプレミア状態だったが、その後半年ほどで状況が逆転し、今では中古の方が新車より安く買えるようになったと明かす。\n\n【新車プレミア組からの「相談トラブル」への苦言】\n新車購入後のプレミア期に高値で売り抜けようとした人たちが、値下がりが始まった今になって複数の車屋に見積もりを聞き回り、査定額に納得できないと既読無視するといったトラブルが増えていることを明かし、「そういう使われ方はやめてほしい」と率直に苦言を呈する。\n\n【距離・グレード別の相場動向と買い方のアドバイス】\n「ちょい乗り(5000km程度)」と1万km走行車でも相場に大きな差はなく、ミッション車のみ走行距離の影響が大きいと説明。グレード別では、エグゼクティブラウンジは新車に近い相場でまだ新車発注が有利、Zはまだプレミアが残る、ハイブリッドは供給が増えて中古が一番お買い得と整理。具体的な買い方として、カーセンサーやグーネットで欲しい仕様の中古の見積もりを取り、同じ仕様の新車見積もりと比較して差額で判断する方法を勧める。\n\n【人気オプションと4WDハイブリッドの狙い目】\n最近の後期型ではデジタルインナーミラー・ドラレコが標準装備化されたことに触れ、追加すべきオプションとしてムーンルーフ、ユニバーサルステップ、パワーシェード、コーティングを推奨(下取り時に投資額の7〜8割は回収できるとする)。さらに、海外では人気が低く相場が正当に評価されていない「4WDハイブリッド」は中古で買うのが特にお得だと紹介する一方、2WDについては最新の次世代ハイブリッド(燃費向上、ガソリンスタンドに行く頻度が減る利点)が良いため新車がおすすめだと自身の実体験(レクサスRXでガソリン車を選び後悔した経験)を交えて語る。\n\n【締めくくり:まとめと値引き復活の兆し】\n新車を買える人は買ってよい、中古を狙う人は新車との差額を比較してから決めるべきとまとめる。かつて当たり前だった新車値引き(10%程度)が消えていたが、競争が戻れば値引きも復活するのではという期待を語り、視聴者に情報提供を呼びかける。最後に、写真15枚を送るだけで非対面のまま査定してもらえる「愛車メーター」を紹介し、チャンネル登録・コメントを呼びかけて締めくくる。\n\n【まとめ】\nこの動画は、「アルファード大暴落」という報道の裏にある真の原因が、国内の供給増加だけでなくマレーシア・ドバイという2大輸出国での輸出停止が重なった「トリプルパンチ」であることを解説し、鉄板リセールと言われたZグレードにも初めて値下がりが及んでいる現状を踏まえ、グレードごとに新車と中古の価格差を実際に見積もり比較した上で購入・売却のタイミングを判断すべきだという一貫したメッセージを伝える内容です。"},
      {"name": "サムの本解説ch", "isNew": true, "videoTitle": "なぜ、脳は「見た目」で差別するのか？【要約】脳は見た目から逃れられない", "videoUrl": "https://www.youtube.com/watch?v=xPKkcw-Tr0E", "published": "2026-09-12T11:00:33+00:00", "failed": false, "summary": "チャンネル名: サムの本解説ch\n動画タイトル: なぜ、脳は「見た目」で差別するのか？【要約】脳は見た目から逃れられない\nURL: https://www.youtube.com/watch?v=xPKkcw-Tr0E\n公開日時: 2026-09-12T11:00:33+00:00\n形式: 書籍要約・解説動画(精神科医・和田秀樹氏の著書『脳は見た目から逃れられない』を紹介)\n\nこの動画は、精神科医・和田秀樹氏の著書をもとに、私たちが信じている「美しさ」の基準がメディアや社会によって後天的に脳に刷り込まれたものであること、脳が外見という手軽な情報だけで人を判断してしまう「ハロー効果」の仕組み、そして外見コンプレックスや見た目による判断から抜け出すための具体的な行動を解説する内容です。\n\n【冒頭:問題提起】\n人は相手の顔をわずか0.1秒見ただけで信頼できるかどうかの第一印象を決めてしまうが、その直感に全てを委ねると詐欺師に騙されたり優秀な人を見誤ったりする危険があり、「見た目で判断する人ほど見た目に騙される」と提起。外見で判断された側が深く傷つく一方、恋愛や仕事の不調を顔や体型のせいにしてダイエットに疲れ果てている人に向けて、この動画を見れば不毛な自己嫌悪から抜け出し、表面に騙されず人生の主導権を取り戻せると案内する。著者・和田秀樹氏を30年以上高齢者医療に携わってきた精神医学のエキスパートとして紹介し、本書は「外見を気にするな」という綺麗事ではなく、脳科学・心理学の知見から美の基準の仕組みを解き明かす現実的な内容だと位置づける。\n\n【1章:その「美しい」は誰かに教え込まれたもの】\n痩せている・目がぱっちり二重・鼻が高いといった美の基準を人間の本能だと思いがちだが、これは誤解であり、第一印象を素早く作る働き自体は脳に備わっているものの、「何を美しいと判断するか」という基準は生まれた後にメディアや社会から教え込まれたものだと説明。平安時代の日本ではおかめ顔や長い黒髪が美とされていた例や、1960年代にテレビの普及とともにイギリスの痩せたモデル「ツイッギー」の登場でわずか数年で「痩せていることが美しい」という基準に塗り替えられた例を紹介。心理学の実験で周囲が明らかな間違いを言い続けると約75%の人が一度は多数派に同調してしまうという同調効果にも触れ、この偏った美の基準が美容・ダイエット業界の広告にも利用され、「今のあなたには欠点がある」と思わせることで商品が売れやすくなる構造があると指摘。さらにSNSの加工文化により、日々見る自分の加工顔が脳内の基準になってしまい、無加工の現実の自分にショックを受け人間関係から逃げてしまう危険性についても言及し、これは狭く偏った美の基準に踊らされているだけだと視聴者に語りかける。\n\n【2章:見た目で判断する人ほど見た目に騙される】\n爽やかな身だしなみの上司と寝癖・シワだらけの上司の例を挙げ、多くの人が見た目だけで能力や性格まで期待してしまう「ハロー効果」(1つの目立った特徴に引っ張られて無関係な部分まで優れていると錯覚する心理)を解説。外見の美しさと知的能力・道徳性・仕事の能力の間に明確な関係はないとした上で、脳がこの錯覚を起こす理由は単純に「面倒くさがり」だからであり、相手をじっくり観察するのはエネルギーを使うため、外見という手軽な情報だけで0.1秒で結論を出そうとすると説明。この脳の手抜きを悪用しているのが詐欺師であり、清潔感のある爽やかな営業マンに警戒心を解いて契約してしまう被害者が「悪い人には見えなかった」と語るのは、相手の人柄を見抜いた証拠ではなく外見の印象が優先された結果に過ぎないと指摘。さらにこの手抜きは自分自身にも向き、仕事や恋愛の失敗を全て顔や体型のせいにしてしまうと、話し方や気遣いといった改善可能な原因を見落とす罠にはまると解説。美容整形をしても内面の態度が変わらなければ現実は好転せず、終わりのない修正ループにはまる例も紹介する。「見た目が9割」という言葉についても、本来のメラビアンの法則は「言葉の内容と表情・声のトーンが矛盾する時、人は表情や声を優先して信じる」という意味であり、生まれつきの顔の造形の良さで人生が決まるという意味ではないと誤解を正す。\n\n【3章:顔を変える前に人生の評価軸を増やせ】\n脳の手抜きの仕組みを踏まえ、明日から実践できる3つの具体的行動を提案。行動1「第一印象を24時間保留する」:第一印象を感じた瞬間に「脳が手抜きをしている」と心の中で唱え、その直感とは関係のない客観的な情報(過去の実績データや実際の行動)を最低1つ意図的に探すことで、詐欺被害や人材の見落としのリスクを減らせると説明。行動2「原因を消す目標を行動する目標に変える」:「鼻を高くしたい」「痩せたい」といった変えるのが難しい外見目標ではなく、その先で得たいもの(人に好かれたい、自信を持ちたい等)を考え、「初対面の人と10分間笑顔で楽しく会話できるようになる」といった今すぐ行動できる目標に変換することを提案。行動3「12週間で1つの強みを徹底的に伸ばす」:会話スキル・専門知識・料理・ユーモアなど、すでに得意なことを1つ選び12週間かけて磨き上げ、世間全体からもてはやされたいという願望を捨てて、身近なたった1人から深く信頼される存在を目指すことを勧める。外見の優位性は年齢とともに比重が小さくなる一方、専門知識や思いやりは年齢とともに深みを増すため、表面的な美しさで100人に振り向かれる人生より内面の深さで1人から深い信頼を得る人生の方が豊かだと語る。\n\n【締めくくり:視聴者への問いかけとまとめ】\n「最初は見た目で苦手だと思ったが、話してみたら印象が大きく変わった経験」についてコメント欄で共有してほしいと呼びかける。最後に、美しさの基準はメディアや社会によって脳に教え込まれたものであり、脳は常にエネルギー節約のため外見という表面的情報で相手を判断しようとするが、ルッキズムへの最大の対抗手段は顔を変えることではなく「賢くなること」、すなわち第一印象を疑い多面的な情報を集め、年齢とともに価値が下がりやすい外見ではなく年齢とともに深みを増す好感度や強みに時間とエネルギーを投資することだとまとめる。\n\n【まとめ】\nこの動画は、私たちが信じている美の基準がメディアや社会によって後天的に脳に刷り込まれたものであり、脳が省エネのために外見という表面的情報だけで人を判断する「ハロー効果」というメカニズムを持つことを解き明かした上で、第一印象を24時間保留する・外見目標を行動目標に変える・12週間で1つの強みを磨くという3つの具体的行動によって、見た目に振り回されず年齢とともに深みを増す自分自身の価値に投資していくことが人生の主導権を取り戻す鍵であるという一貫したメッセージを伝える内容です。"},

      {"name": "BUDDICAの中野クン", "isNew": false, "videoTitle": "【仕事ができる人は全員やってる】社会人30年目の中野優作が教える最強の時間術", "videoUrl": "https://www.youtube.com/watch?v=gTZMqmnGPG8", "published": "2026-09-08T10:00:40+00:00", "failed": false, "summary": "チャンネル名: BUDDICAの中野クン\n動画タイトル: 【仕事ができる人は全員やってる】社会人30年目の中野優作が教える最強の時間術\nURL: https://www.youtube.com/watch?v=gTZMqmnGPG8\n公開日時: 2026-09-08T10:00:40+00:00\n形式: 単独トーク解説動画(BUDDICA代表・中野優作氏による時間術シリーズ第2弾。前回の「秒速の意思決定」「爆速返信」に続く回)\n\nこの動画は、サラリーマン20年・経営者約10年の経験を持つ中野優作氏が、「同じ時間働いても人より成果を上げる」ための時間術シリーズの第2弾として、こまめな進捗報告・仕事の優先順位を時間帯ごとに最適化すること・休日をインプットの時間に変えることという3つの具体的な習慣を、実体験や社内エピソードを交えて解説する内容です。\n\n【冒頭:自己紹介とテーマ提示】\n「あなたは何人いるんですか」「寝てるんですか」と聞かれるほど生産性を追求してきたと自己紹介し、同じ8時間働くなら人の倍の成果を上げたいという感覚で仕事をしてきたと語る。ドラッカーの「生産性を上げたければ時間をマネジメントせよ、成果を上げる人は時間から入る」という言葉に感銘を受け、時間術に取り組んできたと説明。前回動画で紹介した「秒速の意思決定」「朝令暮改を恐れない」「爆速返信」の3つに続き、今回は残る3つのうち「過ごし方(同じタスクでも成果が上がるやり方)」を解説すると予告する。\n\n【1つ目:こまめな進捗報告】\n「1週間後にできましたと完成品だけ持ってくるのではなく、作業の途中経過を全部教えてほしい」と提言。理由は手戻りをなくし精度を上げるためであり、自社の仕事の進め方の基本である「アジャイル開発」(やりながら改善していく手法)を紹介する。車屋のチラシ制作を例に、1週間後に完成品(ラグジュアリー系のデザイン)を見せられて「いや、俺がイメージしてたのは軽自動車っぽい安い感じだったんだけど」となる「あるある」を紹介し、電通や博報堂クラスの一流クリエイターでも起こりうると明かす。自社では作業を始めた初日の段階で方向性を共有してもらい、その場で「アルファードじゃなくて軽自動車系で」と5秒で修正できる体制を作っていると説明。「エレベーターピッチ」(エレベーターの1階から10階までの20秒の間に決裁を取るというビジネス用語)という概念も紹介し、立ち話レベルで進捗報告する重要性を語る。サラリーマン時代からこまめな報告を徹底してきたことで「手戻りで1ヶ月かかった仕事が無駄になる」という経験が一度もなかったと明かし、特に気分がコロコロ変わるスピード感のある上司・経営者ほど、こまめな確認を怠ると興味を失われやすいと注意を促す。具体例として、自社が発売したインテリアリフレッシュスプレー(4000円)が1週間で7500本完売した事例を紹介し、企画から発売まで1ヶ月弱というスピードローンチを実現できたのは、担当者の高本氏が「今この方向性で考えてます、良さそうですか」と逐一細かく共有しながら進めてくれたためだと説明。これにより「中の担当者の脳を使わせる」ことができ、5択の候補を6択に増やす修正なども素早く反映できたと語る。こまめな報告には「手戻りがない」「評価が上がる」という2つの利点があり、マネジメント層(自身は250名の社員を統括)にとって、向こうから逐一情報を伝えてくれる部下は安心感が大きく評価が上がると説明。報告してくれたことに対し「報告してくれてありがとう」とチャットグループなど公の場で伝えることで、報告する文化が育つとアドバイスする。\n\n【2つ目:仕事の優先順位を時間帯で最適化する(段取り8割・仕事2割)】\n朝は脳がクリアなのでタスク処理に向き、夜はクリエイティブな仕事(作曲や企画立案など)に向くという一般論を紹介し、これを入れ替えると成果が2割ほど下がる体感があると語る。土木工事の現場で最も暑い14時ではなく13時半〜14時半を休憩に充てるよう調整していた経験も紹介。おすすめの手法として「時間の棚卸し」を提案し、朝9時〜18時の勤務を30分単位・8コマ程度に区切り、どのタスクをどの   // 既読管理: サーバー側の new_in_last_check は「前回チェックと比較して動画が

  // 実際にユーザーが読んだかどうかはこのブラウザの localStorage で別管理する。
  const READ_KEY = "ytChecker.readVideoUrls";

  function loadReadSet() {
    try {
      const raw = localStorage.getItem(READ_KEY);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch {
      return new Set();
    }
  }

  function markRead(videoUrl) {
    const set = loadReadSet();
    set.add(videoUrl);
    // 肥大化しすぎないよう直近200件に丸める
    const arr = Array.from(set).slice(-200);
    localStorage.setItem(READ_KEY, JSON.stringify(arr));
  }

  function relTime(iso) {
    const then = new Date(iso).getTime();
    const now = Date.now();
    const diffMs = now - then;
    const min = Math.floor(diffMs / 60000);
    if (min < 60) return `${Math.max(min, 0)}分前`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr}時間前`;
    const day = Math.floor(hr / 24);
    if (day < 30) return `${day}日前`;
    const mon = Math.floor(day / 30);
    return `${mon}ヶ月前`;
  }

  function render(data) {
    const list = document.getElementById("channelList");
    list.innerHTML = "";
    const readSet = loadReadSet();
    let unreadCount = 0;

    // 未読(新着)のチャンネルを上に、既読/変化なしを下に並べる。
    // 同じグループ内では元の(state.json の)並び順を保つ(安定ソート)。
    const sorted = data.channels
      .map((ch) => ({
        ch,
        isUnread: !!ch.summary && !readSet.has(ch.videoUrl),
      }))
      .sort((a, b) => Number(b.isUnread) - Number(a.isUnread));

    sorted.forEach(({ ch, isUnread }) => {
      if (isUnread) unreadCount++;

      const li = document.createElement("li");
      li.className = "channel" + (isUnread ? " is-new" : "");

      const chip = document.createElement("span");
      chip.className = "chip" + (isUnread ? " is-new" : "");
      chip.textContent = ch.failed ? "取得失敗" : (isUnread ? "新着あり" : "変化なし");

      const name = document.createElement("div");
      name.className = "channel-name";
      name.textContent = ch.name;

      const video = document.createElement("a");
      video.className = "video-title";
      video.href = ch.videoUrl;
      video.target = "_blank";
      video.rel = "noopener noreferrer";
      video.textContent = ch.videoTitle;

      const meta = document.createElement("div");
      meta.className = "meta" + (ch.failed ? " fail" : "");
      meta.textContent = ch.failed ? "前回チェック失敗" : `公開: ${relTime(ch.published)}`;

      li.append(chip, name, video, meta);

      if (ch.summary) {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "summary-toggle";
        toggle.textContent = isUnread ? "▸ 詳細な要約を読む(未読)" : "▸ 詳細な要約を読む";

        const body = document.createElement("div");
        body.className = "summary-body";
        body.textContent = ch.summary;

        toggle.addEventListener("click", () => {
          const open = body.classList.toggle("open");
          toggle.textContent = open ? "▾ 要約をたたむ" : "▸ 詳細な要約を読む";
          if (open && isUnread) {
            markRead(ch.videoUrl);
            chip.textContent = ch.failed ? "取得失敗" : "変化なし";
            chip.classList.remove("is-new");
            li.classList.remove("is-new");
          }
        });

        li.append(toggle, body);
      }

      list.appendChild(li);
    });

    document.getElementById("sumNew").textContent = unreadCount;
    document.getElementById("sumIdle").textContent = data.channels.length - unreadCount;
    document.getElementById("sumTotal").textContent = data.channels.length;

    const dot = document.getElementById("updatedDot");
    const text = document.getElementById("updatedText");
    dot.classList.toggle("live", unreadCount > 0);
    text.textContent = `最終チェック: ${relTime(data.checkedAt)}`;
  }

  render(CHANNELS_DATA);
</script>
