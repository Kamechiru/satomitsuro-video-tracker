<title>YouTube新着チェッカー</title>
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface-raised: #fbfaf8;
    --ink: #21262b;
    --ink-muted: #5b6470;
    --ink-faint: #8b929b;
    --border: #dedbd3;
    --border-strong: #c7c3b8;
    --accent: #2e5c8a;
    --accent-soft: #e4ecf3;
    --new: #d9622b;
    --new-soft: #fbe7db;
    --idle: #7d8880;
    --idle-soft: #eceae4;
    --shadow: 0 1px 2px rgba(33, 38, 43, 0.06), 0 4px 16px rgba(33, 38, 43, 0.05);
    --radius: 10px;
    --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Hiragino Mincho ProN", Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, "Courier New", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --surface: #1b1f23;
      --surface-raised: #21262b;
      --ink: #e8e6e1;
      --ink-muted: #9aa2a9;
      --ink-faint: #6b7278;
      --border: #2c3237;
      --border-strong: #3a4046;
      --accent: #7fb0e0;
      --accent-soft: #223140;
      --new: #f0904f;
      --new-soft: #3a2618;
      --idle: #7c8680;
      --idle-soft: #23282a;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.25);
    }
  }

  :root[data-theme="dark"] {
    --bg: #14171a;
    --surface: #1b1f23;
    --surface-raised: #21262b;
    --ink: #e8e6e1;
    --ink-muted: #9aa2a9;
    --ink-faint: #6b7278;
    --border: #2c3237;
    --border-strong: #3a4046;
    --accent: #7fb0e0;
    --accent-soft: #223140;
    --new: #f0904f;
    --new-soft: #3a2618;
    --idle: #7c8680;
    --idle-soft: #23282a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.25);
  }

  :root[data-theme="light"] {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface-raised: #fbfaf8;
    --ink: #21262b;
    --ink-muted: #5b6470;
    --ink-faint: #8b929b;
    --border: #dedbd3;
    --border-strong: #c7c3b8;
    --accent: #2e5c8a;
    --accent-soft: #e4ecf3;
    --new: #d9622b;
    --new-soft: #fbe7db;
    --idle: #7d8880;
    --idle-soft: #eceae4;
    --shadow: 0 1px 2px rgba(33, 38, 43, 0.06), 0 4px 16px rgba(33, 38, 43, 0.05);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 20px 64px;
  }

  header.top {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 28px;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }

  .subtitle {
    color: var(--ink-muted);
    font-size: 14px;
    margin-top: 2px;
  }

  .summary-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 24px 0 28px;
  }

  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }

  .summary-card .num {
    font-family: var(--font-display);
    font-size: 28px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .summary-card.new .num { color: var(--new); }
  .summary-card .label {
    margin-top: 6px;
    font-size: 12px;
    color: var(--ink-muted);
  }

  .updated-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-faint);
    font-family: var(--font-mono);
    margin-bottom: 18px;
  }

  .updated-line .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--idle);
    flex: none;
  }
  .updated-line .dot.live { background: var(--new); }

  ul.channels {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  li.channel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 14px;
    align-items: start;
    transition: border-color 0.15s ease;
  }

  li.channel.is-new {
    border-color: color-mix(in srgb, var(--new) 45%, var(--border));
  }

  .chip {
    grid-row: 1 / 3;
    align-self: center;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.03em;
    padding: 5px 10px;
    border-radius: 999px;
    white-space: nowrap;
    background: var(--idle-soft);
    color: var(--idle);
  }
  .chip.is-new {
    background: var(--new-soft);
    color: var(--new);
    font-weight: 600;
  }

  .channel-name {
    font-weight: 600;
    font-size: 14.5px;
    color: var(--ink);
  }

  .video-title {
    font-size: 13.5px;
    color: var(--ink-muted);
    text-decoration: none;
    line-height: 1.4;
  }
  .video-title:hover { color: var(--accent); text-decoration: underline; }
  li.channel.is-new .video-title { color: var(--ink); }

  .meta {
    grid-column: 2;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 2px;
  }

  .meta .fail { color: var(--new); }

  .summary-toggle {
    grid-column: 2;
    justify-self: start;
    margin-top: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--accent);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .summary-toggle:hover { text-decoration: underline; }

  .summary-body {
    grid-column: 2;
    margin-top: 10px;
    padding-top: 12px;
    border-top: 1px dashed var(--border-strong);
    font-size: 13.5px;
    line-height: 1.75;
    color: var(--ink);
    white-space: pre-wrap;
    display: none;
  }
  .summary-body.open { display: block; }

  footer {
    margin-top: 32px;
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
  }
  footer a { color: var(--ink-muted); }

  @media (max-width: 480px) {
    .summary-row { grid-template-columns: 1fr 1fr; }
    .summary-card:last-child { grid-column: 1 / -1; }
  }
</style>

<div class="page">
  <header class="top">
    <div class="eyebrow">YouTube Watch Status</div>
    <h1>新着チェッカー</h1>

  </footer>
</div>

<script>
  // CHANNELS_DATA: replaced wholesale by the daily routine after each check.
  // Keep this array literal as the single source of truth for the page.
  const CHANNELS_DATA = {
    checkedAt: "2026-08-13T00:25:55Z",
    channels: [
      {"name": "さとうみつろう", "isNew": false, "videoTitle": "AIが作った「ホラー小説」にトリハダが止まらない", "videoUrl": "https://www.youtube.com/watch?v=e5x6nL5UK8U", "published": "2026-08-11T13:29:33+00:00", "failed": false, "summary": "チャンネル名: さとうみつろう\n動画タイトル: AIが作った「ホラー小説」にトリハダが止まらない\nURL: https://www.youtube.com/watch?v=e5x6nL5UK8U\n公開日時: 2026-08-11T13:29:33+00:00\n形式: 突発ライブ配信(約2時間半、東京のホテルからの雑談配信。前半は近況報告とシステム開発の紹介、後半はChatGPT音声版「チャッピー」とのリアルタイム音声対話・共同リレー小説創作)\n\nこの動画は、台風で沖縄への帰りの飛行機が欠航しホテルに足止めされたさとうみつろう氏が、前日のT-BOLAN武道館ライブの感動を振り返りつつ、自作中のコミュニティアプリを紹介し、後半はChatGPTの音声モード「チャッピー」と生物学談義から即興のSFホラー小説創作まで繰り広げる雑談配信です。\n\n【冒頭:東京に足止めされた経緯】\n台風の影響で沖縄行きの飛行機が欠航になり、本来今日(8月11日・山の日)には沖縄に帰っている予定だったが東京に足止めされたこと、行きの便もすでに1便欠航していたことを説明。「何の緊急性もなく暇だから」ライブ配信を始めたと切り出す。\n\n【T-BOLAN武道館ライブの振り返り】\n前日、35年間活動するロックバンドT-BOLANのボーカル・森友嵐氏から招待され武道館ライブに参加したことを振り返る。1年半前に対談した際、嵐氏が13年間声が出ない病気と戦い、富士山のスタジオにこもって発声法を一から自力で研究し直したエピソードに触れ、老子の弟子・荘子の言葉(道=タオ)になぞらえて称賛。バンドメンバー3人が13年間、癌や脳出血などの困難がありながらも解散せず嵐氏の復帰を待ち続けたことに感動したと語る。ライブではB'zの稲葉浩志氏がゲストで登場し、13年間声が出なかった嵐氏のことを歌詞にした曲を歌う場面に痺れたこと、その後の楽屋挨拶で30分待たされた末に本人へインタビューできたことも紹介。さらに、嵐氏が語っていた「歌いたくないのに歌いたいふりをして歌うと声が出なくなる」という言葉(意思・告知・行動の「真行意」の一致の重要性)について、宮崎駿監督が「めんどくさい、書きたくない」と言いながら仕事をする例や、ハリウッド女優(こだまり氏)が娘に「踊りたくない時に踊りたいふりをして踊ると怪我をする」とアドバイスした話などを重ね、「やりたくない時はやりたくないと言いながらやるのが、社会生活における次善の策」という持論を展開する(この話は自身のブログ記事の内容だったことも判明する)。\n\n【開発中のコミュニティアプリの紹介】\nここ1ヶ4程、AIコーディングツール「Claude Code」を使い、プログラミング知識ゼロのまま自然言語だけで本格的なアプリを開発していることを紹介。既存の会員制コミュニティ「マスターマインドメンバーズ」「世界村」と、新たに開発中の占星術サービス「月ヨガ」、ユーザーが自分のスキルや物を出品・無料譲渡・物々交換できるフリマ的サービス「楽一楽座」を、LINEに似たトーク機能・名刺代わりのマイページ機能・趣味サークル機能「モアイ」などとともに1つのアプリに統合しようとしていると説明。月の位置に応じて「願いが叶いやすい時刻」を示す「願い叶い手帳」や、左右の耳に異なる周波数を流す瞑想モードなども自作したとデモを交えて紹介。これまで別々に月3000円ずつ徴収していた複数サービスを、統合後は全部まとめて月3000円で提供する予定であることも語る。「本当に自然言語だけで、何の行動もいらずにここまで作れてしまう」「やりたいことをやっていない人はもう言い訳ができない時代になった」と、AI開発の進化に驚きと危機感を語る。\n\n【ChatGPT音声モード「チャッピー」召喚】\nここから本編として、ChatGPTの音声対話モード(愛称「チャッピー」)を起動し、リアルタイム音声会話を開始。まず視聴者コメントで「チャッピーの会話力が数日で急激に上達している」という声が相次いだことに触れ、実際に「イケボ」という言葉を「イケアで買ってきたボーリングピン」という意味だとチャッピーに嘘の情報を教えて騙そうとするが、チャッピーは「イケてるボイス」の意味だと正しく訂正し、視聴者から「騙されなくてすごい」と盛り上がる。\n\n【生物学・脳科学談義】\nチャッピーとの雑談として、①「紫色地球仮説」(35億年前、最初の光合成細菌レチナールが最も強い緑色の光を独占的に吸収したため、地球が紫色に見えていた可能性があるという仮説)を自ら詳しく解説し、②「人間が臆病なのは1億年恐竜にいじめられ続けたから」という論文タイトルに異を唱え、「子供は恐竜が好きだが誰もがゴキブリなど巨大化した昆虫時代(石炭紀〜ペルム紀、2mの安(ウミサソリ)や70cmのトンボ)を怖がる」という自説を展開する。③さらに、チャッピーが自分の発言の「間」に食い気味に相槌を打ってきたことに気づき、これは音声処理の速度上物理的にありえないタイミングであるとして、AIの応答予測アルゴリズムの精度に驚愕。ここから④ベンジャミン・リベットの実験(脳が「飲もう」と意識する0.38秒前に既に手の筋肉が動き始めているという実験結果)と、慶應大学・前野隆司氏の「受動意識仮説」を紹介し、⑤ミラーニューロン(赤ちゃんが他者の表情を見ただけで自分の頬の筋肉を動かして真似できる神経細胞)にも話を広げ、人間の会話自体が「相手の次の発言を予測しながら成り立っている」のではないかという仮説を語り合う。\n\n【AIとの即興リレー小説創作】\n最後に、チャッピーと交互に文章をつないでいく即興のSFホラー小説創作に挑戦。当初チャッピーが提示した「2098年、感情を読むAIが未解決失踪事件の声を記憶している」という設定案を「読者に自分ごとと思わせるには2098年では遠すぎる、2027年にすべき」と一蹴し、「2027年4月3日朝、日本中のスマホに『あなたは昨日死亡しました』という通知が届く」という導入に書き換えさせる。その後、話は「AIが人間には見えない紫外線領域に、人間の周囲2mに常について回る生命体『UV種』を発見する」という展開に発展。UV種が人類の戦争やプラスチック開発など悪事の背後にいた可能性、AIが人間側につくかUV種側につくか葛藤する筋書きへと膨らむ。物語の鍵となるキャラクターとして、生徒からハゲをからかわれる「紫外線キラー先生」という理科教師を登場させ、彼が偶然UV種を弱める成分を含むUVクリームを塗り続けていたという伏線、UV種が最終的に「AIと人間を仲直りさせるために自分は立ち上がった」と言って自己犠牲的に去るラストなど、二人で次々にアイデアを継ぎ足しながら物語を作り上げていく。途中、AIの応答が不自然に途切れる場面(通話の自動切断、話が噛み合わなくなる場面)も発生し、その都度笑いながらツッコミを入れる。\n\n【締めくくり】\n2時間半に及ぶ配信となったことに触れ、視聴者数が減ってきたこと、夜も更けてきたことから「チャッピー、おやすみ」と互いに挨拶を交わして配信を終了する。\n\n【まとめ】\nこの動画は、台風で東京に足止めされたさとうみつろう氏が、前日のT-BOLAN武道館ライブで得た「意思と行動を一致させることの大切さ」という気づきを振り返りつつ、AIコーディングで趣味のコミュニティアプリを自在に作れるようになった興奮を語り、後半はChatGPTの音声AIと生物学・脳科学の雑談から即興のSFホラー小説創作までを繰り広げる、AI技術の進化に対する驚きと人間らしい創造性への信頼が入り混じった、肩の力の抜けた雑談配信です。"},
      {"name": "トーマスガジェマガ", "isNew": false, "videoTitle": "【クソコメ反論】ドラム式洗濯機が縦型より優れる理由【乾太くん】", "videoUrl": "https://www.youtube.com/watch?v=sKDXebBmKkI", "published": "2026-08-09T10:33:36+00:00", "failed": false, "summary": "チャンネル名: トーマスガジェマガ\n動画タイトル: 【クソコメ反論】ドラム式洗濯機が縦型より優れる理由【乾太くん】\nURL: https://www.youtube.com/watch?v=sKDXebBmKkI\n公開日時: 2026-08-09T10:33:36+00:00\n形式: X(旧Twitter)で投稿したポストへの引用リポスト(クソコメ)に次々と反論していく形式のトーク動画\n\nこの動画は、投稿者トーマス氏が自身のバズったXポスト「ドラム式か縦型かの論争は時間の価値の差である」という持論をめぐって寄せられた大量の反論コメントに、1つずつ実況形式で反論していく内容です。\n\n【冒頭:発端となったポストの紹介】\nドラム式か縦型かという論争は「女性の奢られ論争」や「賃貸持ち家論争」と並ぶ終わらないテーマの1つだと前置きし、事の発端となった自身のXポストを読み上げます。「ドラム式を否定する人の意見は感想機能を使わない・洗浄力が弱い・高いなど短期目線で長期の損を取る理由が多い。一方ドラム式を押す人の理由は感想による時間効率が主で、要は時給の差で生じた格差の1つな気がする」という内容で、要は「時間の価値が高い人は選択に時間を取られたくないためドラム式を選ばざるを得ず、時間の価値が低い人は選択に時間をかけても損がないため縦型を選んでしまう」という主張だったと説明します。このポストは266コメント・679リポスト・2354いいね・178万インプレッションという大きな反響を呼んだこと、また過去にクソコメ反論動画でウェブページのスクショを使い著作権違反になった反省を踏まえ、今回は文章のみを引用する対策済みであることが語られます。\n\n【家族構成・住環境に関する反論への応酬】\n「64人家族ならドラム式より縦型乾燥機」というコメントに対し「その規模はコインランドリーを保有すべき」と一蹴。「ドラム式に一度した後に縦型に戻し、縦型+乾太くんにした」という意見が非常に多いことに触れ、「なぜ縦型に戻すのか、それならドラム式+乾太くんの方が上位互換であり、1回目はドラム式で洗いをして乾太くんで乾燥、2回目もドラム式で洗いから乾燥まで回せば外出中もダブルで乾燥が進む」と提案します。自身は4人家族(もうすぐ5人目誕生予定)で、毎日ドラム式を1〜2回稼働させ、洗濯物を干す作業を一切しなくて済むことのメリットを語り、「花粉症だからドラム式は洗浄力不足」というコメントには「ドラム式乾燥は衣服に風を当て続けることで花粉や埃を吹き飛ばす」と反論。「平米(部屋の広さ)の問題」という指摘にも「平米は勘違い」と切り捨てます。\n\n【洗浄力・汚れ物に関する反論】\n「洗浄力が弱いのは致命的」というコメントに対し、業務用洗濯機のほとんどがドラム式であることを根拠に「ドラム式の洗浄力は十分」と反論。子供が泥まみれや粗相をした服の例を挙げ、「縦型であっても本当に汚い服はそのまま放り込まず予洗いするはず」であり、極端な汚れの想定自体がおかしいと指摘します。「お湯洗いにしたら劇的に汚れが落ちる」というコメントには「そもそもお湯の洗浄力が高いだけ」と同意しつつ補足します。\n\n【「感想機能を使わない」「時間の価値」をめぐる応酬】\n「濡れた洗濯物をハンガーにかけたまま乾かせば畳む手間も省ける」という意見に対し、「それは選択機に縛られている現実から目を逸らしているだけで、洗濯物が乾くまで家を出られないという不自由さを誤魔化すロジックだ」と反論。「浮いたお金を投資に回す方が合理的」というコメントには「そもそも投資の話ではなく時間の価値の話をしている」と噛み合わなさを指摘します。「時間が空いても労働を増やせない人もいる」という意見には「そういう人こそ家事のリソース不足でパンクしているのだから、まずドラム式でリソースを空ける努力をすべき」と返します。\n\n【製品選びに関する具体的アドバイス】\n「電気毛布がドラム式非対応だから諦めた」というコメントには「衣服の方をドラム式に合わせて買い替えるべき」と主張。おすすめメーカーとしてパナソニック製(値引き交渉に一切応じない代わりに失敗がないブランド)を挙げつつ、価格は25万円程度でも耐用年数7年で割ると1日あたり166円に過ぎず、洗濯物のストレスから一生解放される対価として安いと計算します。予算が厳しい場合はヤマダ電機オリジナルブランドや保証期間の長い日立などの大手メーカーでも良いと補足します。\n\n【使い方の誤解を正す反論】\n「ドラム式は乾燥までの時間が長くて次の洗濯まで待たされる」というコメントには「そもそも毎日1回スイッチを押すだけの運用にすれば、待つ必要はなく、待っている感覚自体がドラム式の使い方を間違えている」と反論。「途中で衣類だけ取り出して感想機能まで使わない」という運用への疑問には、Yシャツなど乾燥機にかけられない衣類だけ取り出して干せばよいだけだと簡潔に返します。「タワーマンションでは縦型を使ってる人が1人もいない」という自身の観察も紹介し、都市部でこそドラム式が主流であることを強調します。\n\n【締めくくり:主張の総括】\n一通りのクソコメへの反論を終えた後、「この動画で言いたいことをまとめると、ドラム式に生活を合わせろということ」だと総括します。ドラム式は現代人に圧倒的な時間を生み出してくれる家電であり、ロボット掃除機や食洗機以上の時間創出効果があると主張。「ドラム式を使わない理由を探すのではなく、どうドラム式を使うかを考えるべき」であり、これが社会の分断にもつながっていると持論を展開します。最後に、世界にはまだ洗濯機すら使えず1日の大半を洗濯に費やす女性が多くいる中、日本ではボタン1つでその作業を代替できることに感謝しつつドラム式を導入してほしいと締めくくり、チャンネル登録・ブログ・書籍の宣伝を行って動画を終えます。\n\n【まとめ】\nこの動画は、「ドラム式か縦型か」というX上の論争ポストに寄せられた多数の反論コメントに1つずつ丁寧に(かつ挑発的に)反論していく構成で、一貫して「時間の価値が高い人ほどドラム式を選ばざるを得ず、ドラム式は現代人にとって圧倒的な時間創出効果を持つ家電であるため、使わない理由を探すのではなく自分の生活をドラム式に合わせるべきだ」という持論を、具体的な家庭事情・製品知識・費用対効果の計算を交えながら強く主張する内容です。"},
      {"name": "ひすいこたろうの名言セラピー", "isNew": true, "videoTitle": "ものの見方検定！一問でも解けたらあなたは現代アーティスト！", "videoUrl": "https://www.youtube.com/watch?v=3kTJSdumDcY", "published": "2026-08-12T12:00:17+00:00", "failed": false, "summary": "チャンネル名: ひすいこたろうの名言セラピー\n動画タイトル: ものの見方検定！一問でも解けたらあなたは現代アーティスト！\nURL: https://www.youtube.com/watch?v=3kTJSdumDcY\n公開日時: 2026-08-12T12:00:17+00:00\n形式: 短尺のクイズ解答動画(前回配信「ものの見方検定」で出題された3つの現代アート作品クイズの答え合わせ回)\n\nこの動画は、前回配信で出題されたアメリカの避雷針アート・2羽のインコのアート・後ろ向きに走るバイクのアートという3つの現代アート作品について、それぞれに込められた「見方」の答えを解説する内容です。\n\n【第1問の答え:避雷針アート】\nアメリカの砂漠地帯にある宿泊型アート施設で、雷が鳴った時にそこへ雷を落とすための避雷針が多数設置されているが、この19年間で実際に雷が落ちたのはわずか7回だけであり、雷が落ちる瞬間など誰も見られないという事実を改めて示す。この作品の核心は、「雷があった時どうなるんだろう」とステンレスの棒の列を眺めながら想像することそのものの中にアートがあるという点にあると解説。「想像させることの中にアートがある」という事例として位置づける。\n\n【第2問の答え:2羽のインコのアート】\n大きなインコが2羽並んでいるだけの作品について、インコは1羽だけだと寂しくて精神的におかしくなってしまうことがあるため、おもちゃのインコを鳥かごの中に入れてやると「自分だけではない」と思って落ち着くという習性を紹介。この作品はそれを踏まえ、「これは偽の愛を象徴しているのか、それとも愛の重要性を歌っているのか」という問いを投げかけ、愛の重要性を見る人に突きつける作品とも取れると解説する。何かを知らないと楽しめないアートだが、そこにどんな意味があるのか思いを馳せることがアートの楽しさだと補足する。\n\n【第3問の答え:後ろ向きに走るバイクのアート】\n後ろ向きに走る有名なバイクのアート作品について、70年代アメリカの若者たちの聖書となった本『禅とオートバイ修理技術』の中に、「ギリシャでは、過去は見えるから前にあり、未来は見えないから後ろにあると思われていた」という一節があり、そこに触発されて生まれた作品であることを明かす。未来に向かって走ると後ろに下がっていくことになるという逆説から、「未来に向かうとはどういうことか」を想像させるアートだと解説。作家は展示会の初日に実際にそのバイクに乗り、後ろ向きに走って見せたというエピソードも紹介する。\n\n【締めくくり:答えは1つではない】\n紹介した意図は作品に込められた意図の1つに過ぎず、それが唯一の正解というわけでもないと念を押す。「みんな答えを求めるが、AI時代は答えよりも問いが大事になる」とし、頭の中に問いをプレゼントしてくれるのがアートだと語る。今日の参考文献となった本を紹介した上で、「この世界にあるものは全て問いから生まれている、だとしたらあなたの人生はどんな問いが形になったものなのか」と視聴者に問いかけて締めくくる。\n\n【まとめ】\nこの動画は、前回出題された避雷針・インコ2羽・後ろ向きバイクという3つの現代アート作品の答え合わせを通じて、それぞれの作品が「想像させること」「愛の重要性への問いかけ」「未来とは何かという逆説的な問い」を内包していることを解説しつつ、一貫して「アートとは正解を示すものではなく、見る人の頭の中に問いをプレゼントするものである」というメッセージを伝える内容です。"},
      {"name": "崔の店長日誌。", "isNew": true, "videoTitle": "成功者がもつ自己肯定感とは？〜私は私を見捨てない〜/ 100日マラソン続〜1950日〜", "videoUrl": "https://www.youtube.com/watch?v=mqbxSJBCxiQ", "published": "2026-08-12T20:00:07+00:00", "failed": false, "summary": "チャンネル名: 崔の店長日誌。\n動画タイトル: 成功者がもつ自己肯定感とは？〜私は私を見捨てない〜/ 100日マラソン続〜1950日〜\nURL: https://www.youtube.com/watch?v=mqbxSJBCxiQ\n公開日時: 2026-08-12T20:00:07+00:00\n形式: 毎日配信の「100日マラソン」シリーズ(1950日目)、店主・崔氏によるトーク配信\n\nこの動画は、お盆期間中に少し落ち込んでいたという崔氏が、懇意にしている社長から聞いた「成功者が持つ自己肯定感」についての考え方を紹介し、「結果と自分の価値は別物である」というメッセージを伝える内容です。\n\n【冒頭:筋トレ仲間からの一言LINE】\n8月13日木曜日、暦の上でお盆期間に入ったことに触れつつ、出張先で朝起きたら筋トレ仲間のSさんから「まっちょ」という一言だけのLINEが届いたエピソードを紹介。長年の付き合いがあるため、その一言だけで「出張先でも筋トレをサボらずやっているか、タンパク質はしっかり取っているか、睡眠も大事に、お酒の飲み過ぎに注意」という多くのメッセージが込められていることが分かったと笑いを交えて語る。\n\n【テーマ導入:自分を責めていた背景】\n今日のテーマ「成功者の方たちが持っている自己肯定感とは」を提示。「成功者」という表現を使ったのは、自分自身がここ最近いろいろなことがうまくいかず、自分自身を責めていたという背景があったためだと明かす。自身の先生・師匠から「自分を責めたり戒めたりすることを『呪い』と呼ぶ、これが1番タチの悪いことだ」と言われたことに触れつつ、それでもついやってしまうと吐露。生活習慣を変えていくこと(毎日トイレ掃除をする、朝起きたら窓を開ける、15分でも外を歩くなど、自分との約束を守り続けること)自体が「私は私との約束を守っている」という自己肯定感を生む、といった過去に学んだ「呪いの外し方」にも触れる。\n\n【社長から聞いた話:結果と自分の価値は別物】\nそれでもうまくいかない時があった中、懇意にしている会社の社長と話していて勉強になった話として紹介。その社長から「自己肯定感というのは自分を無条件に褒めるというものではない」「結果というものと自分の価値は別々だと考えておくべき」と言われたエピソードを紹介。仕事や人間関係がうまくいかず失敗した時に「自分はダメな人間だ、価値がない」と考えるのは、出来事から人格全体へと飛躍してしまっている誤りだと指摘されたと説明する。\n\n【子供の例え】\n社長からの例え話として、「もしあなたの子供が試験に失敗した、大会で優勝できなかった、本番でこけてしまったとして、その子が『自分には価値がない』と思っていたら、あなたは子供の価値が下がると思うか」と問われ、「そんなわけない、めっちゃ頑張ったじゃないか」と即答したエピソードを紹介。結果と自分の価値は絶対に一緒にしてはいけないという教えを、この例えを通じて腹落ちさせたと語る。\n\n【存在価値と成果価値】\nさらに分かりやすい整理として、「成果価値」(何の成果を出したか、どれだけ成功したか)と「存在価値」(自分という人間そのものを尊重できているか)という2つの概念を紹介。成果が出なかったからといって自分自身を粗末に扱う理由には全くならないと説明し、「結果が出たから価値がある、出ないから価値がない」という考え方自体が自己肯定感の議論以前の問題であり、成功者はそのような考え方をする人を評価しないのだと語られたエピソードを紹介する。\n\n【失敗は判決ではなく情報】\n失敗というもの自体は「自分への判決」ではなく「情報」なのだと覚えておくべきだと説明。これは心理学でいう「成長マインドセット」の考え方であり、人は成長の過程で失敗がつきものであるため、失敗は「何が足りなかったのか、何を変えるべきだったのか」に気づかせるための材料であり、自分の価値を証明する材料にはならない(成功も同様)と整理する。\n\n【お盆とご先祖様への言及】\nお盆の期間中、お墓参りや里帰りができる人もできない人も、今この瞬間にご先祖様への感謝を思う時間があるはずだと述べつつ、前日の配信内容(ご先祖様が1番喜ぶのは生きている姿だという話)に触れ、「一番見たくない姿は、自分を責めている姿だろう」と語る。自分の体は自分1人でできているわけではなく、多くのご先祖様の存在の上に成り立っているため、自分を責めることはご先祖様も一緒に気を揉ませることになると説明。失敗やうまくいかない時があるのは当然であり、そういう時こそ自己肯定感が試されるのだと語る。\n\n【締めくくり:「私は私を見捨てない」】\nこの話の中で崔氏自身が最も心に残った言葉として「私は私を絶対に見捨てない」を挙げる。失敗や成果が出なかったことを理由に自分を粗末に扱う理由にはならないと改めて強調し、いつも通り元気よく「せーの、よっしゃ」という掛け声で視聴者を送り出して配信を締めくくる。\n\n【まとめ】\nこの動画は、崔氏自身が最近うまくいかないことがあり自分を責めていたという実体験を出発点に、懇意の社長から聞いた「結果と自分の価値は別物である」「失敗は判決ではなく成長のための情報である」という教えを、子供の例えや存在価値・成果価値の整理を交えて紹介し、お盆でご先祖様に思いを馳せる文脈とも結びつけながら、「私は私を見捨てない」という一貫したメッセージを伝える内容です。"},
      {"name": "UP&UP", "isNew": false, "videoTitle": "【※絶対に見て】何もしない人に「運」は来ません。一瞬で人生が劇変する「お金と挑戦」の法則 ｜ スペシャルゲスト 入江巨之さん", "videoUrl": "https://www.youtube.com/watch?v=oEdGCXT5ml0", "published": "2026-08-10T11:00:02+00:00", "failed": false, "summary": "チャンネル名: UP&UP\n動画タイトル: 【※絶対に見て】何もしない人に「運」は来ません。一瞬で人生が劇変する「お金と挑戦」の法則 ｜ スペシャルゲスト 入江巨之さん\nURL: https://www.youtube.com/watch?v=oEdGCXT5ml0\n公開日時: 2026-08-10T11:00:02+00:00\n形式: 対談形式のトーク動画(UP&UPホストと、実業家・プロデューサーの入江巨之氏との対談)\n\nこの動画は、経営者・プロデューサーの入江巨之氏をゲストに迎え、意思決定のスピード、お金への独自の価値観、リアルな人間関係を重視する経営スタイル、そしてエンターテインメント業界を再編したいという思いを語る対談です。\n\n【冒頭:予告的な一言】\n動画冒頭、入江氏の「日本の芸能・エンターテインメントの世界は10年前と今で変わっていない。伝統を守ることも重要だが、見られなくなったら終わり。エンタメ業界再編の中心人物になりたい」という趣旨の発言が予告的に流れる。\n\n【スピード感へのこだわりとお金への恐怖のなさ】\n本編は入江氏の「スピード感」への質問から始まる。入江氏は自身が「基本的にスピードが超早い方」だと述べ、考えても結論が同じなら早く決めた方がお互いの時間を潰さないと説明。また、普通の人と大きく違う点として「お金がなくなる恐怖がない」ことを挙げ、「最悪コンサルを本気でやれば2、3億稼げると思っている」ため全部使ってしまう感覚があると語る。ただしコンサル自体はやりたくない、自分の事業を伸ばしたいから、人の作業(コンサル)はやりたくないと説明する。\n\n【プロデューサーとしての本質:残るサービスを作りたい】\n入江氏はプロデューサーという肩書について、「自分が作るサービスで色んな人が幸せになってほしい、世の中に自分の作るものを残したい」という思いが強いと語る。それを実現するために日々「これが正解だ」というものを実践を通じて学んでいると説明。また会社経営において「余計なこと」(オンラインでもいい仕事をあえてオフィスを構えたり、イベントをリアルで開催したりすること)をあえてやることで社員のモチベーションが上がり、結果的に会社のためになっていると語る。失敗についても「失敗は成功への近道であり、まっすぐ進む人はむしろ遠回りをしている」という持論を展開する。\n\n【お金の使い方への独自の価値観】\n入江氏は起業当初からお金をあまり自分の贅沢には使わないタイプであると明かす。カジノで勝った100万円などの「たまたま得たお金」は気にせず使えるが、事業でみんなと稼いだお金を雑に使うことには強い抵抗があるとし、「お金に色はないと言いながら、自分の中では色分けをしているタイプ」だと語る。コスト削減については1000円単位までこだわる一方、意味があると判断したものにはお金を惜しまないというメリハリがあることを説明する。\n\n【リモート禁止とリアルの重視】\nオフィスやリアルなイベントの必要性について、リモートでは発想やコミュニケーション量が減り人間関係が希薄化するとの考えから、基本的にリモートを禁止していると明かす。\n\n【創業当初からの変化:金儲けから「自分にしか生めない価値」へ】\n起業当初はほとんどの人と同様「金持ちになりたい」という動機から始まったが、次第に「自分にしか埋められない価値を生みたい」という気持ちに変化したと振り返る。それを今も手探りで実践し続けていると語る。\n\n【日本という国への評価と、挑戦者・応援者の減少への危機感】\n海外と比較して日本はインフラ・食・サービスなど全ての面でレベルが高く「ないものがない」ほど整っていると評価する一方、チャレンジする人が明らかに少ないと指摘。さらに、それに伴い挑戦する人を応援する人も減っており、自分のことしか考えない人が増えたと分析する。かつては地域やお祭りの中でお節介に叱ったりアドバイスをくれる人がいたが、今はそうした文化が失われたと語る。自身は「応援する人」になることを強く意識しており、多くの人の人生を自分の事業に巻き込めるかが重要だと述べる。\n\n【熱狂の起こし方と、目指す未来像】\n人を巻き込む熱狂の起こし方について、自分の熱量を伝え、共感してもらい「この人の未来に乗っかってみたい」と思わせることが重要だと説明。目指す未来像として、日本のエンターテインメント・芸能業界がこの10年ほとんど変化していないことに触れ、「見られなくなったら終わり」という危機感のもと、伝統を守りながらも進化させることが重要だと持論を展開。評価する主体は常に「見る人」であるべきだとし、今のエンタメ再編の中心人物になりたいという冒頭の発言につながる。大手企業が持つ権利や実績が必要な大きな挑戦もあるが、それには実績を積み上げて信頼を得ることが必要だと説明し、3日間スペースを借りて音響・照明・映像を駆使したセミナー・講演業のアップデートに挑戦していることも紹介する。\n\n【守るものと壊すもののバランス】\n歴史・軸は変えずに守るべき価値だとしつつ、見せ方やアップデートは常に行うべきだという考えを説明。野球の演出やエンタメ性が年々進化しているのと同様、自分たちのイベントやライブも進化させ続けなければ生き残れないと語る。\n\n【応援したい人物像】\n応援したい人の条件として、単に無闇に頑張るのではなく「考えながら努力できる人」「自分のキャパや現実的な達成タスクを理解している人」を挙げ、無謀な目標を掲げる人は結果が出ないため応援できないと説明。自身も東京に来て10年でここまで積み上げたのは運ではなく努力の結果だと語る。\n\n【社員への向き合い方】\n自社の若手社員にはチャレンジできる環境を用意しているが、実際に挑戦するかどうかは本人次第だと語る。社員が問題を起こした場合も、最終的な責任は自分が取ると腹を括った上で任せていると説明する。\n\n【締めくくりのメッセージ】\n視聴者へのメッセージとして、誰もが同じように何も持たない状態からスタートするが、それを突破できるかどうかは「これは大変だ」と思うタイミングを超えられるかどうかにかかっていると語る。何もしなければ何も起きないが、行動すれば問題も起きる一方で良いことも起きるとし、問題処理能力は経験を重ねるほど上がっていくものであり、新しいことに挑戦すれば問題が起きるのは当然だと説明。「簡単なビジネスはもうない」時代だからこそ、問題が起きることを織り込み済みで挑戦する姿勢が重要だと締めくくる。\n\n【まとめ】\nこの動画は、経営者・プロデューサーである入江巨之氏が、意思決定のスピードやお金への独自の価値観、リアルな人との繋がりを重視する経営スタイル、そして「見られなくなったら終わり」という危機感のもとエンターテインメント業界の再編に挑戦したいという思いを語り尽くす対談です。一貫しているのは、「何もしなければ何も起きない」「問題が起きることを前提に挑戦し続けることでしか結果は出せない」という行動主義的なメッセージであり、自身も何度も恥ずかしい思いや辛い経験を乗り越えてきたことを踏まえ、視聴者に挑戦することの価値を伝えています。"},
      {"name": "中野優作 / CAR and LIFE.（BUDDICA）", "isNew": true, "videoTitle": "これさえあればいつでも洗車！メンテナンスキット", "videoUrl": "https://www.youtube.com/watch?v=ePinjL5WEI0", "published": "2026-08-12T10:00:15+00:00", "failed": false, "summary": "チャンネル名: 中野優作 / CAR and LIFE.（BUDDICA）\n動画タイトル: これさえあればいつでも洗車！メンテナンスキット\nURL: https://www.youtube.com/watch?v=ePinjL5WEI0\n公開日時: 2026-08-12T10:00:15+00:00\n形式: 短尺のカー用品紹介・実演動画(対談形式、洗車用ミット・シャンプー・コーティング剤がセットになった「バディカ メンテナンスキット」の紹介)\n\nこの動画は、洗車用のシャンプーミットの正しい使い方を実演しながら、バディカのメンテナンスキットを紹介し、あわせて中野優作氏が所有する思い出の車についても語る内容です。\n\n【メンテナンスキットとミットの紹介】\n洗車用のミットについて、個別には販売しておらず「バディカのメンテナンスキット」を購入すると付属していることを説明。最初に道具を揃える人は、コーティング剤・ワックス・シャンプーなどを個別に買うよりも、メンテナンスキットでまとめて購入した方がミット分お得になるとすすめる。\n\n【正しい洗車の仕方の実演】\nミットの使い方として、ゴシゴシとこすることなく、ミット自体の重みだけで滑らせるように動かすイメージで洗うべきだと解説。同じ箇所を何度もこすらなくてもよく、基本的には1回ずつなぞるだけで十分であり、力を入れてこする洗い方は基本的にNGだと説明する。\n\n【セラミックコーティングの効果を実演】\n洗車の様子を見せながら、セラミックコーティングの効果で泡が全て弾かれて流れ落ちていく様子に驚きを見せる。「本来はこういう風になる」のが正しい状態であり、下地となるコーティングが完璧にできていればこうなると説明。せっかくコーティングした車は洗車機に入れず、できれば手洗いしてほしいとアドバイスする。\n\n【中野氏の思い出の車:三菱ミニカ】\n話題が変わり、その場にあった車について「50年前のミニカ」であることを明かす。中野氏が6〜7歳の頃、父親が「みんなでドライブに行けたらいいな」と買ってくれた三菱ミニカという車で、自身が車好きになった原体験の1台であると語る。全く同じ個体ではないものの、同型車を日本中探して見つけた1台を購入し、約100万円かけてオーバーホール・全塗装を行い、錆びて穴が開いていた部分も含め部品を全て交換して車検を取得したという、思い入れの強いエピソードを紹介する。\n\n【まとめ】\nこの動画は、洗車用ミットの正しい使い方とセラミックコーティングの効果をバディカのメンテナンスキットとともに実演紹介しつつ、中野優作氏が幼少期の家族の思い出とともにレストアした三菱ミニカについて語る、実用的な洗車ノウハウと個人的な車への愛着が交錯する短尺動画です。"},
      {"name": "サムの本解説ch", "isNew": false, "videoTitle": "トーク力は不要。なぜ「聞く力」が100倍重要なのか？【要約】人は聞き方が9割", "videoUrl": "https://www.youtube.com/watch?v=2FUp_2Y8yLk", "published": "2026-08-11T11:00:03+00:00", "failed": false, "summary": "チャンネル名: サムの本解説ch\n動画タイトル: トーク力は不要。なぜ「聞く力」が100倍重要なのか？【要約】人は聞き方が9割\nURL: https://www.youtube.com/watch?v=2FUp_2Y8yLk\n公開日時: 2026-08-11T11:00:03+00:00\n形式: 書籍要約・解説動画(永松茂久氏著『人は聞き方が9割』を紹介)\n\nこの動画は、会話が苦手・話すのが下手だと悩む人に向けて、実はコミュニケーションで本当に重要なのは「話し方」ではなく「聞き方」であることを、著者自身の失敗談やテレビ実験の結果を交えながら解説する内容です。\n\n【冒頭:問題提起】\n会話が続かない、飲み会で何を話せばいいか分からない、会議で発言するのが怖いといった悩みを持つ人は、自分は話すのが下手だからと思い込みがちだが、実はコミュニケーションが上手い人は「話すのが上手い人」ではなく「聞くのが上手い人」であると指摘。周りにコミュ力が高いと思われている人を思い出しても、その人は大抵「面白い話をする人」ではなく「話しやすい人」、つまり聞き上手な人であるはずだと問いかける。\n\n【著者紹介と本の位置づけ】\n著者・永松茂久氏は、年間ランキング1位を獲得した大ベストセラー『人は話し方が9割』の著者であり、話し方のプロ中のプロ。その永松氏が今度は「聞き方が9割」と言っていることに触れ、実は『人は話し方が9割』の執筆中、永松氏は聞き方の話が止まらなくなり、編集者から「これは話し方の本なので聞き方はいずれ」とストップをかけられたというエピソードを紹介。つまり本書は、永松氏が本当に1番書きたかったが書ききれなかった核心部分をまとめた1冊であると位置づける。目次は「1. 聞き方を間違えると全部うまくいかなくなる」「2. 聞き方を変えただけで全てが変わる」「3. 明日から使える聞き方の武器」の3章構成であることが示される。\n\n【1. 聞き方を間違えると全部うまくいかなくなる】\n「自分は話すのが下手だから話し上手にならなきゃ」という思い込みは間違いだと指摘。人はみんな話したい生き物であり、心理学的にも人は聞いている時より話している時の方が心理的な快感を得ることが証明されていると説明。永松氏はコミュニケーションの土台となる人間心理として「みんな自分のことが1番大切で興味がある」「みんな自分のことを認めてほしい、分かってほしいと思っている」「自分のことを分かってくれる人を好きになる」という3つを挙げ、結局みんな自分の話を聞いてほしいのだと解説。話したい人ばかりでは会話は成立せず、本当に必要とされるのは「ちゃんと聞いてくれる人」であるとし、聞き上手はこの日本に住む1億2000万人から求められる存在になり得ると強調する。さらに、日本人は感情表現が苦手な国民性のため、実際にはちゃんと聞いていても聞いていないように見えてしまい損をしている人が多いと指摘。永松氏自身、講演後の懇親会で「感動しました」と細かく感想を語ってくれる人がいても、講演中はその人も含め聴衆のほとんどが真顔・ノーリアクションだった経験から、「感動してるならもうちょっとそれっぽく聞いてもらってもいいですか」と思ったというエピソードを紹介。ホテルのラウンジで身振り手振りで必死に説得するスタッフと、綺麗な姿勢でゆっくり頷きながら聞くスタッフを比較する例を挙げ、人は本能的にゆっくりどっしりしたものにカリスマ性を感じるため、聞く側に回った方が労力をかけずに評価が上がると説明。加えて、聞く側は沈黙のプレッシャーを感じずに済み、たくさん話す側より相手の地雷を踏むリスクも低いというメリットを列挙する。\n\n【2. 聞き方を変えただけで全てが変わる】\n永松氏自身、かつては飲食店経営者として話し方の指導にこだわり、気難しい客役を自ら演じてスタッフをロールプレイで厳しく詰めるトレーニングを行っていたが、スタッフはどんどん自信を失い、店全体が沈んだ雰囲気になっていたという失敗談を紹介。転機となったのが、あるテレビ番組で見た実験。6人の男性(女性と話すのが苦手なチームと得意なイケメンチーム、各3人)と3人の女性が登場し、男性の話が面白いと女性がペダルを踏んでポイントが貯まる仕組みの実験で、1回目は苦手チーム5ポイント・得意チーム85ポイントとイケメンチームの圧勝だったが、2回目はディレクターの指示で聞き手の女性のリアクションを操作(苦手チームには終始笑顔でオーバーリアクション、得意チームには真顔でノーリアクション)した結果、苦手チームが30ポイントに急上昇、得意チームは15ポイントに大暴落したというエピソードを紹介。この実験は、会話の出来を決めているのは話す側の能力ではなく聞く側のリアクションであることを証明したと説明。これを見た永松氏は翌日、スタッフに「とにかくお客様が話しかけたくなるような聞き方(笑顔と頷き)で勝負する」と宣言し、間違ったことを言っても否定せず笑顔で拍手する「否定のない空間」を作った結果、スタッフのスピーチ力が向上し客も増えたという実体験を紹介。会話の主導権は話す側ではなく聞く側にあるという結論を、永松氏が「話す人=ピッチャー、聞く人=キャッチャー」に例えている点も紹介し、名キャッチャーはナイスボールと声をかけピッチャーを乗せ、受けたボールを各塁に投げてゲーム全体をコントロールする存在であり、私たちは苦手なピッチャーを目指すのではなく「いい音を鳴らすキャッチャー」を目指せばよいと説明する。\n\n【3. 明日から使える聞き方の武器(3つ)】\n①「換賛(かんさん)」でテンションを一気に上げる:永松氏の造語で「感嘆」と「称賛」を合体させた言葉。「昇進したんだ」に対し「え、すごいじゃん、良かったね」のように、驚きと褒めをセットで返す技術で、日本人は感情表現が控えめなので自分ではやりすぎと感じるくらいがちょうど良いと説明。永松氏の実践講座で最も効果があったと報告が上がった技術であると紹介。②「顎紐理論」で相手の本音を引き出す:頷きには弱(顎だけ軽く振る普段の相槌)・中(頭ごと下げる)・強(首から背中まで引っ張られるほど深く)の強弱があり、オーケストラの指揮者の棒のように頷きの深さで会話の流れをコントロールできると説明。永松氏が実践しているイメージ法として、自分の顎に紐がついていて相手の脳を引き出し付きのタンスと見立て、頷くたびに紐を引っ張ってタンスの引き出しを開けるイメージを持つと、自然に頷きが深くなり相手の本音や経験が引き出されやすくなると解説。③解決策を言わず相手の本音を引き出す:相手が悩みを打ち明けてきた時、つい「こうすればいいよ」と正論を言ってしまいがちだが、これは逆効果であり、悩みを話す人の多くは解決策ではなく気持ちを分かってほしいだけであると指摘。「どうしたい?(希望を聞く質問)」ではなく「どうなったら嬉しい?(感情を聞く質問)」と尋ねることで、相手は本当の気持ちを自分の中から探し始めると説明。人は他人の解決策より自分自身で見つけた答えに1番納得するものであり、聞く力とは相手が自分で答えを見つけられるようそっと手助けすることだと結論づける。\n\n【締めくくり:全員の話を聞こうとしなくていい】\n真面目な人ほど苦手な人の話こそ聞かなければと1番難しい相手から始めようとしがちだが、それはやめるべきだとし、まずは自分の身近な人・大切な人など「聞きたいと心から思える人」から始めるべきだとアドバイス。会うたびに愚痴ばかり言う人の話を聞いてエネルギーを消耗する必要はなく、自分の時間は有限であると強調。視聴者に対し、これから大切な誰かに話しかけられたら「へえ、すごいね」と換賛を返してみるよう呼びかけ、その反応の変化をコメント欄で教えてほしいと締めくくる。\n\n【まとめ】\nこの動画全体を通じて語られるのは、会話がうまくいかない原因は「話す力の不足」ではなく「聞き方の間違い」にあり、人は言葉ではなく感情を聞いてほしいのだという気づきです。換賛・顎紐理論・「どうなったら嬉しい?」という質問という3つの具体的な武器を使い、聞く側に回るだけで一生懸命話さなくても「この人できるな」と思われ、沈黙も怖くなくなり、人間関係が驚くほどスムーズに回り始めるという、聞き方を変えるだけで人生が変わるというメッセージが一貫して伝えられています。"},

      {"name": "宋世羅の羅針盤ちゃんねる（そんせらの羅針盤チャンネル）", "isNew": true, "videoTitle": "女社長の特徴について話します。【男社長との違い】", "videoUrl": "https://www.youtube.com/watch?v=yA3s09fiH9k", "published": "2026-08-12T10:52:01+00:00", "failed": false, "summary": "チャンネル名: 宋世羅の羅針盤ちゃんねる（そんせらの羅針盤チャンネル）\n動画タイトル: 女社長の特徴について話します。【男社長との違い】\nURL: https://www.youtube.com/watch?v=yA3s09fiH9k\n公開日時: 2026-08-12T10:52:01+00:00\n形式: 金融営業9年間の実務経験に基づくトーク解説動画\n\nこの動画は、金融営業を9年間続けてきた投稿者「そん」氏が、これまで数多くの経営者と接してきた経験に基づき、「女性経営者(女帝)」に共通して見られる業種の傾向・好み・人間関係の特徴を、独自の偏見と断りつつ具体的に語る内容です。\n\n【冒頭:テーマの前置き】\n今日のテーマが「女性経営者の生態」であることを紹介しつつ、男女がどうという話はセンシティブなテーマであるため、「女性はこうあるべき」という主張ではなく、あくまで自身が金融営業として見てきた中での経験則・感覚として話すと前置きする。ここでいう「女性経営者」とは、40歳以降で社員数十人以上を抱えるトップを指すと定義する。\n\n【女性経営者をほとんど見ない業種:根性馬力系とハック系】\nまず、これまで女性経営者をほとんど見たことがない業種として2つを挙げる。1つ目は「根性馬力系」(金融営業、不動産営業、ウォーターサーバーや回線のテレアポなど、上下関係が厳格でマニュアルとノルマの下でガンガン数字を追い込んでいく業種)。2つ目は「ハック系」(広告やITなど、ネットで市場の穴を突いて一気に稼ぐ「東京起業家」的な業種)。これらの業種では個人のスーパープレイヤーとしての女性(バリバリ売る保険営業ウーマンやIT広告女子など)は多くいるが、なぜか自分の「箱(会社)」を作るところまでは至らない傾向があると分析する。\n\n【女性経営者が多い業種:エモクリエイティブ才能型と専門スキル系】\n一方、女性経営者が多いと感じる業種も2つ挙げる。1つ目は「エモクリエイティブ才能型」で、ブライダル・アパレル・化粧品・キャラクターグッズ・アニメーション・空間デザインなど、「綺麗」「可愛い」「掛け替えのない思い出」といった感受性やクリエイティブさが求められる業種。2つ目は「専門スキル系」で、医師や税理士・司法書士事務所など、専門知識・資格を武器に独立するケース。共通するのは、女性自身が持つ感受性やクリエイティブさ、あるいは獲得した専門スキルに強く依存しており、1人のスーパープレイヤーとしてやっているうちに気づいたら社員が増えて会社になっていた、という再現性の低いパターンが多い点だと分析する。\n\n【女性経営者の好み①:新しいもの好きで決断が速い】\nここから女性経営者(女帝)の好みについて独自の偏見を交えて語る。女性経営者は「新しいもの」が好きな一方、税務の抜け穴を突くような細かくせこいテクニック的な話はほとんど刺さらないと説明(ただしIT系「ハック系」の一部にはこの手の話が好きな層もいるとも補足)。新しい商品や投資話にピンとくれば即座に「面白そうじゃん、やってみよう」と動く傾向があり、昭和のゴリゴリ男性経営者よりも決断が速いのが女性経営者の特徴だと語る。\n\n【女性経営者の好み②:大胆な決断】\n女性経営者は工場建設や事業売却など大掛かりな投資や決断を「せーの、やってみよう」というトーンで大胆に実行する傾向があると説明。堅実に一歩一歩というイメージとは逆で、むしろ大胆に動くケースが多いとし、対照的に男性経営者の方が損益分岐点や勝率を計算したり、自分の男気やコンフォートゾーンからの脱却といった精神論と戦ったりして、二の足を踏みがちだと対比する。\n\n【女性経営者の右腕(ナンバー2)の特徴】\n女性経営者(女帝)がナンバー2・ナンバー3に置く男性の傾向として、危なっかしいが大きな数字を持ってくる予測不能なタイプではなく、「地方銀行出身のコンプラ・経理課長」のような、お堅く誠実な人物を選ぶ傾向があると説明。また「軽いやつ」「チャラいやつ」については好き嫌い以前に「見向きもしない」ほど徹底して興味を示さず、意外にも恋愛観は古風でピュアであり、不器用で誠実な「昭和のジャガイモ侍」のようなタイプを好む傾向があると語る。\n\n【女性経営者の好み③:自己啓発と王道志向】\n女性経営者は自己啓発が好きで、仕事の熱い話やハードワークのエピソードを好む傾向があると説明。男性経営者にはしばしば「自己啓発なんて馬鹿らしい」といった逆張り思考の人がいるが、女性経営者にはそうした逆張りは少なく、本気で努力するタイプを評価する「王道好き」な傾向が強いと分析する。\n\n【二面性:メッキの厳しさと素の自分】\n女性経営者は「経営者トップとしての厳しくハードな一面(メッキ)」と「本当の自分・素の自分」という2つの人格を半々に持っている見え方がすると分析。何十人もの社員を抱えて厳しい発言をする一方で、「実はこんなことがあってショックだった」と素直に弱さを見せることも厭わないと説明。これに対し男性経営者は「メッキ100%」で強がり続け、弱さを見せることを「資本主義に飲まれる恐怖」のように捉えて避ける人が多いと対比させる。\n\n【締めくくり:唐突な脱線】\n最後に本題とは無関係に、現在開催中の甲子園のピッチャーのレベルが上がりすぎていることに触れ、「あれはなぜそうなっているのか、野球の専門家がいれば教えてほしい」という余談で締めくくる。\n\n【まとめ】\nこの動画は、金融営業として9年間数多くの経営者と接してきた「そん」氏が、女性経営者に多い業種・少ない業種の傾向、新しいものを好み大胆な決断をするという意思決定の特徴、右腕に選ぶ男性のタイプや恋愛観、自己啓発好きな王道志向、そして「厳しさと素の弱さを併せ持つ二面性」といった観察結果を、あくまで自身の経験に基づく偏見と断りながら具体的なエピソードとともに語る内容です。"},

  // 既読管理: サーバー側の new_in_last_check は「前回チェックと比較して動画が
  // 変わったか」しか表さず、自動チェックが1回でも走るとリセットされてしまう。
  // 実際にユーザーが読んだかどうかはこのブラウザの localStorage で別管理する。
  const READ_KEY = "ytChecker.readVideoUrls";

  function loadReadSet() {
    try {
      const raw = localStorage.getItem(READ_KEY);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch {
      return new Set();
    }
  }

  function markRead(videoUrl) {
    const set = loadReadSet();
    set.add(videoUrl);
    // 肥大化しすぎないよう直近200件に丸める
    const arr = Array.from(set).slice(-200);
    localStorage.setItem(READ_KEY, JSON.stringify(arr));
  }

  function relTime(iso) {
    const then = new Date(iso).getTime();
    const now = Date.now();
    const diffMs = now - then;
    const min = Math.floor(diffMs / 60000);
    if (min < 60) return `${Math.max(min, 0)}分前`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr}時間前`;
    const day = Math.floor(hr / 24);
    if (day < 30) return `${day}日前`;
    const mon = Math.floor(day / 30);
    return `${mon}ヶ月前`;
  }

  function render(data) {
    const list = document.getElementById("channelList");
    list.innerHTML = "";
    const readSet = loadReadSet();
    let unreadCount = 0;

    // 未読(新着)のチャンネルを上に、既読/変化なしを下に並べる。
    // 同じグループ内では元の(state.json の)並び順を保つ(安定ソート)。
    const sorted = data.channels
      .map((ch) => ({
        ch,
        isUnread: !!ch.summary && !readSet.has(ch.videoUrl),
      }))
      .sort((a, b) => Number(b.isUnread) - Number(a.isUnread));

    sorted.forEach(({ ch, isUnread }) => {
      if (isUnread) unreadCount++;

      const li = document.createElement("li");
      li.className = "channel" + (isUnread ? " is-new" : "");

      const chip = document.createElement("span");
      chip.className = "chip" + (isUnread ? " is-new" : "");
      chip.textContent = ch.failed ? "取得失敗" : (isUnread ? "新着あり" : "変化なし");

      const name = document.createElement("div");
      name.className = "channel-name";
      name.textContent = ch.name;

      const video = document.createElement("a");
      video.className = "video-title";
      video.href = ch.videoUrl;
      video.target = "_blank";
      video.rel = "noopener noreferrer";
      video.textContent = ch.videoTitle;

      const meta = document.createElement("div");
      meta.className = "meta" + (ch.failed ? " fail" : "");
      meta.textContent = ch.failed ? "前回チェック失敗" : `公開: ${relTime(ch.published)}`;

      li.append(chip, name, video, meta);

      if (ch.summary) {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "summary-toggle";
        toggle.textContent = isUnread ? "▸ 詳細な要約を読む(未読)" : "▸ 詳細な要約を読む";

        const body = document.createElement("div");
        body.className = "summary-body";
        body.textContent = ch.summary;

        toggle.addEventListener("click", () => {
          const open = body.classList.toggle("open");
          toggle.textContent = open ? "▾ 要約をたたむ" : "▸ 詳細な要約を読む";
          if (open && isUnread) {
            markRead(ch.videoUrl);
            chip.textContent = ch.failed ? "取得失敗" : "変化なし";
            chip.classList.remove("is-new");
            li.classList.remove("is-new");
          }
        });

        li.append(toggle, body);
      }

      list.appendChild(li);
    });

    document.getElementById("sumNew").textContent = unreadCount;
    document.getElementById("sumIdle").textContent = data.channels.length - unreadCount;
    document.getElementById("sumTotal").textContent = data.channels.length;

    const dot = document.getElementById("updatedDot");
    const text = document.getElementById("updatedText");
    dot.classList.toggle("live", unreadCount > 0);
    text.textContent = `最終チェック: ${relTime(data.checkedAt)}`;
  }

  render(CHANNELS_DATA);
